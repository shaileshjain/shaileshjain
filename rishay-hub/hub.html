/* ---------- quiz ---------- */
function startQuiz(title, subject, items){
  if(!items.length) return;
  quiz = {id:uid(), title, subject, items, i:0, results:[], startedAt:Date.now(), done:false, run:{}, cur:null, sel:null, checked:false, fb:null};
  prepare(); go("quiz");
}
function prepare(){
  const it = quiz.items[quiz.i];
  if(it.lazy){ const sk = skillById(it.skill); const base = levelFor(it.skill), adj = quiz.run[it.skill]||0; it.level = Math.max(1,Math.min(3,base+adj)); it.q = sk.gen(it.level); }
  quiz.sel = null; quiz.checked = false; quiz.fb = null;
}
function quizView(){
  const it = quiz.items[quiz.i], q = it.q, sk = skillById(it.skill), subj = subjOf(it.skill);
  const n = quiz.items.length, p = quiz.i/n*100;
  let input = "";
  if(q.type==="mcq") input = `<div class="choices">${q.opts.map((o,k)=>{ let cls="choice"; if(quiz.checked){ if(k===q.ans) cls+=" right"; else if(k===quiz.sel) cls+=" wrong"; } return `<button type="button" class="${cls}" data-choice="${k}" aria-pressed="${quiz.sel===k}" ${quiz.checked?"disabled":""}><span class="k">${String.fromCharCode(65+k)}</span><span>${o}</span></button>`; }).join("")}</div>`;
  else if(q.type==="explain") input = `<div class="ans"><textarea id="ans" ${quiz.checked?"disabled":""} placeholder="Write your answer in two to four sentences.">${esc(quiz.sel||"")}</textarea></div>`;
  else { const mode = ["num","qr"].includes(q.type)?"decimal":"text"; input = `<div class="ans">${q.pre?`<span class="unitlbl">${esc(q.unit)}</span>`:""}<input id="ans" autocomplete="off" inputmode="${q.type==="num"?"decimal":"text"}" value="${esc(quiz.sel||"")}" ${quiz.checked?"disabled":""} aria-label="Your answer">${q.unit&&!q.pre?`<span class="unitlbl">${esc(q.unit)}</span>`:""}</div>${q.hint?`<div class="hint">${esc(q.hint)}</div>`:""}`; }
  const passage = it.q.passage || (it.passage);
  const pass = passage ? `<details class="passage ${passage.poem?"poem":""} ${passage.letter?"letter":""}" open><summary>${esc(passage.kind)}: ${esc(passage.title)}</summary>${passage.text.split(/\n\s*\n/).map(t=>`<p>${esc(t)}</p>`).join("")}</details>` : "";
  return `<div class="quiz">
    <div class="qtop"><div><div class="eyebrow">${esc(quiz.title)}</div><b>Question ${quiz.i+1} of ${n}</b></div><button class="btn sm" type="button" id="endQuiz">${quiz.confirmEnd?"Tap again to finish now":"Finish early"}</button></div>
    <div class="qprog" aria-hidden="true"><i style="width:${p}%"></i></div>
    <section class="qcard">
      <div class="qmeta"><span class="tag"><span class="dot d-${subj}"></span>${esc(sk?sk.name:"")}</span>${it.level?`<span class="lvl" aria-label="Level ${it.level} of 3">${[1,2,3].map(x=>`<i class="${x<=it.level?"on":""}"></i>`).join("")} Level ${it.level}</span>`:""}</div>
      ${pass}
      <div class="prompt">${q.prompt}</div>
      ${input}
      <div id="fbBox">${quiz.fb ? fbHTML() : ""}</div>
      <div class="qactions"><span class="small muted">${q.type==="mcq"?"Press A–D or click an answer.":"Press Enter to check."}</span>
        ${quiz.checked ? `<button class="btn solid" type="button" id="nextQ">${quiz.i+1<n?"Next question":"See results"}</button>` : quiz.pendingSelf ? "" : `<button class="btn solid" type="button" id="checkQ" ${quiz.busy?"disabled":""}>${quiz.busy?"Checking…":"Check answer"}</button>`}
      </div>
    </section></div>`;
}
function fbHTML(){
  const f = quiz.fb, q = quiz.items[quiz.i].q;
  if(f.self) return `<div class="fb part"><h4>Compare with the model answer</h4><div class="model"><b>Model answer:</b> ${q.show}</div><p class="small" style="margin:10px 0 6px">How close was your answer?</p><div class="row"><button class="btn sm uoi" type="button" data-self="1">Got the main ideas</button><button class="btn sm" type="button" data-self="0.5">Partly</button><button class="btn sm danger" type="button" data-self="0">Missed it</button></div></div>`;
  const cls = f.score>=1?"good":f.score>0?"part":"badf", head = f.score>=1?"✓ Correct":f.score>0?"◐ Partly right":"✗ Not quite";
  return `<div class="fb ${cls}" role="status"><h4>${head}</h4>${f.note?`<div class="small">${esc(f.note)}</div>`:""}${f.score<1 && q.type!=="explain" ? `<div class="ex">The answer is <b>${q.show}</b>.</div>`:""}${f.claude?`<div class="ex">${esc(f.claude)}</div>`:""}${q.ex?`<div class="ex small">${q.ex}</div>`:""}${q.type==="explain"?`<div class="model"><b>Model answer:</b> ${q.show}</div>`:""}</div>`;
}
function readInput(){ const el = $("#ans"); if(el) quiz.sel = el.value; }
async function doCheck(){
  const it = quiz.items[quiz.i], q = it.q;
  if(q.type!=="mcq") readInput();
  if(q.type==="mcq" && quiz.sel===null) return;
  if(q.type!=="mcq" && !String(quiz.sel||"").trim()) { const el=$("#ans"); if(el){ el.focus(); el.setAttribute("placeholder","Type your answer first"); } return; }
  if(q.type==="explain"){
    if(sample){
      quiz.busy = true; render();
      try{
        const r = await sample.json(`You are a kind Grade 5 (IB PYP) teacher checking a student's short written answer for a Unit of Inquiry quiz. Judge only whether the main ideas are there, not spelling.

Question: ${stripHtml(q.prompt)}
Model answer: ${q.model}
Student's answer: ${quiz.sel}

Reply with only JSON: {"score": 1 or 0.5 or 0, "feedback": "one or two encouraging sentences to the student naming what was good and what was missing"}`, {modelTier:"quick", cache:false});
        const sc = [0,0.5,1].includes(Number(r && r.score)) ? Number(r.score) : null;
        quiz.busy = false;
        if(sc===null) throw {code:"invalid_json"};
        finishCheck(sc, {claude: String(r.feedback||"")});
      }catch(e){ quiz.busy = false; if(e && (e.code==="not_granted"||e.code==="sampling_disabled")) sample=null; quiz.checked=false; quiz.pendingSelf=true; quiz.fb={self:true}; render(); }
      return;
    }
    quiz.pendingSelf = true; quiz.fb = {self:true}; render(); return;
  }
  const r = check(q, quiz.sel);
  finishCheck(r.score, {note:r.note});
}
function finishCheck(score, extra={}){
  const it = quiz.items[quiz.i], q = it.q;
  quiz.checked = true; quiz.pendingSelf = false; quiz.fb = {score, ...extra};
  record(it.skill, score, it.concept);
  if(it.lazy){ const r = quiz.run, k = it.skill; const recent = (quiz.results.filter(x=>x.skill===k).map(x=>x.score)).concat(score);
    if(recent.slice(-2).every(x=>x>=1) && recent.length>=2) r[k] = Math.min(2,(r[k]||0)+1); if(score<1 && recent.slice(-2).every(x=>x<1) && recent.length>=2) r[k] = Math.max(-2,(r[k]||0)-1); }
  const given = q.type==="mcq" ? (quiz.sel===null?"":stripHtml(q.opts[quiz.sel])) : String(quiz.sel||"");
  quiz.results.push({skill:it.skill, score, p:stripHtml(q.prompt).slice(0,220), given:given.slice(0,300), correct:stripHtml(q.show).slice(0,300), ex:q.ex, promptHtml:q.prompt, showHtml:q.show});
  render();
}
function nextQ(){ if(quiz.i+1 < quiz.items.length){ quiz.i++; prepare(); render(); } else endQuiz(false); }
function endQuiz(early){
  if(!quiz || quiz.done) return;
  quiz.done = true;
  const res = quiz.results; if(!res.length){ quiz = null; return; }
  const score = res.reduce((a,r)=>a+r.score,0), mins = Math.max(1, Math.round((Date.now()-quiz.startedAt)/60000));
  const skills = {}; res.forEach(r=>{ const s=skills[r.skill]||(skills[r.skill]=[0,0]); s[0]++; s[1]+=r.score; });
  const sess = {id:quiz.id, at:Date.now(), title:quiz.title+(early?" (finished early)":""), subject:quiz.subject, n:res.length, score, mins, skills,
    wrong:res.filter(r=>r.score<1).slice(0,20).map(r=>({skill:r.skill, p:r.p, given:r.given, correct:r.correct}))};
  S.sessions.unshift(sess); if(S.sessions.length>300) S.sessions.length=300;
  persistLocal(); dbWrite("sessions/"+sess.id, sess); flushProgress();
  view = {name:"results"}; render(); window.scrollTo({top:0});
}
function resultsView(){
  const res = quiz.results, n = res.length, score = res.reduce((a,r)=>a+r.score,0), pct = Math.round(score/n*100);
  const msg = pct>=90?"Outstanding work!":pct>=75?"Great job — you know most of this well.":pct>=50?"Good effort. Look at the mistakes below and try again.":"This is tricky. Read each explanation, then practise the weakest skill.";
  const bySkill = {}; res.forEach(r=>{ const s=bySkill[r.skill]||(bySkill[r.skill]=[0,0]); s[0]++; s[1]+=r.score; });
  const worst = Object.entries(bySkill).sort((a,b)=>a[1][1]/a[1][0]-b[1][1]/b[1][0])[0];
  return `<div class="quiz"><section class="qcard">
    <div class="eyebrow">${esc(quiz.title)}</div>
    <div class="row" style="gap:20px;margin-top:8px"><span class="score">${fmtScore(score)}<span class="muted" style="font-size:32px">/${n}</span></span><div><h2 style="font-size:24px">${msg}</h2><p class="muted" style="margin:4px 0 0">${pct}% correct · ${Math.max(1,Math.round((Date.now()-quiz.startedAt)/60000))} minutes</p></div></div>
    <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Skill</th><th class="num">Score</th><th>Mastery now</th></tr></thead><tbody>
    ${Object.entries(bySkill).map(([id,[k,c]])=>{ const sk=skillById(id); return `<tr><td class="wrap"><span class="dot d-${subjOf(id)}"></span> ${esc(sk?sk.name:id)}</td><td class="num">${fmtScore(c)}/${k}</td><td style="min-width:160px">${meter(mastery(stat(id)),subjOf(id))}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="row" style="margin-top:16px">${worst && worst[1][1]<worst[1][0] ? `<button class="btn solid" type="button" data-practise="${esc(worst[0])}">Practise ${esc((skillById(worst[0])||{name:""}).name)}</button>`:""}<button class="btn" type="button" data-go="home">Back to home</button></div>
  </section>
  ${res.some(r=>r.score<1) ? `<section class="qcard"><h3 style="font-size:20px;margin-bottom:10px">Look again at these</h3><div class="review">${res.filter(r=>r.score<1).map(r=>`<div class="rv"><div class="p">${r.promptHtml}</div><div class="a">Your answer: <b>${esc(r.given||"(blank)")}</b> · Correct: <b>${r.showHtml}</b></div>${r.ex?`<div class="a muted">${r.ex}</div>`:""}</div>`).join("")}</div></section>` : ""}
  </div>`;
}
function focusAnswer(){ const el = $("#ans"); if(el && !el.disabled) el.focus({preventScroll:true}); else { const nb=$("#nextQ"); if(nb) nb.focus({preventScroll:true}); } }

/* ---------- events ---------- */
const app = $("#app");
app.addEventListener("click", async e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.id==="startMix") return startQuiz("Today’s mix","mix",todaysMix());
  if(t.dataset.practise){ const sk = skillById(t.dataset.practise); if(!sk) return; return startQuiz(`Practice: ${sk.name}`, subjOf(sk.id), poolItems(sk, 10)); }
  if(t.dataset.fulltest){ const subj=t.dataset.fulltest; if(subj==="math") return startQuiz("Maths full check-up","math",shuffle(MATH).map(s=>({skill:s.id,lazy:true})));
    return startQuiz("English full check-up","eng",shuffle([...ENG_SKILLS.flatMap(s=>poolItems(s,1)), ...poolItems(ENG_SKILLS.find(s=>s.id==="e.reading"),2), ...poolItems(ENG_SKILLS.find(s=>s.id==="e.spelling"),1)]).slice(0,20)); }
  if(t.dataset.strand){ const [subj, st] = t.dataset.strand.split("|"); const skills=(subj==="math"?MATH:ENG_SKILLS).filter(s=>s.strand===st); const per = skills.length>=8?2:Math.ceil(16/skills.length);
    return startQuiz(`${st} test`, subj, shuffle(skills.flatMap(s=>poolItems(s,per))).slice(0,16)); }
  if(t.dataset.unit){ S.settings.currentUnit = t.dataset.unit; saveSettings(); return render(); }
  if(t.dataset.unittest){ const u=unitById(t.dataset.unittest); return startQuiz(`${u.title}: unit test`,"uoi",unitItems(u,20,{balanced:true})); }
  if(t.dataset.unitquick){ const u=unitById(t.dataset.unitquick); return startQuiz(`${u.title}: quick quiz`,"uoi",unitItems(u,8,{noExplain:true})); }
  if(t.dataset.choice!==undefined && quiz && !quiz.checked){ quiz.sel = Number(t.dataset.choice); render(); return; }
  if(t.id==="checkQ") return doCheck();
  if(t.id==="nextQ") return nextQ();
  if(t.dataset.self!==undefined){ quiz.pendingSelf=false; return finishCheck(Number(t.dataset.self), {note: Number(t.dataset.self)>=1?"Nice — you included the main ideas.":"Read the model answer again and notice what you left out."}); }
  if(t.id==="endQuiz"){ if(!quiz.confirmEnd){ quiz.confirmEnd=true; render(); setTimeout(()=>{ if(quiz && !quiz.done){ quiz.confirmEnd=false; if(view.name==="quiz") render(); } },4000); return; } if(quiz.results.length) endQuiz(true); else { quiz=null; go("home"); } return; }
  if(t.dataset.filter){ view.filter = t.dataset.filter; return render(); }
  if(t.dataset.setcur){ S.settings.currentUnit = t.dataset.setcur; saveSettings(); return render(); }
  if(t.dataset.manage){ view.manage = t.dataset.manage; render(); return; }
  if(t.dataset.hide){ const id=t.dataset.hide; S.settings.hidden = S.settings.hidden.includes(id) ? S.settings.hidden.filter(x=>x!==id) : [...S.settings.hidden, id]; saveSettings(); return render(); }
  if(t.dataset.delunit){ const id=t.dataset.delunit; if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="Tap again to delete"; return; } S.units = S.units.filter(u=>u.id!==id); persistLocal(); dbDelete("units/"+id); if(S.settings.currentUnit===id){ S.settings.currentUnit=(allUnits()[0]||{}).id||""; saveSettings(); } return render(); }
  if(t.dataset.delq){ const [id,i]=t.dataset.delq.split("|"); const u=S.units.find(x=>x.id===id); if(!u) return; u.qs.splice(Number(i),1); saveUnit(u); return render(); }
  if(t.dataset.genmore){ const u=S.units.find(x=>x.id===t.dataset.genmore); if(u) generateQuestions(u, 10, $("#gen-msg"), t); return; }
  if(t.id==="resetBtn"){ if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="Tap again to erase all progress"; return; }
    const old = S.sessions.map(s=>s.id); S.progress={skills:{},concepts:{},daily:{},updatedAt:Date.now()}; S.sessions=[]; persistLocal(); dbWrite("progress/rishay", S.progress); old.forEach(id=>dbDelete("sessions/"+id)); return render(); }
});
document.addEventListener("keydown", e => {
  if(view.name!=="quiz" || !quiz || quiz.done) return;
  const q = quiz.items[quiz.i].q;
  if(e.key==="Enter" && !e.shiftKey){ if(e.target.tagName==="TEXTAREA") return; if(e.target.tagName==="BUTTON" && e.target.id!=="nextQ" && e.target.id!=="checkQ" && !e.target.dataset.choice) return; e.preventDefault(); if(quiz.checked) nextQ(); else if(!quiz.pendingSelf && !quiz.busy) doCheck(); return; }
  if(q.type==="mcq" && !quiz.checked && /^[a-dA-D1-4]$/.test(e.key) && e.target.tagName!=="INPUT"){ const k = isNaN(e.key) ? e.key.toLowerCase().charCodeAt(0)-97 : Number(e.key)-1; if(k < q.opts.length){ quiz.sel=k; render(); } }
});
app.addEventListener("input", e => { if(e.target.id==="ans" && quiz) quiz.sel = e.target.value; });
app.addEventListener("change", e => { if(e.target.id==="qf-t"){ const o=$("#qf-opts"); if(o) o.hidden = e.target.value!=="mcq"; } });
app.addEventListener("submit", async e => {
  e.preventDefault();
  if(e.target.id==="unitForm"){
    const title=$("#uf-title").value.trim(), central=$("#uf-central").value.trim(), lois=$("#uf-lois").value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,6);
    if(!title || !central || !lois.length){ $("#uf-msg").textContent="Please fill in the title, central idea and at least one line of inquiry."; return; }
    const u = {id:"u"+uid(), theme:$("#uf-theme").value, title, central, lois, concepts:[...document.querySelectorAll(".uf-c:checked")].map(c=>c.value),
      vocab:$("#uf-vocab").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,30), notes:$("#uf-notes").value.trim().slice(0,3000), qs:[], createdAt:Date.now()};
    S.units.push(u); S.settings.currentUnit = u.id; saveUnit(u); saveSettings();
    if(sample){ $("#uf-save").disabled = true; await generateQuestions(u, 24, $("#uf-msg")); }
    view = {name:"uoi"}; render(); return;
  }
  if(e.target.id==="qForm"){
    const u = S.units.find(x=>x.id===e.target.dataset.unit); if(!u) return;
    const t=$("#qf-t").value, q=$("#qf-q").value.trim(), why=$("#qf-why").value.trim(), loi=Number($("#qf-loi").value), c=$("#qf-c").value;
    if(!q){ $("#qf-msg").textContent="Write the question first."; return; }
    let item;
    if(t==="mcq"){ const o=[0,1,2,3].map(i=>$("#qf-o"+i).value.trim()).filter(Boolean); if(o.length<2){ $("#qf-msg").textContent="Give the correct answer and at least one wrong answer."; return; } item={t,loi,c,q,o,a:0,why}; }
    else if(t==="tf"){ item={t,loi,c,q,a:true,why}; const ans=$("#qf-o0").value.trim().toLowerCase(); if(ans.startsWith("f")) item.a=false; }
    else item={t,loi,c,q,model:why};
    u.qs.push(item); saveUnit(u); view.manage=u.id; render();
  }
});

/* ---------- Claude: generate UOI questions ---------- */
async function generateQuestions(u, n, msgEl, btn){
  if(!sample) return;
  if(btn) btn.disabled = true;
  if(msgEl) msgEl.textContent = "Claude is writing questions. This takes about a minute…";
  const existing = u.qs.map(q=>q.q).slice(0,60).join("\n");
  const prompt = `You write assessment questions for an IB PYP Grade 5 student (age 10) in India, to test real understanding of a Unit of Inquiry, not just recall.

Unit
Transdisciplinary theme: ${u.theme}
Title: ${u.title}
Central idea: ${u.central}
Lines of inquiry (index: text):
${u.lois.map((l,i)=>`${i}: ${l}`).join("\n")}
Key concepts: ${(u.concepts||[]).join(", ") || "choose suitable ones"}
Vocabulary: ${(u.vocab||[]).join(", ") || "(none given)"}
What has been taught: ${u.notes || "(not given)"}
${existing ? `\nAlready in the bank, do not repeat:\n${existing}\n` : ""}
Write exactly ${n} new questions, spread evenly across the lines of inquiry. Mix: about 60% multiple choice (4 options, one clearly correct, plausible wrong options), 20% true/false, 20% written answers that ask the student to explain, compare, give an example or take a perspective. Tag each with one PYP key concept from: form, function, causation, change, connection, perspective, responsibility. Keep facts accurate and age-appropriate; use Indian examples where natural. Keep each question under 30 words.

Reply with only a JSON array. Each item is one of:
{"t":"mcq","loi":0,"c":"function","q":"question","o":["correct option","wrong","wrong","wrong"],"a":0,"why":"one-sentence explanation"}
{"t":"tf","loi":1,"c":"change","q":"statement","a":true,"why":"one-sentence explanation"}
{"t":"explain","loi":2,"c":"perspective","q":"question","model":"model answer in 2-3 sentences"}`;
  try{
    const arr = await sample.json(prompt, {modelTier:"default", cache:false});
    const KC = Object.keys(CONCEPTS);
    const clean = (Array.isArray(arr)?arr:[]).map(x=>{
      if(!x || typeof x.q!=="string") return null;
      const loi = Math.max(0, Math.min(u.lois.length-1, Number(x.loi)||0)), c = KC.includes(x.c)?x.c:"form", q = x.q.slice(0,400);
      if(x.t==="mcq" && Array.isArray(x.o) && x.o.length>=2 && Number.isInteger(x.a) && x.a>=0 && x.a<x.o.length) return {t:"mcq",loi,c,q,o:x.o.slice(0,5).map(s=>String(s).slice(0,200)),a:x.a,why:String(x.why||"").slice(0,400)};
      if(x.t==="tf" && typeof x.a==="boolean") return {t:"tf",loi,c,q,a:x.a,why:String(x.why||"").slice(0,400)};
      if(x.t==="explain") return {t:"explain",loi,c,q,model:String(x.model||"").slice(0,800)};
      return null; }).filter(Boolean);
    if(!clean.length) throw {code:"invalid_json"};
    u.qs.push(...clean); saveUnit(u);
    if(msgEl) msgEl.textContent = `Added ${clean.length} questions. Check them in the Parent tab.`;
  }catch(e){
    const code = e && e.code;
    if(code==="not_granted"||code==="sampling_disabled") sample = null;
    if(msgEl) msgEl.textContent = code==="rate_limited" ? "Claude is busy. Try again in a few minutes." : code==="not_granted"||code==="sampling_disabled" ? "Claude isn’t available here. Add questions yourself in the Parent tab." : "Claude couldn’t create questions this time. Try again from the Parent tab.";
  } finally { if(btn) btn.disabled = false; if(view.name==="parent") render(); }
}

/* =========================================================
   Boot
   ========================================================= */
render();
(async () => {
  if(!window.claude || !window.claude.use) return;
  claude.use("sample").then(s => { if(s){ sample = s; if(["unitform","parent"].includes(view.name)) render(); } }).catch(()=>{});
  try { db = await claude.use("db"); } catch(e) { db = null; }
  if(!db) return;
  try{
    const [pg, sg, us, ss] = await Promise.all([db.doc("progress/rishay").get(), db.doc("settings/main").get(), db.collection("units").get(), db.collection("sessions").orderBy("at","desc").limit(300).get()]);
    const clone = x => JSON.parse(JSON.stringify(x));
    if(pg.exists){ const r = clone(pg.data()); if((r.updatedAt||0) >= (S.progress.updatedAt||0)) S.progress = {skills:{},concepts:{},daily:{},...r}; else dirtyProgress = true; } else if(S.progress.updatedAt) dirtyProgress = true;
    if(sg.exists){ const r = clone(sg.data()); if((r.updatedAt||0) >= (S.settings.updatedAt||0)) S.settings = {hidden:[], ...r}; }
    const remoteUnits = us.docs.map(d=>clone(d.data())).filter(u=>u && u.id && Array.isArray(u.qs));
    const localOnly = S.units.filter(u=>!remoteUnits.some(r=>r.id===u.id));
    S.units = [...remoteUnits, ...localOnly]; localOnly.forEach(u=>dbWrite("units/"+u.id, u));
    const remoteS = ss.docs.map(d=>clone(d.data()));
    const localS = S.sessions.filter(s=>!remoteS.some(r=>r.id===s.id)); localS.forEach(s=>dbWrite("sessions/"+s.id, s));
    S.sessions = [...remoteS, ...localS].sort((a,b)=>b.at-a.at).slice(0,300);
    persistLocal(); setSync(true); flushProgress();
    if(view.name!=="quiz" && view.name!=="results" && view.name!=="unitform") render();
  }catch(e){ db = null; setSync(false); }
})();
</script>
