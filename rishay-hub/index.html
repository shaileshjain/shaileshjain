/* =========================================================
   Skills and mastery
   ========================================================= */
function allUnits(){ return [...EX_UNITS.filter(u=>!S.settings.hidden.includes(u.id)), ...S.units]; }
function unitById(id){ return EX_UNITS.find(u=>u.id===id) || S.units.find(u=>u.id===id); }
function currentUnit(){ const u = unitById(S.settings.currentUnit); return (u && allUnits().includes(u)) ? u : allUnits()[0] || null; }
function uoiSkills(u){ return u.lois.map((l,i)=>({id:`u.${u.id}.${i}`, strand:u.title, name:l, desc:"", unit:u, loi:i})); }
function skillById(id){
  if(id.startsWith("m.")) return MATH.find(s=>s.id===id);
  if(id.startsWith("e.")) return ENG_SKILLS.find(s=>s.id===id);
  const m = id.match(/^u\.(.+)\.(\d+)$/); if(!m) return null; const u = unitById(m[1]); return u ? uoiSkills(u)[+m[2]] : null;
}
const subjOf = id => id[0]==="m"?"math":id[0]==="e"?"eng":"uoi";
function stat(id){ return S.progress.skills[id]; }
function mastery(st){ if(!st || !st.h || !st.h.length) return null; const h=st.h.slice(-12); let w=0,t=0; h.forEach((x,i)=>{const wt=1+i/h.length; w+=x*wt; t+=wt}); return w/t; }
function status(st){
  const m = mastery(st), n = st ? st.n : 0;
  if(m===null || n<3) return {k:"new", label: n ? "Started" : "Not started", icon:"○"};
  if(m<0.5) return {k:"needs", label:"Needs work", icon:"!"};
  if(m<0.75) return {k:"learning", label:"Learning", icon:"◐"};
  if(m>=0.9 && n>=12) return {k:"mastered", label:"Mastered", icon:"★"};
  return {k:"secure", label:"Secure", icon:"●"};
}
function chip(st){ const s=status(st); return `<span class="chip ${s.k}"><span aria-hidden="true">${s.icon}</span>${s.label}</span>`; }
function meter(m, subj){ const p = m===null ? 0 : Math.round(m*100); return `<div class="meter" role="img" aria-label="Mastery ${m===null?"not measured yet":p+" percent"}"><div class="bar ${subj}"><i style="width:${p}%"></i></div><span class="pct">${m===null?"–":p+"%"}</span></div>`; }
function levelFor(id){ const m = mastery(stat(id)); if(m===null || m<0.6) return 1; if(m<0.85) return 2; return 3; }
function record(id, score, concept){
  const st = S.progress.skills[id] || (S.progress.skills[id] = {h:[], n:0, c:0, last:0});
  st.h.push(score); if(st.h.length>20) st.h = st.h.slice(-20); st.n++; st.c += score; st.last = Date.now();
  if(concept){ const cs = S.progress.concepts[concept] || (S.progress.concepts[concept] = {h:[], n:0, c:0}); cs.h.push(score); if(cs.h.length>30) cs.h=cs.h.slice(-30); cs.n++; cs.c+=score; }
  const k = todayKey(), d = S.progress.daily[k] || (S.progress.daily[k] = {n:0, c:0}); d.n++; d.c += score;
  saveProgress();
}
function subjectMastery(skills){ const ms = skills.map(s=>mastery(stat(s.id))).filter(m=>m!==null); return ms.length ? ms.reduce((a,b)=>a+b,0)/ms.length : null; }
function securedCount(skills){ return skills.filter(s=>["secure","mastered"].includes(status(stat(s.id)).k)).length; }
function weakest(skills, n=2){ return skills.map(s=>({s, m:mastery(stat(s.id))})).filter(x=>x.m!==null && (stat(x.s.id).n>=3)).sort((a,b)=>a.m-b.m).slice(0,n).map(x=>x.s); }
function streak(){ let k = todayKey(), n = 0; if(!S.progress.daily[k]) k = addDays(k,-1); while(S.progress.daily[k] && S.progress.daily[k].n>0){ n++; k = addDays(k,-1); } return n; }
function priority(id){ const st=stat(id), m=mastery(st); const stale = st ? Math.min(1,(Date.now()-st.last)/(7*864e5)) : 1; return (m===null?0.7:1-m) + stale*0.5 + Math.random()*0.15; }

/* =========================================================
   Building quiz items
   ========================================================= */
function unitItem(u, q){
  const loi = Math.min(q.loi||0, u.lois.length-1), skill = `u.${u.id}.${loi}`;
  if(q.t==="tf") return {skill, concept:q.c, q:{type:"mcq", prompt:`True or false? <b>${esc(q.q)}</b>`, opts:["True","False"], ans:q.a?0:1, show:q.a?"True":"False", ex:esc(q.why||"")}};
  if(q.t==="explain") return {skill, concept:q.c, q:{type:"explain", prompt:esc(q.q), model:q.model||"", show:esc(q.model||""), ex:""}};
  return {skill, concept:q.c, q:mcq(esc(q.q), q.o.map(esc), q.a, esc(q.why||""))};
}
function poolItems(skillObj, n){
  if(skillObj.gen) return Array.from({length:n}, ()=>({skill:skillObj.id, lazy:true}));
  if(skillObj.pool) return shuffle(skillObj.pool()).slice(0,n).map(q=>({skill:skillObj.id, q}));
  const u = skillObj.unit; return shuffle(u.qs.filter(q=>(q.loi||0)===skillObj.loi)).slice(0,n).map(q=>unitItem(u,q));
}
function unitItems(u, n, opts={}){
  let qs = shuffle(u.qs);
  if(opts.noExplain) qs = qs.filter(q=>q.t!=="explain");
  if(opts.balanced){ // spread across lines of inquiry and keep at most 3 written answers
    const byLoi = u.lois.map((_,i)=>qs.filter(q=>(q.loi||0)===i)); const out=[]; let ex=0;
    for(let r=0; out.length<n && r<40; r++) for(const list of byLoi){ const q=list.shift(); if(!q) continue; if(q.t==="explain"){ if(ex>=3) continue; ex++; } out.push(q); if(out.length>=n) break; }
    qs = shuffle(out);
  }
  return qs.slice(0,n).map(q=>unitItem(u,q));
}
function todaysMix(){
  const items = [];
  const ms = MATH.slice().sort((a,b)=>priority(b.id)-priority(a.id)).slice(0,5);
  ms.forEach(s=>items.push({skill:s.id, lazy:true}));
  const forced = ["e.synonyms","e.marrs.spell"].map(skillById); forced.forEach(s=>items.push(...poolItems(s,1)));
  ENG_SKILLS.filter(s=>!forced.includes(s)).sort((a,b)=>priority(b.id)-priority(a.id)).slice(0,2).forEach(s=>items.push(...poolItems(s,1)));
  const u = currentUnit(); if(u && u.qs.length) items.push(...unitItems(u,3,{noExplain:false}));
  return items;
}

/* =========================================================
   Answer checking
   ========================================================= */
function parseNum(s){ s = String(s).replace(/[−–]/g,"-").replace(/[,\s₹%°]/g,"").replace(/(cm²|cm³|m²|cm|mm|km|kg|ml|mL|l|L|g|m|minutes|mins|min|degrees|deg|c|C)$/,""); return /^-?\d*\.?\d+$/.test(s) ? Number(s) : null; }
function parseFrac(s){ s = s.trim().replace(/\s+/g," "); let m;
  if((m=s.match(/^(\d+) (\d+)\/(\d+)$/))) return {w:+m[1], n:+m[2], d:+m[3], kind:"mixed"};
  if((m=s.match(/^(\d+)\/(\d+)$/))) return {w:0, n:+m[1], d:+m[2], kind:"frac"};
  if((m=s.match(/^\d+$/))) return {w:+s, n:0, d:1, kind:"int"};
  return null; }
function check(q, raw){
  const s = String(raw ?? "").trim();
  if(q.type==="mcq") return {score: raw===q.ans?1:0};
  if(q.type==="multi"){ const cor=new Set(q.correct), sel=(raw||[]).filter(i=>!q.optional.includes(i)); const wrong=sel.filter(i=>!cor.has(i)).length, hit=sel.filter(i=>cor.has(i)).length;
    if(!wrong && hit===cor.size) return {score:1}; if(!wrong && hit>0) return {score:0.5, note:"You found some of the correct words, but not all of them."}; return {score:0}; }
  if(!s) return {score:0, empty:true};
  if(q.type==="spell"){ const v=s.toLowerCase(); if(q.accept.some(a=>a.toLowerCase()===v)) return {score:1}; if(q.alt.some(a=>a.toLowerCase()===v)) return {score:1, note:`That is the American spelling. In British English (used by Cambridge and in Indian spelling bees) it is “${q.word}”.`}; return {score:0}; }
  if(q.type==="num"){ const x=parseNum(s); if(x===null) return {score:0, note:"That doesn’t look like a number."}; return {score: Math.abs(x-q.ans)<1e-6?1:0}; }
  if(q.type==="qr"){ const m=s.replace(/,/g,"").toLowerCase().match(/^(\d+)\s*(?:r|rem|remainder)?\s*(\d+)?$/); if(!m) return {score:0, note:"Write it like 23 r 4."}; const qq=+m[1], rr=m[2]?+m[2]:0; return {score: qq===q.ans.q && rr===q.ans.r ? 1 : 0}; }
  if(q.type==="pair"){ const m=s.match(/^\(?\s*(-?\d+)\s*,\s*(-?\d+)\s*\)?$/); if(!m) return {score:0, note:"Write it like (4, 7)."}; return {score: +m[1]===q.ans[0] && +m[2]===q.ans[1] ? 1 : 0}; }
  if(q.type==="time"){ const m=s.replace(/\s/g,"").match(/^(\d{1,2})[:.]?(\d{2})$/); if(!m) return {score:0, note:"Write the time like 14:35."}; return {score: ((+m[1])*60 + (+m[2]))%1440 === q.ans ? 1 : 0}; }
  if(q.type==="frac"){
    const f = parseFrac(s); if(!f || f.d===0) return {score:0, note:"Write a fraction like 3/4 or a mixed number like 1 1/2."};
    const [an,ad] = q.ans, num = f.w*f.d + f.n;
    if(num*ad !== an*f.d) return {score:0};
    if(q.form==="improper" && f.kind!=="frac") return {score:0, note:"Right value, but write it as an improper fraction (like 7/3)."};
    if(q.form==="mixed" && !(f.kind==="mixed" && f.n<f.d) && !(f.kind==="int")) return {score:0, note:"Right value, but write it as a mixed number (like 2 1/3)."};
    if(q.form==="simplest"){ if(f.kind!=="int" && gcd(f.n,f.d)!==1) return {score:0, note:"Right value, but it can be simplified further."}; if(f.kind==="mixed" && f.n>=f.d) return {score:0, note:"The fraction part should be less than 1."}; }
    if(q.form==="mixed" && f.kind==="mixed" && gcd(f.n,f.d)!==1) return {score:0, note:"Right value, but simplify the fraction part."};
    return {score:1};
  }
  if(q.type==="text"){ return {score: (q.accept||[]).some(a=>a.toLowerCase()===s.toLowerCase())?1:0}; }
  return {score:0};
}

function homeView(){

  const mixPreview = [...MATH.slice().sort((a,b)=>priority(b.id)-priority(a.id)).slice(0,3), ...ENG_SKILLS.slice().sort((a,b)=>priority(b.id)-priority(a.id)).slice(0,2)];

function skillRow(s, subj){ const st = stat(s.id); return `<div class="li"><div><div class="nm">${esc(s.name)}</div>${s.desc?`<div class="ds">${esc(s.desc)}</div>`:""}</div>${meter(mastery(st), subj)}${chip(st)}<button class="btn sm ${subj}" type="button" data-practise="${esc(s.id)}">Practise</button></div>`; }

/* ---------- quiz ---------- */
function startQuiz(title, subject, items){
  if(!items.length) return;
  quiz = {id:uid(), title, subject, items, i:0, results:[], startedAt:Date.now(), done:false, run:{}, cur:null, sel:null, checked:false, fb:null};
  prepare(); go("quiz");
}
function prepare(){
  const it = quiz.items[quiz.i];
  if(it.lazy){ const sk = skillById(it.skill); const base = levelFor(it.skill), adj = quiz.run[it.skill]||0; it.level = Math.max(1,Math.min(3,base+adj)); it.q = sk.gen(it.level, quiz.used || (quiz.used = new Set())); }
  quiz.sel = null; quiz.checked = false; quiz.fb = null; quiz.hintUsed = false;
}
function quizView(){
  const it = quiz.items[quiz.i], q = it.q, sk = skillById(it.skill), subj = subjOf(it.skill);
  const n = quiz.items.length, p = quiz.i/n*100;
  let input = "";
  if(q.type==="mcq") input = `<div class="choices">${q.opts.map((o,k)=>{ let cls="choice"; if(quiz.checked){ if(k===q.ans) cls+=" right"; else if(k===quiz.sel) cls+=" wrong"; } return `<button type="button" class="${cls}" data-choice="${k}" aria-pressed="${quiz.sel===k}" ${quiz.checked?"disabled":""}><span class="k">${String.fromCharCode(65+k)}</span><span>${o}</span></button>`; }).join("")}</div>`;
  else if(q.type==="multi") input = `<div class="choices">${q.opts.map((o,k)=>{ const on=(quiz.sel||[]).includes(k); let cls="choice"; if(quiz.checked){ if(q.correct.includes(k)) cls+=" right"; else if(on && !q.optional.includes(k)) cls+=" wrong"; } return `<button type="button" class="${cls}" data-mchoice="${k}" aria-pressed="${on}" ${quiz.checked?"disabled":""}><span class="k">${on?"✓":String.fromCharCode(65+k)}</span><span>${esc(o)}</span></button>`; }).join("")}</div>`;
  else if(q.type==="spell") input = `<div class="bee">${SPEECH ? `<div class="row"><button class="btn solid" type="button" data-say="word">Hear the word</button><button class="btn sm" type="button" data-say="slow">Say it slowly</button><button class="btn sm" type="button" data-say="def">Hear the meaning</button>${q.sent?`<button class="btn sm" type="button" data-say="sent">Hear it in a sentence</button>`:""}</div>` : `<p class="note">Sound isn’t available in this browser, so use the meaning${q.sent?" and the sentence":""} below. A parent can also read the word aloud.</p>`}
      <p style="margin:12px 0 2px"><b>Meaning:</b> ${esc(q.def)}</p>${q.sent?`<p class="muted" style="margin:0 0 12px"><b>Sentence:</b> ${esc(blankWord(q.sent,q.word))}</p>`:`<div style="height:10px"></div>`}</div>
      <div class="ans"><input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(quiz.sel||"")}" ${quiz.checked?"disabled":""} aria-label="Type the spelling"></div>
      ${quiz.checked ? "" : `<div class="hint">${quiz.hintUsed ? `Hint: ${q.word.length} letters, starting with “${esc(q.word[0])}”. A correct answer now earns half a mark.` : `<button class="btn sm" type="button" id="beeHint">Show a hint (half a mark)</button>`}</div>`}`;
  else if(q.type==="explain") input = `<div class="ans"><textarea id="ans" ${quiz.checked?"disabled":""} placeholder="Write your answer in two to four sentences.">${esc(quiz.sel||"")}</textarea></div>`;
  else { const mode = ["num","qr"].includes(q.type)?"decimal":"text"; input = `<div class="ans">${q.pre?`<span class="unitlbl">${esc(q.unit)}</span>`:""}<input id="ans" autocomplete="off" inputmode="${q.type==="num"?"decimal":"text"}" value="${esc(quiz.sel||"")}" ${quiz.checked?"disabled":""} aria-label="Your answer">${q.unit&&!q.pre?`<span class="unitlbl">${esc(q.unit)}</span>`:""}</div>${q.hint?`<div class="hint">${esc(q.hint)}</div>`:""}`; }
  const passage = it.q.passage || (it.passage);
  const pass = passage ? `<details class="passage ${passage.poem?"poem":""} ${passage.letter?"letter":""}" open><summary>${esc(passage.kind)}: ${esc(passage.title)}</summary>${passage.text.split(/\n\s*\n/).map(t=>`<p>${esc(t)}</p>`).join("")}</details>` : "";
  return `<div class="quiz">
    <div class="qtop"><div><div class="eyebrow">${esc(quiz.title)}</div><b>Question ${quiz.i+1} of ${n}</b></div><button class="btn sm" type="button" id="endQuiz">${quiz.confirmEnd?"Tap again to finish now":"Finish early"}</button></div>
    <div class="qprog" aria-hidden="true"><i style="width:${p}%"></i></div>
    <section class="qcard">
      <div class="qmeta"><span class="tag"><span class="dot d-${subj}"></span>${esc(sk?sk.name:"")}</span>${it.level && !(sk&&sk.flat)?`<span class="lvl" aria-label="Level ${it.level} of 3">${[1,2,3].map(x=>`<i class="${x<=it.level?"on":""}"></i>`).join("")} Level ${it.level}</span>`:""}</div>
      ${pass}
      <div class="prompt">${q.prompt}</div>
      ${input}
      <div id="fbBox">${quiz.fb ? fbHTML() : ""}</div>
      <div class="qactions"><span class="small muted">${q.type==="mcq"?"Press A–D or click an answer.":q.type==="multi"?"Click every correct word, then check.":"Press Enter to check."}</span>
        ${quiz.checked ? `<button class="btn solid" type="button" id="nextQ">${quiz.i+1<n?"Next question":"See results"}</button>` : quiz.pendingSelf ? "" : `<button class="btn solid" type="button" id="checkQ" ${quiz.busy?"disabled":""}>${quiz.busy?"Checking…":"Check answer"}</button>`}
      </div>
    </section></div>`;
}
function fbHTML(){
  const f = quiz.fb, q = quiz.items[quiz.i].q;
  if(f.self) return `<div class="fb part"><h4>Compare with the model answer</h4><div class="model"><b>Model answer:</b> ${q.show}</div><p class="small" style="margin:10px 0 6px">How close was your answer?</p><div class="row"><button class="btn sm uoi" type="button" data-self="1">Got the main ideas</button><button class="btn sm" type="button" data-self="0.5">Partly</button><button class="btn sm danger" type="button" data-self="0">Missed it</button></div></div>`;
  const cls = f.score>=1?"good":f.score>0?"part":"badf", head = f.score>=1?"✓ Correct":f.score>0?"◐ Partly right":"✗ Not quite";
  return `<div class="fb ${cls}" role="status"><h4>${head}</h4>${f.note?`<div class="small">${esc(f.note)}</div>`:""}${f.score<1 && q.type==="spell" ? `<div class="ex">You wrote <b>${esc(quiz.sel||"")}</b>. The correct spelling is <span class="bigword">${markDiff(String(quiz.sel||""), q.word)}</span></div>` : f.score<1 && q.type!=="explain" ? `<div class="ex">The answer is <b>${q.type==="multi"?esc(q.show):q.show}</b>.</div>`:""}${f.claude?`<div class="ex">${esc(f.claude)}</div>`:""}${q.ex?`<div class="ex small">${q.ex}</div>`:""}${q.type==="explain"?`<div class="model"><b>Model answer:</b> ${q.show}</div>`:""}</div>`;
}
function readInput(){ const el = $("#ans"); if(el) quiz.sel = el.value; }
async function doCheck(){
  const it = quiz.items[quiz.i], q = it.q;
  if(q.type!=="mcq" && q.type!=="multi") readInput();
  if(q.type==="mcq" && quiz.sel===null) return;
  if(q.type==="multi" && !(quiz.sel||[]).length) return;
  if(q.type!=="mcq" && q.type!=="multi" && !String(quiz.sel||"").trim()) { const el=$("#ans"); if(el){ el.focus(); el.setAttribute("placeholder","Type your answer first"); } return; }
  if(q.type==="explain"){
    if(sample){
      quiz.busy = true; render();
      try{
        const r = await sample.json(`You are a kind Cambridge Primary Stage 5 teacher checking a student's short written answer for a science or inquiry quiz. Judge only whether the main ideas are there, not spelling.

Question: ${stripHtml(q.prompt)}
Model answer: ${q.model}
Student's answer: ${quiz.sel}

Reply with only JSON: {"score": 1 or 0.5 or 0, "feedback": "one or two encouraging sentences to the student naming what was good and what was missing"}`, {modelTier:"quick", cache:false});
        const sc = [0,0.5,1].includes(Number(r && r.score)) ? Number(r.score) : null;
        quiz.busy = false;
        if(sc===null) throw {code:"invalid_json"};
        finishCheck(sc, {claude: String(r.feedback||"")});
      }catch(e){ quiz.busy = false; if(e && (e.code==="not_granted"||e.code==="sampling_disabled")) sample=null; quiz.checked=false; quiz.pendingSelf=true; quiz.fb={self:true}; render(); }
      return;
    }
    quiz.pendingSelf = true; quiz.fb = {self:true}; render(); return;
  }
  const r = check(q, quiz.sel);
  if(q.type==="spell" && quiz.hintUsed && r.score===1){ r.score = 0.5; r.note = ((r.note||"")+" Correct, with a hint: half a mark.").trim(); }
  finishCheck(r.score, {note:r.note});
}
function finishCheck(score, extra={}){
  const it = quiz.items[quiz.i], q = it.q;
  quiz.checked = true; quiz.pendingSelf = false; quiz.fb = {score, ...extra};
  record(it.skill, score, it.concept);
  if(it.lazy){ const r = quiz.run, k = it.skill; const recent = (quiz.results.filter(x=>x.skill===k).map(x=>x.score)).concat(score);
    if(recent.slice(-2).every(x=>x>=1) && recent.length>=2) r[k] = Math.min(2,(r[k]||0)+1); if(score<1 && recent.slice(-2).every(x=>x<1) && recent.length>=2) r[k] = Math.max(-2,(r[k]||0)-1); }
  const given = q.type==="mcq" ? (quiz.sel===null?"":stripHtml(q.opts[quiz.sel])) : q.type==="multi" ? (quiz.sel||[]).map(i=>q.opts[i]).join(", ") : String(quiz.sel||"");
  quiz.results.push({skill:it.skill, score, p:stripHtml(q.prompt).slice(0,220), given:given.slice(0,300), correct:stripHtml(q.show).slice(0,300), ex:q.ex, promptHtml:q.prompt, showHtml:q.show});
  render();
}
function nextQ(){ if(quiz.i+1 < quiz.items.length){ quiz.i++; prepare(); render(); } else endQuiz(false); }
function endQuiz(early){
  if(!quiz || quiz.done) return;
  quiz.done = true;
  const res = quiz.results; if(!res.length){ quiz = null; return; }
  const score = res.reduce((a,r)=>a+r.score,0), mins = Math.max(1, Math.round((Date.now()-quiz.startedAt)/60000));
  const skills = {}; res.forEach(r=>{ const s=skills[r.skill]||(skills[r.skill]=[0,0]); s[0]++; s[1]+=r.score; });
  const sess = {id:quiz.id, at:Date.now(), title:quiz.title+(early?" (finished early)":""), subject:quiz.subject, n:res.length, score, mins, skills,
    wrong:res.filter(r=>r.score<1).slice(0,20).map(r=>({skill:r.skill, p:r.p, given:r.given, correct:r.correct}))};
  S.sessions.unshift(sess); if(S.sessions.length>300) S.sessions.length=300;
  persistLocal(); dbWrite("sessions/"+sess.id, sess); flushProgress();
  view = {name:"results"}; render(); window.scrollTo({top:0});
}
function resultsView(){

/* ---------- Claude: generate UOI questions ---------- */
async function generateQuestions(u, n, msgEl, btn){
  if(!sample) return;
  if(btn) btn.disabled = true;
  if(msgEl) msgEl.textContent = "Claude is writing questions. This takes about a minute…";
  const existing = u.qs.map(q=>q.q).slice(0,60).join("\n");
  const prompt = `You write assessment questions for a Cambridge Primary Stage 5 (Class 5, age 10) student in India, to test real understanding of a school unit, not just recall. Match the Cambridge Primary Stage 5 curriculum level.

Unit
Subject area: ${u.theme}
Title: ${u.title}
Central idea: ${u.central}
Lines of inquiry (index: text):
${u.lois.map((l,i)=>`${i}: ${l}`).join("\n")}
Key concepts: ${(u.concepts||[]).join(", ") || "choose suitable ones"}
Vocabulary: ${(u.vocab||[]).join(", ") || "(none given)"}
What has been taught: ${u.notes || "(not given)"}
${existing ? `\nAlready in the bank, do not repeat:\n${existing}\n` : ""}
Write exactly ${n} new questions, spread evenly across the lines of inquiry. Mix: about 60% multiple choice (4 options, one clearly correct, plausible wrong options), 20% true/false, 20% written answers that ask the student to explain, compare, give an example or take a perspective. Tag each with one way of thinking from: form, function, causation, change, connection, perspective, responsibility. Keep facts accurate and age-appropriate; use Indian examples where natural. Keep each question under 30 words.

Reply with only a JSON array. Each item is one of:
{"t":"mcq","loi":0,"c":"function","q":"question","o":["correct option","wrong","wrong","wrong"],"a":0,"why":"one-sentence explanation"}
{"t":"tf","loi":1,"c":"change","q":"statement","a":true,"why":"one-sentence explanation"}
{"t":"explain","loi":2,"c":"perspective","q":"question","model":"model answer in 2-3 sentences"}`;
  try{
    const arr = await sample.json(prompt, {modelTier:"default", cache:false});
    const KC = Object.keys(CONCEPTS);
    const clean = (Array.isArray(arr)?arr:[]).map(x=>{
      if(!x || typeof x.q!=="string") return null;
      const loi = Math.max(0, Math.min(u.lois.length-1, Number(x.loi)||0)), c = KC.includes(x.c)?x.c:"form", q = x.q.slice(0,400);
      if(x.t==="mcq" && Array.isArray(x.o) && x.o.length>=2 && Number.isInteger(x.a) && x.a>=0 && x.a<x.o.length) return {t:"mcq",loi,c,q,o:x.o.slice(0,5).map(s=>String(s).slice(0,200)),a:x.a,why:String(x.why||"").slice(0,400)};
      if(x.t==="tf" && typeof x.a==="boolean") return {t:"tf",loi,c,q,a:x.a,why:String(x.why||"").slice(0,400)};
      if(x.t==="explain") return {t:"explain",loi,c,q,model:String(x.model||"").slice(0,800)};
      return null; }).filter(Boolean);
    if(!clean.length) throw {code:"invalid_json"};
    u.qs.push(...clean); saveUnit(u);
    if(msgEl) msgEl.textContent = `Added ${clean.length} questions. Check them in the Parent tab.`;
  }catch(e){
    const code = e && e.code;
    if(code==="not_granted"||code==="sampling_disabled") sample = null;
    if(msgEl) msgEl.textContent = code==="rate_limited" ? "Claude is busy. Try again in a few minutes." : code==="not_granted"||code==="sampling_disabled" ? "Claude isn’t available here. Add questions yourself in the Parent tab." : "Claude couldn’t create questions this time. Try again from the Parent tab.";
  } finally { if(btn) btn.disabled = false; if(view.name==="parent") render(); }
}

/* =========================================================
   Boot
   ========================================================= */
render();
(async () => {
  if(!window.claude || !window.claude.use) return;
  claude.use("sample").then(s => { if(s){ sample = s; if(["unitform","parent"].includes(view.name)) render(); } }).catch(()=>{});
  try { db = await claude.use("db"); } catch(e) { db = null; }
  if(!db) return;
  try{
    const [pg, sg, us, ss] = await Promise.all([db.doc("progress/rishay").get(), db.doc("settings/main").get(), db.collection("units").get(), db.collection("sessions").orderBy("at","desc").limit(300).get()]);
    const clone = x => JSON.parse(JSON.stringify(x));
    if(pg.exists){ const r = clone(pg.data()); if((r.updatedAt||0) >= (S.progress.updatedAt||0)) S.progress = {skills:{},concepts:{},daily:{},...r}; else dirtyProgress = true; } else if(S.progress.updatedAt) dirtyProgress = true;
    if(sg.exists){ const r = clone(sg.data()); if((r.updatedAt||0) >= (S.settings.updatedAt||0)) S.settings = {hidden:[], ...r}; }
    const remoteUnits = us.docs.map(d=>clone(d.data())).filter(u=>u && u.id && Array.isArray(u.qs));
    const localOnly = S.units.filter(u=>!remoteUnits.some(r=>r.id===u.id));
    S.units = [...remoteUnits, ...localOnly]; localOnly.forEach(u=>dbWrite("units/"+u.id, u));
    const remoteS = ss.docs.map(d=>clone(d.data()));
    const localS = S.sessions.filter(s=>!remoteS.some(r=>r.id===s.id)); localS.forEach(s=>dbWrite("sessions/"+s.id, s));
    S.sessions = [...remoteS, ...localS].sort((a,b)=>b.at-a.at).slice(0,300);
    persistLocal(); setSync(true); flushProgress();
    if(view.name!=="quiz" && view.name!=="results" && view.name!=="unitform") render();
  }catch(e){ db = null; setSync(false); }
})();
</script>
