<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Rishay's Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: graph-paper ground, one sticky top bar with subject tabs, a single centred column of
   cards. Subjects keep fixed identity colours (Maths blue, English coral, UOI green); status
   chips always carry an icon and a word, never colour alone. */
:root{
  --bg:#f3f5f7;
  --grid:#e4e9ee;
  --card:#ffffff;
  --ink:#152030;
  --muted:#596577;
  --line:#dce2e9;
  --soft:#eef2f6;
  --math:#2d6cdf;
  --eng:#d4572e;
  --uoi:#1f9b6b;
  --sun:#e0a21b;
  --bad:#c62828;
  --warn:#a86a00;
  --ok:#2d5fa8;
  --chart:#3b4b63;
  --font-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --grid:#18202a; --card:#18202b; --ink:#e8edf3; --muted:#9aa6b5; --line:#2a3442; --soft:#202a37;
    --math:#5a8cf0; --eng:#d8653c; --uoi:#21996a; --sun:#f2c14e; --bad:#ef7070; --warn:#e3a740; --ok:#8db6ff; --chart:#9fb1c8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --grid:#18202a; --card:#18202b; --ink:#e8edf3; --muted:#9aa6b5; --line:#2a3442; --soft:#202a37;
  --math:#5a8cf0; --eng:#d8653c; --uoi:#21996a; --sun:#f2c14e; --bad:#ef7070; --warn:#e3a740; --ok:#8db6ff; --chart:#9fb1c8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--math);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
.brand span{color:var(--sun)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{appearance:none;border:0;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--card)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-math{background:var(--math)} .d-eng{background:var(--eng)} .d-uoi{background:var(--uoi)}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.solid{background:var(--ink);color:var(--card)}
.btn.solid:hover:not(:disabled){background:var(--ink);opacity:.9}
.btn.sm{padding:4px 10px;font-size:14px;border-width:1px}
.btn.math{border-color:var(--math);color:var(--math)} .btn.eng{border-color:var(--eng);color:var(--eng)} .btn.uoi{border-color:var(--uoi);color:var(--uoi)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid3,.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:13px}

/* meters + chips */
.meter{display:flex;align-items:center;gap:8px;min-width:0}
.bar{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px}
.bar.math i{background:var(--math)} .bar.eng i{background:var(--eng)} .bar.uoi i{background:var(--uoi)}
.pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:38px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.new{color:var(--muted)}
.chip.needs{color:var(--bad);border-color:var(--bad)}
.chip.learning{color:var(--warn);border-color:var(--warn)}
.chip.secure{color:var(--ok);border-color:var(--ok)}
.chip.mastered{color:var(--sun);border-color:var(--sun)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}

/* home */
.hello h1{font-size:clamp(28px,5vw,40px);font-weight:800}
.mix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;border:2px solid var(--ink)}
@media (max-width:620px){.mix{grid-template-columns:1fr}}
.mix h2{font-size:24px}
.mix .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.subj h3{font-size:21px;display:flex;align-items:center;gap:8px}
.subj .big{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.subj ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.subj{display:flex;flex-direction:column;gap:10px}
.subj .row:last-child{margin-top:auto}

/* activity chart */
.chart{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;align-items:end;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;outline:none}
.col i{display:block;width:70%;max-width:26px;background:var(--chart);border-radius:4px 4px 0 0;min-height:0}
.col.today i{background:var(--sun)}
.col[data-tip]:hover::after,.col[data-tip]:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:3}
.col:first-child[data-tip]:hover::after,.col:first-child[data-tip]:focus::after{left:0;transform:none}
.col:last-child[data-tip]:hover::after,.col:last-child[data-tip]:focus::after{left:auto;right:0;transform:none}
.xlab{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,200px) auto auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .nm{font-weight:700}
.li .ds{font-size:14px;color:var(--muted)}
@media (max-width:620px){.li{grid-template-columns:minmax(0,1fr) auto}.li>div:first-child{grid-column:1;grid-row:1}.li>.chip{grid-column:2;grid-row:1;justify-self:end}.li>.meter{grid-column:1;grid-row:2}.li>.btn{grid-column:2;grid-row:2;justify-self:end}}
.strand{display:flex;flex-direction:column;gap:4px}
.strand-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.strand-h h3{font-size:19px}
.sess{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.sess:first-child{border-top:0}
.sess .sc{font-weight:700;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:200px}
th{font-family:var(--font-display);font-size:13px;color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums}

/* subject header */
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.shead h1{font-size:clamp(28px,5vw,38px);display:flex;align-items:center;gap:10px}
.shead .dot{width:14px;height:14px}

/* UOI */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.unit{appearance:none;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.unit[aria-pressed="true"]{border-color:var(--uoi);box-shadow:0 0 0 2px var(--uoi) inset}
.unit .th{font-size:12px;color:var(--uoi);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.unit b{font-family:var(--font-display);font-size:17px}
.central{font-family:var(--font-display);font-size:clamp(20px,3.4vw,26px);font-weight:700;line-height:1.25;margin:6px 0 4px;max-width:36ch}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{background:var(--soft);border-radius:6px;padding:1px 8px;font-size:14px}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 18px}
.concept .q{font-size:13px;color:var(--muted)}

/* quiz */
.quiz{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qprog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lvl{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
.lvl i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.lvl i.on{background:var(--muted)}
.prompt{font-size:21px;line-height:1.45;margin:4px 0 16px}
.prompt .bignum{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.prompt mark{background:transparent;color:var(--math);text-decoration:underline 3px;text-underline-offset:5px;font-weight:800}
.prompt i{color:var(--eng)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-variant-numeric:tabular-nums}
.fr sup{border-bottom:2px solid currentColor;padding:0 3px;font-size:.85em;vertical-align:baseline}
.fr sub{font-size:.85em;padding:0 3px;vertical-align:baseline}
.fr .sl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.passage{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;background:var(--soft)}
.passage summary{cursor:pointer;font-weight:700;font-family:var(--font-display)}
.passage p{margin:8px 0 0;max-width:68ch;font-size:16px}
.passage.poem p,.passage.letter p{white-space:pre-line}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:17px}
.choice .k{font-family:var(--font-display);font-weight:700;color:var(--muted);min-width:18px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);font-weight:700}
.choice.right{border-color:var(--uoi);background:color-mix(in srgb,var(--uoi) 14%,var(--card))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.choice:disabled{cursor:default}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans input{border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:20px;width:min(280px,100%);background:var(--card);font-variant-numeric:tabular-nums}
.ans input:focus{border-color:var(--ink);outline:none}
.ans .unitlbl{font-size:18px;color:var(--muted)}
.ans textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:17px;background:var(--card);min-height:130px;resize:vertical}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;border:1.5px solid var(--line)}
.fb.good{border-color:var(--uoi)} .fb.badf{border-color:var(--bad)} .fb.part{border-color:var(--warn)}
.fb h4{font-size:18px;display:flex;align-items:center;gap:8px}
.fb .ex{margin-top:6px}
.fb .model{margin-top:8px;background:var(--soft);border-radius:8px;padding:8px 12px}
.qactions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

details{border-top:1px solid var(--line);padding:8px 0}
details summary{cursor:pointer}
.bigword{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:.04em}
.bigword mark{background:transparent;color:var(--eng);text-decoration:underline 3px;text-underline-offset:4px}
/* results */
.score{font-family:var(--font-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.rv .p{font-weight:700}
.rv .a{font-size:14px;margin-top:4px}

/* forms */
.form{display:grid;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.form input,.form select,.form textarea{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-weight:400;font-size:16px}
.form textarea{min-height:80px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400}
.checks label{flex-direction:row;align-items:center;gap:6px;font-weight:400}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px}
.status{font-size:14px;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:6px;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <button class="brand" type="button" data-go="home">Rishay’s Learning Hub<span>.</span></button>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" type="button" data-go="home">Home</button>
      <button class="tab" type="button" data-go="math"><span class="dot d-math"></span>Maths</button>
      <button class="tab" type="button" data-go="eng"><span class="dot d-eng"></span>English</button>
      <button class="tab" type="button" data-go="uoi"><span class="dot d-uoi"></span>Unit of Inquiry</button>
      <button class="tab" type="button" data-go="parent">Parent</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   Utilities
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b]} return a; };
const lcm = (a,b) => a/gcd(a,b)*b;
const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 6});
const round6 = x => Math.round(x*1e6)/1e6;
const frac = (n,d) => `<span class="fr"><sup>${n}</sup><span class="sl">/</span><sub>${d}</sub></span>`;
const mixed = (w,n,d) => w ? (n ? `${w}${frac(n,d)}` : `${w}`) : frac(n,d);
function simp(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }
function fracText(n,d){ if (d===1) return String(n); if (n>d){ const w=Math.floor(n/d), r=n%d; return r ? `${frac(n,d)} = ${mixed(w,r,d)}` : String(w); } return frac(n,d); }
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayKey = t => { const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const addDays = (k,n) => { const [y,m,d]=k.split("-").map(Number); return dayKey(new Date(y,m-1,d+n)); };
const PLACES = ["ones","tens","hundreds","thousands","ten thousands","hundred thousands","millions","ten millions"];
function stripHtml(h){ const d=document.createElement("div"); d.innerHTML=h; return d.textContent.replace(/\s+/g," ").trim(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =========================================================
   Maths: question generators (level 1–3)
   Each returns {type, prompt (html), ans, show (html of correct answer), ex (worked explanation), ...}
   ========================================================= */
function Q(type, prompt, ans, show, ex, extra={}){ return {type, prompt, ans, show, ex, ...extra}; }
function mcq(prompt, opts, correctIdx, ex){ const order = shuffle(opts.map((_,i)=>i)); return {type:"mcq", prompt, opts:order.map(i=>opts[i]), ans:order.indexOf(correctIdx), show:opts[correctIdx], ex}; }
function factorsOf(n){ const f=[]; for(let i=1;i<=n;i++) if(n%i===0) f.push(i); return f; }
const isPrime = n => n>1 && factorsOf(n).length===2;
const UNITS_ = {cm2:"cm²", cm3:"cm³"};

const MATH = [
 {id:"m.pv", strand:"Number sense", name:"Place value", desc:"Value of a digit in numbers up to ten millions", gen(l){
   const len=[6,7,8][l-1]; const ds=Array.from({length:len},(_,i)=> i===0?ri(1,9):ri(0,9));
   const pos=ri(0,len-1); if(ds[pos]===0) ds[pos]=ri(1,9);
   const place=len-1-pos, d=ds[pos], ans=d*10**place;
   let s=""; ds.forEach((x,i)=>{ s += i===pos?`<mark>${x}</mark>`:x; if((len-1-i)%3===0 && i<len-1) s+=","; });
   return Q("num", `What is the value of the underlined digit in<br><span class="bignum">${s}</span>?`, ans, fmt(ans),
     `The ${d} is in the <b>${PLACES[place]}</b> place, so its value is ${d} × ${fmt(10**place)} = <b>${fmt(ans)}</b>.`);
 }},
 {id:"m.round", strand:"Number sense", name:"Rounding", desc:"Round to the nearest 10, 100, 1,000 or 10,000", gen(l){
   const to = l===1 ? pick([10,100]) : l===2 ? pick([100,1000]) : pick([1000,10000]);
   const N = ri(l===1?1000:10000, l===1?99999:l===2?999999:9999999);
   const ans = Math.round(N/to)*to, nd = Math.floor(N/(to/10))%10;

     `Look at the digit just to the right of the ${PLACES[Math.log10(to)]} place. It is <b>${nd}</b>, which is ${nd>=5?"5 or more, so round <b>up</b>":"less than 5, so round <b>down</b>"}. ${fmt(N)} → <b>${fmt(ans)}</b>.`);
 }},
 {id:"m.negative", strand:"Number sense", name:"Negative numbers", desc:"Temperature changes and differences across zero", gen(l){
   if(l===1){ const t=ri(-8,-1), r=ri(-t+1,15), a=t+r; return Q("num",`The temperature in Shimla is <b>${t}°C</b> at dawn. By noon it rises by <b>${r}°</b>. What is the temperature at noon?`,a,`${a}°C`,`Start at ${t} and count ${r} up the number line: ${-t} steps take you to 0, then ${r+t} more → <b>${a}°C</b>.`,{unit:"°C"}); }
   if(l===2){ const t=ri(-3,10), f=ri(t+1,t+12), a=t-f; return Q("num",`It is <b>${t}°C</b> in Manali. At night the temperature falls by <b>${f}°</b>. What is the new temperature?`,a,`${a}°C`,`${t} − ${f}: ${t>0?`${t} steps take you down to 0, then ${f-t} more below zero`:`count ${f} steps down`} → <b>${a}°C</b>.`,{unit:"°C"}); }
   const t1=ri(-15,-2), t2=ri(3,30), a=t2-t1; return Q("num",`In Leh it is <b>${t1}°C</b> and in Pune it is <b>${t2}°C</b>. How many degrees warmer is Pune?`,a,`${a}°`,`From ${t1} up to 0 is ${-t1} degrees, and from 0 up to ${t2} is ${t2} degrees. ${-t1} + ${t2} = <b>${a}</b>.`,{unit:"degrees"});
 }},
 {id:"m.decorder", strand:"Number sense", name:"Comparing decimals", desc:"Order decimals with different numbers of places", gen(l){
   let vals;
   for(let tries=0;tries<50;tries++){
     const a=ri(1,8), b=ri(1,9), w=l===1?0:ri(1,9);
     const c = l===1 ? [`0.${a}`,`0.${a}${b}`,`0.${b}`,`0.0${a}`] : l===2 ? [`${w}.${a}`,`${w}.${a}${b}`,`${w}.${b}${a}`,`${w}.0${b}`] : [`${w}.${a}0${b}`,`${w}.${a}${b}`,`${w}.0${a}${b}`,`${w}.${a}`];
     if(new Set(c.map(Number)).size===4){ vals=c; break; }
   }
   const big=Math.random()<.5, nums=vals.map(Number), target=big?Math.max(...nums):Math.min(...nums);
   const dp=Math.max(...vals.map(v=>v.split(".")[1].length));
   const padded=vals.map(v=>{const [w,f]=v.split(".");return `${w}.${f.padEnd(dp,"0")}`}).sort((x,y)=>Number(x)-Number(y));
   return mcq(`Which number is the <b>${big?"greatest":"smallest"}</b>?`, vals, nums.indexOf(target),
     `Write them all with ${dp} decimal places and compare digit by digit: ${padded.join(" &lt; ")}. So the ${big?"greatest":"smallest"} is <b>${vals[nums.indexOf(target)]}</b>.`);
 }},
 {id:"m.mult", strand:"Operations", name:"Multiplication", desc:"3-digit × 1-digit up to 3-digit × 2-digit", gen(l){
   const a = l===1?ri(100,999):l===2?ri(12,99):ri(120,999), b = l===1?ri(3,9):ri(12,99), ans=a*b;

     : `Split ${a}: ${Math.floor(a/100)*100} × ${b} + ${a%100} × ${b} = ${fmt(Math.floor(a/100)*100*b)} + ${fmt((a%100)*b)} = <b>${fmt(ans)}</b>.`;

 {id:"m.div", strand:"Operations", name:"Division with remainders", desc:"Long division, including remainders", gen(l){
   const d = l===1?ri(2,9):l===2?ri(3,9):ri(11,25), q = l===1?ri(12,99):l===2?ri(100,999):ri(20,99), r = l===1?0:ri(0,d-1), N=d*q+r;
   return Q("qr", `<span class="bignum">${fmt(N)} ÷ ${d}</span> = ?`, {q,r}, r?`${q} r ${r}`:`${q}`,
     `${d} × ${q} = ${fmt(d*q)}${r?`, and ${fmt(N)} − ${fmt(d*q)} = ${r} left over`:""}. So the answer is <b>${q}${r?` r ${r}`:""}</b>.`, {hint:"If there is a remainder, write it like 23 r 4."});
 }},
 {id:"m.bodmas", strand:"Operations", name:"Order of operations", desc:"Brackets, then × and ÷, then + and −", gen(l){
   if(l===1){ const a=ri(2,20),b=ri(2,9),c=ri(2,9),ans=a+b*c; return Q("num",`<span class="bignum">${a} + ${b} × ${c}</span> = ?`,ans,ans,`Multiply first: ${b} × ${c} = ${b*c}. Then ${a} + ${b*c} = <b>${ans}</b>.`); }
   if(l===2){ const a=ri(2,12),b=ri(2,12),c=ri(2,9),d=ri(1,(a+b)*c-1),ans=(a+b)*c-d; return Q("num",`<span class="bignum">(${a} + ${b}) × ${c} − ${d}</span> = ?`,ans,ans,`Brackets first: ${a} + ${b} = ${a+b}. Then ${a+b} × ${c} = ${(a+b)*c}. Then ${(a+b)*c} − ${d} = <b>${ans}</b>.`); }
   const d=ri(2,6),k=ri(2,6),c=ri(1,9),b=c+d*k,a=ri(2,9),e=ri(1,20),ans=a*k+e;
   return Q("num",`<span class="bignum">${a} × (${b} − ${c}) ÷ ${d} + ${e}</span> = ?`,ans,ans,`Brackets: ${b} − ${c} = ${b-c}. Then left to right: ${a} × ${b-c} = ${a*(b-c)}, ÷ ${d} = ${a*k}. Finally + ${e} = <b>${ans}</b>.`);
 }},
 {id:"m.factors", strand:"Operations", name:"Factors, HCF and LCM", desc:"Factors, highest common factor, lowest common multiple", gen(l){
   if(l===1){ const N=pick([24,36,48,60,72,84,90,96]); const fs=factorsOf(N).filter(f=>f>2&&f<N/2+1); const f=pick(fs);
     const non=shuffle(Array.from({length:N},(_,i)=>i+3).filter(x=>N%x!==0&&x<N)).slice(0,3);
     return mcq(`Which of these is a <b>factor</b> of ${N}?`,[f,...non].map(String),0,`${N} ÷ ${f} = ${N/f} exactly, so ${f} is a factor. The others leave a remainder.`); }
   if(l===2){ const h=ri(2,12); let x,y; do{x=ri(1,7);y=ri(2,8)}while(x===y||gcd(x,y)!==1); const a=h*x,b=h*y;
     return Q("num",`What is the <b>highest common factor</b> (HCF) of ${a} and ${b}?`,h,h,`Factors of ${a}: ${factorsOf(a).join(", ")}.<br>Factors of ${b}: ${factorsOf(b).join(", ")}.<br>The highest number in both lists is <b>${h}</b>.`); }
   let a,b; do{a=ri(4,15);b=ri(4,15)}while(a===b); const L=lcm(a,b); const ma=[],mb=[]; for(let i=1;a*i<=L;i++) ma.push(a*i); for(let i=1;b*i<=L;i++) mb.push(b*i);
   return Q("num",`Bus A leaves the stop every <b>${a} minutes</b> and bus B every <b>${b} minutes</b>. Both leave together at 8:00. After how many minutes will they next leave together?`,L,`${L} minutes`,`We need the lowest common multiple of ${a} and ${b}.<br>Multiples of ${a}: ${ma.join(", ")}.<br>Multiples of ${b}: ${mb.join(", ")}.<br>The first number in both lists is <b>${L}</b>.`,{unit:"minutes"});
 }},
 {id:"m.prime", strand:"Operations", name:"Prime numbers", desc:"Recognise primes and composites", gen(l){
   const hi=l===1?30:l===2?60:100, lo=l===3?30:2;
   const pr=[], co=[]; for(let n=lo;n<=hi;n++){ (isPrime(n)?pr:co).push(n); }
   const oddCo = co.filter(n=>n%2===1 && n%5!==0);
   const notQ = Math.random()<.35;
   if(!notQ){ const p=pick(pr), cs=shuffle(l===1?co:oddCo.length>=3?oddCo:co).slice(0,3);
     return mcq(`Which of these numbers is <b>prime</b>?`,[p,...cs].map(String),0,`${p} has exactly two factors, 1 and ${p}. ${cs.map(c=>{const f=factorsOf(c)[1];return `${c} = ${f} × ${c/f}`}).join("; ")}.`); }
   const c=pick(l===1?co:oddCo.length?oddCo:co), ps=shuffle(pr).slice(0,3), f=factorsOf(c)[1];
   return mcq(`Which of these numbers is <b>not</b> prime?`,[c,...ps].map(String),0,`${c} = ${f} × ${c/f}, so it has more than two factors. ${ps.join(", ")} are all prime.`);
 }},

 {id:"m.fequiv", strand:"Fractions, decimals and percentages", name:"Equivalent fractions", desc:"Find the missing number in equal fractions", gen(l){

 {id:"m.fsimp", strand:"Fractions, decimals and percentages", name:"Simplifying fractions", desc:"Write fractions in their simplest form", gen(l){

 {id:"m.fadd", strand:"Fractions, decimals and percentages", name:"Adding and subtracting fractions", desc:"Same, related and different denominators", gen(l){
   let d1,d2,a,b,op;
   for(let t=0;t<100;t++){
     if(l===1){ d1=d2=ri(5,12); } else if(l===2){ d1=ri(2,6); d2=d1*ri(2,3); if(Math.random()<.5)[d1,d2]=[d2,d1]; } else { d1=ri(2,9); do{d2=ri(2,9)}while(d2===d1); }
     a=ri(1,d1-1); b=ri(1,d2-1); op=Math.random()<.5?"+":"−";
     if(op==="−" && a/d1<=b/d2) continue; break;
   }
   const L=lcm(d1,d2), A=a*L/d1, B=b*L/d2, N=op==="+"?A+B:A-B, [n,d]=simp(N,L);
   return Q("frac",`${frac(a,d1)} ${op} ${frac(b,d2)} = ?<div class="hint">Give your answer in its simplest form.</div>`,[n,d],fracText(n,d),
     `${d1===d2?`The denominators are the same, so ${op==="+"?"add":"subtract"} the numerators: `:`Use the common denominator ${L}: ${frac(a,d1)} = ${frac(A,L)} and ${frac(b,d2)} = ${frac(B,L)}. `}${A} ${op} ${B} = ${N}, giving ${frac(N,L)}${(n!==N)?` = ${frac(n,d)}`:""}${n>d?` = ${mixed(Math.floor(n/d),n%d,d)}`:""}.`,{form:"simplest",hint:"Type a fraction like 5/6 or a mixed number like 1 1/4."});
 }},

 {id:"m.area", strand:"Measurement", name:"Perimeter and area", desc:"Rectangles, missing sides, triangles, compound shapes", gen(l){

{title:"Grandpa’s Kite",kind:"Story",text:`Every January, the sky above Ahmedabad fills with kites for Uttarayan. Ishaan had watched his grandfather make kites for years, but this year Grandpa said, “You will make your own.”

They sat on the terrace with thin bamboo sticks, sheets of tissue paper and a pot of glue made from cooked rice. Ishaan’s first kite tore when he pulled the paper too tight. His second kite was so heavy that it would not leave the ground. He felt like giving up.

“A kite is like a bird,” Grandpa said gently. “It must be light, and it must be balanced.” He showed Ishaan how to shave the bamboo until it was as thin as a pencil, and how to tie the string so that both sides pulled equally.

On the morning of the festival, Ishaan’s third kite rose high above the rooftops. It was not the biggest kite in the sky, nor the most colourful, but it danced steadily in the wind. Ishaan looked at his sticky fingers and smiled. He had never been prouder of anything.`,

{title:"The Busy Honeybee",kind:"Information",text:`A honeybee may look small, but it is one of the hardest workers in nature. A single hive can be home to more than fifty thousand bees, and each one has a job to do.

The queen bee lays all the eggs, sometimes over a thousand in a day. Worker bees, which are all female, clean the hive, feed the young, guard the entrance and collect food. Drones are male bees, and they do not collect food at all.

To make honey, worker bees visit flowers and suck up a sweet liquid called nectar. They store it in a special ‘honey stomach’ and carry it back to the hive. There, the nectar is passed from bee to bee and placed in wax cells. The bees fan it with their wings until most of the water dries up. What is left is thick, golden honey.

Bees also do something even more important. As they move from flower to flower, they carry pollen, which helps plants make fruits and seeds. Without bees, we would have far fewer apples, mangoes and almonds.`,

short:[["Name three jobs done by worker bees.","Worker bees clean the hive, feed the young bees, guard the entrance and collect food (any three)."],["What would happen if there were no bees? Answer in your own words.","Plants would not get pollen carried from flower to flower, so they could not make fruits and seeds. We would have far fewer fruits like apples, mangoes and almonds."]]},

{title:"The Lost Wallet",kind:"Story",text:`Kabir was walking home from cricket practice when he spotted a brown wallet lying near the bus stop. He picked it up and opened it. Inside were five hundred-rupee notes, a library card and a small photograph of an old woman.

Kabir’s heart beat fast. Five hundred rupees was enough to buy the new bat he had wanted for months. Nobody had seen him pick it up. For a moment he imagined himself hitting sixes with a shiny new bat.

Then he looked at the photograph again. The woman had kind, tired eyes. Perhaps she needed the money for medicine or food. Kabir remembered how upset his mother had been when she once lost her purse at the market.

He read the name on the library card: Mrs Kamala Iyer, Flat 4B, Lotus Apartments. That was only two streets away. Kabir walked there and rang the bell. When Mrs Iyer saw her wallet, her eyes filled with tears. “My pension money!” she cried. “Thank you, beta.”

Kabir walked home without a new bat, but with a light and happy heart.`,

{title:"The Great Indian Hornbill",kind:"Information",text:`Deep in the forests of the Western Ghats and the north-east of India lives a bird with a bright yellow beak and a strange helmet on its head. This is the Great Indian Hornbill. The ‘helmet’, called a casque, is hollow and helps make its calls louder.

Hornbills have a most unusual way of raising their chicks. When it is time to lay eggs, the female enters a hole in a tall tree. She then seals the entrance with mud, droppings and fruit pulp, leaving only a narrow slit. For about two months she stays inside, keeping the eggs warm and caring for the chicks.

During this time the male works tirelessly. He flies back and forth, bringing figs and other fruits, and passes them through the slit to feed his family.

Hornbills are called ‘farmers of the forest’ because they spread the seeds of the fruits they eat across large areas. Sadly, the cutting down of tall trees has made it hard for them to find nesting places. Today, many villagers in Nagaland and Arunachal Pradesh help to protect hornbill nests.`,

{title:"The Rain Comes Dancing",kind:"Poem",poem:true,text:`The clouds rolled in like elephants,
All grey and slow and wide;
The peacock spread its painted fan
And danced with joy and pride.

The first drops tapped upon the roof
Like fingers on a drum;
The thirsty earth looked up and sighed,
“At last, at last you’ve come!”

The paper boats went sailing down
The river in our lane,
And Mother laughed and let us play
Barefoot in the rain.

By evening every leaf was washed,
The air was cool and sweet,
And frogs began their evening song
In one loud, croaking beat.`,

{title:"Kalpana Chawla",kind:"Biography",text:`Kalpana Chawla was born in Karnal, Haryana, in 1962. As a little girl, she loved to lie on the roof at night and look at the stars. She often drew pictures of aeroplanes while other children drew houses and flowers.

In those days, few girls in her town studied engineering. Kalpana did not let that stop her. She studied aeronautical engineering in Chandigarh and then went to the United States for higher studies. She worked very hard and later became an astronaut with NASA, the American space agency.

In 1997, Kalpana flew into space aboard the space shuttle Columbia. She became the first woman of Indian origin to go to space. During her mission she travelled millions of kilometres and circled the Earth hundreds of times.

In 2003, she went on a second mission. Sadly, the shuttle broke apart as it returned to Earth, and all seven astronauts on board lost their lives. Kalpana is remembered as a brave pioneer who showed that dreams can take you beyond the sky. Many schools and hostels, and even an Indian satellite, have been named after her.`,

{title:"The Banyan and the Bamboo",kind:"Fable",text:`At the edge of a village stood a mighty banyan tree. Its branches spread wide, and its roots hung down like ropes. Beside it grew a thin clump of bamboo.

“Look at you,” the banyan boomed one day. “You bend whenever the smallest breeze blows. You have no strength at all. I never bow to anyone.”

The bamboo said nothing. It simply swayed and rustled softly.

One night, a terrible storm swept across the land. The wind howled and the rain lashed down. The banyan stood stiff and proud, refusing to bend. The bamboo bent low, almost touching the ground, and let the wind rush over it.

By morning, the storm had passed. The villagers came out to see the damage. The great banyan lay on its side, its roots torn out of the earth. The bamboo stood tall again, shining in the sunlight, with hardly a leaf out of place.

An old woman shook her head and said to the children, “Remember this. Sometimes the one who bends is stronger than the one who refuses to bend.”`,

{title:"Plastic in Our Oceans",kind:"Information",text:`Every year, millions of tonnes of plastic end up in the world’s oceans. Much of it comes from things we use only once: bottles, straws, carry bags and food wrappers.

Plastic does not rot like a banana peel or a leaf. Instead, sunlight and waves slowly break it into tiny pieces called microplastics. These pieces can stay in the water for hundreds of years.

Sea animals suffer the most. Turtles often mistake floating bags for jellyfish, one of their favourite foods. Seabirds feed bottle caps to their chicks. Fish swallow microplastics, and when people eat those fish, the plastic can enter our bodies too.

The good news is that each of us can help. We can carry cloth bags to the market, refuse plastic straws, and use steel bottles and lunch boxes. We can also take part in beach and river clean-ups. In 2015, volunteers led by a young lawyer named Afroz Shah began cleaning Versova Beach in Mumbai. Over the next few years they removed millions of kilograms of rubbish, and Olive Ridley turtles returned to hatch on the beach.`,

{title:"The Mystery of the Missing Tiffin",kind:"Story",text:`On Monday, Aanya’s tiffin box disappeared from her desk during the morning break. On Tuesday, it happened again. By Wednesday, the whole of Class 5B was talking about the Tiffin Thief.

“It must be someone from 5A,” said Dev. “They’re always hungry.”

But Aanya was not so sure. She noticed that the box always went missing when the windows were open. She also noticed small muddy marks on her desk, shaped like tiny hands.

On Thursday, Aanya and her friend Zoya hid behind the cupboard during break. Ten minutes later, they heard a soft thump. A small grey monkey climbed in through the window, grabbed Aanya’s tiffin and sat on the windowsill, happily eating her aloo parathas.

The girls burst out laughing. The ‘thief’ looked at them, chattered angrily and leapt away into the neem tree.

From then on, the class kept the windows closed at break time. And Aanya, feeling a little sorry for the monkey, left a banana on the wall outside every Friday.`,

{title:"Why We Need Sleep",kind:"Information",text:`Have you ever felt grumpy or found it hard to focus in class after staying up late? That is because sleep is not just rest. It is when your body and brain do some of their most important work.

While you sleep, your brain sorts out everything you learned during the day. It stores the useful memories and clears away what is not needed. This is why a good night’s sleep before a test often helps more than staying up late to study.

Sleep also helps your body grow. Children’s bodies release a special growth hormone mostly while they are in deep sleep. Your muscles repair themselves, and your body builds up its defence against germs.

Doctors say children aged six to twelve need nine to twelve hours of sleep every night. To sleep well, it helps to go to bed at the same time each day, keep screens away for an hour before bedtime, and sleep in a dark, quiet room.

So the next time someone tells you to go to bed early, remember: you are not wasting time. You are helping your brain and body become stronger.`,

{title:"The Forest Man of India",kind:"True story",text:`In 1979, a sixteen-year-old boy named Jadav Payeng saw something that made him very sad. After a flood on the Brahmaputra river in Assam, many snakes lay dead on a bare sandbank. There were no trees to give them shade, and the hot sun had killed them.

Jadav decided to do something. He began planting bamboo saplings on the sandbank, one by one. Every day he watered them, carrying water from the river. People laughed at him. “Nothing will grow on sand,” they said.

But Jadav did not give up. Year after year, he planted more trees. Slowly, the bare sandbank turned green. Today, the forest he planted covers about 550 hectares. It is called the Molai Forest, after his nickname.

The forest is now home to deer, rhinos, tigers and hundreds of birds. Herds of elephants visit it every year. In 2015, the Government of India gave Jadav the Padma Shri award. People now call him the ‘Forest Man of India’.`,

{title:"A Letter from Camp",kind:"Letter",letter:true,text:`Dear Ma and Papa,

Greetings from the adventure camp in Manali! I have been here for four days, and I have so much to tell you.

On the first day I was homesick, and I almost cried when the bus left. But my tent partner, Siddharth, shared his chocolates with me and told me funny jokes until I fell asleep. Now we are best friends.

Every morning we wake up at six. It is so cold that my breath comes out like smoke! After a breakfast of porridge and parathas, we go trekking. Yesterday we climbed to a waterfall. The path was steep and slippery, and I fell twice, but our instructor, Captain Thapa, said I was the bravest in our group because I kept going.

In the evenings, we sit around a campfire and sing songs. Last night I saw more stars than I have ever seen in Delhi. Captain Thapa showed us the Great Bear and the Pole Star.

I miss your cooking, Ma, and our evening chess games, Papa. I will be home on Sunday.

With lots of love,
Arnav`,

const SPEECH = typeof window!=="undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";
function speak(text, rate=0.82){ if(!SPEECH || !text) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); const vs=speechSynthesis.getVoices(); const v=vs.find(x=>/en[-_]IN/i.test(x.lang))||vs.find(x=>/en[-_]GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang)); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-GB"; u.rate=rate; speechSynthesis.speak(u); }catch(e){} }
const reEsc = w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function blankWord(sentence, word){ return sentence.replace(new RegExp(reEsc(word),"gi"), "_____"); }
function pickUnused(list, used, key){ const fresh=list.filter(x=>!used.has(key(x))); const x=pick(fresh.length?fresh:list); used.add(key(x)); return x; }
function spellQ(w, def, sent){ const alt = BEE_ALT[w.toLowerCase()];
  return {type:"spell", word:w, def, sent, prompt:"Listen to the word, then type its spelling.", accept:[w], alt: alt?[alt]:[], show:w,
    ex:`<b>${esc(w)}</b>: ${esc(def)}.${sent?` <i>${esc(sent)}</i>`:""}`}; }
function markDiff(given, word){ let out=""; for(let i=0;i<word.length;i++){ const ok=(given[i]||"").toLowerCase()===word[i].toLowerCase(); out += ok ? esc(word[i]) : `<mark>${esc(word[i])}</mark>`; } return out; }
function synBanned(e){ const set=new Set([e[0],...e[2]]); SYN.forEach(o=>{ if(o===e) return; if(set.has(o[0]) || o[2].some(x=>set.has(x)) || o[2].includes(e[0])){ set.add(o[0]); o[2].forEach(x=>set.add(x)); } }); return set; }
function synQ(l, used){
  const e = pickUnused(SYN.filter(x=>x[5]===l), used, x=>x[0]);
  const [w, mean, syns, ant, sent] = e;
  const banned = synBanned(e); if(ant) banned.add(ant);
  const others = shuffle([...new Set(SYN.flatMap(x=>[x[0],...x[2]]))].filter(x=>!banned.has(x)));
  const ex = `<b>${esc(w)}</b> means ${esc(mean)}. Synonyms: ${syns.map(esc).join(", ")}.${ant?` Opposite (antonym): ${esc(ant)}.`:""}`;
  const mode = l===3 && Math.random()<0.35 ? "not" : Math.random()<0.5 ? "context" : "same";
  if(mode==="not") return mcq(`Which word is <b>not</b> a synonym of <b>${esc(w)}</b>?`, [ant||others[0], ...syns.slice(0,3)], 0, ex);
  const right = pick(syns), wrong = [...(ant?[ant]:[]), ...others].slice(0,3);
  if(mode==="context"){ const sh = esc(sent).replace(new RegExp(`\\b${reEsc(w)}\\b`,"i"), m=>`<b><u>${m}</u></b>`); return mcq(`${sh}<br>Which word could replace the underlined word without changing the meaning?`, [right,...wrong], 0, ex); }
  return mcq(`Which word means the <b>same</b> as <b>${esc(w)}</b>?`, [right,...wrong], 0, ex);
}
function multiQ(ws, ok, opt=[]){
  const fixes = ws.map((w,i)=> ok.includes(i)||opt.includes(i) ? null : `${esc(w)} → <b>${esc(MARRS.fix[w]||"")}</b>`).filter(Boolean);
  return {type:"multi", prompt:"Select <b>all</b> the words that are spelt correctly. There may be more than one.", opts:ws, correct:ok, optional:opt, show: ok.map(i=>ws[i]).join(", "),
    ex:`Corrections: ${fixes.join(", ")}.${opt.length?` (“${esc(ws[opt[0]])}” is a common variant of the standard spelling <b>minuscule</b>, so it is not marked either way.)`:""}`};
}

  sk.push({id:"e.marrs.correct", strand:MS, name:"Find the correctly spelt words", desc:"Booklet section I", pool:()=>MARRS.correct.map(([ws,ok,opt])=>multiQ(ws,ok,opt||[]))});
  sk.push({id:"e.marrs.anagram", strand:MS, name:"Anagrams", desc:"Booklet section II: rearrange the letters to fit the clue", pool:()=>MARRS.anagram.map(([g,c,a])=>({type:"text", prompt:`Rearrange the letters of <span class="bignum">${g.toUpperCase()}</span> to make a word that means:<br><i>${esc(c)}</i>`, accept:[a], show:a, ex:`${esc(g)} → <b>${esc(a)}</b>: ${esc(c)}.`, hint:`Use all ${g.length} letters.`}))});
  sk.push({id:"e.marrs.meaning", strand:MS, name:"Match the meaning", desc:"Booklet section III: advanced words and their meanings", pool:()=>MARRS.match.flatMap(set=>set.map(([w,m],i)=>{ const o=shuffle(set.filter((_,j)=>j!==i)).slice(0,3);
    return Math.random()<0.5 ? mcq(`Which word means: <i>${esc(m)}</i>?`, [w,...o.map(x=>x[0])], 0, `<b>${esc(w)}</b>: ${esc(m)}.`) : mcq(`What does <b>${esc(w)}</b> mean?`, [m,...o.map(x=>x[1])].map(esc), 0, `<b>${esc(w)}</b>: ${esc(m)}.`); }))});
  sk.push({id:"e.marrs.odd", strand:MS, name:"Odd one out", desc:"Booklet section IV: three words share a meaning", pool:()=>MARRS.odd.map(([ws,k,g,om])=>mcq("Three of these words are related in meaning. Which is the <b>odd one out</b>?", ws, k, `The other three mean <i>${esc(g)}</i>; ${esc(om)}.`))});
  return sk;
})();

const THEMES = ["Biology","Chemistry","Physics","Earth and space","Global Perspectives","Other"];
const CONCEPTS = {form:"What is it like?",function:"How does it work?",causation:"Why is it like it is?",change:"How is it changing?",connection:"How is it connected to other things?",perspective:"What are the points of view?",responsibility:"What is our responsibility?"};
const EX_UNITS = [
{id:"cs5-plants", builtin:true, theme:"Biology", title:"Life cycles of flowering plants", central:"Flowering plants reproduce through a life cycle of pollination, fertilisation, seed dispersal and germination.",
 lois:["Flowering and non-flowering plants; parts of a flower","Pollination and fertilisation","Seed dispersal and germination"], concepts:["form","function","change","causation"],
 vocab:["anther","filament","stamen","stigma","style","ovary","ovule","sepal","pollination","fertilisation","seed dispersal","germination","spore"],
 qs:[
 {t:"mcq",loi:0,c:"form",q:"Which part of a flower makes pollen?",o:["Anther","Stigma","Ovary","Sepal"],a:0,why:"The anther sits on top of the filament; together they make the stamen, the male part of the flower."},
 {t:"mcq",loi:0,c:"form",q:"The stigma, style and ovary together make the:",o:["Carpel (female part)","Stamen (male part)","Petal","Sepal"],a:0,why:"The carpel is the female part. The stamen (anther and filament) is the male part."},
 {t:"mcq",loi:0,c:"function",q:"What is the job of the sepals?",o:["To protect the flower while it is a bud","To attract insects","To make pollen","To make seeds"],a:0,why:"Sepals are the small green leaf-like parts that cover and protect the bud."},
 {t:"mcq",loi:0,c:"form",q:"Which of these is a non-flowering plant?",o:["Fern","Mango tree","Sunflower","Hibiscus"],a:0,why:"Ferns and mosses reproduce using spores, not flowers and seeds."},
 {t:"tf",loi:0,c:"form",q:"Pine trees (conifers) make their seeds in cones, not in flowers.",a:true,why:"Conifers are non-flowering plants that make seeds inside cones."},
 {t:"mcq",loi:0,c:"function",q:"Why do many flowers have brightly coloured petals, a sweet smell and nectar?",o:["To attract insects and birds that carry pollen","To protect the seeds","To soak up water","To make the plant taller"],a:0,why:"Colour, scent and nectar attract pollinators."},
 {t:"mcq",loi:1,c:"function",q:"Pollination is:",o:["The transfer of pollen from an anther to a stigma","A seed starting to grow","Seeds being spread far away","Water moving up the stem"],a:0,why:"Pollen must reach the stigma before fertilisation can happen."},
 {t:"mcq",loi:1,c:"connection",q:"Which flower is most likely to be pollinated by the wind?",o:["A small, dull flower with long, feathery stigmas","A large flower with bright petals","A sweet-smelling flower full of nectar","A flower with a landing platform for bees"],a:0,why:"Wind-pollinated flowers (like grasses and maize) don’t need to attract animals; feathery stigmas catch pollen from the air."},
 {t:"mcq",loi:1,c:"causation",q:"After pollination, a pollen tube grows down the style. Why?",o:["So the male cell can reach the ovule and join with the egg cell","So the flower can drink water","So the petals can fall off","So insects can climb in"],a:0,why:"The male cell travels down the tube to the ovule. Joining with the egg cell is fertilisation."},
 {t:"mcq",loi:1,c:"change",q:"After fertilisation, the ovary grows into the:",o:["Fruit","Petal","Anther","Root"],a:0,why:"The ovules become seeds and the ovary becomes the fruit around them."},
 {t:"tf",loi:1,c:"change",q:"Fertilisation happens at the moment pollen lands on the stigma.",a:false,why:"Pollen landing on the stigma is pollination. Fertilisation happens later, when the male cell joins the egg cell in the ovule."},
 {t:"mcq",loi:1,c:"change",q:"Which is the correct order of a flowering plant’s life cycle?",o:["germination → growth → flowering → pollination → fertilisation → seed dispersal","pollination → germination → flowering → seed dispersal → fertilisation → growth","flowering → germination → seed dispersal → pollination → growth → fertilisation","seed dispersal → pollination → germination → fertilisation → flowering → growth"],a:0,why:"A seed germinates, the plant grows and flowers, it is pollinated and fertilised, and new seeds are dispersed."},
 {t:"mcq",loi:2,c:"causation",q:"Why do plants need to disperse their seeds away from the parent plant?",o:["So the new plants don’t compete with the parent for light, water and space","Because seeds are too heavy","To keep insects away","Because seeds need darkness"],a:0,why:"Seedlings growing right under the parent would be shaded and short of water and nutrients."},
 {t:"mcq",loi:2,c:"form",q:"A coconut floats and has a waterproof husk. How are its seeds mainly dispersed?",o:["By water","By wind","By exploding pods","By birds eating them"],a:0,why:"Coconuts can float across the sea and grow on new beaches."},
 {t:"mcq",loi:2,c:"form",q:"Seeds with tiny hooks that stick to your socks are dispersed by:",o:["Animals","Wind","Water","Exploding pods"],a:0,why:"The hooks catch on animal fur (or clothes) and drop off somewhere else."},
 {t:"mcq",loi:2,c:"form",q:"Dandelion seeds have fluffy ‘parachutes’ and sycamore seeds have ‘wings’. They are dispersed by:",o:["Wind","Water","Animals","Explosion"],a:0,why:"Their light, wide shapes catch the air and travel far."},
 {t:"mcq",loi:2,c:"causation",q:"Which conditions does a seed need to germinate?",o:["Water, warmth and air","Light and soil only","Fertiliser and light","Only sunlight"],a:0,why:"Seeds use their own stored food to start growing, so most do not need light or soil to germinate."},
 {t:"mcq",loi:2,c:"causation",q:"Rishay tests whether seeds need water to germinate. Which things must he keep the same in every pot?",o:["Type of seed, number of seeds and temperature","The amount of water","Nothing — he can change everything","Only the colour of the pot"],a:0,why:"In a fair test you change only one variable (water) and keep everything else the same."},
 {t:"explain",loi:1,c:"change",q:"Explain the difference between pollination and fertilisation.",model:"Pollination is when pollen is carried from an anther to a stigma (by insects, birds or wind). Fertilisation happens afterwards, when a male cell from the pollen travels down a pollen tube and joins with the egg cell in an ovule. The fertilised ovule becomes a seed."},
 {t:"explain",loi:2,c:"function",q:"Describe how the features of two fruits or seeds help them to be dispersed.",model:"Any two with features, e.g. dandelion seeds have fluffy parachutes so the wind carries them; coconuts float and are carried by water; mangoes and berries are tasty, so animals eat them and drop the seeds elsewhere; burrs have hooks that stick to fur; pea and balsam pods burst open and throw out seeds."},
 {t:"explain",loi:2,c:"causation",q:"Plan a fair test to find out if seeds need warmth to germinate.",model:"Use two identical sets of the same seeds on damp cotton wool, with the same amount of water and air. Put one in a warm place and one in a fridge (cold). Change only the temperature. Check every day and count how many seeds germinate in each, then compare."}
 ]},
{id:"cs5-sound", builtin:true, theme:"Physics", title:"Sound", central:"Sounds are made by vibrations that travel through materials to our ears.",
 lois:["How sounds are made and how they travel","Loudness (volume) and pitch","Investigating and controlling sound"], concepts:["form","function","causation","connection","responsibility"],
 vocab:["vibration","sound wave","medium","eardrum","volume","pitch","decibel","muffle","insulate"],
 qs:[
 {t:"mcq",loi:0,c:"causation",q:"All sounds are made by:",o:["Vibrations","Light","Magnetism","Heat"],a:0,why:"A sound source vibrates (moves back and forth quickly), making the material around it vibrate too."},
 {t:"mcq",loi:0,c:"form",q:"Sound usually travels fastest through:",o:["Solids","Liquids","Gases","A vacuum"],a:0,why:"Particles in solids are packed closely, so vibrations pass from one to the next quickly."},
 {t:"tf",loi:0,c:"form",q:"Sound can travel through empty space (a vacuum).",a:false,why:"Sound needs particles to pass vibrations along. In space there are almost none, so astronauts talk by radio."},
 {t:"mcq",loi:0,c:"connection",q:"When you hear a school bell, the vibrations reach your ears through:",o:["The air","Light","Electricity","Magnetism"],a:0,why:"The bell vibrates the air particles, and the vibrations pass through the air to your ears."},
 {t:"mcq",loi:0,c:"function",q:"Which part of the ear vibrates when sound reaches it?",o:["The eardrum","The ear lobe","The nose","The tongue"],a:0,why:"The eardrum vibrates and passes the vibrations to tiny bones inside the ear, then nerves send messages to the brain."},
 {t:"mcq",loi:1,c:"causation",q:"If you hit a drum harder, the sound becomes:",o:["Louder","Higher in pitch","Lower in pitch","Quieter"],a:0,why:"A harder hit makes bigger vibrations, which makes a louder sound."},
 {t:"mcq",loi:1,c:"causation",q:"On a guitar, a shorter or tighter string makes a sound that is:",o:["Higher in pitch","Lower in pitch","Always quieter","Silent"],a:0,why:"Shorter, tighter or thinner strings vibrate faster, giving a higher pitch."},
 {t:"mcq",loi:1,c:"form",q:"Pitch means:",o:["How high or low a sound is","How loud a sound is","How far a sound travels","How long a sound lasts"],a:0,why:"Pitch is high or low; volume is loud or quiet."},
 {t:"mcq",loi:1,c:"form",q:"The loudness of a sound is measured in:",o:["Decibels (dB)","Newtons (N)","Metres (m)","Degrees (°)"],a:0,why:"A sound level meter measures loudness in decibels."},
 {t:"tf",loi:1,c:"causation",q:"A bigger drum usually makes a lower-pitched sound than a smaller drum.",a:true,why:"Bigger, looser drum skins vibrate more slowly, giving a lower pitch."},
 {t:"mcq",loi:1,c:"causation",q:"You blow across the tops of bottles holding different amounts of water. The bottle with the LEAST water gives:",o:["The lowest pitch","The highest pitch","No sound","Exactly the same pitch as the others"],a:0,why:"When you blow, the air column vibrates. Least water means the longest air column, which vibrates slowest: the lowest pitch."},
 {t:"mcq",loi:2,c:"function",q:"Which is best for muffling sound in a music practice room?",o:["Thick foam panels or heavy curtains","Glass windows","Metal sheets","Shiny floor tiles"],a:0,why:"Soft, thick materials absorb vibrations instead of reflecting them."},
 {t:"mcq",loi:2,c:"causation",q:"Rishay tests which material muffles sound best. What should stay the same in every test?",o:["The sound source, its loudness and its distance from the sound meter","The material","Nothing","The person who listens, changing each time"],a:0,why:"Only the material should change, so the results can be compared fairly."},
 {t:"mcq",loi:2,c:"causation",q:"Why do sounds get quieter as you move further away from them?",o:["The vibrations spread out and lose energy","The sound changes pitch","Sound stops moving in air","Your ears get tired"],a:0,why:"The energy of the vibrations spreads over a bigger area the further it travels."},
 {t:"mcq",loi:2,c:"responsibility",q:"Why do airport ground staff wear ear defenders?",o:["Very loud sounds can damage hearing","To keep their ears warm","To hear the planes better","To listen to music"],a:0,why:"Long exposure to very loud sounds can permanently damage the inner ear."},
 {t:"explain",loi:0,c:"connection",q:"Explain how the sound of a school bell reaches your ears and how you hear it.",model:"The bell vibrates when it is struck. The vibrations pass through the air particles to your ear. Your eardrum vibrates, tiny bones pass the vibrations on, and nerves send messages to your brain, which recognises the sound."},
 {t:"explain",loi:1,c:"causation",q:"Explain two ways to make a higher-pitched sound on a guitar or a rubber-band box.",model:"Any two: make the string shorter (press it down further along), tighten the string, or use a thinner string. These make the string vibrate faster, which gives a higher pitch."},
 {t:"explain",loi:2,c:"causation",q:"Describe a fair test to find out which material is best at blocking sound.",model:"Wrap the same sound source (e.g. a phone alarm at the same volume) in each material in turn, with the same thickness. Measure the sound with a sound level meter (or listen) from the same distance each time. Change only the material. The material with the lowest reading blocks sound best."}
 ]},
{id:"cs5-matter", builtin:true, theme:"Chemistry", title:"States and properties of matter", central:"Matter can be solid, liquid or gas, and it changes state when it is heated or cooled.",
 lois:["Solids, liquids and gases and the particle model","Changes of state","Evaporation, condensation and the water cycle"], concepts:["form","change","causation","connection"],
 vocab:["particle","solid","liquid","gas","melting","freezing","evaporation","boiling","condensation","melting point","boiling point","water vapour","water cycle"],
 qs:[
 {t:"mcq",loi:0,c:"form",q:"In which state are particles packed tightly together in a fixed pattern?",o:["Solid","Liquid","Gas","All of them"],a:0,why:"In a solid, particles vibrate in fixed positions, so solids keep their shape."},
 {t:"mcq",loi:0,c:"form",q:"Which state takes the shape of its container but keeps the same volume?",o:["Liquid","Solid","Gas","None"],a:0,why:"Liquid particles are close together but can slide past each other."},
 {t:"mcq",loi:0,c:"form",q:"Gases can be squashed (compressed) because:",o:["Their particles are far apart","Their particles are bigger","They are very heavy","They have no particles"],a:0,why:"There is a lot of space between gas particles, so they can be pushed closer together."},
 {t:"tf",loi:0,c:"form",q:"Air has mass, even though we cannot see it.",a:true,why:"Air is made of particles, so it has mass. A blown-up balloon weighs a tiny bit more than an empty one."},
 {t:"mcq",loi:0,c:"form",q:"Sand can be poured like a liquid, but it is a solid because:",o:["Each grain keeps its own shape and size","It is wet","It is heavy","It is yellow"],a:0,why:"Each tiny grain is a solid; it is the grains together that can be poured."},
 {t:"mcq",loi:1,c:"change",q:"Melting is a change from:",o:["Solid to liquid","Liquid to gas","Gas to liquid","Liquid to solid"],a:0,why:"Heating gives particles more energy so they can slide past each other."},
 {t:"mcq",loi:1,c:"change",q:"At sea level, pure water boils at:",o:["100°C","0°C","50°C","37°C"],a:0,why:"100°C is the boiling point of water; 0°C is its melting (freezing) point."},
 {t:"mcq",loi:1,c:"change",q:"Condensation is when:",o:["A gas cools and turns into a liquid","A liquid turns into a solid","A solid turns into a gas","A liquid is heated"],a:0,why:"Cooling makes gas particles slow down and come together as a liquid."},
 {t:"mcq",loi:1,c:"causation",q:"Water droplets form on the outside of a glass of cold water because:",o:["Water vapour in the air condenses on the cold glass","Water leaks through the glass","Ice melts through the glass","The glass is sweating"],a:0,why:"The cold glass cools the water vapour in the air, which condenses into droplets."},
 {t:"mcq",loi:1,c:"change",q:"When a solid melts, its particles:",o:["Move faster and can slide past each other","Get bigger","Disappear","Stop moving"],a:0,why:"Particles don’t change size; they gain energy and move more freely."},
 {t:"tf",loi:2,c:"change",q:"Water evaporates only when it boils.",a:false,why:"Evaporation happens from the surface at any temperature (puddles dry up). Boiling is fast evaporation at the boiling point."},
 {t:"mcq",loi:2,c:"causation",q:"Wet clothes dry fastest on a day that is:",o:["Warm and windy","Cold and still","Cloudy and damp","Cold and wet"],a:0,why:"Warmth gives particles more energy and wind carries water vapour away, so evaporation is faster."},
 {t:"mcq",loi:2,c:"causation",q:"Rishay puts the same amount of water in a wide saucer and a narrow glass. Which dries up first?",o:["The saucer, because more water surface is open to the air","The glass, because it is taller","Both at the same time","The glass, because it is narrow"],a:0,why:"A larger surface area means more particles can escape at once."},
 {t:"mcq",loi:2,c:"connection",q:"In the water cycle, clouds form when:",o:["Water vapour cools and condenses into tiny droplets","The Sun heats the clouds","Rain freezes","Rivers flow into the sea"],a:0,why:"Rising water vapour cools high up and condenses into droplets that make clouds."},
 {t:"mcq",loi:2,c:"connection",q:"Salt is collected from sea water in the salt pans of Gujarat by:",o:["Evaporation","Freezing","Melting","Condensation"],a:0,why:"The Sun evaporates the water and the salt is left behind."},
 {t:"explain",loi:0,c:"form",q:"Use the particle model to explain why you can pour a liquid but not a solid.",model:"In a solid, the particles are packed tightly in fixed positions and can only vibrate, so the solid keeps its shape. In a liquid, the particles are close together but can move and slide past each other, so the liquid can flow and be poured."},
 {t:"explain",loi:2,c:"change",q:"Explain the difference between evaporation and boiling.",model:"Evaporation happens slowly from the surface of a liquid at any temperature. Boiling happens quickly throughout the liquid, with bubbles of gas, and only at the boiling point (100°C for water)."},
 {t:"explain",loi:2,c:"connection",q:"Describe the water cycle using the words evaporation, condensation and precipitation.",model:"The Sun heats water in seas, lakes and rivers, and it evaporates into water vapour. The vapour rises, cools and condenses into droplets that form clouds. When the droplets get heavy they fall as precipitation (rain, snow or hail) and flow back into rivers and seas."}
 ]},
{id:"cs5-digestion", builtin:true, theme:"Biology", title:"The digestive system", central:"The digestive system breaks food down so that the body can absorb the nutrients it needs.",
 lois:["Organs of the digestive system and what they do","Teeth and the journey of food","A healthy diet and a healthy digestive system"], concepts:["form","function","connection","responsibility"],
 vocab:["digestion","saliva","oesophagus","stomach","small intestine","large intestine","nutrients","absorb","incisor","canine","molar","fibre"],
 qs:[
 {t:"mcq",loi:0,c:"function",q:"Where does digestion begin?",o:["In the mouth","In the stomach","In the small intestine","In the large intestine"],a:0,why:"Teeth break food up and saliva starts to break down starch."},
 {t:"mcq",loi:0,c:"form",q:"The tube that carries food from the mouth to the stomach is the:",o:["Oesophagus (food pipe)","Windpipe","Small intestine","Artery"],a:0,why:"The oesophagus links the mouth to the stomach."},
 {t:"mcq",loi:0,c:"function",q:"What does the stomach do?",o:["Churns food and mixes it with acid and digestive juices","Absorbs most of the water","Pumps blood","Makes saliva"],a:0,why:"The stomach’s muscular walls churn food, and acid helps break it down and kill germs."},
 {t:"mcq",loi:0,c:"function",q:"Most nutrients pass into the blood in the:",o:["Small intestine","Stomach","Large intestine","Mouth"],a:0,why:"The small intestine is long with a huge inner surface, which is ideal for absorbing nutrients."},
 {t:"mcq",loi:0,c:"function",q:"The main job of the large intestine is to:",o:["Absorb water from undigested food","Chew food","Make acid","Pump food upwards"],a:0,why:"The large intestine takes back water, leaving solid waste."},
 {t:"mcq",loi:0,c:"function",q:"Saliva helps digestion because it:",o:["Makes food moist and starts breaking down starch","Only cleans teeth","Makes food hotter","Adds vitamins"],a:0,why:"Saliva softens food so it is easy to swallow and starts digesting starch."},
 {t:"tf",loi:0,c:"form",q:"The small intestine is longer than the large intestine.",a:true,why:"In an adult it is about 6–7 m long, compared with about 1.5 m for the large intestine. ‘Small’ refers to its narrow width."},
 {t:"mcq",loi:1,c:"connection",q:"Which is the correct order of food’s journey?",o:["mouth → oesophagus → stomach → small intestine → large intestine","mouth → stomach → oesophagus → large intestine → small intestine","stomach → mouth → small intestine → oesophagus → large intestine","mouth → small intestine → stomach → large intestine → oesophagus"],a:0,why:"Food goes down the oesophagus to the stomach, then the small and large intestines."},
 {t:"mcq",loi:1,c:"function",q:"Which teeth are best for biting and cutting food?",o:["Incisors","Molars","Premolars","Wisdom teeth"],a:0,why:"Incisors are the flat, sharp front teeth."},
 {t:"mcq",loi:1,c:"function",q:"Molars are used for:",o:["Grinding and crushing food","Tearing meat","Cutting food","Tasting food"],a:0,why:"Molars at the back have wide, bumpy surfaces for grinding."},
 {t:"mcq",loi:1,c:"function",q:"Food is pushed along the oesophagus by:",o:["Muscles squeezing in waves","Gravity only","The heart","Air pressure"],a:0,why:"Muscle waves push food along, which is why you can even swallow lying down."},
 {t:"tf",loi:1,c:"causation",q:"Chewing food well makes digestion easier for the stomach.",a:true,why:"Smaller pieces have more surface for digestive juices to work on."},
 {t:"mcq",loi:2,c:"responsibility",q:"Fibre (in fruit, vegetables and whole grains) helps the digestive system by:",o:["Helping food move through the intestines and preventing constipation","Giving a lot of fat","Making teeth whiter","Stopping digestion"],a:0,why:"Fibre adds bulk so the muscles of the intestines can push food along."},
 {t:"mcq",loi:2,c:"function",q:"Which food is the best source of protein for growth and repair?",o:["Dal (lentils)","White rice","Butter","Sugar"],a:0,why:"Lentils, beans, eggs, fish, milk and paneer are good sources of protein."},
 {t:"mcq",loi:2,c:"responsibility",q:"Why should you wash your hands before eating?",o:["To stop germs entering your digestive system and making you ill","To make the food taste better","To help saliva work","It doesn’t matter"],a:0,why:"Germs on hands can cause stomach upsets and infections."},
 {t:"mcq",loi:2,c:"causation",q:"Which habit is most likely to harm your teeth?",o:["Sipping sugary drinks throughout the day","Brushing twice a day","Drinking water","Eating carrots"],a:0,why:"Bacteria feed on sugar and make acid that attacks tooth enamel."},
 {t:"explain",loi:1,c:"connection",q:"Describe what happens to a bite of chapati from the moment it enters your mouth until its nutrients reach your blood.",model:"Teeth cut and grind it and saliva moistens it and starts breaking down starch. It is swallowed down the oesophagus to the stomach, where it is churned with acid and digestive juices. In the small intestine it is broken down further and the nutrients are absorbed into the blood. Water is absorbed in the large intestine and the waste leaves the body."},
 {t:"explain",loi:2,c:"responsibility",q:"Explain why a balanced diet with fibre and plenty of water keeps the digestive system healthy.",model:"A balanced diet gives the body all the nutrients it needs. Fibre helps food move through the intestines and prevents constipation, and water keeps the waste soft and helps digestion. Together they keep the digestive system working well."}
 ]},
{id:"cs5-forces", builtin:true, theme:"Physics", title:"Forces and magnetism", central:"Forces push or pull and change how things move; magnets exert forces on magnetic materials.",
 lois:["Types of forces and measuring them","Friction, air resistance and water resistance","Magnets and magnetic materials"], concepts:["form","function","causation","connection"],

 qs:[
 {t:"mcq",loi:0,c:"form",q:"Forces are measured in:",o:["Newtons (N)","Kilograms (kg)","Metres (m)","Litres (L)"],a:0,why:"The unit of force is the newton, named after Isaac Newton."},
 {t:"mcq",loi:0,c:"function",q:"A forcemeter (newton meter) measures force using:",o:["A spring that stretches","A magnet","A thermometer","A light sensor"],a:0,why:"The bigger the force, the more the spring stretches along the scale."},
 {t:"mcq",loi:0,c:"form",q:"Gravity is a force that:",o:["Pulls objects towards the Earth","Pushes objects up","Slows down moving objects","Attracts only iron"],a:0,why:"Gravity pulls everything towards the centre of the Earth."},
 {t:"mcq",loi:0,c:"form",q:"A book rests on a table. The table pushes up on the book. This upward push is called the:",o:["Normal force (reaction force)","Friction","Magnetic force","Air resistance"],a:0,why:"The surface pushes back up, balancing the book’s weight."},
 {t:"tf",loi:0,c:"form",q:"Weight is a force, so it is measured in newtons; mass is measured in kilograms.",a:true,why:"Mass is the amount of matter; weight is the pull of gravity on that mass."},
 {t:"mcq",loi:0,c:"causation",q:"When the forces on an object are balanced, the object:",o:["Stays still or keeps moving at the same speed","Speeds up","Always stops","Changes direction"],a:0,why:"Only unbalanced forces change how an object moves."},

let S = {progress:{skills:{}, concepts:{}, daily:{}, updatedAt:0}, sessions:[], units:[], settings:{currentUnit:"cs5-plants", hidden:[], updatedAt:0}};
try { const x = JSON.parse(localStorage.getItem(LS)||"null"); if (x && x.progress) S = {...S, ...x}; } catch(e){}
let db = null, sample = null;
let chain = Promise.resolve(), saveT = null, dirtyProgress = false;

function persistLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }
function dbWrite(path, body){ if(!db) return; const b = JSON.parse(JSON.stringify(body)); chain = chain.then(()=>db.doc(path).set(b)).then(()=>setSync(true)).catch(e=>setSync(false, e)); }
function dbDelete(path){ if(!db) return; chain = chain.then(()=>db.doc(path).delete()).catch(()=>{}); }
function saveProgress(){ S.progress.updatedAt = Date.now(); dirtyProgress = true; persistLocal(); clearTimeout(saveT); saveT = setTimeout(flushProgress, 2000); }
function flushProgress(){ if(dirtyProgress){ dirtyProgress=false; dbWrite("progress/rishay", S.progress); } }
function saveSettings(){ S.settings.updatedAt = Date.now(); persistLocal(); dbWrite("settings/main", S.settings); }
function saveUnit(u){ persistLocal(); dbWrite("units/"+u.id, u); }
let syncMsg = "Progress is saved on this device.";
function setSync(ok, e){ syncMsg = ok ? "Progress is saved to your Claude account." : (e && e.code==="quota_exceeded" ? "Online storage is full. Progress is saved on this device." : "Could not save online just now. Progress is saved on this device."); const el=$("#sync"); if(el) el.textContent=syncMsg; }
