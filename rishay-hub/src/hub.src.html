<title>Rishay's Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: graph-paper ground, one sticky top bar with subject tabs, a single centred column of
   cards. Subjects keep fixed identity colours (Maths blue, English coral, UOI green); status
   chips always carry an icon and a word, never colour alone. */
:root{
  --bg:#f3f5f7;
  --grid:#e4e9ee;
  --card:#ffffff;
  --ink:#152030;
  --muted:#596577;
  --line:#dce2e9;
  --soft:#eef2f6;
  --math:#2d6cdf;
  --eng:#d4572e;
  --uoi:#1f9b6b;
  --sun:#e0a21b;
  --bad:#c62828;
  --warn:#a86a00;
  --ok:#2d5fa8;
  --chart:#3b4b63;
  --font-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --grid:#18202a; --card:#18202b; --ink:#e8edf3; --muted:#9aa6b5; --line:#2a3442; --soft:#202a37;
    --math:#5a8cf0; --eng:#d8653c; --uoi:#21996a; --sun:#f2c14e; --bad:#ef7070; --warn:#e3a740; --ok:#8db6ff; --chart:#9fb1c8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --grid:#18202a; --card:#18202b; --ink:#e8edf3; --muted:#9aa6b5; --line:#2a3442; --soft:#202a37;
  --math:#5a8cf0; --eng:#d8653c; --uoi:#21996a; --sun:#f2c14e; --bad:#ef7070; --warn:#e3a740; --ok:#8db6ff; --chart:#9fb1c8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--math);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
.brand span{color:var(--sun)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{appearance:none;border:0;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--card)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-math{background:var(--math)} .d-eng{background:var(--eng)} .d-uoi{background:var(--uoi)}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.solid{background:var(--ink);color:var(--card)}
.btn.solid:hover:not(:disabled){background:var(--ink);opacity:.9}
.btn.sm{padding:4px 10px;font-size:14px;border-width:1px}
.btn.math{border-color:var(--math);color:var(--math)} .btn.eng{border-color:var(--eng);color:var(--eng)} .btn.uoi{border-color:var(--uoi);color:var(--uoi)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid3,.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:13px}

/* meters + chips */
.meter{display:flex;align-items:center;gap:8px;min-width:0}
.bar{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px}
.bar.math i{background:var(--math)} .bar.eng i{background:var(--eng)} .bar.uoi i{background:var(--uoi)}
.pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:38px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.new{color:var(--muted)}
.chip.needs{color:var(--bad);border-color:var(--bad)}
.chip.learning{color:var(--warn);border-color:var(--warn)}
.chip.secure{color:var(--ok);border-color:var(--ok)}
.chip.mastered{color:var(--sun);border-color:var(--sun)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}

/* home */
.hello h1{font-size:clamp(28px,5vw,40px);font-weight:800}
.mix{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;border:2px solid var(--ink)}
@media (max-width:620px){.mix{grid-template-columns:1fr}}
.mix h2{font-size:24px}
.mix .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.subj h3{font-size:21px;display:flex;align-items:center;gap:8px}
.subj .big{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.subj ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.subj{display:flex;flex-direction:column;gap:10px}
.subj .row:last-child{margin-top:auto}

/* activity chart */
.chart{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;align-items:end;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;outline:none}
.col i{display:block;width:70%;max-width:26px;background:var(--chart);border-radius:4px 4px 0 0;min-height:0}
.col.today i{background:var(--sun)}
.col[data-tip]:hover::after,.col[data-tip]:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:3}
.col:first-child[data-tip]:hover::after,.col:first-child[data-tip]:focus::after{left:0;transform:none}
.col:last-child[data-tip]:hover::after,.col:last-child[data-tip]:focus::after{left:auto;right:0;transform:none}
.xlab{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,200px) auto auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .nm{font-weight:700}
.li .ds{font-size:14px;color:var(--muted)}
@media (max-width:620px){.li{grid-template-columns:minmax(0,1fr) auto}.li>div:first-child{grid-column:1;grid-row:1}.li>.chip{grid-column:2;grid-row:1;justify-self:end}.li>.meter{grid-column:1;grid-row:2}.li>.btn{grid-column:2;grid-row:2;justify-self:end}}
.strand{display:flex;flex-direction:column;gap:4px}
.strand-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.strand-h h3{font-size:19px}
.sess{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.sess:first-child{border-top:0}
.sess .sc{font-weight:700;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:200px}
th{font-family:var(--font-display);font-size:13px;color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums}

/* subject header */
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.shead h1{font-size:clamp(28px,5vw,38px);display:flex;align-items:center;gap:10px}
.shead .dot{width:14px;height:14px}

/* UOI */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.unit{appearance:none;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.unit[aria-pressed="true"]{border-color:var(--uoi);box-shadow:0 0 0 2px var(--uoi) inset}
.unit .th{font-size:12px;color:var(--uoi);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.unit b{font-family:var(--font-display);font-size:17px}
.central{font-family:var(--font-display);font-size:clamp(20px,3.4vw,26px);font-weight:700;line-height:1.25;margin:6px 0 4px;max-width:36ch}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{background:var(--soft);border-radius:6px;padding:1px 8px;font-size:14px}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 18px}
.concept .q{font-size:13px;color:var(--muted)}

/* quiz */
.quiz{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qprog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lvl{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
.lvl i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.lvl i.on{background:var(--muted)}
.prompt{font-size:21px;line-height:1.45;margin:4px 0 16px}
.prompt .bignum{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.prompt mark{background:transparent;color:var(--math);text-decoration:underline 3px;text-underline-offset:5px;font-weight:800}
.prompt i{color:var(--eng)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-variant-numeric:tabular-nums}
.fr sup{border-bottom:2px solid currentColor;padding:0 3px;font-size:.85em;vertical-align:baseline}
.fr sub{font-size:.85em;padding:0 3px;vertical-align:baseline}
.fr .sl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.passage{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;background:var(--soft)}
.passage summary{cursor:pointer;font-weight:700;font-family:var(--font-display)}
.passage p{margin:8px 0 0;max-width:68ch;font-size:16px}
.passage.poem p,.passage.letter p{white-space:pre-line}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:17px}
.choice .k{font-family:var(--font-display);font-weight:700;color:var(--muted);min-width:18px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);font-weight:700}
.choice.right{border-color:var(--uoi);background:color-mix(in srgb,var(--uoi) 14%,var(--card))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.choice:disabled{cursor:default}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans input{border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:20px;width:min(280px,100%);background:var(--card);font-variant-numeric:tabular-nums}
.ans input:focus{border-color:var(--ink);outline:none}
.ans .unitlbl{font-size:18px;color:var(--muted)}
.ans textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:17px;background:var(--card);min-height:130px;resize:vertical}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;border:1.5px solid var(--line)}
.fb.good{border-color:var(--uoi)} .fb.badf{border-color:var(--bad)} .fb.part{border-color:var(--warn)}
.fb h4{font-size:18px;display:flex;align-items:center;gap:8px}
.fb .ex{margin-top:6px}
.fb .model{margin-top:8px;background:var(--soft);border-radius:8px;padding:8px 12px}
.qactions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* results */
.score{font-family:var(--font-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.rv .p{font-weight:700}
.rv .a{font-size:14px;margin-top:4px}

/* forms */
.form{display:grid;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.form input,.form select,.form textarea{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-weight:400;font-size:16px}
.form textarea{min-height:80px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400}
.checks label{flex-direction:row;align-items:center;gap:6px;font-weight:400}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px}
.status{font-size:14px;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:6px;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <button class="brand" type="button" data-go="home">Rishay’s Learning Hub<span>.</span></button>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" type="button" data-go="home">Home</button>
      <button class="tab" type="button" data-go="math"><span class="dot d-math"></span>Maths</button>
      <button class="tab" type="button" data-go="eng"><span class="dot d-eng"></span>English</button>
      <button class="tab" type="button" data-go="uoi"><span class="dot d-uoi"></span>Unit of Inquiry</button>
      <button class="tab" type="button" data-go="parent">Parent</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   Utilities
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b]} return a; };
const lcm = (a,b) => a/gcd(a,b)*b;
const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 6});
const round6 = x => Math.round(x*1e6)/1e6;
const frac = (n,d) => `<span class="fr"><sup>${n}</sup><span class="sl">/</span><sub>${d}</sub></span>`;
const mixed = (w,n,d) => w ? (n ? `${w}${frac(n,d)}` : `${w}`) : frac(n,d);
function simp(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }
function fracText(n,d){ if (d===1) return String(n); if (n>d){ const w=Math.floor(n/d), r=n%d; return r ? `${frac(n,d)} = ${mixed(w,r,d)}` : String(w); } return frac(n,d); }
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayKey = t => { const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const addDays = (k,n) => { const [y,m,d]=k.split("-").map(Number); return dayKey(new Date(y,m-1,d+n)); };
const PLACES = ["ones","tens","hundreds","thousands","ten thousands","hundred thousands","millions","ten millions"];
function stripHtml(h){ const d=document.createElement("div"); d.innerHTML=h; return d.textContent.replace(/\s+/g," ").trim(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =========================================================
   Maths: question generators (level 1–3)
   Each returns {type, prompt (html), ans, show (html of correct answer), ex (worked explanation), ...}
   ========================================================= */
function Q(type, prompt, ans, show, ex, extra={}){ return {type, prompt, ans, show, ex, ...extra}; }
function mcq(prompt, opts, correctIdx, ex){ const order = shuffle(opts.map((_,i)=>i)); return {type:"mcq", prompt, opts:order.map(i=>opts[i]), ans:order.indexOf(correctIdx), show:opts[correctIdx], ex}; }
function factorsOf(n){ const f=[]; for(let i=1;i<=n;i++) if(n%i===0) f.push(i); return f; }
const isPrime = n => n>1 && factorsOf(n).length===2;
const UNITS_ = {cm2:"cm²", cm3:"cm³"};

const MATH = [
 {id:"m.pv", strand:"Number sense", name:"Place value", desc:"Value of a digit in numbers up to ten millions", gen(l){
   const len=[6,7,8][l-1]; const ds=Array.from({length:len},(_,i)=> i===0?ri(1,9):ri(0,9));
   const pos=ri(0,len-1); if(ds[pos]===0) ds[pos]=ri(1,9);
   const place=len-1-pos, d=ds[pos], ans=d*10**place;
   let s=""; ds.forEach((x,i)=>{ s += i===pos?`<mark>${x}</mark>`:x; if((len-1-i)%3===0 && i<len-1) s+=","; });
   return Q("num", `What is the value of the underlined digit in<br><span class="bignum">${s}</span>?`, ans, fmt(ans),
     `The ${d} is in the <b>${PLACES[place]}</b> place, so its value is ${d} × ${fmt(10**place)} = <b>${fmt(ans)}</b>.`);
 }},
 {id:"m.round", strand:"Number sense", name:"Rounding", desc:"Round to the nearest 10, 100, 1,000 or 10,000", gen(l){
   const to = l===1 ? pick([10,100]) : l===2 ? pick([100,1000]) : pick([1000,10000]);
   const N = ri(l===1?1000:10000, l===1?99999:l===2?999999:9999999);
   const ans = Math.round(N/to)*to, nd = Math.floor(N/(to/10))%10;
   return Q("num", `Round <span class="bignum">${fmt(N)}</span> to the nearest <b>${fmt(to)}</b>.`, ans, fmt(ans),
     `Look at the digit just to the right of the ${PLACES[Math.log10(to)]} place. It is <b>${nd}</b>, which is ${nd>=5?"5 or more, so round <b>up</b>":"less than 5, so round <b>down</b>"}. ${fmt(N)} → <b>${fmt(ans)}</b>.`);
 }},
 {id:"m.negative", strand:"Number sense", name:"Negative numbers", desc:"Temperature changes and differences across zero", gen(l){
   if(l===1){ const t=ri(-8,-1), r=ri(-t+1,15), a=t+r; return Q("num",`The temperature in Shimla is <b>${t}°C</b> at dawn. By noon it rises by <b>${r}°</b>. What is the temperature at noon?`,a,`${a}°C`,`Start at ${t} and count ${r} up the number line: ${-t} steps take you to 0, then ${r+t} more → <b>${a}°C</b>.`,{unit:"°C"}); }
   if(l===2){ const t=ri(-3,10), f=ri(t+1,t+12), a=t-f; return Q("num",`It is <b>${t}°C</b> in Manali. At night the temperature falls by <b>${f}°</b>. What is the new temperature?`,a,`${a}°C`,`${t} − ${f}: ${t>0?`${t} steps take you down to 0, then ${f-t} more below zero`:`count ${f} steps down`} → <b>${a}°C</b>.`,{unit:"°C"}); }
   const t1=ri(-15,-2), t2=ri(3,30), a=t2-t1; return Q("num",`In Leh it is <b>${t1}°C</b> and in Pune it is <b>${t2}°C</b>. How many degrees warmer is Pune?`,a,`${a}°`,`From ${t1} up to 0 is ${-t1} degrees, and from 0 up to ${t2} is ${t2} degrees. ${-t1} + ${t2} = <b>${a}</b>.`,{unit:"degrees"});
 }},
 {id:"m.decorder", strand:"Number sense", name:"Comparing decimals", desc:"Order decimals with different numbers of places", gen(l){
   let vals;
   for(let tries=0;tries<50;tries++){
     const a=ri(1,8), b=ri(1,9), w=l===1?0:ri(1,9);
     const c = l===1 ? [`0.${a}`,`0.${a}${b}`,`0.${b}`,`0.0${a}`] : l===2 ? [`${w}.${a}`,`${w}.${a}${b}`,`${w}.${b}${a}`,`${w}.0${b}`] : [`${w}.${a}0${b}`,`${w}.${a}${b}`,`${w}.0${a}${b}`,`${w}.${a}`];
     if(new Set(c.map(Number)).size===4){ vals=c; break; }
   }
   const big=Math.random()<.5, nums=vals.map(Number), target=big?Math.max(...nums):Math.min(...nums);
   const dp=Math.max(...vals.map(v=>v.split(".")[1].length));
   const padded=vals.map(v=>{const [w,f]=v.split(".");return `${w}.${f.padEnd(dp,"0")}`}).sort((x,y)=>Number(x)-Number(y));
   return mcq(`Which number is the <b>${big?"greatest":"smallest"}</b>?`, vals, nums.indexOf(target),
     `Write them all with ${dp} decimal places and compare digit by digit: ${padded.join(" &lt; ")}. So the ${big?"greatest":"smallest"} is <b>${vals[nums.indexOf(target)]}</b>.`);
 }},
 {id:"m.mult", strand:"Operations", name:"Multiplication", desc:"3-digit × 1-digit up to 3-digit × 2-digit", gen(l){
   const a = l===1?ri(100,999):l===2?ri(12,99):ri(120,999), b = l===1?ri(3,9):ri(12,99), ans=a*b;
   const ex = b>=10 ? `${a} × ${b} = ${a} × ${Math.floor(b/10)*10} + ${a} × ${b%10} = ${fmt(a*Math.floor(b/10)*10)} + ${fmt(a*(b%10))} = <b>${fmt(ans)}</b>.`
     : `Split ${a}: ${Math.floor(a/100)*100} × ${b} + ${a%100} × ${b} = ${fmt(Math.floor(a/100)*100*b)} + ${fmt((a%100)*b)} = <b>${fmt(ans)}</b>.`;
   return Q("num", `<span class="bignum">${a} × ${b}</span> = ?`, ans, fmt(ans), ex);
 }},
 {id:"m.div", strand:"Operations", name:"Division with remainders", desc:"Long division, including remainders", gen(l){
   const d = l===1?ri(2,9):l===2?ri(3,9):ri(11,25), q = l===1?ri(12,99):l===2?ri(100,999):ri(20,99), r = l===1?0:ri(0,d-1), N=d*q+r;
   return Q("qr", `<span class="bignum">${fmt(N)} ÷ ${d}</span> = ?`, {q,r}, r?`${q} r ${r}`:`${q}`,
     `${d} × ${q} = ${fmt(d*q)}${r?`, and ${fmt(N)} − ${fmt(d*q)} = ${r} left over`:""}. So the answer is <b>${q}${r?` r ${r}`:""}</b>.`, {hint:"If there is a remainder, write it like 23 r 4."});
 }},
 {id:"m.bodmas", strand:"Operations", name:"Order of operations", desc:"Brackets, then × and ÷, then + and −", gen(l){
   if(l===1){ const a=ri(2,20),b=ri(2,9),c=ri(2,9),ans=a+b*c; return Q("num",`<span class="bignum">${a} + ${b} × ${c}</span> = ?`,ans,ans,`Multiply first: ${b} × ${c} = ${b*c}. Then ${a} + ${b*c} = <b>${ans}</b>.`); }
   if(l===2){ const a=ri(2,12),b=ri(2,12),c=ri(2,9),d=ri(1,(a+b)*c-1),ans=(a+b)*c-d; return Q("num",`<span class="bignum">(${a} + ${b}) × ${c} − ${d}</span> = ?`,ans,ans,`Brackets first: ${a} + ${b} = ${a+b}. Then ${a+b} × ${c} = ${(a+b)*c}. Then ${(a+b)*c} − ${d} = <b>${ans}</b>.`); }
   const d=ri(2,6),k=ri(2,6),c=ri(1,9),b=c+d*k,a=ri(2,9),e=ri(1,20),ans=a*k+e;
   return Q("num",`<span class="bignum">${a} × (${b} − ${c}) ÷ ${d} + ${e}</span> = ?`,ans,ans,`Brackets: ${b} − ${c} = ${b-c}. Then left to right: ${a} × ${b-c} = ${a*(b-c)}, ÷ ${d} = ${a*k}. Finally + ${e} = <b>${ans}</b>.`);
 }},
 {id:"m.factors", strand:"Operations", name:"Factors, HCF and LCM", desc:"Factors, highest common factor, lowest common multiple", gen(l){
   if(l===1){ const N=pick([24,36,48,60,72,84,90,96]); const fs=factorsOf(N).filter(f=>f>2&&f<N/2+1); const f=pick(fs);
     const non=shuffle(Array.from({length:N},(_,i)=>i+3).filter(x=>N%x!==0&&x<N)).slice(0,3);
     return mcq(`Which of these is a <b>factor</b> of ${N}?`,[f,...non].map(String),0,`${N} ÷ ${f} = ${N/f} exactly, so ${f} is a factor. The others leave a remainder.`); }
   if(l===2){ const h=ri(2,12); let x,y; do{x=ri(1,7);y=ri(2,8)}while(x===y||gcd(x,y)!==1); const a=h*x,b=h*y;
     return Q("num",`What is the <b>highest common factor</b> (HCF) of ${a} and ${b}?`,h,h,`Factors of ${a}: ${factorsOf(a).join(", ")}.<br>Factors of ${b}: ${factorsOf(b).join(", ")}.<br>The highest number in both lists is <b>${h}</b>.`); }
   let a,b; do{a=ri(4,15);b=ri(4,15)}while(a===b); const L=lcm(a,b); const ma=[],mb=[]; for(let i=1;a*i<=L;i++) ma.push(a*i); for(let i=1;b*i<=L;i++) mb.push(b*i);
   return Q("num",`Bus A leaves the stop every <b>${a} minutes</b> and bus B every <b>${b} minutes</b>. Both leave together at 8:00. After how many minutes will they next leave together?`,L,`${L} minutes`,`We need the lowest common multiple of ${a} and ${b}.<br>Multiples of ${a}: ${ma.join(", ")}.<br>Multiples of ${b}: ${mb.join(", ")}.<br>The first number in both lists is <b>${L}</b>.`,{unit:"minutes"});
 }},
 {id:"m.prime", strand:"Operations", name:"Prime numbers", desc:"Recognise primes and composites", gen(l){
   const hi=l===1?30:l===2?60:100, lo=l===3?30:2;
   const pr=[], co=[]; for(let n=lo;n<=hi;n++){ (isPrime(n)?pr:co).push(n); }
   const oddCo = co.filter(n=>n%2===1 && n%5!==0);
   const notQ = Math.random()<.35;
   if(!notQ){ const p=pick(pr), cs=shuffle(l===1?co:oddCo.length>=3?oddCo:co).slice(0,3);
     return mcq(`Which of these numbers is <b>prime</b>?`,[p,...cs].map(String),0,`${p} has exactly two factors, 1 and ${p}. ${cs.map(c=>{const f=factorsOf(c)[1];return `${c} = ${f} × ${c/f}`}).join("; ")}.`); }
   const c=pick(l===1?co:oddCo.length?oddCo:co), ps=shuffle(pr).slice(0,3), f=factorsOf(c)[1];
   return mcq(`Which of these numbers is <b>not</b> prime?`,[c,...ps].map(String),0,`${c} = ${f} × ${c/f}, so it has more than two factors. ${ps.join(", ")} are all prime.`);
 }},
 {id:"m.money", strand:"Operations", name:"Money word problems", desc:"Multi-step problems with rupees", gen(l){
   if(l===1){ const a=ri(25,180), b=ri(15,95), ans=a+b; return Q("num",`Rishay buys a storybook for <b>₹${a}</b> and a set of colour pencils for <b>₹${b}</b>. How much does he spend altogether?`,ans,`₹${ans}`,`₹${a} + ₹${b} = <b>₹${ans}</b>.`,{unit:"₹",pre:true}); }
   if(l===2){ const n=ri(3,6), p=ri(28,65), g=ri(40,120), tot=n*p+g, pay=tot<=500?500:1000, ans=pay-tot;
     return Q("num",`Rishay buys <b>${n} notebooks</b> at <b>₹${p}</b> each and a geometry box for <b>₹${g}</b>. He pays with a <b>₹${pay}</b> note. How much change does he get?`,ans,`₹${ans}`,`Notebooks: ${n} × ₹${p} = ₹${n*p}. Total: ₹${n*p} + ₹${g} = ₹${tot}. Change: ₹${pay} − ₹${tot} = <b>₹${ans}</b>.`,{unit:"₹",pre:true}); }
   if(Math.random()<.5){ const price=ri(16,60)*100, pct=pick([10,20,25,50]), ans=price*(100-pct)/100;

   const c=ri(12,30)*10, k=ri(3,5), s=ri(24,32), tot=c*k*s, B=Math.floor(tot*ri(60,90)/100/1000)*1000, ans=tot-B;

 }},
 {id:"m.fequiv", strand:"Fractions, decimals and percentages", name:"Equivalent fractions", desc:"Find the missing number in equal fractions", gen(l){
   let a,b; do{b=ri(2,12);a=ri(1,b-1)}while(gcd(a,b)!==1); const m=ri(2,l===1?5:12);
   if(l<3) return Q("num",`Fill in the missing number: ${frac(a,b)} = ${frac("?",b*m)}`,a*m,a*m,`${b} × ${m} = ${b*m}, so multiply the top by ${m} too: ${a} × ${m} = <b>${a*m}</b>.`);
   return Q("num",`Fill in the missing number: ${frac(a,b)} = ${frac(a*m,"?")}`,b*m,b*m,`${a} × ${m} = ${a*m}, so multiply the bottom by ${m} too: ${b} × ${m} = <b>${b*m}</b>.`);
 }},
 {id:"m.fsimp", strand:"Fractions, decimals and percentages", name:"Simplifying fractions", desc:"Write fractions in their simplest form", gen(l){
   let a,b; do{b=ri(2,l===3?9:12);a=l===3?ri(b+1,3*b):ri(1,b-1)}while(gcd(a,b)!==1); const m=ri(2,l===1?4:l===2?8:12);
   return Q("frac",`Write ${frac(a*m,b*m)} in its <b>simplest form</b>.`,[a,b],fracText(a,b),`The highest common factor of ${a*m} and ${b*m} is ${m}. ${a*m} ÷ ${m} = ${a} and ${b*m} ÷ ${m} = ${b}, so the answer is <b>${fracText(a,b)}</b>.`,{form:"simplest",hint:"Type a fraction like 3/4 or a mixed number like 1 1/2."});
 }},
 {id:"m.fadd", strand:"Fractions, decimals and percentages", name:"Adding and subtracting fractions", desc:"Same, related and different denominators", gen(l){
   let d1,d2,a,b,op;
   for(let t=0;t<100;t++){
     if(l===1){ d1=d2=ri(5,12); } else if(l===2){ d1=ri(2,6); d2=d1*ri(2,3); if(Math.random()<.5)[d1,d2]=[d2,d1]; } else { d1=ri(2,9); do{d2=ri(2,9)}while(d2===d1); }
     a=ri(1,d1-1); b=ri(1,d2-1); op=Math.random()<.5?"+":"−";
     if(op==="−" && a/d1<=b/d2) continue; break;
   }
   const L=lcm(d1,d2), A=a*L/d1, B=b*L/d2, N=op==="+"?A+B:A-B, [n,d]=simp(N,L);
   return Q("frac",`${frac(a,d1)} ${op} ${frac(b,d2)} = ?<div class="hint">Give your answer in its simplest form.</div>`,[n,d],fracText(n,d),
     `${d1===d2?`The denominators are the same, so ${op==="+"?"add":"subtract"} the numerators: `:`Use the common denominator ${L}: ${frac(a,d1)} = ${frac(A,L)} and ${frac(b,d2)} = ${frac(B,L)}. `}${A} ${op} ${B} = ${N}, giving ${frac(N,L)}${(n!==N)?` = ${frac(n,d)}`:""}${n>d?` = ${mixed(Math.floor(n/d),n%d,d)}`:""}.`,{form:"simplest",hint:"Type a fraction like 5/6 or a mixed number like 1 1/4."});
 }},
 {id:"m.fof", strand:"Fractions, decimals and percentages", name:"Fraction of an amount", desc:"Find 3/4 of 48 and similar", gen(l){
   const d=pick([2,3,4,5,6,8,10]); let n; do{n=ri(1,d-1)}while(gcd(n,d)!==1); const q=d*ri(2,l===1?10:l===2?25:60), ans=n*q/d;
   const ctx = l===3 ? `Rishay’s family drove <b>${q} km</b> to Goa. ${frac(n,d)} of the journey was on the highway. How many kilometres was that?` : `What is ${frac(n,d)} of <b>${q}</b>?`;

 }},
 {id:"m.mixed", strand:"Fractions, decimals and percentages", name:"Mixed numbers and improper fractions", desc:"Convert between the two forms", gen(l){
   const w=ri(1,l===1?5:9), d=ri(2,9); let n; do{n=ri(1,d-1)}while(gcd(n,d)!==1);

 }},
 {id:"m.decops", strand:"Fractions, decimals and percentages", name:"Decimal calculations", desc:"Add, subtract, ×/÷ by 10, 100 and 1,000", gen(l){
   if(l===1){ const a=ri(10,999)/10, b=ri(10,999)/10, ans=round6(a+b); return Q("num",`<span class="bignum">${a.toFixed(1)} + ${b.toFixed(1)}</span> = ?`,ans,ans.toFixed(1),`Line up the decimal points and add as usual: ${a.toFixed(1)} + ${b.toFixed(1)} = <b>${ans.toFixed(1)}</b>.`); }
   if(l===2){ const A=ri(500,9999), B=ri(100,A-1), ans=round6((A-B)/100); return Q("num",`<span class="bignum">${(A/100).toFixed(2)} − ${(B/100).toFixed(2)}</span> = ?`,ans,ans.toFixed(2),`Line up the decimal points and subtract (exchange where needed): ${(A/100).toFixed(2)} − ${(B/100).toFixed(2)} = <b>${ans.toFixed(2)}</b>.`); }
   const f=pick([10,100,1000]), mul=Math.random()<.5, x=mul?ri(1,9999)/1000:ri(1,9999)/10, ans=round6(mul?x*f:x/f), k=Math.log10(f);

 }},
 {id:"m.fdp", strand:"Fractions, decimals and percentages", name:"Fractions, decimals and percentages", desc:"Convert between forms; percentage of an amount", gen(l){

 {id:"m.convert", strand:"Measurement", name:"Converting units", desc:"Length, mass and capacity", gen(l){

 {id:"m.area", strand:"Measurement", name:"Perimeter and area", desc:"Rectangles, missing sides, triangles, compound shapes", gen(l){

   if(Math.random()<.5){ const bse=ri(3,12)*2, h=ri(3,14); return Q("num",`A triangle has a base of <b>${bse} cm</b> and a height of <b>${h} cm</b>. What is its area?`,bse*h/2,`${bse*h/2} cm²`,`Area of a triangle = ½ × base × height = ½ × ${bse} × ${h} = <b>${bse*h/2} cm²</b>.`,{unit:"cm²"}); }
   const a=ri(6,12), b=ri(2,4), c=ri(2,5), d=ri(3,7), ans=a*b+c*d;

 }},

function dbWrite(path, body){ if(!db) return; const b = JSON.parse(JSON.stringify(body)); chain = chain.then(()=>db.doc(path).set(b)).then(()=>setSync(true)).catch(e=>setSync(false, e)); }
function dbDelete(path){ if(!db) return; chain = chain.then(()=>db.doc(path).delete()).catch(()=>{}); }
function saveProgress(){ S.progress.updatedAt = Date.now(); dirtyProgress = true; persistLocal(); clearTimeout(saveT); saveT = setTimeout(flushProgress, 2000); }
function flushProgress(){ if(dirtyProgress){ dirtyProgress=false; dbWrite("progress/rishay", S.progress); } }
function saveSettings(){ S.settings.updatedAt = Date.now(); persistLocal(); dbWrite("settings/main", S.settings); }
function saveUnit(u){ persistLocal(); dbWrite("units/"+u.id, u); }
let syncMsg = "Progress is saved on this device.";
function setSync(ok, e){ syncMsg = ok ? "Progress is saved to your Claude account." : (e && e.code==="quota_exceeded" ? "Online storage is full. Progress is saved on this device." : "Could not save online just now. Progress is saved on this device."); const el=$("#sync"); if(el) el.textContent=syncMsg; }
window.addEventListener("pagehide", flushProgress);

/* =========================================================
   Skills and mastery
   ========================================================= */
function allUnits(){ return [...EX_UNITS.filter(u=>!S.settings.hidden.includes(u.id)), ...S.units]; }
function unitById(id){ return EX_UNITS.find(u=>u.id===id) || S.units.find(u=>u.id===id); }
function currentUnit(){ const u = unitById(S.settings.currentUnit); return (u && allUnits().includes(u)) ? u : allUnits()[0] || null; }
function uoiSkills(u){ return u.lois.map((l,i)=>({id:`u.${u.id}.${i}`, strand:u.title, name:l, desc:"", unit:u, loi:i})); }
function skillById(id){
  if(id.startsWith("m.")) return MATH.find(s=>s.id===id);
  if(id.startsWith("e.")) return ENG_SKILLS.find(s=>s.id===id);
  const m = id.match(/^u\.(.+)\.(\d+)$/); if(!m) return null; const u = unitById(m[1]); return u ? uoiSkills(u)[+m[2]] : null;
}
const subjOf = id => id[0]==="m"?"math":id[0]==="e"?"eng":"uoi";
function stat(id){ return S.progress.skills[id]; }
function mastery(st){ if(!st || !st.h || !st.h.length) return null; const h=st.h.slice(-12); let w=0,t=0; h.forEach((x,i)=>{const wt=1+i/h.length; w+=x*wt; t+=wt}); return w/t; }
function status(st){
  const m = mastery(st), n = st ? st.n : 0;
  if(m===null || n<3) return {k:"new", label: n ? "Started" : "Not started", icon:"○"};
  if(m<0.5) return {k:"needs", label:"Needs work", icon:"!"};
  if(m<0.75) return {k:"learning", label:"Learning", icon:"◐"};
  if(m>=0.9 && n>=12) return {k:"mastered", label:"Mastered", icon:"★"};
  return {k:"secure", label:"Secure", icon:"●"};
}
function chip(st){ const s=status(st); return `<span class="chip ${s.k}"><span aria-hidden="true">${s.icon}</span>${s.label}</span>`; }
function meter(m, subj){ const p = m===null ? 0 : Math.round(m*100); return `<div class="meter" role="img" aria-label="Mastery ${m===null?"not measured yet":p+" percent"}"><div class="bar ${subj}"><i style="width:${p}%"></i></div><span class="pct">${m===null?"–":p+"%"}</span></div>`; }
function levelFor(id){ const m = mastery(stat(id)); if(m===null || m<0.6) return 1; if(m<0.85) return 2; return 3; }
function record(id, score, concept){
  const st = S.progress.skills[id] || (S.progress.skills[id] = {h:[], n:0, c:0, last:0});
  st.h.push(score); if(st.h.length>20) st.h = st.h.slice(-20); st.n++; st.c += score; st.last = Date.now();
  if(concept){ const cs = S.progress.concepts[concept] || (S.progress.concepts[concept] = {h:[], n:0, c:0}); cs.h.push(score); if(cs.h.length>30) cs.h=cs.h.slice(-30); cs.n++; cs.c+=score; }
  const k = todayKey(), d = S.progress.daily[k] || (S.progress.daily[k] = {n:0, c:0}); d.n++; d.c += score;
  saveProgress();
}
function subjectMastery(skills){ const ms = skills.map(s=>mastery(stat(s.id))).filter(m=>m!==null); return ms.length ? ms.reduce((a,b)=>a+b,0)/ms.length : null; }
function securedCount(skills){ return skills.filter(s=>["secure","mastered"].includes(status(stat(s.id)).k)).length; }
function weakest(skills, n=2){ return skills.map(s=>({s, m:mastery(stat(s.id))})).filter(x=>x.m!==null && (stat(x.s.id).n>=3)).sort((a,b)=>a.m-b.m).slice(0,n).map(x=>x.s); }
function streak(){ let k = todayKey(), n = 0; if(!S.progress.daily[k]) k = addDays(k,-1); while(S.progress.daily[k] && S.progress.daily[k].n>0){ n++; k = addDays(k,-1); } return n; }
function priority(id){ const st=stat(id), m=mastery(st); const stale = st ? Math.min(1,(Date.now()-st.last)/(7*864e5)) : 1; return (m===null?0.7:1-m) + stale*0.5 + Math.random()*0.15; }

/* =========================================================
   Building quiz items
   ========================================================= */
function unitItem(u, q){
  const loi = Math.min(q.loi||0, u.lois.length-1), skill = `u.${u.id}.${loi}`;
  if(q.t==="tf") return {skill, concept:q.c, q:{type:"mcq", prompt:`True or false? <b>${esc(q.q)}</b>`, opts:["True","False"], ans:q.a?0:1, show:q.a?"True":"False", ex:esc(q.why||"")}};
  if(q.t==="explain") return {skill, concept:q.c, q:{type:"explain", prompt:esc(q.q), model:q.model||"", show:esc(q.model||""), ex:""}};
  return {skill, concept:q.c, q:mcq(esc(q.q), q.o.map(esc), q.a, esc(q.why||""))};
}
function poolItems(skillObj, n){
  if(skillObj.gen) return Array.from({length:n}, ()=>({skill:skillObj.id, lazy:true}));
  if(skillObj.pool) return shuffle(skillObj.pool()).slice(0,n).map(q=>({skill:skillObj.id, q}));
  const u = skillObj.unit; return shuffle(u.qs.filter(q=>(q.loi||0)===skillObj.loi)).slice(0,n).map(q=>unitItem(u,q));
}
function unitItems(u, n, opts={}){
  let qs = shuffle(u.qs);
  if(opts.noExplain) qs = qs.filter(q=>q.t!=="explain");
  if(opts.balanced){ // spread across lines of inquiry and keep at most 3 written answers
    const byLoi = u.lois.map((_,i)=>qs.filter(q=>(q.loi||0)===i)); const out=[]; let ex=0;
    for(let r=0; out.length<n && r<40; r++) for(const list of byLoi){ const q=list.shift(); if(!q) continue; if(q.t==="explain"){ if(ex>=3) continue; ex++; } out.push(q); if(out.length>=n) break; }
    qs = shuffle(out);
  }
  return qs.slice(0,n).map(q=>unitItem(u,q));
}
function todaysMix(){
  const items = [];
  const ms = MATH.slice().sort((a,b)=>priority(b.id)-priority(a.id)).slice(0,5);
  ms.forEach(s=>items.push({skill:s.id, lazy:true}));
  ENG_SKILLS.slice().sort((a,b)=>priority(b.id)-priority(a.id)).slice(0,4).forEach(s=>items.push(...poolItems(s,1)));
  const u = currentUnit(); if(u && u.qs.length) items.push(...unitItems(u,3,{noExplain:false}));
  return items;
}

/* =========================================================
   Answer checking
   ========================================================= */
function parseNum(s){ s = String(s).replace(/[−–]/g,"-").replace(/[,\s₹%°]/g,"").replace(/(cm²|cm³|m²|cm|mm|km|kg|ml|mL|l|L|g|m|minutes|mins|min|degrees|deg|c|C)$/,""); return /^-?\d*\.?\d+$/.test(s) ? Number(s) : null; }
function parseFrac(s){ s = s.trim().replace(/\s+/g," "); let m;
  if((m=s.match(/^(\d+) (\d+)\/(\d+)$/))) return {w:+m[1], n:+m[2], d:+m[3], kind:"mixed"};
  if((m=s.match(/^(\d+)\/(\d+)$/))) return {w:0, n:+m[1], d:+m[2], kind:"frac"};
  if((m=s.match(/^\d+$/))) return {w:+s, n:0, d:1, kind:"int"};
  return null; }
function check(q, raw){
  const s = String(raw ?? "").trim();
  if(q.type==="mcq") return {score: raw===q.ans?1:0};
  if(!s) return {score:0, empty:true};
  if(q.type==="num"){ const x=parseNum(s); if(x===null) return {score:0, note:"That doesn’t look like a number."}; return {score: Math.abs(x-q.ans)<1e-6?1:0}; }
  if(q.type==="qr"){ const m=s.replace(/,/g,"").toLowerCase().match(/^(\d+)\s*(?:r|rem|remainder)?\s*(\d+)?$/); if(!m) return {score:0, note:"Write it like 23 r 4."}; const qq=+m[1], rr=m[2]?+m[2]:0; return {score: qq===q.ans.q && rr===q.ans.r ? 1 : 0}; }
  if(q.type==="pair"){ const m=s.match(/^\(?\s*(-?\d+)\s*,\s*(-?\d+)\s*\)?$/); if(!m) return {score:0, note:"Write it like (4, 7)."}; return {score: +m[1]===q.ans[0] && +m[2]===q.ans[1] ? 1 : 0}; }
  if(q.type==="time"){ const m=s.replace(/\s/g,"").match(/^(\d{1,2})[:.]?(\d{2})$/); if(!m) return {score:0, note:"Write the time like 14:35."}; return {score: ((+m[1])*60 + (+m[2]))%1440 === q.ans ? 1 : 0}; }
  if(q.type==="frac"){
    const f = parseFrac(s); if(!f || f.d===0) return {score:0, note:"Write a fraction like 3/4 or a mixed number like 1 1/2."};
    const [an,ad] = q.ans, num = f.w*f.d + f.n;
    if(num*ad !== an*f.d) return {score:0};
    if(q.form==="improper" && f.kind!=="frac") return {score:0, note:"Right value, but write it as an improper fraction (like 7/3)."};
    if(q.form==="mixed" && !(f.kind==="mixed" && f.n<f.d) && !(f.kind==="int")) return {score:0, note:"Right value, but write it as a mixed number (like 2 1/3)."};
    if(q.form==="simplest"){ if(f.kind!=="int" && gcd(f.n,f.d)!==1) return {score:0, note:"Right value, but it can be simplified further."}; if(f.kind==="mixed" && f.n>=f.d) return {score:0, note:"The fraction part should be less than 1."}; }
    if(q.form==="mixed" && f.kind==="mixed" && gcd(f.n,f.d)!==1) return {score:0, note:"Right value, but simplify the fraction part."};
    return {score:1};
  }
  if(q.type==="text"){ return {score: (q.accept||[]).some(a=>a.toLowerCase()===s.toLowerCase())?1:0}; }
  return {score:0};
}

let view = {name:"home"};
let quiz = null;
function go(name, extra={}){ if(quiz && name!=="quiz" && !quiz.done){ /* leaving an active quiz keeps its answers recorded so far */ } view = {name, ...extra}; render(); window.scrollTo({top:0}); }
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if(g){ if(quiz && !quiz.done && view.name==="quiz"){ endQuiz(true); } go(g.dataset.go); } });

function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.go===view.name || (view.name==="unitform" && t.dataset.go==="uoi") ? "page" : "false"));
  const app = $("#app");
  if(view.name==="home") app.innerHTML = homeView();
  else if(view.name==="math") app.innerHTML = subjectView("math");
  else if(view.name==="eng") app.innerHTML = subjectView("eng");
  else if(view.name==="uoi") app.innerHTML = uoiView();
  else if(view.name==="unitform") app.innerHTML = unitFormView();
  else if(view.name==="parent") app.innerHTML = parentView();
  else if(view.name==="quiz") app.innerHTML = quizView();
  else if(view.name==="results") app.innerHTML = resultsView();
  if(view.name==="quiz") focusAnswer();
}

function activityChart(){
  const t = todayKey(); let cols="", labs="", max=1;
  const days = Array.from({length:14},(_,i)=>addDays(t,i-13));
  days.forEach(k=>{ const d=S.progress.daily[k]; if(d && d.n>max) max=d.n; });
  days.forEach((k,i)=>{ const d=S.progress.daily[k]||{n:0,c:0}; const [y,m,dd]=k.split("-").map(Number); const dt=new Date(y,m-1,dd);
    const tip = d.n ? `${dt.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}: ${d.n} questions, ${Math.round(d.c/d.n*100)}% correct` : `${dt.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}: no practice`;
    cols += `<div class="col ${k===t?"today":""}" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(tip)}"><i style="height:${d.n?Math.max(4,d.n/max*100):0}%"></i></div>`;
    labs += `<span>${i%2===1||k===t ? dt.toLocaleDateString("en-IN",{weekday:"narrow"}) : ""}</span>`;
  });
  return `<div class="row between"><h3 style="font-size:18px">Questions answered, last 14 days</h3><span class="small muted">Most in a day: ${max>1||Object.keys(S.progress.daily).length?max:0}</span></div><div class="chart">${cols}</div><div class="xlab">${labs}</div>`;
}

function weekStats(){ const t=todayKey(); let n=0,c=0; for(let i=0;i<7;i++){ const d=S.progress.daily[addDays(t,-i)]; if(d){n+=d.n;c+=d.c;} } return {n, acc: n? Math.round(c/n*100)+"%" : "–"}; }

  <p class="status" id="sync">${esc(syncMsg)}</p>`;

function sessRow(s){ const p = s.n ? Math.round(s.score/s.n*100) : 0; return `<div class="sess"><span class="dot d-${s.subject==="mix"?"math":s.subject}" style="${s.subject==="mix"?"background:var(--chart)":""}"></span><span>${esc(s.title)} <span class="muted small">· ${new Date(s.at).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}${s.mins?` · ${s.mins} min`:""}</span></span><span class="sc">${fmtScore(s.score)}/${s.n} · ${p}%</span></div>`; }
const fmtScore = x => (Math.round(x*2)/2).toString();

function skillRow(s, subj){ const st = stat(s.id); return `<div class="li"><div><div class="nm">${esc(s.name)}</div>${s.desc?`<div class="ds">${esc(s.desc)}</div>`:""}</div>${meter(mastery(st), subj)}${chip(st)}<button class="btn sm ${subj}" type="button" data-practise="${esc(s.id)}">Practise</button></div>`; }

function unitFormView(){
  return `<div class="shead"><div><div class="eyebrow">Parent</div><h1><span class="dot d-uoi"></span>Add a unit of inquiry</h1></div><button class="btn" type="button" data-go="uoi">Cancel</button></div>
  <section class="card"><form class="form" id="unitForm">
    <p class="note">Copy these from the unit planner or the letter the school sends home. The more detail you give, the better the questions.</p>
    <label>Area<select id="uf-theme">${THEMES.map(t=>`<option>${t}</option>`).join("")}</select></label>
    <label>Unit title<input id="uf-title" required placeholder="e.g. Systems in nature"></label>

/* ---------- quiz ---------- */
function startQuiz(title, subject, items){
  if(!items.length) return;
  quiz = {id:uid(), title, subject, items, i:0, results:[], startedAt:Date.now(), done:false, run:{}, cur:null, sel:null, checked:false, fb:null};
  prepare(); go("quiz");
}
function prepare(){
  const it = quiz.items[quiz.i];
  if(it.lazy){ const sk = skillById(it.skill); const base = levelFor(it.skill), adj = quiz.run[it.skill]||0; it.level = Math.max(1,Math.min(3,base+adj)); it.q = sk.gen(it.level); }
  quiz.sel = null; quiz.checked = false; quiz.fb = null;
}
function quizView(){
  const it = quiz.items[quiz.i], q = it.q, sk = skillById(it.skill), subj = subjOf(it.skill);
  const n = quiz.items.length, p = quiz.i/n*100;
  let input = "";
  if(q.type==="mcq") input = `<div class="choices">${q.opts.map((o,k)=>{ let cls="choice"; if(quiz.checked){ if(k===q.ans) cls+=" right"; else if(k===quiz.sel) cls+=" wrong"; } return `<button type="button" class="${cls}" data-choice="${k}" aria-pressed="${quiz.sel===k}" ${quiz.checked?"disabled":""}><span class="k">${String.fromCharCode(65+k)}</span><span>${o}</span></button>`; }).join("")}</div>`;
  else if(q.type==="explain") input = `<div class="ans"><textarea id="ans" ${quiz.checked?"disabled":""} placeholder="Write your answer in two to four sentences.">${esc(quiz.sel||"")}</textarea></div>`;
  else { const mode = ["num","qr"].includes(q.type)?"decimal":"text"; input = `<div class="ans">${q.pre?`<span class="unitlbl">${esc(q.unit)}</span>`:""}<input id="ans" autocomplete="off" inputmode="${q.type==="num"?"decimal":"text"}" value="${esc(quiz.sel||"")}" ${quiz.checked?"disabled":""} aria-label="Your answer">${q.unit&&!q.pre?`<span class="unitlbl">${esc(q.unit)}</span>`:""}</div>${q.hint?`<div class="hint">${esc(q.hint)}</div>`:""}`; }
  const passage = it.q.passage || (it.passage);
  const pass = passage ? `<details class="passage ${passage.poem?"poem":""} ${passage.letter?"letter":""}" open><summary>${esc(passage.kind)}: ${esc(passage.title)}</summary>${passage.text.split(/\n\s*\n/).map(t=>`<p>${esc(t)}</p>`).join("")}</details>` : "";
  return `<div class="quiz">
    <div class="qtop"><div><div class="eyebrow">${esc(quiz.title)}</div><b>Question ${quiz.i+1} of ${n}</b></div><button class="btn sm" type="button" id="endQuiz">${quiz.confirmEnd?"Tap again to finish now":"Finish early"}</button></div>
    <div class="qprog" aria-hidden="true"><i style="width:${p}%"></i></div>
    <section class="qcard">
      <div class="qmeta"><span class="tag"><span class="dot d-${subj}"></span>${esc(sk?sk.name:"")}</span>${it.level?`<span class="lvl" aria-label="Level ${it.level} of 3">${[1,2,3].map(x=>`<i class="${x<=it.level?"on":""}"></i>`).join("")} Level ${it.level}</span>`:""}</div>
      ${pass}
      <div class="prompt">${q.prompt}</div>
      ${input}
      <div id="fbBox">${quiz.fb ? fbHTML() : ""}</div>
      <div class="qactions"><span class="small muted">${q.type==="mcq"?"Press A–D or click an answer.":"Press Enter to check."}</span>
        ${quiz.checked ? `<button class="btn solid" type="button" id="nextQ">${quiz.i+1<n?"Next question":"See results"}</button>` : quiz.pendingSelf ? "" : `<button class="btn solid" type="button" id="checkQ" ${quiz.busy?"disabled":""}>${quiz.busy?"Checking…":"Check answer"}</button>`}
      </div>
    </section></div>`;
}
function fbHTML(){
  const f = quiz.fb, q = quiz.items[quiz.i].q;
  if(f.self) return `<div class="fb part"><h4>Compare with the model answer</h4><div class="model"><b>Model answer:</b> ${q.show}</div><p class="small" style="margin:10px 0 6px">How close was your answer?</p><div class="row"><button class="btn sm uoi" type="button" data-self="1">Got the main ideas</button><button class="btn sm" type="button" data-self="0.5">Partly</button><button class="btn sm danger" type="button" data-self="0">Missed it</button></div></div>`;
  const cls = f.score>=1?"good":f.score>0?"part":"badf", head = f.score>=1?"✓ Correct":f.score>0?"◐ Partly right":"✗ Not quite";
  return `<div class="fb ${cls}" role="status"><h4>${head}</h4>${f.note?`<div class="small">${esc(f.note)}</div>`:""}${f.score<1 && q.type!=="explain" ? `<div class="ex">The answer is <b>${q.show}</b>.</div>`:""}${f.claude?`<div class="ex">${esc(f.claude)}</div>`:""}${q.ex?`<div class="ex small">${q.ex}</div>`:""}${q.type==="explain"?`<div class="model"><b>Model answer:</b> ${q.show}</div>`:""}</div>`;
}
function readInput(){ const el = $("#ans"); if(el) quiz.sel = el.value; }
async function doCheck(){
  const it = quiz.items[quiz.i], q = it.q;
  if(q.type!=="mcq") readInput();
  if(q.type==="mcq" && quiz.sel===null) return;
  if(q.type!=="mcq" && !String(quiz.sel||"").trim()) { const el=$("#ans"); if(el){ el.focus(); el.setAttribute("placeholder","Type your answer first"); } return; }
  if(q.type==="explain"){
    if(sample){
      quiz.busy = true; render();
      try{
        const r = await sample.json(`You are a kind Cambridge Primary Stage 5 teacher checking a student's short written answer for a science or inquiry quiz. Judge only whether the main ideas are there, not spelling.

Question: ${stripHtml(q.prompt)}
Model answer: ${q.model}
Student's answer: ${quiz.sel}

Reply with only JSON: {"score": 1 or 0.5 or 0, "feedback": "one or two encouraging sentences to the student naming what was good and what was missing"}`, {modelTier:"quick", cache:false});
        const sc = [0,0.5,1].includes(Number(r && r.score)) ? Number(r.score) : null;
        quiz.busy = false;
        if(sc===null) throw {code:"invalid_json"};
        finishCheck(sc, {claude: String(r.feedback||"")});
      }catch(e){ quiz.busy = false; if(e && (e.code==="not_granted"||e.code==="sampling_disabled")) sample=null; quiz.checked=false; quiz.pendingSelf=true; quiz.fb={self:true}; render(); }
      return;
    }
    quiz.pendingSelf = true; quiz.fb = {self:true}; render(); return;
  }
  const r = check(q, quiz.sel);
  finishCheck(r.score, {note:r.note});
}
function finishCheck(score, extra={}){
  const it = quiz.items[quiz.i], q = it.q;
  quiz.checked = true; quiz.pendingSelf = false; quiz.fb = {score, ...extra};
  record(it.skill, score, it.concept);
  if(it.lazy){ const r = quiz.run, k = it.skill; const recent = (quiz.results.filter(x=>x.skill===k).map(x=>x.score)).concat(score);
    if(recent.slice(-2).every(x=>x>=1) && recent.length>=2) r[k] = Math.min(2,(r[k]||0)+1); if(score<1 && recent.slice(-2).every(x=>x<1) && recent.length>=2) r[k] = Math.max(-2,(r[k]||0)-1); }
  const given = q.type==="mcq" ? (quiz.sel===null?"":stripHtml(q.opts[quiz.sel])) : String(quiz.sel||"");
  quiz.results.push({skill:it.skill, score, p:stripHtml(q.prompt).slice(0,220), given:given.slice(0,300), correct:stripHtml(q.show).slice(0,300), ex:q.ex, promptHtml:q.prompt, showHtml:q.show});
  render();
}
function nextQ(){ if(quiz.i+1 < quiz.items.length){ quiz.i++; prepare(); render(); } else endQuiz(false); }
function endQuiz(early){
  if(!quiz || quiz.done) return;
  quiz.done = true;
  const res = quiz.results; if(!res.length){ quiz = null; return; }
  const score = res.reduce((a,r)=>a+r.score,0), mins = Math.max(1, Math.round((Date.now()-quiz.startedAt)/60000));
  const skills = {}; res.forEach(r=>{ const s=skills[r.skill]||(skills[r.skill]=[0,0]); s[0]++; s[1]+=r.score; });
  const sess = {id:quiz.id, at:Date.now(), title:quiz.title+(early?" (finished early)":""), subject:quiz.subject, n:res.length, score, mins, skills,
    wrong:res.filter(r=>r.score<1).slice(0,20).map(r=>({skill:r.skill, p:r.p, given:r.given, correct:r.correct}))};
  S.sessions.unshift(sess); if(S.sessions.length>300) S.sessions.length=300;
  persistLocal(); dbWrite("sessions/"+sess.id, sess); flushProgress();
  view = {name:"results"}; render(); window.scrollTo({top:0});
}
function resultsView(){
  const res = quiz.results, n = res.length, score = res.reduce((a,r)=>a+r.score,0), pct = Math.round(score/n*100);
  const msg = pct>=90?"Outstanding work!":pct>=75?"Great job — you know most of this well.":pct>=50?"Good effort. Look at the mistakes below and try again.":"This is tricky. Read each explanation, then practise the weakest skill.";
  const bySkill = {}; res.forEach(r=>{ const s=bySkill[r.skill]||(bySkill[r.skill]=[0,0]); s[0]++; s[1]+=r.score; });
  const worst = Object.entries(bySkill).sort((a,b)=>a[1][1]/a[1][0]-b[1][1]/b[1][0])[0];
  return `<div class="quiz"><section class="qcard">
    <div class="eyebrow">${esc(quiz.title)}</div>
    <div class="row" style="gap:20px;margin-top:8px"><span class="score">${fmtScore(score)}<span class="muted" style="font-size:32px">/${n}</span></span><div><h2 style="font-size:24px">${msg}</h2><p class="muted" style="margin:4px 0 0">${pct}% correct · ${Math.max(1,Math.round((Date.now()-quiz.startedAt)/60000))} minutes</p></div></div>
    <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Skill</th><th class="num">Score</th><th>Mastery now</th></tr></thead><tbody>
    ${Object.entries(bySkill).map(([id,[k,c]])=>{ const sk=skillById(id); return `<tr><td class="wrap"><span class="dot d-${subjOf(id)}"></span> ${esc(sk?sk.name:id)}</td><td class="num">${fmtScore(c)}/${k}</td><td style="min-width:160px">${meter(mastery(stat(id)),subjOf(id))}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="row" style="margin-top:16px">${worst && worst[1][1]<worst[1][0] ? `<button class="btn solid" type="button" data-practise="${esc(worst[0])}">Practise ${esc((skillById(worst[0])||{name:""}).name)}</button>`:""}<button class="btn" type="button" data-go="home">Back to home</button></div>
  </section>
  ${res.some(r=>r.score<1) ? `<section class="qcard"><h3 style="font-size:20px;margin-bottom:10px">Look again at these</h3><div class="review">${res.filter(r=>r.score<1).map(r=>`<div class="rv"><div class="p">${r.promptHtml}</div><div class="a">Your answer: <b>${esc(r.given||"(blank)")}</b> · Correct: <b>${r.showHtml}</b></div>${r.ex?`<div class="a muted">${r.ex}</div>`:""}</div>`).join("")}</div></section>` : ""}
  </div>`;
}
function focusAnswer(){ const el = $("#ans"); if(el && !el.disabled) el.focus({preventScroll:true}); else { const nb=$("#nextQ"); if(nb) nb.focus({preventScroll:true}); } }

/* ---------- events ---------- */
const app = $("#app");
app.addEventListener("click", async e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.id==="startMix") return startQuiz("Today’s mix","mix",todaysMix());
  if(t.dataset.practise){ const sk = skillById(t.dataset.practise); if(!sk) return; return startQuiz(`Practice: ${sk.name}`, subjOf(sk.id), poolItems(sk, 10)); }
  if(t.dataset.fulltest){ const subj=t.dataset.fulltest; if(subj==="math") return startQuiz("Maths full check-up","math",shuffle(MATH).map(s=>({skill:s.id,lazy:true})));
    return startQuiz("English full check-up","eng",shuffle([...ENG_SKILLS.flatMap(s=>poolItems(s,1)), ...poolItems(ENG_SKILLS.find(s=>s.id==="e.reading"),2), ...poolItems(ENG_SKILLS.find(s=>s.id==="e.spelling"),1)]).slice(0,20)); }
  if(t.dataset.strand){ const [subj, st] = t.dataset.strand.split("|"); const skills=(subj==="math"?MATH:ENG_SKILLS).filter(s=>s.strand===st); const per = skills.length>=8?2:Math.ceil(16/skills.length);
    return startQuiz(`${st} test`, subj, shuffle(skills.flatMap(s=>poolItems(s,per))).slice(0,16)); }
  if(t.dataset.unit){ S.settings.currentUnit = t.dataset.unit; saveSettings(); return render(); }
  if(t.dataset.unittest){ const u=unitById(t.dataset.unittest); return startQuiz(`${u.title}: unit test`,"uoi",unitItems(u,20,{balanced:true})); }
  if(t.dataset.unitquick){ const u=unitById(t.dataset.unitquick); return startQuiz(`${u.title}: quick quiz`,"uoi",unitItems(u,8,{noExplain:true})); }
  if(t.dataset.choice!==undefined && quiz && !quiz.checked){ quiz.sel = Number(t.dataset.choice); render(); return; }
  if(t.id==="checkQ") return doCheck();
  if(t.id==="nextQ") return nextQ();
  if(t.dataset.self!==undefined){ quiz.pendingSelf=false; return finishCheck(Number(t.dataset.self), {note: Number(t.dataset.self)>=1?"Nice — you included the main ideas.":"Read the model answer again and notice what you left out."}); }
  if(t.id==="endQuiz"){ if(!quiz.confirmEnd){ quiz.confirmEnd=true; render(); setTimeout(()=>{ if(quiz && !quiz.done){ quiz.confirmEnd=false; if(view.name==="quiz") render(); } },4000); return; } if(quiz.results.length) endQuiz(true); else { quiz=null; go("home"); } return; }
  if(t.dataset.filter){ view.filter = t.dataset.filter; return render(); }
  if(t.dataset.setcur){ S.settings.currentUnit = t.dataset.setcur; saveSettings(); return render(); }
  if(t.dataset.manage){ view.manage = t.dataset.manage; render(); return; }
  if(t.dataset.hide){ const id=t.dataset.hide; S.settings.hidden = S.settings.hidden.includes(id) ? S.settings.hidden.filter(x=>x!==id) : [...S.settings.hidden, id]; saveSettings(); return render(); }
  if(t.dataset.delunit){ const id=t.dataset.delunit; if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="Tap again to delete"; return; } S.units = S.units.filter(u=>u.id!==id); persistLocal(); dbDelete("units/"+id); if(S.settings.currentUnit===id){ S.settings.currentUnit=(allUnits()[0]||{}).id||""; saveSettings(); } return render(); }
  if(t.dataset.delq){ const [id,i]=t.dataset.delq.split("|"); const u=S.units.find(x=>x.id===id); if(!u) return; u.qs.splice(Number(i),1); saveUnit(u); return render(); }
  if(t.dataset.genmore){ const u=S.units.find(x=>x.id===t.dataset.genmore); if(u) generateQuestions(u, 10, $("#gen-msg"), t); return; }
  if(t.id==="resetBtn"){ if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="Tap again to erase all progress"; return; }
    const old = S.sessions.map(s=>s.id); S.progress={skills:{},concepts:{},daily:{},updatedAt:Date.now()}; S.sessions=[]; persistLocal(); dbWrite("progress/rishay", S.progress); old.forEach(id=>dbDelete("sessions/"+id)); return render(); }
});
document.addEventListener("keydown", e => {
  if(view.name!=="quiz" || !quiz || quiz.done) return;
  const q = quiz.items[quiz.i].q;
  if(e.key==="Enter" && !e.shiftKey){ if(e.target.tagName==="TEXTAREA") return; if(e.target.tagName==="BUTTON" && e.target.id!=="nextQ" && e.target.id!=="checkQ" && !e.target.dataset.choice) return; e.preventDefault(); if(quiz.checked) nextQ(); else if(!quiz.pendingSelf && !quiz.busy) doCheck(); return; }
  if(q.type==="mcq" && !quiz.checked && /^[a-dA-D1-4]$/.test(e.key) && e.target.tagName!=="INPUT"){ const k = isNaN(e.key) ? e.key.toLowerCase().charCodeAt(0)-97 : Number(e.key)-1; if(k < q.opts.length){ quiz.sel=k; render(); } }
});
app.addEventListener("input", e => { if(e.target.id==="ans" && quiz) quiz.sel = e.target.value; });
app.addEventListener("change", e => { if(e.target.id==="qf-t"){ const o=$("#qf-opts"); if(o) o.hidden = e.target.value!=="mcq"; } });
app.addEventListener("submit", async e => {
  e.preventDefault();
  if(e.target.id==="unitForm"){
    const title=$("#uf-title").value.trim(), central=$("#uf-central").value.trim(), lois=$("#uf-lois").value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,6);
    if(!title || !central || !lois.length){ $("#uf-msg").textContent="Please fill in the title, central idea and at least one line of inquiry."; return; }
    const u = {id:"u"+uid(), theme:$("#uf-theme").value, title, central, lois, concepts:[...document.querySelectorAll(".uf-c:checked")].map(c=>c.value),
      vocab:$("#uf-vocab").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,30), notes:$("#uf-notes").value.trim().slice(0,3000), qs:[], createdAt:Date.now()};
    S.units.push(u); S.settings.currentUnit = u.id; saveUnit(u); saveSettings();
    if(sample){ $("#uf-save").disabled = true; await generateQuestions(u, 24, $("#uf-msg")); }
    view = {name:"uoi"}; render(); return;
  }
  if(e.target.id==="qForm"){
    const u = S.units.find(x=>x.id===e.target.dataset.unit); if(!u) return;
    const t=$("#qf-t").value, q=$("#qf-q").value.trim(), why=$("#qf-why").value.trim(), loi=Number($("#qf-loi").value), c=$("#qf-c").value;
    if(!q){ $("#qf-msg").textContent="Write the question first."; return; }
    let item;
    if(t==="mcq"){ const o=[0,1,2,3].map(i=>$("#qf-o"+i).value.trim()).filter(Boolean); if(o.length<2){ $("#qf-msg").textContent="Give the correct answer and at least one wrong answer."; return; } item={t,loi,c,q,o,a:0,why}; }
    else if(t==="tf"){ item={t,loi,c,q,a:true,why}; const ans=$("#qf-o0").value.trim().toLowerCase(); if(ans.startsWith("f")) item.a=false; }
    else item={t,loi,c,q,model:why};
    u.qs.push(item); saveUnit(u); view.manage=u.id; render();
  }
});

/* ---------- Claude: generate UOI questions ---------- */
async function generateQuestions(u, n, msgEl, btn){
  if(!sample) return;
  if(btn) btn.disabled = true;
  if(msgEl) msgEl.textContent = "Claude is writing questions. This takes about a minute…";
  const existing = u.qs.map(q=>q.q).slice(0,60).join("\n");
  const prompt = `You write assessment questions for a Cambridge Primary Stage 5 (Class 5, age 10) student in India, to test real understanding of a school unit, not just recall. Match the Cambridge Primary Stage 5 curriculum level.

Unit
Subject area: ${u.theme}
Title: ${u.title}
Central idea: ${u.central}
Lines of inquiry (index: text):
${u.lois.map((l,i)=>`${i}: ${l}`).join("\n")}
Key concepts: ${(u.concepts||[]).join(", ") || "choose suitable ones"}
Vocabulary: ${(u.vocab||[]).join(", ") || "(none given)"}
What has been taught: ${u.notes || "(not given)"}
${existing ? `\nAlready in the bank, do not repeat:\n${existing}\n` : ""}
Write exactly ${n} new questions, spread evenly across the lines of inquiry. Mix: about 60% multiple choice (4 options, one clearly correct, plausible wrong options), 20% true/false, 20% written answers that ask the student to explain, compare, give an example or take a perspective. Tag each with one way of thinking from: form, function, causation, change, connection, perspective, responsibility. Keep facts accurate and age-appropriate; use Indian examples where natural. Keep each question under 30 words.

Reply with only a JSON array. Each item is one of:
{"t":"mcq","loi":0,"c":"function","q":"question","o":["correct option","wrong","wrong","wrong"],"a":0,"why":"one-sentence explanation"}
{"t":"tf","loi":1,"c":"change","q":"statement","a":true,"why":"one-sentence explanation"}
{"t":"explain","loi":2,"c":"perspective","q":"question","model":"model answer in 2-3 sentences"}`;
  try{
    const arr = await sample.json(prompt, {modelTier:"default", cache:false});
    const KC = Object.keys(CONCEPTS);
    const clean = (Array.isArray(arr)?arr:[]).map(x=>{
      if(!x || typeof x.q!=="string") return null;
      const loi = Math.max(0, Math.min(u.lois.length-1, Number(x.loi)||0)), c = KC.includes(x.c)?x.c:"form", q = x.q.slice(0,400);
      if(x.t==="mcq" && Array.isArray(x.o) && x.o.length>=2 && Number.isInteger(x.a) && x.a>=0 && x.a<x.o.length) return {t:"mcq",loi,c,q,o:x.o.slice(0,5).map(s=>String(s).slice(0,200)),a:x.a,why:String(x.why||"").slice(0,400)};
      if(x.t==="tf" && typeof x.a==="boolean") return {t:"tf",loi,c,q,a:x.a,why:String(x.why||"").slice(0,400)};
      if(x.t==="explain") return {t:"explain",loi,c,q,model:String(x.model||"").slice(0,800)};
      return null; }).filter(Boolean);
    if(!clean.length) throw {code:"invalid_json"};
    u.qs.push(...clean); saveUnit(u);
    if(msgEl) msgEl.textContent = `Added ${clean.length} questions. Check them in the Parent tab.`;
  }catch(e){
    const code = e && e.code;
    if(code==="not_granted"||code==="sampling_disabled") sample = null;
    if(msgEl) msgEl.textContent = code==="rate_limited" ? "Claude is busy. Try again in a few minutes." : code==="not_granted"||code==="sampling_disabled" ? "Claude isn’t available here. Add questions yourself in the Parent tab." : "Claude couldn’t create questions this time. Try again from the Parent tab.";
  } finally { if(btn) btn.disabled = false; if(view.name==="parent") render(); }
}

/* =========================================================
   Boot
   ========================================================= */
render();
(async () => {
  if(!window.claude || !window.claude.use) return;
  claude.use("sample").then(s => { if(s){ sample = s; if(["unitform","parent"].includes(view.name)) render(); } }).catch(()=>{});
  try { db = await claude.use("db"); } catch(e) { db = null; }
  if(!db) return;
  try{
    const [pg, sg, us, ss] = await Promise.all([db.doc("progress/rishay").get(), db.doc("settings/main").get(), db.collection("units").get(), db.collection("sessions").orderBy("at","desc").limit(300).get()]);
    const clone = x => JSON.parse(JSON.stringify(x));
    if(pg.exists){ const r = clone(pg.data()); if((r.updatedAt||0) >= (S.progress.updatedAt||0)) S.progress = {skills:{},concepts:{},daily:{},...r}; else dirtyProgress = true; } else if(S.progress.updatedAt) dirtyProgress = true;
    if(sg.exists){ const r = clone(sg.data()); if((r.updatedAt||0) >= (S.settings.updatedAt||0)) S.settings = {hidden:[], ...r}; }
    const remoteUnits = us.docs.map(d=>clone(d.data())).filter(u=>u && u.id && Array.isArray(u.qs));
    const localOnly = S.units.filter(u=>!remoteUnits.some(r=>r.id===u.id));
    S.units = [...remoteUnits, ...localOnly]; localOnly.forEach(u=>dbWrite("units/"+u.id, u));
    const remoteS = ss.docs.map(d=>clone(d.data()));
    const localS = S.sessions.filter(s=>!remoteS.some(r=>r.id===s.id)); localS.forEach(s=>dbWrite("sessions/"+s.id, s));
    S.sessions = [...remoteS, ...localS].sort((a,b)=>b.at-a.at).slice(0,300);
    persistLocal(); setSync(true); flushProgress();
    if(view.name!=="quiz" && view.name!=="results" && view.name!=="unitform") render();
  }catch(e){ db = null; setSync(false); }
})();
</script>
