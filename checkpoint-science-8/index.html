  {"t":"b2A","c":"Identical twins","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Identical twins have the same genetic information.","R":"They develop from one zygote that splits into two.","a":0,"e":"Both true; because they come from the same fertilised egg, their genes are the same."},
  {"t":"b2K","c":"Where fertilisation happens","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Fertilisation usually happens in the uterus.","R":"The embryo implants in the uterus lining.","a":3,"e":"Fertilisation usually happens in the oviduct. The embryo then moves to the uterus and implants."},
  {"t":"b3A","c":"Crossing the placenta","type":"multi","q":"Which can pass from the mother's blood to the fetus across the placenta? Select all that apply.","o":["Oxygen","Glucose","Nicotine","Alcohol","Red blood cells"],"k":4,"e":"Small dissolved molecules cross, harmful ones included. Blood cells do not, because the two bloods do not mix."},
  {"t":"a2A","c":"Sperm adaptations","type":"multi","q":"Which are adaptations of a sperm cell? Select all that apply.","o":["A tail for swimming","Many mitochondria","A streamlined head","A large food store","Chloroplasts"],"k":3,"e":"The large food store belongs to the egg cell. Chloroplasts are only in plant cells."},
  {"t":"b2K","c":"From egg to embryo","type":"order","q":"Put these events in order.","o":["An egg is released from an ovary","The egg is fertilised in the oviduct","The zygote divides into a ball of cells","The embryo implants in the uterus lining"],"e":"Ovulation, fertilisation, cell division, then implantation."},
  {"t":"d1K","c":"Odd one out: hormones","q":"Which is the odd one out?","o":["Haemoglobin","Oestrogen","Testosterone","Adrenaline"],"e":"Oestrogen, testosterone and adrenaline are hormones. Haemoglobin is the oxygen-carrying protein in red blood cells."},
  {"t":"d2A","c":"Smoking in pregnancy","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Babies of mothers who smoke often have a lower birth weight.","R":"Carbon monoxide from smoke reduces the oxygen reaching the fetus.","a":0,"e":"Both true; less oxygen slows the fetus's growth."}
  ]},
{ n: 6, title: "States of matter", strand: "Chemistry", topics: "Particle theory, changes of state, diffusion, gas pressure, expansion",
  qs: [
  {"t":"b1K","c":"Melting at particle level","q":"What happens to the particles in ice when it melts?","o":["They gain energy and break free of fixed positions, but stay close together","The particles themselves melt and turn into liquid particles","The particles get bigger and push each other further apart","The particles stop vibrating and start to flow past each other"],"e":"Particles do not change in size or melt. In a liquid they are still close together but can move past each other."},
  {"t":"a2A","c":"Compressing gases","q":"Why can a gas be squashed into a smaller volume, but a liquid cannot?","o":["There are large spaces between gas particles; liquid particles are already touching","Gas particles are much smaller than liquid particles, so they fit together","Gas particles are soft and can be squeezed into a smaller size","Liquid particles do not move at all, so they cannot be pushed closer"],"e":"In a gas the particles are far apart, so pushing them closer is easy. In a liquid the particles are already close together, so there is almost no space to remove."},
  {"t":"a2K","c":"Spaces between particles","q":"What is in the space between the particles of a gas?","o":["Nothing; it is empty space","Air","Water vapour","Smaller particles of the same gas"],"e":"Air is itself made of particles. Between gas particles there is simply empty space."},
  {"t":"c1A","c":"Diffusion","q":"Someone opens a bottle of perfume at the front of a classroom. A few minutes later students at the back can smell it. Which explanation is best?","o":["Perfume particles move randomly and spread out to where there are fewer of them","Perfume particles are attracted to people's noses and move straight towards them","The perfume particles grow larger and larger until they fill the whole room","Air particles push all of the perfume particles in a straight line to the back"],"e":"This is diffusion. Particles move randomly and collide, which causes a net movement from a high concentration to a low concentration."},
  {"t":"c2A","c":"Diffusion and temperature","q":"A drop of food colouring spreads faster in hot water than in cold water. Why?","o":["Particles in hot water have more energy and move faster","Hot water has more spaces between particles because the particles shrink","Food colouring dissolves only in hot water","Cold water particles do not move at all"],"e":"Higher temperature means particles have more kinetic energy. They move and collide faster, so the dye spreads more quickly."},
  {"t":"c2A","c":"Diffusion in gases vs liquids","q":"Why does diffusion happen faster in gases than in liquids?","o":["Gas particles move faster and have more space between them","Gas particles are heavier than liquid particles","Liquid particles are not able to move","Gases are always hotter than liquids"],"e":"Gas particles move quickly and travel further before hitting another particle, so they spread out faster than particles in a liquid."},
  {"t":"d1K","c":"Gas pressure","q":"What causes the pressure of a gas inside a container?","o":["Gas particles colliding with the walls","Gas particles sticking to the walls","The weight of the container pressing down","Gas particles growing until they fill it"],"e":"Each collision pushes on the wall. Millions of collisions every second produce a steady force on the walls, which we measure as pressure."},
  {"t":"d2A","c":"Heating a sealed gas","q":"A sealed can of gas is heated. Why does the pressure inside increase?","o":["The particles move faster, so they hit the walls more often and harder","More gas particles are made when the gas is heated, so it gets crowded","The particles themselves expand and press harder on the walls","Particles of heat enter the can and add to the number hitting the walls"],"e":"The number of particles stays the same. Faster particles collide with the walls more often and with more force, so pressure rises. That is why aerosol cans warn against heating."},
  {"t":"e2A","c":"Expansion","q":"Gaps are left between sections of some bridges. Why?","o":["In hot weather the particles vibrate more and take up more space, so the bridge expands","The particles of metal get larger when heated, so the bridge gets longer","The gaps let rainwater drain away so that the bridge does not rust","The metal shrinks in hot weather and the gaps stop the bridge cracking"],"e":"When a solid is heated its particles vibrate more and move slightly further apart. The particles do not grow. The gaps stop the bridge from buckling when it expands."},
  {"t":"b3A","c":"Constant temperature while boiling","q":"Water keeps boiling on a cooker but its temperature stays at 100 °C. Where is the energy going?","o":["Into separating the particles as liquid turns into gas","Into heating the saucepan, while the water stays the same","It is destroyed by the boiling water as the bubbles burst","Into making the water particles bigger so they become gas"],"e":"During a change of state, energy is used to overcome the attraction between particles rather than to raise the temperature."},
  {"t":"b2K","c":"Evaporation vs boiling","q":"Which statement about evaporation is correct?","o":["It can happen at any temperature, but only from the surface of a liquid","It only happens at the boiling point, when bubbles appear","It happens throughout the whole liquid, forming bubbles of vapour","It only happens when a liquid is being heated by a flame or the Sun"],"e":"Some surface particles always have enough energy to escape. Boiling happens only at the boiling point and throughout the liquid."},
  {"t":"b3A","c":"Cooling by evaporation","q":"Why does sweating cool you down?","o":["The most energetic particles evaporate, so the rest of the sweat has less energy","Sweat is made at a lower temperature than the body, so it cools the skin","Sweat forms a shiny layer that reflects heat away from the skin","Sweat tells the brain to stop the body making heat for a while"],"e":"Evaporating particles take energy with them. The average energy of the particles left on the skin falls, so the skin cools."},
  {"t":"b2N","c":"Using melting and boiling points","q":"A substance melts at −39 °C and boils at 357 °C. What state is it in at 25 °C?","o":["Liquid","Solid","Gas","It cannot be in any state at 25 °C"],"e":"25 °C is above the melting point, so it is not a solid, and below the boiling point, so it is not a gas. This substance is mercury."},
  {"t":"d2A","c":"Cooling a gas","q":"A balloon is taken from a warm room into a freezer and shrinks. Why?","o":["The particles slow down and hit the inside of the balloon less hard","Some of the gas particles are destroyed by the cold temperature","The gas particles themselves shrink when they get cold","Cold air particles enter the balloon and take up less space"],"e":"Slower particles produce less pressure. The higher pressure outside squashes the balloon until the pressures balance."},
  {"t":"a1K","c":"Solids","q":"Why does a solid keep a fixed shape?","o":["Its particles are held in fixed positions by strong forces, and can only vibrate","Its particles do not move at all, so they stay where they are","Its particles are larger than those of liquids, so they cannot move","There are no forces between its particles, so nothing pulls them apart"],"e":"Particles in a solid vibrate about fixed positions. They cannot move past each other, so the shape stays the same."},
  {"t":"a1K","c":"Liquids","q":"Why can a liquid be poured and take the shape of its container?","o":["Its particles are close together but can slide past each other","Its particles are far apart and move quickly in all directions","Its particles are fixed in place but can bend into new shapes","Its particles are soft, so they change shape to fit the container"],"e":"The particles stay touching, so the volume stays fixed, but they move around each other, so the liquid flows."},
  {"t":"a1K","c":"Gases fill containers","q":"A small amount of gas is released into an empty box. What happens?","o":["It spreads out to fill the whole box","It stays in one corner","It sinks to the bottom as a liquid","It takes up only half the box"],"e":"Gas particles move quickly in all directions and keep going until they hit something, so a gas fills any container."},
  {"t":"a2A","c":"Density of gases","q":"Why is a gas much less dense than the same substance as a liquid?","o":["The particles are much further apart, so there is less mass in each cm³","Gas particles are lighter than the particles of the same liquid","Gas particles have no mass at all, so a gas weighs nothing","Gas particles are smaller than liquid particles of the same substance"],"e":"The particles are the same. In a gas, they are spread out, so a given volume contains far fewer of them."},
  {"t":"b1A","c":"Condensation","q":"A glass of iced drink gets droplets of water on the outside. Where do they come from?","o":["Water vapour in the air cools on the glass and condenses","The cold drink leaks out through tiny holes in the glass","The ice melts and its water soaks through the glass wall","The glass itself produces water when it becomes very cold"],"e":"Water vapour particles touching the cold glass lose energy, move closer together and become liquid."},
  {"t":"b1K","c":"Sublimation","q":"Solid carbon dioxide (dry ice) turns straight into a gas without melting. What is this change called?","o":["Sublimation","Evaporation","Condensation","Melting"],"e":"Sublimation is a change directly from solid to gas. Iodine also sublimes when gently heated."},
  {"t":"b1K","c":"Melting and freezing points","q":"Pure water freezes at 0 °C. At what temperature does pure ice melt?","o":["0 °C","100 °C","−10 °C","It has no melting point"],"e":"For a pure substance, the melting point and the freezing point are the same temperature."},
  {"t":"b2N","c":"Heating curve","q":"A solid is heated steadily and its temperature is recorded. The graph has two flat sections. What is happening during them?","o":["The substance is changing state","The heater has been switched off","The particles have stopped moving","The substance is being destroyed"],"e":"During melting and boiling, energy is used to separate particles, so the temperature stays constant until the change is complete."},
  {"t":"b3A","c":"Changes that release energy","q":"Which change of state releases energy to the surroundings?","o":["Condensing","Melting","Boiling","Evaporating"],"e":"When a gas condenses or a liquid freezes, particles move closer together and attract each other, releasing energy. Melting and boiling take energy in."},
  {"t":"c3E","c":"Brownian motion","q":"Under a microscope, smoke particles in air jiggle about randomly. What causes this?","o":["They are hit by fast-moving air particles that are too small to see","The smoke particles are tiny living things that swim about","Light from the microscope pushes the particles in random directions","The smoke particles are attracted to and repelled by each other"],"e":"This is evidence that air is made of particles in constant, random motion."},
  {"t":"c3E","c":"Diffusion and particle mass","q":"Cotton wool soaked in ammonia is put at one end of a long tube and hydrochloric acid at the other. A white ring forms where the gases meet, nearer the acid end. Why?","o":["Ammonia particles are lighter and move faster, so they travel further","The acid particles are lighter and move faster, so they travel further","Gases can only diffuse in one direction along a tube","The white ring is attracted towards the acid end of the tube"],"e":"Lighter particles move faster at the same temperature, so they diffuse more quickly."},
  {"t":"c2E","c":"Diffusion in liquids","q":"A crystal of purple potassium manganate(VII) is dropped into still water. After an hour the purple colour has spread through the water. Why?","o":["The dissolved particles moved randomly and spread out by diffusion","The crystal moved around and stirred the water as it dissolved","The crystal grew larger until it filled the whole beaker","Gravity pulled the purple particles evenly through the water"],"e":"Even without stirring, particles in a liquid move randomly, so the colour spreads, though more slowly than in a gas."},
  {"t":"c2A","c":"Diffusion in solids","q":"Why does diffusion hardly happen at all in solids?","o":["The particles are held in fixed positions and cannot move past each other","Solid particles are too large to fit between other particles","Solids have no particles, so there is nothing to diffuse","Solid particles move too fast to stay in one place for long"],"e":"Diffusion needs particles to move from place to place. In a solid they only vibrate."},
  {"t":"d2A","c":"Compressing a gas","q":"You push in the plunger of a sealed syringe full of air. Why does it get harder to push?","o":["The particles are squeezed closer, so they hit the walls more often and pressure rises","The air particles get bigger and push back against the plunger","The air turns into a liquid immediately, which cannot be squashed","The particles stop moving, so they jam together and block the plunger"],"e":"The same number of particles in a smaller space means more collisions per second with each part of the wall."},
  {"t":"d2A","c":"Pumping up a ball","q":"Why does pumping more air into a football make it firmer?","o":["More particles inside means more collisions with the wall","The air particles inside expand and press harder on the wall","The ball's material gets thicker as more air is pumped in","The air inside gets colder, and cold air presses harder"],"e":"Pressure depends on how many particles hit the walls and how hard. Adding particles increases the pressure."},
  {"t":"d2A","c":"Tyres after a journey","q":"A car's tyre pressure is higher after a long drive. Why?","o":["The air in the tyres has warmed up, so particles move faster and collide harder","More air has leaked into the tyres through the valve during the drive","The tyres have shrunk because of the friction with the road","The air particles have become heavier, so they press down harder"],"e":"Friction warms the tyres and the air inside. Faster particles produce higher pressure."},
  {"t":"e2A","c":"Thermometers","q":"How does a liquid-in-glass thermometer work?","o":["The liquid expands when heated and rises up the narrow tube","The liquid particles get bigger when heated and fill more of the tube","Heat particles enter the bulb and push the liquid up the tube","The glass shrinks when heated and squeezes the liquid upwards"],"e":"Heated liquid particles move more and take up a little more space, so the liquid expands along the tube."},
  {"t":"e2E","c":"Ball and ring","q":"A metal ball just fits through a metal ring. After the ball is heated, it will not fit through. Why?","o":["The ball has expanded because its particles vibrate more and move slightly apart","The ball's particles have each grown larger because of the heat","The ball has gained extra particles from the flame that heated it","The ring has expanded too, but the ball expanded in a different way"],"e":"The number and size of particles stay the same. They take up more space because they vibrate more."},
  {"t":"e3A","c":"Bimetallic strip","q":"A strip made of brass and iron joined together bends when it is heated. Why?","o":["Brass expands more than iron for the same temperature rise","Iron melts at a lower temperature than brass and softens first","Only one of the metals is heated; the other stays cold","The two metals react with each other to form a new alloy"],"e":"Different materials expand by different amounts. The strip bends towards the metal that expands less. This is used in some thermostats."},
  {"t":"e2A","c":"Power lines","q":"Overhead power cables are hung loosely, sagging between pylons. Why?","o":["They contract in cold weather and could snap if they were tight","They are too heavy to be pulled tight between the pylons","Sagging cables let electricity flow more easily","They expand in cold weather and need room to grow"],"e":"In cold weather the cables get shorter. Leaving slack stops them pulling tight and breaking."},
  {"t":"e2A","c":"Jar lids","q":"Running hot water over a tight metal lid on a glass jar makes it easier to open. Why?","o":["The metal lid expands more than the glass","The glass shrinks in hot water, pulling away from the lid","Hot water makes the metal lid lighter and easier to turn","The water acts as a lubricant that dissolves the seal"],"e":"Metals expand more than glass when heated, so the lid loosens."},
  {"t":"e2A","c":"Water is unusual","q":"Water pipes can burst in very cold weather. Why?","o":["Water expands when it freezes into ice","Ice is denser than water","Cold metal pipes expand","Water particles grow in the cold"],"e":"Most substances contract when they freeze, but water expands. This is also why ice floats."},
  {"t":"b1A","c":"Mass during melting","q":"100 g of ice melts completely. What is the mass of the water?","o":["100 g","More than 100 g","Less than 100 g","It depends on the temperature"],"e":"Changing state does not change the number of particles, so mass stays the same."},
  {"t":"b2A","c":"Drying washing","q":"Washing dries faster on a warm, windy day. Why does the wind help?","o":["It carries away water vapour, so more water particles can escape from the clothes","The wind gives extra energy to the water particles in the clothes","The wind pushes liquid water out of the clothes, like wringing them","The wind makes the water in the clothes boil at a lower temperature"],"e":"Evaporation is faster when the air next to the surface is not full of water vapour. Warmth and a larger surface area also help."},
  {"t":"a2K","c":"Temperature and particles","q":"What does a higher temperature tell you about the particles in a substance?","o":["They are moving faster on average","They are bigger","There are more of them","They have stopped vibrating"],"e":"Temperature is related to the average kinetic energy of the particles."},
  {"t":"a3K","c":"Limits of the model","q":"In diagrams, particles are drawn as coloured circles. Which statement about the model is true?","o":["Real particles are much too small to see and do not have colour like this","Real particles look exactly like the drawings, only smaller","Real particles are large enough to see with a hand lens","Gas particles are drawn far apart because they are bigger"],"e":"The particle model is a simplified picture that helps explain observations. Colour is a property of large amounts of a substance, not single particles."},
  {"t":"b2N","c":"Identifying states from data","q":"Substance X melts at 80 °C and boils at 218 °C. What state is it in at 100 °C?","o":["Liquid","Solid","Gas","Solid and gas at once"],"e":"100 °C is above its melting point but below its boiling point."},
  {"t":"a3A","c":"Solids and liquids resist squashing","q":"Why are both solids and liquids very hard to compress?","o":["In both, the particles are already touching each other","In both, the particles are fixed in their positions","In both, there are no forces between the particles","In both, the particles are larger than gas particles"],"e":"Gases compress easily because of the gaps between particles. Solids and liquids have almost no gaps to remove."},
  {"t":"b3N","c":"Cooling curve","q":"A hot liquid cools. Its temperature falls, then stays at 54 °C for 4 minutes, then falls again. What is 54 °C?","o":["Its freezing point, where the liquid turns solid","Its boiling point, where the liquid turns to gas","The temperature where particles stop moving","Room temperature, where all cooling stops"],"e":"The temperature stays constant while the substance changes state, because energy is released as particles settle into fixed positions."},
  {"t":"b2A","c":"Puddles disappear","q":"A puddle dries up on a sunny day even though the water never reaches 100 °C. Why?","o":["Surface water particles gain enough energy to escape","The Sun heats the puddle up to its boiling point","The water soaks straight down into the ground","Sunlight splits the water into hydrogen and oxygen"],"e":"This is evaporation. It happens at any temperature, but faster when it is warm, windy and dry."},
  {"t":"c3A","c":"Dense gas spreads up","q":"Brown bromine gas is denser than air. It is released at the bottom of a jar of air, yet it slowly spreads to the top. Why?","o":["Its particles move randomly, so they spread in all directions","The air particles pull the bromine particles upwards","Bromine is lighter than air, so it rises to the top","The jar warms up, so the bromine rises like smoke"],"e":"Diffusion is caused by random movement. Particles spread out from where they are concentrated, whichever direction that is."},
  {"t":"c3A","c":"Diffusion into a vacuum","q":"Bromine spreads almost instantly into a jar that has had all its air removed. Why is it so much faster?","o":["There are no air particles for bromine to bump into","Bromine particles grow much larger inside a vacuum","The vacuum pulls the bromine particles towards it","Bromine turns into a fast-moving liquid in a vacuum"],"e":"In air, bromine particles keep colliding with air particles, which slows their spread. In a vacuum nothing gets in the way."},
  {"t":"d3A","c":"Crushed can","q":"Air is pumped out of a metal can, and the can is crushed. What crushes it?","o":["The air pressure outside is much greater than the pressure inside","The vacuum inside pulls the walls of the can inwards","Removing the air makes the metal soft and weak","The can cools down when the air leaves and shrinks"],"e":"A vacuum does not pull. Air particles outside keep hitting the can, and with nothing pushing back from inside, the can collapses."},
  {"t":"e2A","c":"Gaps in roads","q":"Concrete roads are laid in sections with soft material in the gaps. Why?","o":["So the concrete can expand in hot weather without cracking","So that rainwater can drain away under the road","So the road is quieter for cars driving over it","So the concrete has room to shrink in hot weather"],"e":"Like bridges and railway tracks, concrete expands when it gets hot. The soft gaps give it room."},
  {"t":"e2A","c":"Hot-air balloons","q":"Why does a hot-air balloon rise when the air inside is heated?","o":["The heated air expands, becomes less dense and rises","The heated air particles become lighter and float up","Particles of heat in the air push the balloon up","The hot air contains fewer particles because they evaporate"],"e":"The particles do not get lighter. They spread out, so the same volume contains fewer particles and less mass."},
  {"t":"a2E","c":"Evidence for moving particles","q":"Which observation is evidence that particles in a liquid are moving?","o":["A drop of ink spreads through still water on its own","Water is hard to squash in a sealed syringe","Water freezes when it is put in a freezer","A full glass of water is heavier than an empty one"],"e":"Ink can only spread through still water if the particles are moving and mixing."},
  {"t":"b3A","c":"Steam burns","q":"A burn from steam at 100 °C is usually worse than a burn from water at 100 °C. Why?","o":["Steam releases extra energy as it condenses on skin","Steam is always much hotter than 100 °C","Steam particles are larger, so they hit harder","Water at 100 °C cannot transfer any heat at all"],"e":"Condensing releases the energy that was needed to boil the water, on top of the energy from cooling."},
  {"t":"b2A","c":"Ice in a drink","q":"How does an ice cube cool a drink?","o":["The melting ice takes in energy from the drink","The ice gives out cold that spreads through the drink","The ice makes the drink's particles stop moving","The ice adds cold particles to the drink"],"e":"There is no such thing as 'cold' flowing. Energy moves from the warm drink to the ice, which uses it to melt."},
  {"t":"a2K","c":"Gas vs liquid arrangement","q":"How does the arrangement of particles in a gas differ from a liquid?","o":["Gas particles are far apart; liquid particles are close together","Gas particles are in fixed rows; liquid particles are not","Gas particles are bigger than liquid particles","Gas particles do not move; liquid particles do"],"e":"In both, particles move randomly. The big difference is the spacing between them."},
  {"t":"b2N","c":"Which is a gas?","q":"Which substance is a gas at 20 °C? A: melts −210 °C, boils −196 °C. B: melts 0 °C, boils 100 °C. C: melts 801 °C, boils 1413 °C. D: melts 44 °C, boils 280 °C.","o":["A","B","C","D"],"e":"A substance is a gas when the temperature is above its boiling point. Only A boils below 20 °C."},
  {"t":"d2A","c":"Bigger container","q":"The same amount of gas is moved into a container twice as large, at the same temperature. What happens to the pressure?","o":["It decreases, because the particles hit the walls less often","It increases, because the particles have room to speed up","It stays the same, because the number of particles is the same","It drops to zero, because the gas is spread too thinly"],"e":"With more space, each part of the wall is hit less often, so the pressure falls."},
  {"t":"c2E","c":"Controlling variables","q":"A student times how long a dye takes to spread in water at different temperatures. Which variables should be controlled?","o":["The volume of water and the amount of dye","The temperature of the water","The time taken for the dye to spread","The colour seen at the end"],"e":"Temperature is the independent variable and time is the dependent variable. Everything else should stay the same."},
  {"t":"d2A","c":"Dented table tennis ball","q":"A dented table tennis ball is put in hot water and the dent pops out. Why?","o":["The air inside warms, its pressure rises and it pushes the dent out","Hot water softens the plastic, which flows back into shape","Water particles push into the ball through the dent","The plastic particles grow larger in hot water"],"e":"Warmer gas particles move faster and hit the inside of the ball harder and more often."},
  {"t":"a2A","c":"Compressing gases","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Gases can be compressed easily.","R":"Gas particles are far apart.","a":0,"e":"Both true, and the large gaps between particles explain why gases squash easily."},
  {"t":"e2A","c":"Expanding rods","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"The particles in a metal rod get bigger when it is heated.","R":"A metal rod gets longer when it is heated.","a":3,"e":"The rod does expand, but its particles stay the same size; they vibrate more and move slightly further apart."},
  {"t":"c1K","c":"Ice floats","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Ice floats on water.","R":"Water particles are always moving.","a":1,"e":"Both true, but particle movement does not explain floating. Ice floats because it is less dense than liquid water."},
  {"t":"b2K","c":"Taking in energy","type":"multi","q":"Which changes of state take in energy? Select all that apply.","o":["Melting","Boiling","Evaporating","Sublimation","Condensing","Freezing"],"k":4,"e":"Changes that separate particles take in energy. Condensing and freezing release energy."},
  {"t":"c2A","c":"Examples of diffusion","type":"multi","q":"Which are examples of diffusion? Select all that apply.","o":["The smell of cooking spreading through a house","Purple colour spreading from a crystal in still water","Tea colour spreading from a teabag without stirring","Water being poured into a glass","Ice melting in a drink"],"k":3,"e":"Diffusion is particles spreading out on their own by random movement. Pouring and melting are not diffusion."},
  {"t":"a1K","c":"Particle spacing","type":"order","q":"Put these in order of increasing space between particles.","o":["Ice","Liquid water","Steam"],"e":"Particles are packed tightly in a solid, close but free to move in a liquid, and far apart in a gas."},
  {"t":"b2A","c":"Odd one out: energy changes","q":"Which is the odd one out?","o":["Condensing","Melting","Boiling","Evaporating"],"e":"Melting, boiling and evaporating take in energy. Condensing gives energy out."}
  ]},
{ n: 7, title: "Elements and compounds", strand: "Chemistry", topics: "Atoms, elements and symbols, the Periodic Table, metals and non-metals, compounds and formulae",
  qs: [
  {"t":"a1K","c":"What an element is","q":"Which is the best definition of an element?","o":["A substance made of only one type of atom","A substance made of two or more types of atom joined together","Any substance found in the Periodic Table or in nature","A substance that is always a metal"],"e":"An element cannot be broken down into simpler substances by chemical reactions, because all its atoms are the same type."},
  {"t":"a2A","c":"Molecules of an element","q":"Oxygen gas is made of O₂ molecules. Is oxygen an element or a compound?","o":["An element, because both atoms in the molecule are oxygen atoms","A compound, because its two atoms are joined together","A mixture, because each molecule contains two atoms","A compound, because anything made of molecules is one"],"e":"A molecule is any group of atoms joined together. It is only a compound if the atoms are of different elements."},
  {"t":"d2A","c":"Compound properties differ","q":"Sodium is a soft, very reactive metal. Chlorine is a poisonous green gas. They react to form sodium chloride, which is table salt. What does this show?","o":["A compound can have completely different properties from the elements it is made from","Sodium chloride is just a mixture of sodium and chlorine kept together","Sodium chloride must still be poisonous, because it contains chlorine","Elements keep all their properties when they combine to form compounds"],"e":"When elements react, their atoms join to make a new substance. The new substance has its own properties, which can be very different from those of the elements."},
  {"t":"d1K","c":"Reading a formula","q":"What does the formula H₂O tell you?","o":["Each molecule contains two hydrogen atoms joined to one oxygen atom","Each molecule contains two oxygen atoms joined to one hydrogen atom","Water is a mixture of hydrogen gas and oxygen gas in the ratio 2 : 1","There are two water molecules, each containing one H and one O atom"],"e":"The small number after a symbol tells you how many atoms of that element there are. No number means one atom."},
  {"t":"d2N","c":"Counting atoms","q":"Calcium carbonate has the formula CaCO₃. How many different elements and how many atoms in total does one unit contain?","o":["3 elements, 5 atoms","3 elements, 3 atoms","2 elements, 5 atoms","4 elements, 6 atoms"],"e":"The elements are calcium (Ca), carbon (C) and oxygen (O). There is 1 Ca, 1 C and 3 O, which makes 5 atoms."},
  {"t":"d1K","c":"Naming compounds","q":"What is the name of the compound formed when iron reacts with sulfur?","o":["Iron sulfide","Iron sulfate","Sulfur iron","Iron sulfur oxide"],"e":"The metal is named first. A compound of just two elements ends in -ide. Names ending in -ate, like sulfate, mean oxygen is also present."},
  {"t":"d2K","c":"-ate compounds","q":"Which elements are present in copper sulfate?","o":["Copper, sulfur and oxygen","Copper and sulfur only","Copper, sulfur and hydrogen","Copper and oxygen only"],"e":"The ending -ate tells you the compound contains oxygen as well as the other elements named. Copper sulfate is CuSO₄."},
  {"t":"c1A","c":"Metal or non-metal","q":"An unknown solid element is dull, breaks when hammered and does not conduct electricity. What is it most likely to be?","o":["A non-metal","A metal","A compound","An alloy"],"e":"Metals are usually shiny, malleable and good conductors of electricity and heat. Dull, brittle and non-conducting are typical non-metal properties."},
  {"t":"b1K","c":"Groups in the Periodic Table","q":"Lithium, sodium and potassium are in the same column (group) of the Periodic Table. What would you expect?","o":["They have similar chemical properties","They have exactly the same mass","They are all non-metals that conduct","They are all gases at room temperature"],"e":"Elements in the same group react in similar ways. These three are all soft metals that react strongly with water."},
  {"t":"b1K","c":"Where metals are","q":"Where are most metals found in the Periodic Table?","o":["On the left and in the middle","On the right-hand side","Only along the top row","Only along the bottom row"],"e":"Most elements are metals, and they are found on the left and in the centre. Non-metals are mainly on the right."},
  {"t":"a2K","c":"Chemical symbols","q":"Which pair of element and symbol is correct?","o":["Iron, Fe","Sodium, S","Potassium, P","Copper, Co"],"e":"Some symbols come from Latin names: Fe (ferrum) is iron, Na (natrium) is sodium, K (kalium) is potassium and Cu (cuprum) is copper. S is sulfur, P is phosphorus and Co is cobalt."},
  {"t":"d2A","c":"Compounds only","q":"Which list contains only compounds?","o":["H₂O, CO₂, NaCl","O₂, H₂O, CO₂","Fe, Cu, NaCl","N₂, O₂, Cl₂"],"e":"A compound has at least two different elements chemically joined. O₂, N₂, Cl₂, Fe and Cu each contain only one element."},
  {"t":"d2A","c":"Separating a compound","q":"How can the elements in a compound be separated?","o":["Only by a chemical reaction","By filtering","With a magnet","By evaporating the compound"],"e":"The atoms in a compound are chemically joined. Physical methods like filtering or using a magnet can separate mixtures, but not compounds."},
  {"t":"a1K","c":"Atoms","q":"What is an atom?","o":["The smallest particle of an element that can take part in a chemical reaction","A particle made of two or more different elements joined together","A tiny piece broken off a compound during a chemical reaction","A type of molecule that is found only in gases such as oxygen"],"e":"Everything is made from atoms. Each element has its own type of atom."},
  {"t":"a1K","c":"Number of elements","q":"Roughly how many elements are known?","o":["About 118, of which around 90 occur naturally","Exactly 4: earth, air, fire and water","About 1 million","About 12"],"e":"All the millions of different substances are made from combinations of this fairly small number of elements."},
  {"t":"a2A","c":"Writing symbols","q":"Why is the symbol for cobalt written Co and not CO?","o":["CO means carbon and oxygen; a symbol's second letter is lower case","There is no difference; both are correct ways to write cobalt","CO is the symbol for copper, so cobalt needs a different one","Capital letters are only used for non-metals, so cobalt uses Co"],"e":"Each symbol starts with a capital letter. CO is carbon monoxide, a compound of carbon (C) and oxygen (O)."},
  {"t":"b1K","c":"Groups and periods","q":"In the Periodic Table, what are the horizontal rows called?","o":["Periods","Groups","Families","Columns"],"e":"Rows are periods. Columns are groups; elements in a group have similar properties."},
  {"t":"b2K","c":"Noble gases","q":"Helium, neon and argon are in the last group of the Periodic Table. What property do they share?","o":["They are very unreactive gases","They are very reactive metals","They are all solids","They all conduct electricity well"],"e":"The noble gases hardly react at all. That is why argon is used inside light bulbs and helium in balloons."},
  {"t":"b3A","c":"Trends in a group","q":"Lithium reacts gently with water, sodium reacts strongly and potassium reacts violently. Rubidium is below potassium. How would you expect it to react?","o":["Even more violently than potassium","Less strongly than lithium","Not at all with water","Exactly like lithium"],"e":"In Group 1, reactivity increases down the group. The Periodic Table lets you predict properties from patterns."},
  {"t":"b3A","c":"Mendeleev","q":"When Mendeleev made his Periodic Table, he left gaps. Why was this important?","o":["He predicted elements to fill them, and they were later found as predicted","He had made mistakes and simply ran out of space for some elements","The gaps were left for compounds that he planned to add later on","He did not know where to put the metals, so he left them out for now"],"e":"Successful predictions were strong evidence that the patterns in his table were real."},
  {"t":"c2K","c":"States of elements","q":"Which statement about elements at room temperature is correct?","o":["Most metals are solid, while non-metals may be solid, liquid or gas","All elements are solids at room temperature, including oxygen","All non-metals are gases, while all metals are solids","Most metals are liquids, while non-metals are always solids"],"e":"Mercury is the only liquid metal at room temperature. Bromine is a liquid non-metal, and many non-metals, such as oxygen and nitrogen, are gases."},
  {"t":"c3A","c":"Exceptions","q":"Graphite (a form of carbon) conducts electricity. Is carbon a metal?","o":["No; carbon is a non-metal, and graphite is an unusual exception","Yes; anything that conducts electricity must be a metal","Yes; because it is a shiny solid at room temperature","No; graphite is a compound of carbon and a metal"],"e":"Classifying elements uses several properties together. Carbon has mostly non-metal properties."},
  {"t":"c3A","c":"Non-metal oxides","q":"Sulfur burns to form sulfur dioxide, which dissolves in water to form an acidic solution. What does this suggest about non-metal oxides?","o":["Many non-metal oxides form acidic solutions","All oxides are neutral when they dissolve in water","Non-metal oxides always contain a hidden metal atom","Non-metal oxides always form alkaline solutions"],"e":"Non-metal oxides such as carbon dioxide and sulfur dioxide are acidic. Many metal oxides are basic."},
  {"t":"d2A","c":"Fixed composition","q":"Water from a tap, a river or a melted glacier always has the formula H₂O. What does this show about compounds?","o":["A compound always contains its elements in the same fixed ratio","Water is a mixture","The ratio of elements in a compound can be anything","Only pure water is a compound"],"e":"A mixture of hydrogen and oxygen gases can be in any proportions, but the compound water always has 2 H for every 1 O."},
  {"t":"d3A","c":"Same elements, different compound","q":"Water is H₂O and hydrogen peroxide is H₂O₂. What does this show?","o":["The same elements combined in different ratios make different substances","They are the same substance, written in two different ways","Hydrogen peroxide is a mixture of water and oxygen gas","The formula does not matter as long as the elements match"],"e":"Hydrogen peroxide is a bleach and has very different properties from water, even though both contain only hydrogen and oxygen."},
  {"t":"d2A","c":"Carbon oxides","q":"What is the difference between carbon monoxide (CO) and carbon dioxide (CO₂)?","o":["CO has one oxygen atom per carbon atom; CO₂ has two","CO contains no oxygen; only CO₂ contains oxygen","CO₂ contains two carbon atoms for each oxygen atom","They are the same compound, written in two ways"],"e":"Mono- means one and di- means two. The names tell you about the formula."},
  {"t":"d2N","c":"Counting atoms","q":"How many atoms are in one molecule of glucose, C₆H₁₂O₆?","o":["24","3","18","6"],"e":"6 carbon + 12 hydrogen + 6 oxygen = 24 atoms, made from 3 elements."},
  {"t":"d2N","c":"Counting atoms 2","q":"Sulfuric acid is H₂SO₄. How many atoms are shown in this formula?","o":["7","3","4","6"],"e":"2 hydrogen + 1 sulfur + 4 oxygen = 7 atoms."},
  {"t":"d1K","c":"Ammonia","q":"Ammonia has the formula NH₃. What does it contain?","o":["One nitrogen atom joined to three hydrogen atoms","Three nitrogen atoms and one hydrogen atom","Nitrogen, hydrogen and oxygen","One nickel atom and three hydrogen atoms"],"e":"N is nitrogen and H is hydrogen. The 3 belongs to the hydrogen."},
  {"t":"d1K","c":"Naming oxides","q":"Magnesium burns in oxygen. What is the product called?","o":["Magnesium oxide","Magnesium oxygenate","Oxygen magnesium","Magnesium dioxide gas"],"e":"Metal first, then the non-metal with -ide: magnesium oxide, MgO."},
  {"t":"d2E","c":"Iron and sulfur","q":"A mixture of iron and sulfur is heated. It glows and a black solid forms that is not attracted to a magnet. What has happened?","o":["A chemical reaction has formed a new compound, iron sulfide","The iron has melted into the sulfur and coloured it black","The sulfur has turned into iron, which is now not magnetic","Nothing has changed; it is still a mixture that has been burnt"],"e":"The product has new properties: it is not magnetic and looks different. This shows a compound has formed."},
  {"t":"d2A","c":"Elements and compounds in air","q":"Which substances in air are compounds?","o":["Carbon dioxide and water vapour","Nitrogen and oxygen gases","Argon and neon gases","Oxygen and argon gases"],"e":"Nitrogen (N₂), oxygen (O₂) and argon (Ar) are elements. Carbon dioxide and water contain two elements each."},
  {"t":"d3A","c":"Particle diagrams","q":"A diagram shows a box of identical particles. Each particle is one black atom joined to two white atoms. What does the box contain?","o":["A pure compound","A pure element","A mixture of two elements","A mixture of compounds"],"e":"Every particle is the same, so it is a pure substance. Each particle contains two different types of atom, so it is a compound."},
  {"t":"a3A","c":"Particle diagrams 2","q":"A box contains single black atoms and separate pairs of white atoms, not joined to each other. What does the box contain?","o":["A mixture of two elements","A compound","A single element","A mixture of compounds"],"e":"There are two different kinds of particle, so it is a mixture. Each kind contains only one type of atom, so both are elements."},
  {"t":"a2A","c":"Diatomic elements","q":"Chlorine exists as Cl₂ molecules. Which statement is correct?","o":["Chlorine is an element whose molecules have two atoms","Chlorine is a compound of two different elements","Cl₂ means chlorine has two different types of atom","Chlorine gas is a mixture of two chlorine compounds"],"e":"Several gaseous elements, including hydrogen, nitrogen, oxygen and chlorine, exist as pairs of atoms."},
  {"t":"c1A","c":"Properties and uses","q":"Copper is used for electrical wires. Which property is most important for this?","o":["It conducts electricity well and can be drawn into wires","It is shiny and does not rust in damp air","It is magnetic, so it attracts the current","It is a non-metal, so it stays cool when used"],"e":"Uses of materials depend on their properties. Copper is ductile and conducts electricity very well."},
  {"t":"c1A","c":"Metal properties","q":"Why are saucepans often made of aluminium or steel?","o":["Metals are good conductors of heat and have high melting points","Metals are poor conductors of heat, so the handles stay cool","Metals are brittle, so the pans keep their shape when heated","Metals melt at low temperatures, so they spread heat evenly"],"e":"A saucepan needs to transfer heat to the food and not melt on the cooker."},
  {"t":"d2K","c":"Hydroxides","q":"Sodium hydroxide has the formula NaOH. Which elements does a hydroxide contain besides the metal?","o":["Oxygen and hydrogen","Oxygen only","Hydrogen only","Hydrogen and sulfur"],"e":"OH is the hydroxide group. The name ending tells you which elements are present."},
  {"t":"d2K","c":"Carbonates","q":"Calcium carbonate is found in limestone. Which elements does it contain?","o":["Calcium, carbon and oxygen","Calcium and carbon only","Calcium and oxygen only","Carbon and oxygen only"],"e":"Carbonate means carbon combined with oxygen, CO₃. With calcium, the formula is CaCO₃."},
  {"t":"a2A","c":"Breaking down compounds","q":"Electricity passed through water breaks it into hydrogen and oxygen. Why couldn't the same be done to oxygen gas?","o":["Oxygen is an element and cannot be broken down into simpler substances","Oxygen is a gas, and only liquids can be broken down by electricity","Electricity cannot pass through oxygen, so no reaction can start","Oxygen is already a mixture, so it needs a physical method instead"],"e":"Compounds can be split into their elements by chemical means. Elements are already the simplest substances."},
  {"t":"b2A","c":"Predicting from a group","q":"Element X is in the same group as chlorine. What would you predict about X?","o":["It reacts in a similar way to chlorine","It is a metal that reacts like sodium","It has exactly the same mass as chlorine","It is a noble gas that does not react"],"e":"Elements in the same group have similar chemical properties. X could be bromine or iodine."},
  {"t":"b2K","c":"Order in the modern table","q":"How are elements arranged in the modern Periodic Table?","o":["In order of increasing atomic number","In alphabetical order of their names","In the order in which they were discovered","In order of how common they are"],"e":"The atomic number counts the protons in an atom. Arranging elements this way puts similar elements in the same groups."},
  {"t":"c2A","c":"Mercury","q":"Mercury is a liquid at room temperature. Why is it still classed as a metal?","o":["It is shiny and conducts electricity and heat well","All liquids at room temperature are metals","It is heavy, and all heavy elements are metals","It is found on the left of every group"],"e":"Elements are classified by several properties together. Mercury has typical metal properties apart from its low melting point."},
  {"t":"c2K","c":"Non-metal properties","q":"Which property is typical of non-metals?","o":["Poor conductors of heat and electricity","Shiny and bend when they are hammered","High density and high melting point","Make a ringing sound when they are struck"],"e":"Most non-metals are poor conductors, dull and brittle when solid. Graphite is the main exception for conducting."},
  {"t":"c3A","c":"In-between elements","q":"Silicon is shiny like a metal, but it is brittle and conducts electricity only poorly. What does this show?","o":["Some elements have properties of metals and non-metals","Silicon must be a compound, not a single element","Only shininess decides whether something is a metal","Silicon is a noble gas whenever it is pure"],"e":"Elements near the dividing line in the Periodic Table, such as silicon, are sometimes called metalloids."},
  {"t":"a2A","c":"Diamond and graphite","q":"Diamond and graphite are both pure carbon, but diamond is very hard and graphite is soft. What does this show?","o":["One element can exist in forms with different properties","Diamond and graphite must be different compounds","Diamond contains a metal that graphite does not","Graphite is a mixture of carbon and lead"],"e":"The atoms are all carbon. They are arranged differently, which gives different properties. Pencil 'lead' is actually graphite."},
  {"t":"d2A","c":"Making water","q":"Hydrogen burns in oxygen to make water. Which word equation is correct?","o":["hydrogen + oxygen → water","water → hydrogen + oxygen","hydrogen + water → oxygen","oxygen → hydrogen + water"],"e":"Reactants go on the left of the arrow and products on the right. The reverse reaction happens when electricity splits water."},
  {"t":"d3A","c":"Oxygen in carbon dioxide","q":"Oxygen helps things burn, yet carbon dioxide, which contains oxygen, is used to put out fires. Why?","o":["In a compound, the oxygen is joined to carbon and behaves differently","The oxygen in carbon dioxide is a completely different element","Carbon dioxide does not contain any oxygen atoms at all","Carbon atoms absorb the flames before the oxygen can feed them"],"e":"A compound has its own properties. The oxygen atoms are chemically bonded, so the compound does not behave like oxygen gas."},
  {"t":"d2N","c":"Most atoms","q":"Which formula shows the most atoms?","o":["C₂H₅OH","CH₄","CO₂","NH₃"],"e":"C₂H₅OH has 2 + 5 + 1 + 1 = 9 atoms. CH₄ has 5, NH₃ has 4 and CO₂ has 3."},
  {"t":"a1K","c":"Symbol for sodium","q":"What is the chemical symbol for sodium?","o":["Na","So","S","Sd"],"e":"Na comes from natrium, the Latin name for sodium. S is the symbol for sulfur."},
  {"t":"a2K","c":"Which are elements","q":"Which pair are both elements?","o":["Iron and oxygen","Water and iron","Carbon dioxide and oxygen","Salt and copper"],"e":"Water, carbon dioxide and salt (sodium chloride) are compounds made of two or more elements."},
  {"t":"b2A","c":"Helium in airships","q":"Airships today are filled with helium rather than hydrogen. Why?","o":["Helium is unreactive, but hydrogen burns explosively","Helium is much heavier than hydrogen","Hydrogen is a metal and conducts electricity","Helium is a compound that cannot burn"],"e":"Helium is a noble gas. Hydrogen is lighter but flammable, which caused serious airship disasters."},
  {"t":"d2A","c":"Compound to compounds","q":"Copper carbonate is heated and forms copper oxide and carbon dioxide. Which statement is correct?","o":["One compound breaks down into two other compounds","An element breaks down into two other elements","Two elements combine to make one compound","A mixture is separated by a physical method"],"e":"Copper carbonate, copper oxide and carbon dioxide are all compounds. This is thermal decomposition."},
  {"t":"d1K","c":"Common salt","q":"What is the chemical name of common table salt?","o":["Sodium chloride","Sodium carbonate","Calcium chloride","Sodium hydroxide"],"e":"Table salt is sodium chloride, NaCl."},
  {"t":"c3A","c":"Does conducting prove metal?","q":"A dull grey solid element conducts electricity. Is it definitely a metal?","o":["Not definitely; graphite is a non-metal that also conducts","Yes, because only metals conduct electricity","Yes, because all metals are grey and dull","No, because metals are always shiny, never grey"],"e":"Good scientists check several properties before deciding, because there are exceptions."},
  {"t":"b3A","c":"Missing noble gases","q":"Mendeleev's 1869 table had no group for argon, neon or helium. Why not?","o":["They had not yet been discovered","They are compounds, not elements","They did not fit any pattern at all","They were thought too rare to include"],"e":"The noble gases were discovered in the 1890s. They fitted neatly into a new group, which supported the idea of the Periodic Table."},
  {"t":"d1K","c":"Water is a compound","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Water is a compound.","R":"Water contains two elements chemically joined.","a":0,"e":"Both true, and the reason is the definition of a compound."},
  {"t":"a2A","c":"Oxygen gas","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Oxygen gas is a compound.","R":"Oxygen gas is made of O₂ molecules.","a":3,"e":"Oxygen is an element: both atoms in each molecule are oxygen. Being made of molecules does not make it a compound."},
  {"t":"a1K","c":"Which are elements","type":"multi","q":"Which of these are elements? Select all that apply.","o":["Iron","Oxygen","Sulfur","Helium","Water","Salt"],"k":4,"e":"Water (H₂O) and salt (NaCl) are compounds of two elements."},
  {"t":"c1K","c":"Metal properties","type":"multi","q":"Which are typical properties of metals? Select all that apply.","o":["Good conductor of electricity","Malleable","Shiny","Brittle","Low melting point"],"k":3,"e":"Brittleness is a non-metal property, and most metals have high melting points."},
  {"t":"b2A","c":"Group 1 reactivity","type":"order","q":"Put these Group 1 metals in order of increasing reactivity with water.","o":["Lithium","Sodium","Potassium"],"e":"Reactivity increases down Group 1: lithium fizzes gently, sodium melts and whizzes, potassium bursts into flame."},
  {"t":"c1K","c":"Odd one out: metals","q":"Which is the odd one out?","o":["Sulfur","Iron","Copper","Zinc"],"e":"Iron, copper and zinc are metals. Sulfur is a non-metal."},
  {"t":"d2N","c":"Atoms in a formula","q":"Which has more atoms in one molecule: glucose (C₆H₁₂O₆) or sulfuric acid (H₂SO₄)?","o":["Glucose, with 24 atoms","Sulfuric acid, with 7 atoms","Both have the same number","Glucose, with 3 atoms"],"e":"Glucose: 6 + 12 + 6 = 24 atoms. Sulfuric acid: 2 + 1 + 4 = 7 atoms."}
  ]},
{ n: 8, title: "Mixtures", strand: "Chemistry", topics: "Mixtures vs compounds, solutions and solubility, filtration, evaporation, distillation, chromatography, purity",
  qs: [
  {"t":"b2A","c":"Conservation of mass in dissolving","q":"10 g of salt is dissolved completely in 100 g of water. What is the mass of the solution?","o":["110 g, because the salt particles are still there, spread among the water particles","100 g, because the salt has disappeared and no longer has any mass","Less than 100 g, because some of the water is used up in dissolving","More than 110 g, because a new substance with extra mass is made"],"e":"Dissolving is a physical change. No particles are lost, so total mass stays the same even though you cannot see the salt."},
  {"t":"b1K","c":"Solute and solvent","q":"In a sugar solution, which is the solute and which is the solvent?","o":["Sugar is the solute; water is the solvent","Water is the solute; sugar is the solvent","Both are solutes","The solution is the solvent"],"e":"The solute is the substance that dissolves. The solvent is the liquid it dissolves in. Together they make a solution."},
  {"t":"b1K","c":"Saturated solutions","q":"What is a saturated solution?","o":["A solution in which no more solute will dissolve at that temperature","A solution that is very hot, so it is close to boiling","A solution that contains a lot of solvent and only a little solute","Any solution that has a strong colour, such as copper sulfate"],"e":"When a solution is saturated, extra solute stays undissolved. Changing the temperature can change how much will dissolve."},
  {"t":"b2A","c":"Solubility and temperature","q":"A hot saturated solution of copper sulfate is left to cool. Crystals appear. Why?","o":["Solubility decreases as the solution cools, so less solid can stay dissolved","Cooling turns some of the water into copper sulfate crystals","The solvent freezes into crystals as the solution gets cold","New copper sulfate is made by a reaction as the solution cools"],"e":"Most solids are more soluble in hot water. As the solution cools, the extra solute comes out of solution as crystals."},
  {"t":"b3A","c":"Rate vs amount","q":"Stirring helps sugar dissolve faster in tea. Does stirring increase the total amount of sugar that can dissolve?","o":["No, it only speeds up dissolving; the maximum amount depends on temperature","Yes, stirring always increases solubility","Yes, because stirring adds energy that makes room for more sugar","No, because stirring stops sugar dissolving"],"e":"Stirring brings fresh solvent to the solid, so it dissolves sooner. Solubility, the maximum that can dissolve, depends on the solvent and the temperature."},
  {"t":"c2A","c":"Filtration and evaporation","q":"How would you get dry salt from a mixture of sand, salt and water?","o":["Filter to remove the sand, then evaporate the water from the filtrate","Evaporate the water first, then filter the salt away from the sand","Use a magnet to pull out the salt, then pour away the water","Filter the mixture; the salt stays on the paper and the sand passes through"],"e":"Salt is dissolved, so it passes through the filter paper with the water. Sand is insoluble and stays as the residue. Evaporating the filtrate leaves the salt."},
  {"t":"c2A","c":"Distillation","q":"Which method gives pure water from sea water?","o":["Distillation: the water evaporates and is then condensed and collected","Filtration, because the filter paper traps the dissolved salt","Chromatography, because the water travels up the paper alone","Evaporation in an open dish, because the water is left behind"],"e":"Salt is dissolved, so filtering does not remove it. In distillation the water turns to vapour and is cooled back to liquid, leaving the salt behind."},
  {"t":"d1A","c":"Reading a chromatogram","q":"A spot of black ink separates into three coloured spots on chromatography paper. What does this show?","o":["The ink is a mixture of at least three dyes","The ink is a pure substance","The ink reacted with the solvent to make three new substances","The ink contains three different solvents"],"e":"Each dye travels a different distance depending on how soluble it is in the solvent and how strongly it sticks to the paper. Three spots means at least three dyes."},
  {"t":"d2E","c":"Chromatography method","q":"Why is the start line in chromatography drawn in pencil and placed above the level of the solvent?","o":["Pencil does not dissolve in the solvent, and the spots must not dissolve straight into the solvent in the beaker","Pencil lines help the solvent move faster up the paper, and spots above the solvent dry out","Pen ink is too dark, so it hides the spots, and the solvent level does not matter","Pencil shows up better, and the spots need to be below the solvent to dissolve"],"e":"Ink from a pen would separate too and spoil the result. If the spots are under the solvent, they wash off into the beaker instead of moving up the paper."},
  {"t":"a2A","c":"Purity and boiling point","q":"Pure water boils at 100 °C. A sample of water boils at 102 °C. What does this suggest?","o":["The water is not pure; it contains dissolved substances","The thermometer must be broken","The water is extra pure","The water is turning into a different element"],"e":"Pure substances have fixed melting and boiling points. Dissolved impurities change them; salt water, for example, boils above 100 °C."},
  {"t":"a2A","c":"Air is a mixture","q":"Why is air described as a mixture and not a compound?","o":["Its gases are not chemically joined and their proportions can vary","It contains only one element, which is spread out as a gas","It has a chemical formula that shows a fixed ratio of gases","Its gases are chemically joined, so they cannot be separated"],"e":"Nitrogen, oxygen and the other gases in air keep their own properties. They can be separated by physical methods, such as fractional distillation of liquid air."},
  {"t":"a3A","c":"Mixture vs compound","q":"Iron filings and sulfur powder are mixed. Then some of the mixture is heated to make iron sulfide. What happens if a magnet is held near each?","o":["The magnet removes iron from the mixture, but not from iron sulfide","The magnet removes iron from both, because both still contain iron","The magnet removes iron from iron sulfide only, because heating magnetises it","The magnet attracts the sulfur in both, because sulfur is yellow and soft"],"e":"In the mixture, iron keeps its magnetic property. In the compound, iron atoms are chemically joined to sulfur atoms and the new substance has different properties."},
  {"t":"b2A","c":"Other solvents","q":"Nail varnish does not dissolve in water but does dissolve in acetone (propanone). What does this show?","o":["Whether something dissolves depends on the solvent as well as the solute","Nail varnish is soluble in all liquids, but dissolves slowly in water","Acetone is a type of water that has been made stronger","Water cannot dissolve anything that is coloured, such as varnish"],"e":"Insoluble in water does not mean insoluble in everything. Different solvents dissolve different substances."},
  {"t":"a1K","c":"What a mixture is","q":"Which is the best description of a mixture?","o":["Two or more substances that are together but not chemically joined","Two or more elements chemically joined in a fixed ratio","A substance made of only one type of atom","Any substance that is a liquid"],"e":"In a mixture each substance keeps its own properties, and the proportions can vary."},
  {"t":"a2A","c":"Pure in chemistry","q":"A carton says pure orange juice. Is it pure in the chemical sense?","o":["No; it is a mixture of water, sugars, acids and more","Yes; it is pure because it comes only from oranges","Yes; it is pure because nothing has been added to it","No; it is a single substance, but it is not an element"],"e":"In everyday language pure means nothing added. In chemistry, pure means only one substance."},
  {"t":"b1A","c":"Dissolving vs melting","q":"Sugar disappears when stirred into water. Has it melted?","o":["No; it has dissolved, spreading out between water particles","Yes; the water was warm enough to melt the sugar crystals","Yes; dissolving and melting are two names for the same change","No; the sugar has reacted and turned into more water particles"],"e":"Melting needs heat and involves only one substance. Dissolving involves a solute mixing with a solvent."},
  {"t":"b1A","c":"Insoluble substances","q":"Chalk is stirred into water. The water goes cloudy, and chalk settles at the bottom later. What does this show?","o":["Chalk is insoluble in water","Chalk is soluble in water","Chalk reacts with water","Chalk is a solvent"],"e":"A solution is transparent, though it may be coloured. A cloudy mixture where solid settles shows the solid has not dissolved."},
  {"t":"b1N","c":"Concentration","q":"Solution A has 10 g of salt in 100 cm³ of water. Solution B has 20 g of salt in 100 cm³ of water. Which is more concentrated?","o":["B","A","They are equally concentrated","You cannot tell"],"e":"Concentration is the amount of solute in a given volume. B has twice as much solute in the same volume."},
  {"t":"b2N","c":"Solubility data","q":"At 20 °C, 36 g of salt dissolves in 100 g of water. If 50 g of salt is added to 100 g of water at 20 °C, what happens?","o":["36 g dissolves and 14 g stays undissolved","All 50 g dissolves if stirred long enough","None of it dissolves until the water is heated","36 g dissolves and the other 14 g reacts with water"],"e":"Once 36 g has dissolved, the solution is saturated. The extra 14 g cannot dissolve at this temperature."},
  {"t":"b3N","c":"Solubility curves","q":"Potassium nitrate's solubility is 30 g/100 g water at 20 °C and 110 g/100 g water at 60 °C. A saturated solution in 100 g of water at 60 °C is cooled to 20 °C. How much solid forms?","o":["80 g","30 g","110 g","140 g"],"e":"At 60 °C it holds 110 g. At 20 °C it can only hold 30 g, so 110 − 30 = 80 g comes out as crystals."},
  {"t":"b3A","c":"Gas solubility","q":"A fizzy drink goes flat faster when it is warm. What does this show?","o":["Gases are less soluble in water at higher temperatures","Gases are more soluble at higher temperatures","Warm drinks contain more gas","Temperature does not affect gas solubility"],"e":"Unlike most solids, gases dissolve better in cold water. This is also why warm water holds less oxygen for fish."},
  {"t":"c2E","c":"Crystal size","q":"How can you grow larger crystals from a solution?","o":["Let the solution cool or evaporate slowly","Boil the solution dry as fast as possible","Add more water","Stir it very quickly"],"e":"Slow crystallisation gives particles time to arrange into larger, regular crystals."},
  {"t":"c1K","c":"Residue and filtrate","q":"Muddy water is filtered. What is the liquid that passes through the filter paper called?","o":["The filtrate","The residue","The solute","The solvent"],"e":"The solid trapped on the paper is the residue. The liquid that passes through is the filtrate."},
  {"t":"c1A","c":"How filtering works","q":"Why does filtering separate sand from water?","o":["Sand grains are too big to fit through the holes in the paper","The filter paper absorbs the sand into its fibres","The sand dissolves in the paper and stays behind","Water is attracted to the sand and leaves it behind"],"e":"Filter paper acts like a very fine sieve. Dissolved particles are tiny and pass through it."},
  {"t":"c1K","c":"Condenser","q":"What is the job of the condenser in distillation?","o":["To cool the vapour so that it turns back into a liquid","To heat the mixture so that the water evaporates faster","To filter out any solid pieces before the vapour is collected","To dissolve the solute so that it does not block the flask"],"e":"Cold water flows around the inner tube of the condenser, cooling the vapour inside."},
  {"t":"c2A","c":"Fractional distillation","q":"Ethanol boils at 78 °C and water at 100 °C. How can they be separated?","o":["Fractional distillation, because they have different boiling points","Filtration, because the ethanol particles are smaller than water particles","Using a magnet, because ethanol is attracted and water is not","Chromatography, because ethanol travels further up the paper"],"e":"When the mixture is heated, ethanol boils off first and is condensed and collected separately."},
  {"t":"c3A","c":"Separating air","q":"Air is cooled until it becomes liquid, then warmed slowly so the gases boil off one at a time. What property is this separation based on?","o":["Different boiling points","Different colours","Different magnetic properties","Different solubility in water"],"e":"Nitrogen, argon and oxygen have different boiling points, so they can be collected separately."},
  {"t":"d2A","c":"Identifying food colourings","q":"A chromatogram has an unknown sweet colouring next to known dyes A, B and C. The unknown's two spots are at the same heights as spots from A and C. What does this show?","o":["The colouring contains dyes A and C","The colouring contains dye B only","The colouring is pure","The colouring contains A, B and C"],"e":"With the same solvent and paper, the same dye always travels the same distance."},
  {"t":"d3N","c":"Rf values","q":"A dye travels 3 cm while the solvent travels 6 cm. What is the Rf value?","o":["0.5","2","3","18"],"e":"Rf = distance moved by dye ÷ distance moved by solvent = 3 ÷ 6 = 0.5. Rf is always less than 1."},
  {"t":"d2A","c":"Pure substance chromatogram","q":"A substance gives only one spot in chromatography, whatever solvent is used. What does this suggest?","o":["It is probably a pure substance","It is a mixture of many dyes","It is insoluble in all solvents","It is a metal"],"e":"A mixture would usually separate into more than one spot in at least one solvent."},
  {"t":"c1A","c":"Magnetic separation","q":"How would you separate iron filings from sand?","o":["Use a magnet","Filter the mixture","Dissolve the iron in water","Distil the mixture"],"e":"Iron is magnetic and sand is not. Choose a method based on a property that differs between the substances."},
  {"t":"c2A","c":"Two insoluble solids","q":"How would you separate a mixture of salt and sand?","o":["Dissolve the salt in water, filter out the sand, then evaporate","Use a magnet to pull the sand grains out of the dry mixture","Filter the dry mixture so that the salt falls through the paper","Heat it until the sand melts, then pour the liquid sand away"],"e":"The useful difference is solubility. Dissolving the salt lets the sand be filtered out."},
  {"t":"c2A","c":"Immiscible liquids","q":"Oil and water do not mix and form two layers. How can they be separated?","o":["With a separating funnel, by running off the bottom layer","By filtration, because the oil stays on the paper","By chromatography, because oil moves further","By using a magnet, because water is attracted"],"e":"Liquids that do not mix are immiscible. A separating funnel lets the lower, denser layer drain out first."},
  {"t":"a2A","c":"Alloys","q":"Steel is iron mixed with a small amount of carbon. Why is steel used for building rather than pure iron?","o":["Steel is stronger and harder than pure iron","Steel is a pure element","Steel cannot rust at all","Steel is a compound with fixed properties"],"e":"An alloy is a mixture containing a metal. Mixing changes the properties, often making the metal harder."},
  {"t":"c1A","c":"Sea salt","q":"In hot countries, sea water is let into shallow ponds to get salt. Which separation method is this?","o":["Evaporation","Filtration","Distillation","Chromatography"],"e":"The Sun evaporates the water, leaving the salt behind."},
  {"t":"a3A","c":"Melting range","q":"A sample of a solid melts between 115 °C and 121 °C instead of at one temperature. What does this suggest?","o":["It is impure (a mixture)","It is a pure element","The thermometer is fine and the sample is pure","It is a gas"],"e":"Pure substances melt sharply at one temperature. Impurities lower the melting point and make it melt over a range."},
  {"t":"a2A","c":"Salt on roads","q":"Salt is spread on icy roads in winter. How does it help?","o":["Salt water freezes below 0 °C","Salt gives out heat as it touches ice","Salt absorbs the ice into its crystals","Salt makes ice harder and less slippery"],"e":"Dissolved salt is an impurity that lowers the freezing point, so ice melts even below 0 °C."},
  {"t":"b2A","c":"Surface area and dissolving","q":"Why does granulated sugar dissolve faster than a sugar cube of the same mass?","o":["Small grains have more surface touching the water","Granulated sugar is a different, more soluble substance","Sugar cubes are insoluble until they are crushed","Small grains are warmer, so they dissolve sooner"],"e":"More surface means more sugar particles are exposed to water particles at once."},
  {"t":"a2A","c":"Purity of water","q":"Why is distilled water used in some experiments rather than tap water?","o":["Tap water contains dissolved substances that might affect the results","Tap water is not made of water molecules","Distilled water is a compound and tap water is an element","Tap water cannot dissolve anything"],"e":"Tap water is a mixture containing dissolved minerals and gases. Distillation removes them."},
  {"t":"c2A","c":"Separating a dissolved solid without losing the solvent","q":"You want to collect both the water and the salt from salty water. Which method lets you do this?","o":["Distillation","Evaporation in an open dish","Filtration","Using a magnet"],"e":"Evaporation in an open dish loses the water to the air. Distillation condenses and collects the water while the salt stays in the flask."},
  {"t":"b2A","c":"Salt water","q":"Is salt water a mixture or a compound?","o":["A mixture, because the salt and water are not chemically joined","A compound, because the salt can no longer be seen","An element, because it looks just like pure water","A compound, because it has a fixed chemical formula"],"e":"The salt can be recovered by evaporating the water, and you can make the solution weaker or stronger."},
  {"t":"b3N","c":"Scaling solubility","q":"20 g of a solid dissolves in 50 g of water at 20 °C. How much can dissolve in 200 g of water at the same temperature?","o":["80 g","20 g","40 g","200 g"],"e":"200 g of water is 4 times as much as 50 g, so 4 × 20 g = 80 g can dissolve."},
  {"t":"c3A","c":"Three-part mixture","q":"How would you separate a mixture of iron filings, salt and sand?","o":["Magnet first, then dissolve the salt, filter and evaporate","Filter first, then use a magnet on the filtrate","Evaporate first, then use a magnet and filter","Dissolve first, then use a magnet on the salt solution"],"e":"Each step uses a different property: magnetism for iron, solubility for salt, then filtering and evaporation."},
  {"t":"d2E","c":"Solvent front","q":"In chromatography, why is the paper taken out before the solvent reaches the top?","o":["So the distance the solvent moved can be measured","So the dyes do not fall off the top of the paper","So the paper does not dissolve in the solvent","So the spots stop changing colour"],"e":"You need to mark the solvent front to calculate Rf values."},
  {"t":"d3A","c":"Water vs ethanol solvent","q":"A felt-tip ink does not move at all in water but separates into colours in ethanol. Why?","o":["The dyes are insoluble in water but soluble in ethanol","Ethanol reacts with the ink to make new dyes","Water reacts with the dyes and holds them still","The paper only absorbs ethanol, never water"],"e":"A dye only moves if it dissolves in the solvent. Permanent markers often need a solvent other than water."},
  {"t":"d2A","c":"Forensic chromatography","q":"Police find a note written in ink. How could chromatography help find which pen wrote it?","o":["Compare its chromatogram with those of the suspects' pens","Measure how long the ink took to dry on the paper","Weigh the ink on the note and on each pen","Dissolve the paper and measure its boiling point"],"e":"Inks with the same dyes give matching spots at the same heights."},
  {"t":"c2A","c":"Heating ethanol safely","q":"Why is an electric heater, not a Bunsen burner, used to distil a mixture of ethanol and water?","o":["Ethanol is flammable, so a flame is dangerous","A Bunsen flame is not hot enough to boil ethanol","Ethanol would freeze if it were near a flame","A flame would stop the condenser working"],"e":"Ethanol vapour can catch fire. Electric heaters or water baths avoid naked flames."},
  {"t":"a2K","c":"Pure substance","q":"Which of these is a pure substance?","o":["Distilled water","Sea water","Air","Milk"],"e":"Distilled water contains only water. The others are mixtures of several substances."},
  {"t":"c1K","c":"Decanting","q":"Pouring off a liquid and leaving a solid sediment behind is called:","o":["Decanting","Filtering","Distilling","Condensing"],"e":"Decanting is quick but less complete than filtering."},
  {"t":"c2A","c":"Cost of desalination","q":"Turning sea water into drinking water by distillation is expensive. Why?","o":["Boiling large amounts of water needs a lot of energy","Salt is very expensive to throw away afterwards","The condenser must be made of a precious metal","Sea water must be filtered ten times first"],"e":"Water needs a lot of energy to boil. Countries with cheap energy or sunshine use it more."},
  {"t":"a2A","c":"Variable properties","q":"A substance's properties change depending on how much of each part is present. What is it?","o":["A mixture","A compound","An element","A pure metal"],"e":"A mixture can have any proportions, so its properties vary. A compound always has a fixed composition and fixed properties."},
  {"t":"d3N","c":"Comparing Rf values","q":"Dye A has an Rf of 0.8 and dye B has an Rf of 0.3 in the same solvent. Which dye is more soluble in the solvent?","o":["Dye A, because it travelled further with the solvent","Dye B, because it stayed closer to the start line","Both equally, because both of them moved","Neither; Rf has nothing to do with solubility"],"e":"A dye that is more soluble spends more time dissolved in the moving solvent, so it travels further."},
  {"t":"b2E","c":"Testing for saturation","q":"How can you tell whether a solution is saturated?","o":["Add a little more solute; if it does not dissolve, it is saturated","Heat it; if it starts to boil, it is saturated","Filter it; if nothing is left behind, it is saturated","Taste it; if it is very salty, it is saturated"],"e":"Never taste anything in a laboratory. A saturated solution cannot dissolve any more solute at that temperature."},
  {"t":"b3N","c":"Comparing concentrations","q":"Which solution is more concentrated: 5 g of salt in 50 cm³ of water, or 8 g of salt in 100 cm³?","o":["5 g in 50 cm³","8 g in 100 cm³","They are equally concentrated","You cannot compare different volumes"],"e":"Compare the same volume: 5 g in 50 cm³ is the same as 10 g in 100 cm³, which is more than 8 g."},
  {"t":"c2A","c":"Filtering sea water","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Salt can be removed from sea water by filtering.","R":"Salt is soluble in water.","a":3,"e":"Because salt dissolves, it passes through filter paper; filtering cannot remove it. Distillation or evaporation is needed."},
  {"t":"a2A","c":"Fixed boiling point","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Pure water boils at 100 °C at sea level.","R":"Pure substances have fixed boiling points.","a":0,"e":"Both true, and the reason explains why the boiling point is exact."},
  {"t":"a2K","c":"Which are mixtures","type":"multi","q":"Which of these are mixtures? Select all that apply.","o":["Air","Sea water","Steel","Distilled water","Carbon dioxide","Copper"],"k":3,"e":"Air, sea water and steel contain more than one substance. Distilled water and carbon dioxide are compounds; copper is an element."},
  {"t":"b2A","c":"Faster dissolving","type":"multi","q":"Which would make sugar dissolve faster? Select all that apply.","o":["Stirring","Using warmer water","Crushing the sugar","Using colder water","Leaving it completely still"],"k":3,"e":"Stirring, warmth and a larger surface area all speed up dissolving."},
  {"t":"c2E","c":"Salt from rock salt","type":"order","q":"Put the steps for getting pure salt from rock salt (salt mixed with sand) in order.","o":["Crush the rock salt","Add water and stir to dissolve the salt","Filter to remove the sand","Evaporate the water from the filtrate"],"e":"Crushing gives a bigger surface area, the salt dissolves, filtering removes insoluble sand and evaporation leaves salt crystals."},
  {"t":"c1K","c":"Odd one out: separation","q":"Which is the odd one out?","o":["Combustion","Filtration","Distillation","Chromatography"],"e":"Filtration, distillation and chromatography separate mixtures. Combustion is a chemical reaction."},
  {"t":"b3A","c":"Fish and warm water","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Fish can struggle in warm water.","R":"Less oxygen dissolves in warm water than in cold water.","a":0,"e":"Both true, and lower oxygen solubility explains it."}
