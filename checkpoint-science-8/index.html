<style>
/* Layout: exam-paper column. Unit index as a ruled list; each test runs one question at a time with instant "why" feedback. */
:root {
  --bg: #f2f4f3;
  --paper: #ffffff;
  --ink: #17202a;
  --muted: #5b6670;
  --rule: #d9dfdd;
  --accent: #23408e;
  --bio: #2c7a4b;
  --chem: #a33b67;
  --phys: #2a5fb3;
  --good: #1f7a45;
  --good-bg: #e3f3e9;
  --bad: #b3261e;
  --bad-bg: #fbe7e5;
  --warn: #8a5a00;
  --warn-bg: #fbf0d9;
  --shadow: 0 1px 2px rgba(23,32,42,.06), 0 4px 16px rgba(23,32,42,.05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --paper: #19212a; --ink: #e6ebef; --muted: #9aa6b1; --rule: #2b3540;
    --accent: #8fa8ff; --bio: #5fc58a; --chem: #e57fab; --phys: #7aa8f5;
    --good: #6fd39a; --good-bg: #173226; --bad: #ff8a80; --bad-bg: #3a1c1b; --warn: #f2c464; --warn-bg: #352b14;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --paper: #19212a; --ink: #e6ebef; --muted: #9aa6b1; --rule: #2b3540;
  --accent: #8fa8ff; --bio: #5fc58a; --chem: #e57fab; --phys: #7aa8f5;
  --good: #6fd39a; --good-bg: #173226; --bad: #ff8a80; --bad-bg: #3a1c1b; --warn: #f2c464; --warn-bg: #352b14;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.45rem; font-weight: 700; }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
header.top { display: grid; gap: 10px; margin-bottom: 28px; }
header.top .lede { color: var(--muted); max-width: 60ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 4px; font-size: .9rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); display: inline-block; }

/* Unit index */
.units { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.unit-row { border-bottom: 1px solid var(--rule); }
.unit-no { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.unit-main { min-width: 0; display: grid; gap: 4px; }
.unit-title { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; }
.unit-topics { color: var(--muted); font-size: .92rem; }
.unit-meta { display: grid; justify-items: end; gap: 6px; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); white-space: nowrap; }
.strand { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--c); border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
.best { font-variant-numeric: tabular-nums; }
.best.secure { color: var(--good); }
.best.developing { color: var(--warn); }
.best.revisit { color: var(--bad); }
.unit-head { display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 14px; align-items: start; }
.unit-row { padding: 16px 4px; display: grid; gap: 12px; }
.unit-body { display: grid; gap: 10px; padding-left: calc(3.2rem + 14px); }
.mastery { display: grid; gap: 4px; }
.mbar { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; max-width: 420px; }
.mbar i { display: block; height: 100%; background: var(--muted); }
.mbar i.secure { background: var(--good); }
.mbar i.developing { background: var(--warn); }
.mbar i.revisit { background: var(--bad); }
.mtext { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.sm { padding: 6px 12px; font-size: .88rem; }
.btn.sm:not(.ghost) { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: var(--paper); }
.btn.sm.ghost { border-color: var(--c, var(--ink)); color: var(--c, var(--ink)); }
.howto { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 16px; max-width: 64ch; font-size: .95rem; }
.tnum { font-variant-numeric: tabular-nums; }
.mline { color: var(--muted); font-size: .95rem; }
.link.danger { color: var(--bad); }
.mixed { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; }
.mixed p { color: var(--muted); font-size: .95rem; min-width: 0; flex: 1 1 260px; }

/* Buttons */
.btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 10px 18px; font-weight: 700; }
.btn:hover { opacity: .9; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: .92rem; }
.link:hover { color: var(--ink); text-decoration: underline; }

/* Quiz */
.qbar { display: grid; gap: 10px; margin-bottom: 20px; }
.qbar-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.progress { height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--c); width: 0; transition: width .3s ease; }
.tally { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 28px); display: grid; gap: 18px; }
.qhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.qtext { font-size: 1.15rem; font-weight: 700; line-height: 1.45; }
.options { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: start; text-align: left; background: transparent; border: 1.5px solid var(--rule); border-radius: 9px; padding: 11px 12px; }
.opt:hover:not(:disabled) { border-color: var(--c); }
.opt:disabled { cursor: default; }
.opt .key { font-family: var(--f-mono); font-weight: 500; width: 1.7rem; height: 1.7rem; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--rule); font-size: .85rem; }
.opt span:last-child { min-width: 0; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .key { background: var(--good); color: var(--paper); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: var(--paper); border-color: var(--bad); }
.opt.dim { opacity: .55; }
.why { border-left: 4px solid var(--fb); background: color-mix(in srgb, var(--fb) 8%, transparent); padding: 12px 14px; border-radius: 0 8px 8px 0; display: grid; gap: 4px; }
.why strong { color: var(--fb); font-family: var(--f-display); }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hint { font-size: .82rem; color: var(--muted); }

/* Results */
.result-head { display: grid; gap: 6px; }
.score { font-family: var(--f-display); font-weight: 800; font-size: clamp(3rem, 12vw, 4.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .35em; color: var(--muted); font-weight: 500; }
.band { justify-self: start; font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.band.secure { color: var(--good); background: var(--good-bg); }
.band.developing { color: var(--warn); background: var(--warn-bg); }
.band.revisit { color: var(--bad); background: var(--bad-bg); }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.review li { border-top: 1px solid var(--rule); padding-top: 12px; display: grid; gap: 4px; }
.review .ans { font-size: .93rem; }
.review .ans b { color: var(--good); }
.review .ans s { color: var(--bad); }
.review .exp { color: var(--muted); font-size: .93rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.note { margin-top: 28px; font-size: .85rem; color: var(--muted); max-width: 62ch; }
@media (max-width: 520px) {
  .unit-head { grid-template-columns: 2.4rem 1fr; gap: 10px; }
  .unit-body { padding-left: 0; }
  .unit-meta { grid-column: 2; justify-items: start; grid-auto-flow: column; justify-content: start; gap: 10px; }
  .unit-no { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const STRANDS = { Biology: "var(--bio)", Chemistry: "var(--chem)", Physics: "var(--phys)" };

/* Question bank. Each question: c = concept, q = question, o = options (correct answer first; shuffled on screen), e = explanation.
   Questions are only ever appended to a unit, so ids (unit-index) used for mastery tracking stay stable. */
const UNITS = [
{ n: 1, title: "Plants", strand: "Biology", topics: "Photosynthesis, testing leaves for starch, leaf structure, water and minerals, roots",
  qs: [
  { c: "Where plant mass comes from", q: "A seedling with a mass of 1 g grows into a plant with a mass of 500 g. Where did most of the extra mass come from?",
    o: ["Carbon dioxide from the air and water, turned into glucose by photosynthesis","Soil taken in through the roots, which is why pots of soil slowly lose mass","Energy from sunlight, which is turned into matter inside the leaves","Minerals such as nitrates, which are absorbed from the soil in large amounts"],
    e: "Photosynthesis builds glucose from carbon dioxide and water, and glucose is used to make the rest of the plant. The soil supplies only small amounts of minerals. Light provides energy, not mass." },
  { c: "Photosynthesis equation", q: "Which word equation correctly describes photosynthesis?",
    o: ["carbon dioxide + water → glucose + oxygen (using light and chlorophyll)","glucose + oxygen → carbon dioxide + water (using light)","oxygen + water → glucose + carbon dioxide (using chlorophyll)","carbon dioxide + oxygen → glucose + water (using light)"],
    e: "The reactants are carbon dioxide and water. Light energy is absorbed by chlorophyll, and the products are glucose and oxygen. The reverse equation is respiration." },
  { c: "Why test for starch", q: "When we want to know whether a leaf has been photosynthesising, why do we test it for starch rather than for glucose?",
    o: ["Glucose made in the leaf is quickly turned into starch for storage","Iodine reacts with glucose only when it has been heated in a water bath","Leaves store all their glucose in the roots, so none is left to detect","Starch is made first in photosynthesis and only later turned into glucose"],
    e: "Glucose is soluble and is quickly converted into insoluble starch to be stored. Starch builds up in the leaf, so it is a reliable sign that photosynthesis has happened." },
  { c: "Destarching (controls)", q: "Before an experiment, a plant is kept in the dark for 48 hours. What is the purpose of this?",
    o: ["To use up its stored starch, so any starch found later was made in the experiment","To make the plant photosynthesise faster when it is put back in the light again","To kill the leaf cells so that the iodine solution can get into them later","To let the leaves build up extra chlorophyll before the experiment begins"],
    e: "In the dark the plant cannot photosynthesise, so it uses up its stored starch. Any starch found at the end must have been made during the experiment. This makes the test fair." },
  { c: "Chlorophyll is needed", q: "A variegated leaf has green parts and white parts. After a day in bright light it is tested with iodine. What result do you expect?",
    o: ["Only the green parts turn blue-black","The whole leaf turns blue-black","Only the white parts turn blue-black","No part turns blue-black, because variegated leaves cannot make starch"],
    e: "Only the green parts contain chlorophyll, which absorbs the light energy needed for photosynthesis. The white parts have no chlorophyll, so they make no starch and stay orange-brown." },
  { c: "Starch test method", q: "In the starch test, why is the leaf placed in hot ethanol before iodine is added?",
    o: ["To remove the green chlorophyll so the colour change can be seen clearly","To turn any glucose in the leaf into starch so that the iodine can detect it","To add the heat energy that iodine needs before it can react with starch","To soften the leaf so it absorbs more iodine solution in the final step"],
    e: "Ethanol dissolves chlorophyll and makes the leaf pale. Without this step, the green colour would hide the blue-black colour of iodine reacting with starch." },
  { c: "Light intensity and rate", q: "A student counts oxygen bubbles from pondweed with a lamp at different distances. Moving the lamp closer increases the number of bubbles per minute. Which conclusion is best?",
    o: ["The rate of photosynthesis increases as light intensity increases","Pondweed only photosynthesises when a lamp is very close","The bubbles are carbon dioxide, which increases with light","The pondweed respires faster when the lamp is closer"],
    e: "The bubbles are oxygen, a product of photosynthesis. A closer lamp means brighter light, so more bubbles means a faster rate. Light intensity is the independent variable in this investigation." },
  { c: "Leaf shape and function", q: "Most leaves are broad and thin. How does this help photosynthesis?",
    o: ["A large surface area absorbs plenty of light, and gases only have a short distance to diffuse","A thin leaf is light, so the stem can hold up more leaves without bending over","A broad leaf collects more rainwater, which is absorbed straight into the cells","A broad, thin leaf has room to store more starch in each of its cells"],
    e: "A broad leaf traps more light. A thin leaf means carbon dioxide can diffuse quickly from the air spaces to every cell that has chloroplasts." },
  { c: "Stomata", q: "Why are most stomata found on the lower surface of a leaf?",
    o: ["They let gases in and out while losing less water, because the lower surface is cooler and shaded","Light enters the leaf mainly through the lower surface, so gas exchange happens there","Water from the roots arrives at the lower surface and needs stomata to get out","The lower surface has more chlorophyll, so it needs the most carbon dioxide"],
    e: "Stomata let carbon dioxide in and oxygen out, but water vapour also escapes through them. The lower surface is cooler and out of direct sun, so less water is lost there." },
  { c: "Palisade cells", q: "Palisade cells are packed just below the upper surface of a leaf and contain many chloroplasts. Why is this a good arrangement?",
    o: ["They are in the position that receives the most light","They are closest to the stomata for taking in water","They protect the leaf from insects","They store all the minerals the leaf needs"],
    e: "Light falls on the upper surface, so cells placed there with many chloroplasts can absorb the most light for photosynthesis." },
  { c: "Root hair cells", q: "Root hair cells have a long, thin extension. What is the main advantage of this shape?",
    o: ["It gives a large surface area for absorbing water and minerals from the soil","It lets the root make glucose in the dark","It anchors the plant by growing into rocks","It allows the root to take in carbon dioxide for photosynthesis"],
    e: "A larger surface area in contact with the soil means water and dissolved minerals can be absorbed faster. Root hair cells have no chloroplasts because they are underground." },
  { c: "Minerals", q: "A plant has yellow leaves even though it has plenty of light and water. A lack of which mineral is most likely?",
    o: ["Magnesium, because it is needed to make chlorophyll","Glucose, because it is needed to make leaves","Oxygen, because it is needed for photosynthesis","Carbon, because it is needed to make roots"],
    e: "Chlorophyll molecules contain magnesium. Without enough magnesium the plant makes less chlorophyll and its leaves turn yellow. Nitrates are needed to make proteins for growth." },
  { c: "Plants also respire", q: "What is happening in a plant's leaves at night?",
    o: ["Respiration continues, using oxygen and releasing carbon dioxide","Nothing happens, because plants only respire while photosynthesis is happening","Photosynthesis continues slowly, using light energy stored during the day","The leaves take in carbon dioxide and give out oxygen, just as in daytime"],
    e: "All living cells respire all the time. In daylight, photosynthesis is usually faster than respiration so a plant gives out oxygen overall. At night only respiration happens, so the plant gives out carbon dioxide." },
  { c: "Carbon dioxide is needed", q: "A destarched plant has one leaf sealed in a flask with sodium hydroxide, which absorbs carbon dioxide. After a day in the light, that leaf has no starch but the other leaves do. What does this show?",
    o: ["Carbon dioxide is needed for photosynthesis","Sodium hydroxide blocks light, so the leaf in the flask could not photosynthesise","Leaves in a flask cannot get water, so they cannot photosynthesise","Sodium hydroxide destroys starch, so any starch made was broken down"],
    e: "The only difference for the sealed leaf is that it had no carbon dioxide. It made no starch, so carbon dioxide is needed. The other leaves act as the control." },
  { c: "Chloroplasts", q: "In which part of a leaf cell does photosynthesis take place?",
    o: ["Chloroplasts","Nucleus, which controls the cell","Cell wall, which faces the light","Vacuole, which holds the water used"],
    e: "Chloroplasts contain chlorophyll, which absorbs light. The reactions of photosynthesis happen inside them." },
  { c: "Role of chlorophyll", q: "What is the job of chlorophyll in photosynthesis?",
    o: ["It absorbs light energy","It provides the carbon dioxide","It stores the glucose that is made","It takes in water from the soil"],
    e: "Chlorophyll is a green pigment that absorbs light energy. The plant uses this energy to make glucose from carbon dioxide and water." },
  { c: "Energy transfer", q: "Which energy change takes place during photosynthesis?",
    o: ["Light energy is changed into chemical energy stored in glucose","Chemical energy in carbon dioxide is changed into light energy","Heat energy from the Sun is changed into kinetic energy in the leaf","Chemical energy in glucose is changed into heat and light energy"],
    e: "Photosynthesis stores energy from light in the glucose molecule. Respiration later releases this chemical energy." },
  { c: "Uses of glucose", q: "A plant uses some of its glucose to make cellulose. What is cellulose used for?",
    o: ["Building cell walls","Absorbing light","Carrying oxygen","Making chlorophyll directly"],
    e: "Glucose is used for respiration, stored as starch, and turned into cellulose for cell walls. With minerals, it is also used to make proteins." },
  { c: "Nitrates", q: "A plant grows very slowly and its older leaves turn yellow. A lack of nitrates is the cause. Why are nitrates needed?",
    o: ["To make proteins needed for growth","To make glucose in photosynthesis","To absorb light","To open the stomata"],
    e: "Plants combine nitrogen from nitrates with sugars to make proteins. Without proteins, new cells cannot be made, so growth is poor." },
  { c: "Fertilisers", q: "Why do farmers add fertilisers to fields?",
    o: ["To replace minerals that crops have taken from the soil","To give the plants extra carbon dioxide so they photosynthesise faster","To provide glucose that the roots can absorb when photosynthesis is slow","To kill insects and weeds that compete with the crop for light"],
    e: "When crops are harvested, the minerals in them are removed from the field. Fertilisers containing nitrogen, phosphorus and potassium replace them." },
  { c: "Minerals are dissolved", q: "Why can a plant not take in minerals from very dry soil, even if the soil contains plenty of them?",
    o: ["Minerals are absorbed dissolved in water, so without water they cannot get into the roots","Minerals are only made in the soil when it rains, so dry soil has none","Dry soil blocks oxygen from the roots, so the root cells all die at once","Roots only absorb minerals at night, when the soil has cooled down"],
    e: "Root hair cells take up minerals as ions dissolved in soil water. No water means no route in for the minerals." },
  { c: "Xylem", q: "What is the job of xylem vessels in a plant?",
    o: ["Carrying water and minerals up from the roots to the leaves","Carrying glucose down from the leaves to the roots","Absorbing light for photosynthesis","Letting gases in and out of the leaf"],
    e: "Xylem vessels are long, hollow tubes that run from the roots, through the stem, to every leaf." },
  { c: "Celery experiment", q: "A stick of celery is left in water with red dye. Later, red dots appear when the stem is cut across. What does this show?",
    o: ["Water travels up the stem in particular tubes (xylem)","The celery is making red pigment","Water travels through every cell in the stem equally","The dye is being photosynthesised"],
    e: "The dye only colours the xylem vessels, which shows the route water takes through the plant." },
  { c: "Transpiration", q: "Water evaporates from the leaves and escapes through the stomata. How does this help the plant?",
    o: ["It pulls water and minerals up the xylem from the roots","It makes glucose in the leaf by turning the water vapour into sugar","It lets the plant get rid of oxygen produced in the roots overnight","It stops the roots absorbing too much water when the soil is very wet"],
    e: "As water is lost from leaves, more is drawn up to replace it, like drinking through a straw. This flow also carries minerals." },
  { c: "Wilting", q: "A plant in a pot wilts on a hot, sunny afternoon. Why?",
    o: ["It is losing water from its leaves faster than its roots can absorb it","It is making so much glucose that the stem becomes too heavy to stand","The bright sunlight has destroyed the chlorophyll in all of its leaves","It is absorbing too many minerals, which makes the leaves go soft"],
    e: "Cells that are full of water keep the plant firm. When more water is lost than taken in, the cells go soft and the plant droops." },
  { c: "Closing stomata", q: "In very dry conditions, a plant closes its stomata. What is the disadvantage of this?",
    o: ["Less carbon dioxide can enter, so photosynthesis slows down","The plant loses more water, because it can no longer cool itself down","The roots stop growing, because no oxygen can reach them through the leaves","Light can no longer reach the chloroplasts once the stomata are closed"],
    e: "Closing stomata saves water but also blocks gas exchange. The plant has a trade-off between saving water and photosynthesising." },
  { c: "Waxy cuticle", q: "The upper surface of many leaves is covered in a thin, clear, waxy layer. Why is it useful that it is clear?",
    o: ["Light can pass through it to reach the palisade cells","It lets carbon dioxide pass through it into the palisade cells","It makes the leaf shiny, which attracts insects for pollination","It stores starch made in the cells just beneath it"],
    e: "The wax reduces water loss by evaporation. Because it is transparent, light still reaches the cells that photosynthesise." },
  { c: "Air spaces", q: "Why does the spongy layer of a leaf have many air spaces?",
    o: ["So gases can diffuse easily to and from the cells","To store water so the leaf survives dry periods","To make the leaf lighter so it can float on air","To hold the starch made by the palisade cells"],
    e: "Carbon dioxide entering through the stomata spreads through the air spaces to reach the photosynthesising cells. Oxygen leaves the same way." },
  { c: "Greenhouses", q: "Some greenhouse growers burn a heater that releases carbon dioxide. Why does this increase their crop?",
    o: ["Extra carbon dioxide and warmth increase the rate of photosynthesis","The heater gives out extra light, so photosynthesis can continue at night","The carbon dioxide kills insect pests, so fewer leaves are eaten","The smoke from the heater contains minerals that the leaves absorb"],
    e: "Carbon dioxide is a raw material of photosynthesis. Warmth helps the enzymes involved. Both can make the rate faster." },
  { c: "Limiting factors", q: "Pondweed is in very bright light. Making the light even brighter does not increase the bubble rate. What is the best explanation?",
    o: ["Something else, such as carbon dioxide or temperature, is now limiting the rate","Photosynthesis has stopped, because the plant has made enough glucose","Bright light damages the pondweed, so it stops releasing oxygen","The pondweed has run out of chlorophyll, so no more light is absorbed"],
    e: "The rate is held back by whichever factor is in shortest supply. Once light is plentiful, adding more makes no difference." },
  { c: "Temperature", q: "How does temperature affect the rate of photosynthesis?",
    o: ["The rate rises as it gets warmer up to an optimum, then falls if it gets too hot","The rate keeps rising as temperature rises, however hot it gets","Temperature has no effect on the rate; only light and carbon dioxide do","The rate is fastest at low temperatures, because enzymes are protected"],
    e: "Photosynthesis is controlled by enzymes. They work faster when warmer, but very high temperatures damage them." },
  { c: "Fair test with a lamp", q: "In a pondweed experiment, a lamp is moved closer. Why should a beaker of water (heat shield) be put between the lamp and the pondweed?",
    o: ["The lamp also gives out heat, and temperature must be kept the same","The water makes the light brighter by focusing it onto the pondweed","The water adds dissolved carbon dioxide to the pondweed's beaker","The water stops the pondweed respiring, so only photosynthesis is measured"],
    e: "Only light intensity should change. If the water warms up, you cannot tell whether light or temperature caused the change." },
  { c: "Testing for oxygen", q: "How could you show that the gas given off by pondweed in light is oxygen?",
    o: ["It relights a glowing splint","It turns limewater milky","It makes a lighted splint pop","It turns iodine blue-black"],
    e: "Oxygen relights a glowing splint. Carbon dioxide turns limewater milky, and hydrogen gives a squeaky pop." },
  { c: "Producers", q: "Why are green plants called producers?",
    o: ["They make their own food using light energy","They produce the carbon dioxide that animals need","They are eaten by more animals than anything else","They produce seeds, which grow into new plants"],
    e: "Plants make glucose by photosynthesis. Almost every food chain starts with a producer, so energy from the Sun enters food chains through plants." },
  { c: "Roots have no chloroplasts", q: "Root hair cells do not contain chloroplasts. Why?",
    o: ["They are underground, where there is no light for photosynthesis","Roots make their glucose in a different way that does not need chloroplasts","Chloroplasts would block water from entering the root hair cells","Roots get chlorophyll directly from the soil, so they do not need chloroplasts"],
    e: "Chloroplasts would be useless without light. Root cells get their glucose from the leaves instead." },
  { c: "Blocking stomata", q: "Petroleum jelly is smeared on the lower surface of a destarched leaf, then the plant is put in the light. The leaf makes very little starch. Why?",
    o: ["The jelly blocked the stomata, so carbon dioxide could not enter","The jelly blocked light from reaching the chloroplasts in the leaf","The jelly stopped water reaching the leaf through the veins","The jelly killed the chlorophyll, so no light could be absorbed"],
    e: "Most stomata are on the lower surface. Blocking them stops carbon dioxide getting in, so photosynthesis cannot happen." },
  { c: "Stomata in daylight", q: "Why are most stomata open during the day?",
    o: ["To let carbon dioxide in for photosynthesis","To let light into the leaf for photosynthesis","To let glucose leave the leaf for the roots","To let water vapour in from the damp air"],
    e: "Photosynthesis happens in the light, so this is when the leaf needs carbon dioxide. Many plants close their stomata at night to save water." },
  { c: "Minerals from soil", q: "A plant grows in washed sand watered with pure distilled water. It grows poorly even with good light. Why?",
    o: ["It has no source of minerals","It has no source of carbon dioxide","Sand blocks light from the leaves","Distilled water cannot be absorbed"],
    e: "Light, water and carbon dioxide allow photosynthesis, but the plant still needs minerals such as nitrates and magnesium to grow healthily." },
  { c: "Oxygen over a day", q: "A plant is kept in a sealed glass jar in bright light for a day. What happens to the amount of oxygen in the jar?",
    o: ["It increases, because photosynthesis is faster than respiration","It decreases, because the plant respires","It stays the same, because plants do not exchange gases","It falls to zero"],
    e: "In bright light the plant produces oxygen by photosynthesis faster than it uses oxygen in respiration." },
  { c: "Comparing day and night", q: "Which statement about a plant is true?",
    o: ["It photosynthesises only in the light but respires all the time","It respires only in the dark and photosynthesises all the time","It photosynthesises and respires only in the light","It never respires because it photosynthesises"],
    e: "Photosynthesis needs light. Respiration releases energy for the cells and never stops while the plant is alive." }
  ]},
{ n: 2, title: "Food and digestion", strand: "Biology", topics: "Nutrients, a balanced diet, deficiency diseases, the digestive system, enzymes, absorption",
  qs: [
  { c: "Why digest food", q: "Why must large food molecules such as starch and protein be digested?",
    o: ["They are too large to pass through the wall of the small intestine into the blood","They contain no energy until enzymes have broken them into smaller pieces","They would dissolve the wall of the intestine if they were left undigested","The body can only use molecules that have first been mixed with water"],
    e: "Digestion breaks large, insoluble molecules into small, soluble molecules. Only small molecules can be absorbed through the gut wall into the blood." },
  { c: "Mechanical digestion", q: "How does chewing food help digestion?",
    o: ["It breaks food into smaller pieces, giving enzymes a larger surface area to work on","It turns starch into sugar by crushing the starch molecules between the teeth","It breaks proteins into amino acids, which can then be absorbed straight away","It warms the food to body temperature so the enzymes in saliva can start"],
    e: "Chewing is mechanical digestion. It does not change the molecules, but smaller pieces have more surface for enzymes to act on, so chemical digestion is faster." },
  { c: "Enzyme products", q: "What are proteins broken down into during digestion?",
    o: ["Amino acids","Glucose","Fatty acids and glycerol","Vitamins"],
    e: "Protease enzymes break proteins into amino acids. Carbohydrase enzymes such as amylase break starch into sugars. Lipase breaks fats into fatty acids and glycerol." },
  { c: "Enzymes and temperature", q: "Amylase is mixed with starch at 5 °C, 37 °C and 90 °C. In which tube is starch digested fastest?",
    o: ["37 °C, because human enzymes work best at about body temperature","90 °C, because higher temperatures always make reactions faster","5 °C, because enzymes are protected from damage","All three, because temperature does not affect enzymes"],
    e: "Enzymes work fastest near their optimum temperature, which is about 37 °C for human enzymes. At 5 °C they work slowly. At 90 °C their shape is permanently changed (denatured), so they stop working." },
  { c: "Villi", q: "The small intestine is lined with millions of villi. How do they help?",
    o: ["They give a huge surface area, with thin walls and a rich blood supply","They grind the food into smaller pieces so that enzymes can reach it","They produce stomach acid that kills bacteria before food is absorbed","They beat like tiny hairs, pushing food along to the large intestine"],
    e: "Villi make the inner surface of the small intestine very large. Each one has a thin wall and many capillaries, so digested food can diffuse into the blood quickly." },
  { c: "Fibre", q: "Fibre is not digested and does not enter the blood. Why is it still an important part of a balanced diet?",
    o: ["It adds bulk that helps food move through the gut and prevents constipation","It is the body's main source of energy, because it is digested slowly","It is needed to build new muscle cells after they have been damaged","It is changed into vitamins by bacteria in the large intestine"],
    e: "Fibre gives the muscles of the intestine something to push against, which keeps food moving and prevents constipation." },
  { c: "Balanced diet depends on need", q: "Which person most needs a diet with more energy-rich food?",
    o: ["A teenage athlete who trains for two hours each day","An adult who works at a desk all day","An elderly person who rarely exercises","Everyone needs exactly the same amount of energy"],
    e: "A balanced diet depends on age, sex and how active a person is. Active, growing people use more energy and need more carbohydrate and fat." },
  { c: "Rickets", q: "A child has soft, weak leg bones that bend. Which deficiency is the most likely cause?",
    o: ["Too little vitamin D or calcium","Too little vitamin C or protein","Too little iron or haemoglobin","Too little fibre or water"],
    e: "Calcium is needed to build strong bones, and vitamin D helps the body absorb calcium. A lack of either causes rickets. Lack of vitamin C causes scurvy; lack of iron causes anaemia." },
  { c: "Anaemia", q: "Why does a person with iron-deficiency anaemia feel tired?",
    o: ["Iron is needed to make haemoglobin, so less oxygen is carried to cells for respiration","Iron is the main source of energy in the diet, so less energy is released","Iron is needed to digest carbohydrates, so less glucose reaches the blood","Iron keeps muscles strong, so a lack of it makes every movement harder"],
    e: "Haemoglobin in red blood cells carries oxygen and contains iron. With less haemoglobin, cells get less oxygen and release less energy by respiration." },
  { c: "Scurvy", q: "Sailors on long voyages long ago often got scurvy, with bleeding gums. Eating limes or oranges cured it. What does this show?",
    o: ["Scurvy is caused by a lack of vitamin C, which citrus fruits contain","Scurvy is caused by bacteria that citrus fruits kill","Sailors were short of protein, which citrus fruits contain","Sailors were eating too much fat"],
    e: "Citrus fruits are rich in vitamin C. Scurvy is a deficiency disease, so it is cured by supplying the missing nutrient." },
  { c: "Stomach acid", q: "What is one job of the hydrochloric acid in the stomach?",
    o: ["It kills most bacteria in food","It digests starch into glucose","It absorbs water from food","It turns fats into protein"],
    e: "Stomach acid kills many microorganisms in food. It also gives the right acidic conditions for the stomach's protease enzyme to work." },
  { c: "Large intestine", q: "What is the main job of the large intestine?",
    o: ["Absorbing water from undigested food","Digesting protein with enzymes","Absorbing most of the glucose into the blood","Storing food before it is digested"],
    e: "Most digested food is absorbed in the small intestine. The large intestine absorbs water from what is left. If food passes through too quickly, too little water is absorbed and diarrhoea results." },
  { c: "Energy in nutrients", q: "Why do people who need to lose weight often reduce the amount of fat they eat?",
    o: ["One gram of fat contains about twice as much energy as one gram of carbohydrate","Fat cannot be digested at all, so it stays in the body and builds up","Fat contains no useful nutrients, so cutting it out loses nothing","Fat is turned directly into muscle, which weighs more than fat"],
    e: "Fat is the most energy-dense nutrient. If energy taken in is more than energy used, the extra is stored as body fat. Some fat is still needed in a balanced diet." },
  { c: "Carbohydrates", q: "What is the main job of carbohydrates in the diet?",
    o: ["To provide energy","To build and repair cells","To prevent deficiency diseases","To help food move through the gut"],
    e: "Sugars and starch are the body's main fuel for respiration. Protein is for growth and repair; fibre keeps food moving." },
  { c: "Protein", q: "Why do growing children and people recovering from injury need plenty of protein?",
    o: ["Protein is used to build new cells and repair damaged tissue","Protein is the quickest source of energy, and healing uses a lot of energy","Protein is stored as body fat, which protects injured parts of the body","Protein absorbs water in the gut, which keeps the body's cells hydrated"],
    e: "Amino acids from protein are used to make new proteins for muscles, skin, enzymes and other tissues." },
  { c: "Fats", q: "Which is a job of fat in the body?",
    o: ["Storing energy and insulating the body","Carrying oxygen in the blood","Building strong bones and teeth","Digesting starch in the gut"],
    e: "Fat is a concentrated energy store. A layer under the skin helps reduce heat loss, and fat also protects some organs." },
  { c: "Water", q: "Why is water an essential part of the diet even though it contains no energy?",
    o: ["Most chemical reactions in the body happen in solution, and water transports substances","It is digested into glucose in the small intestine and used for respiration","It is needed to build bones, which are made mostly of hardened water","It provides the vitamins that keep the body healthy and free from disease"],
    e: "Cells are mostly water, blood plasma is mostly water and water is lost in sweat, urine and breath, so it must be replaced." },
  { c: "Starch test", q: "Iodine solution is added to a food and turns blue-black. What does this show?",
    o: ["Starch is present","Sugar is present","Protein is present","Fat is present"],
    e: "Iodine solution is orange-brown. It turns blue-black only if starch is present." },
  { c: "Sugar test", q: "Benedict's solution is added to a food solution and heated. It changes from blue to orange-red. What is present?",
    o: ["A sugar, such as glucose","Starch, such as in bread","Protein, such as in egg","Fat, such as in butter"],
    e: "Benedict's test needs heating. The more sugar there is, the further the colour goes from blue through green and yellow to orange-red." },
  { c: "Protein test", q: "Biuret solution is added to some egg white and turns purple. What does this show?",
    o: ["Protein is present","Starch is present","Glucose is present","Fat is present"],
    e: "Biuret solution is blue and turns purple (lilac) when protein is present. Egg white is rich in protein." },
  { c: "Fat test", q: "A food is rubbed on paper and leaves a see-through mark that does not dry. What does this suggest?",
    o: ["The food contains fat","The food contains water","The food contains starch","The food contains sugar"],
    e: "Water would leave a mark that dries and disappears. A translucent spot that stays shows fat." },
  { c: "Reading food labels", q: "Crisps contain 2200 kJ per 100 g. An apple contains 220 kJ per 100 g. What does this tell you?",
    o: ["The same mass of crisps provides ten times as much energy as apple","Apples contain almost no energy, so they cannot be used as food","A packet of crisps weighs ten times as much as an apple does","Apples are a better source of fat, so they keep you full for longer"],
    e: "Food labels compare foods per 100 g. Crisps are energy-dense because of their high fat content." },
  { c: "Malnutrition", q: "Which statement about malnutrition is correct?",
    o: ["It means eating the wrong balance of food, which includes eating too much","It only means not having enough food to eat, so it is a lack of energy","It only affects people in poor countries, where food is hard to find","It is caused by eating too many fruits and vegetables and not enough meat"],
    e: "Malnutrition is any unbalanced diet. Eating too much energy-rich food, leading to obesity, is also malnutrition." },
  { c: "Protein deficiency", q: "A child gets plenty of starchy food but very little protein. What is most likely to happen?",
    o: ["The child's growth will be poor","The child will get scurvy","The child will have too much energy","The child will get rickets"],
    e: "Without enough protein the body cannot build new tissue properly. Severe protein deficiency causes a disease called kwashiorkor." },
  { c: "Order of the gut", q: "Which order shows the path food takes?",
    o: ["Mouth → oesophagus → stomach → small intestine → large intestine","Mouth → stomach → oesophagus → large intestine → small intestine","Mouth → oesophagus → small intestine → stomach → large intestine","Mouth → stomach → small intestine → oesophagus → large intestine"],
    e: "The oesophagus carries food to the stomach. Digestion finishes and absorption happens in the small intestine. Water is absorbed in the large intestine." },
  { c: "Peristalsis", q: "Astronauts can swallow food in space, and you can swallow while upside down. Why?",
    o: ["Muscles in the gut wall squeeze food along; gravity is not needed","Food is sucked down the oesophagus by the lungs when you breathe in","Saliva makes food sticky, so it slides down whichever way you face","Food is always pulled towards the stomach by a magnet-like force"],
    e: "Waves of muscle contraction, called peristalsis, push food through the gut in one direction." },
  { c: "Bile", q: "Bile is made in the liver and released into the small intestine. What does it do to fats?",
    o: ["It breaks fat into small droplets, giving a larger surface area for enzymes","It digests fat into fatty acids and glycerol, just like an enzyme","It turns fat into protein so that it can be used for growth","It absorbs fat into the blood through the wall of the intestine"],
    e: "Bile is not an enzyme. It physically splits large fat globules into tiny droplets so that lipase can work faster." },
  { c: "Pancreas", q: "What does the pancreas contribute to digestion?",
    o: ["It releases several digestive enzymes into the small intestine","It absorbs digested food from the small intestine into the blood","It stores bile and releases it whenever fatty food arrives","It produces the hydrochloric acid that kills bacteria in the stomach"],
    e: "The pancreas makes enzymes that digest starch, protein and fat. They flow into the small intestine." },
  { c: "Saliva", q: "If you chew a piece of bread for a long time, it starts to taste sweet. Why?",
    o: ["Amylase in saliva is breaking starch down into sugar","Saliva contains sugar","Bread turns into sugar when it is warm","Chewing makes your taste buds more sensitive"],
    e: "Saliva contains the enzyme amylase. It begins the digestion of starch in the mouth." },
  { c: "Enzymes as catalysts", q: "Which statement about enzymes is correct?",
    o: ["They speed up reactions and are not used up","They are a type of food","They are used up in the reactions they speed up","They are only found in the stomach"],
    e: "Enzymes are biological catalysts made of protein. One enzyme molecule can be used again and again." },
  { c: "Enzymes are specific", q: "Amylase is added to a mixture of starch and protein. What happens?",
    o: ["Only the starch is digested","Both starch and protein are digested","Only the protein is digested","Neither is digested"],
    e: "Each enzyme works on one type of molecule. Its shape only fits that molecule, like a key fits one lock." },
  { c: "Visking tubing model", q: "Starch and glucose solution is put inside a bag of Visking tubing, standing in water. Later the water outside contains glucose but not starch. What does this model show?",
    o: ["Small molecules can pass through the gut wall but large molecules cannot","Starch is digested by water, so it disappears from inside the bag","Glucose is made from starch when it touches the water outside the bag","The tubing absorbs starch into its walls and lets only glucose stay"],
    e: "The tubing acts like the wall of the small intestine. Only small molecules fit through its tiny holes, which is why food must be digested." },
  { c: "Digestion vs absorption", q: "What is the difference between digestion and absorption?",
    o: ["Digestion breaks food into small molecules; absorption moves them into the blood","Digestion happens in the blood; absorption happens in the mouth","They are the same process, given two names in different textbooks","Absorption breaks food down; digestion moves it into body cells"],
    e: "First large molecules are digested, mainly in the mouth, stomach and small intestine. Then the small molecules are absorbed through the wall of the small intestine." },
  { c: "Assimilation", q: "After amino acids are absorbed, what happens to many of them?",
    o: ["They are carried to cells and built into new proteins","They are sent back to the gut and turned into food again","They are broken down in the lungs and breathed out","They are joined together and stored in the liver as starch"],
    e: "Using absorbed food molecules to build the body is called assimilation." },
  { c: "Teeth", q: "Which type of tooth is best for grinding food?",
    o: ["Molars","Incisors","Canines","All teeth grind equally"],
    e: "Incisors at the front cut and bite. Canines grip and tear. Molars and premolars at the back have broad surfaces for grinding." },
  { c: "Tooth decay", q: "Why do sugary snacks between meals increase tooth decay?",
    o: ["Bacteria on teeth feed on sugar and make acid that dissolves enamel","Sugar crystals are harder than enamel, so they scratch the teeth","Sugar stops saliva being made, so teeth dry out and crack","Sugar is itself a strong acid that dissolves the enamel"],
    e: "Every time you eat sugar, bacteria in plaque produce acid for a while. Frequent snacks keep teeth under acid attack for longer." },
  { c: "Energy balance", q: "A person regularly takes in more energy in food than they use. What will happen?",
    o: ["They will gain mass, as the extra energy is stored as fat","They will lose mass, because digesting extra food uses up energy","Nothing will happen, because extra energy is breathed out as heat","Their extra energy will be stored as vitamins in the liver"],
    e: "Energy in that is greater than energy out leads to weight gain. Energy out that is greater than energy in leads to weight loss." },
  { c: "Vitamins and minerals", q: "Vitamins and minerals are needed only in small amounts. What is their role?",
    o: ["They keep the body healthy and help it work properly, but do not provide energy","They are the main source of energy, because they are needed every day","They are used to build most of the body's muscle and other tissues","They add bulk to food, which helps it move through the gut"],
    e: "Small amounts are essential. A lack of one causes a specific deficiency disease, such as scurvy or rickets." },
  { c: "Glucose needs no digestion", q: "Why does a glucose drink give an athlete energy very quickly?",
    o: ["Glucose is already a small molecule, so it can be absorbed without being digested","Glucose is digested in the mouth by saliva, before it reaches the stomach","Glucose contains more energy per gram than any other food, including fat","Glucose goes straight to the muscles from the stomach without entering blood"],
    e: "Starch has to be broken down into sugars first. Glucose is absorbed directly from the small intestine into the blood." },
  { c: "Egestion", q: "What happens to the undigested food left at the end of the large intestine?",
    o: ["It leaves the body as faeces through the anus (egestion)","It is absorbed into the blood through the wall of the rectum","It is carried to the liver, where it is digested a second time","It is stored in the large intestine and used when food runs out"],
    e: "Food that is never digested, such as fibre, passes out of the body. Removing it is called egestion." }
  ]},
{ n: 3, title: "The circulatory system", strand: "Biology", topics: "The heart, double circulation, arteries, veins and capillaries, blood",
  qs: [
  { c: "Artery structure", q: "Why do arteries have thick walls containing muscle and elastic tissue?",
    o: ["They carry blood at high pressure, pumped directly from the heart","They carry blood at very low pressure back to the heart","They need to let substances diffuse through their walls","They store blood when the body is resting"],
    e: "Each heartbeat pushes blood into the arteries at high pressure. Thick, stretchy walls withstand this pressure and help smooth out the flow." },
  { c: "Valves in veins", q: "Veins contain valves but arteries (apart from where they leave the heart) do not. Why?",
    o: ["Blood in veins is at low pressure, so valves stop it flowing backwards","Valves make blood in veins move faster than in arteries","Valves let oxygen into the blood in veins","Veins carry blood away from the heart and need valves to push it"],
    e: "By the time blood reaches the veins, its pressure is low. Valves make sure it only flows towards the heart, especially in the legs." },
  { c: "Capillaries", q: "Capillary walls are only one cell thick. Why is this important?",
    o: ["Substances such as oxygen and glucose can diffuse quickly between blood and cells","Blood can flow through them at very high pressure without bursting","They can contract to help the heart pump blood around the body","Thin walls stop white blood cells from leaving the blood"],
    e: "Capillaries are where exchange happens. A very thin wall means only a short distance for diffusion between the blood and the body's cells." },
  { c: "Ventricle walls", q: "The wall of the left ventricle is much thicker than the wall of the right ventricle. Why?",
    o: ["The left ventricle pumps blood all around the body, but the right only pumps to the lungs","The left ventricle holds deoxygenated blood, which is heavier to pump","The right ventricle does not need to pump, because blood flows to the lungs by itself","The left ventricle receives blood from the lungs at very high pressure"],
    e: "Pushing blood around the whole body needs a much higher pressure than pushing it to the nearby lungs, so the left ventricle has more muscle." },
  { c: "Arteries defined by direction", q: "The pulmonary artery carries deoxygenated blood. Why is it still called an artery?",
    o: ["Arteries are vessels that carry blood away from the heart","Arteries are vessels that carry deoxygenated blood","All vessels connected to the lungs are arteries","It has valves along its length"],
    e: "Arteries carry blood away from the heart and veins carry it back. The pulmonary artery takes deoxygenated blood from the heart to the lungs. The pulmonary vein brings oxygenated blood back." },
  { c: "Double circulation", q: "Which route does blood take in the human double circulation, starting from the body?",
    o: ["Body → right side of heart → lungs → left side of heart → body","Body → left side of heart → lungs → right side of heart → body","Body → lungs → right side of heart → left side of heart → body","Body → right side of heart → left side of heart → lungs → body"],
    e: "Blood passes through the heart twice in one full circuit. The right side sends it to the lungs to collect oxygen. It returns to the left side, which pumps it around the body." },
  { c: "Red blood cells", q: "Red blood cells have no nucleus. How does this help them do their job?",
    o: ["There is more space for haemoglobin, so each cell can carry more oxygen","It lets them squeeze through capillaries and destroy bacteria more easily","It allows them to divide quickly to make new red blood cells","It helps them stick together and form blood clots at a cut"],
    e: "Red blood cells are packed with haemoglobin, which carries oxygen. Their biconcave disc shape also gives a large surface area for oxygen to diffuse in and out." },
  { c: "Plasma", q: "Which list shows substances carried dissolved in the plasma?",
    o: ["Glucose, carbon dioxide, urea and hormones","Oxygen, haemoglobin and platelets","Red blood cells and white blood cells","Starch, protein and fat molecules"],
    e: "Plasma is the liquid part of blood. It carries digested food such as glucose, waste such as carbon dioxide and urea, and hormones. Most oxygen is carried by haemoglobin in red cells." },
  { c: "Platelets", q: "You cut your finger. Which part of the blood helps stop the bleeding?",
    o: ["Platelets, which help form a clot","Red blood cells, which carry oxygen to the cut","Plasma, which washes the cut clean","White blood cells, which seal the skin"],
    e: "Platelets are cell fragments that help blood clot. The clot seals the wound and stops blood loss and microorganisms entering." },
  { c: "White blood cells", q: "What is the main job of white blood cells?",
    o: ["Defending the body against bacteria and viruses","Carrying oxygen from the lungs to every body cell","Carrying digested food from the gut to the cells","Helping the blood to clot when the skin is cut"],
    e: "Some white blood cells engulf pathogens. Others make antibodies that help destroy them." },
  { c: "Heart rate and exercise", q: "Why does your heart rate increase when you exercise?",
    o: ["Muscles need oxygen and glucose faster, and carbon dioxide removed","The heart needs to pump faster to cool the body down","Blood becomes thicker during exercise, so it needs more pushing","The lungs stop working during exercise, so the heart takes over"],
    e: "Working muscles respire faster. A faster heartbeat delivers more oxygen and glucose to them and removes carbon dioxide more quickly." },
  { c: "Coronary arteries", q: "A fatty blockage forms in a coronary artery. Why can this cause a heart attack?",
    o: ["Part of the heart muscle does not get enough oxygen and glucose, so it stops working","Blood can no longer reach the lungs, so no oxygen gets into the body","The heart chambers fill with fat, so they can no longer hold blood","The valves in the heart can no longer close, so blood flows backwards"],
    e: "Heart muscle has its own blood supply through the coronary arteries. If this is blocked, the muscle cannot respire and that part of the heart can die." },
  { c: "Pulmonary vein", q: "Where does the pulmonary vein carry blood, and what kind of blood is it?",
    o: ["From the lungs to the heart; oxygenated blood","From the heart to the lungs; deoxygenated blood","From the body to the heart; deoxygenated blood","From the heart to the body; oxygenated blood"],
    e: "Veins carry blood towards the heart. The pulmonary vein brings blood that has just collected oxygen in the lungs back to the left atrium." },
  { c: "Job of the circulatory system", q: "What is the main job of the circulatory system?",
    o: ["To carry oxygen, food and waste around the body","To digest food and absorb the nutrients from it","To take air into the lungs and push it out again","To make new cells and repair damaged tissues"],
    e: "Blood is pumped through vessels to reach every cell, bringing what cells need and taking away what they produce." },
  { c: "Heart chambers", q: "What is the role of the atria in the heart?",
    o: ["They receive blood coming into the heart","They pump blood all around the body","They stop the heart from beating too fast","They carry blood to the lungs"],
    e: "The two atria at the top receive blood from veins and pass it to the ventricles. The muscular ventricles pump blood out." },
  { c: "Heart valves", q: "What do the valves inside the heart do?",
    o: ["They stop blood flowing backwards","They pump blood into the arteries","They add oxygen to the blood","They make the blood clot"],
    e: "Valves open to let blood through, then close so it cannot flow back the wrong way. The sound of them closing is the heartbeat you hear." },
  { c: "Septum", q: "What is the importance of the septum, the wall dividing the left and right sides of the heart?",
    o: ["It keeps the two types of blood apart","It pumps blood into the lungs","It produces new red blood cells","It controls how fast the heart beats"],
    e: "If the two types of blood mixed, the blood going to the body would carry less oxygen." },
  { c: "Hole in the heart", q: "A baby is born with a hole in the septum. Why might the baby get tired easily?",
    o: ["Some deoxygenated blood mixes with oxygenated blood, so less oxygen reaches the body","The heart cannot beat at all, so blood only moves when the baby moves","Blood stops going to the lungs, so it never collects any oxygen","The blood leaks out of the heart and cannot carry glucose to cells"],
    e: "Mixing lowers the amount of oxygen in blood pumped to the body, so cells cannot respire as well." },
  { c: "Vena cava", q: "Blood returning from the body enters the heart through the vena cava. Which chamber does it enter?",
    o: ["The right atrium","The left atrium","The left ventricle","The right ventricle"],
    e: "Deoxygenated blood from the body enters the right side of the heart, ready to be pumped to the lungs." },
  { c: "Aorta", q: "Which blood vessel carries blood from the left ventricle to the body?",
    o: ["The aorta","The vena cava","The pulmonary artery","The pulmonary vein"],
    e: "The aorta is the largest artery. It carries oxygenated blood at high pressure from the left ventricle." },
  { c: "Blood colour", q: "Drawings often show deoxygenated blood in blue. What colour is it really?",
    o: ["Dark red","Blue","Green","Colourless"],
    e: "Oxygenated blood is bright red and deoxygenated blood is dark red. Blue is only used in diagrams, and veins look blue through skin." },
  { c: "Pulse", q: "When you feel a pulse in your wrist, what are you detecting?",
    o: ["A surge of blood stretching an artery each time the heart beats","Blood flowing slowly through a vein just under the skin","The heart itself moving down the arm to the wrist","Air bubbles moving through the blood with each breath"],
    e: "Each heartbeat pushes blood into the arteries. The stretch travels along the artery and can be felt where it is near the skin." },
  { c: "Measuring pulse rate", q: "You count 18 pulse beats in 15 seconds. What is the pulse rate in beats per minute?",
    o: ["72","18","33","270"],
    e: "There are four lots of 15 seconds in a minute: 18 × 4 = 72 beats per minute." },
  { c: "Recovery time", q: "Two students run the same distance. Student A's pulse returns to normal in 2 minutes; student B's takes 6 minutes. What does this suggest?",
    o: ["Student A is probably fitter","Student B is probably fitter","Student A's heart is weaker","Both are equally fit"],
    e: "A fitter person's heart and lungs supply oxygen more efficiently, so they recover more quickly." },
  { c: "Athletes' resting heart rate", q: "Trained athletes often have a lower resting heart rate than other people. Why?",
    o: ["Their stronger heart pumps more blood with each beat","Their muscles need no oxygen at all when they are resting","Their blood carries no carbon dioxide, so less needs removing","Their heart has fewer chambers, so each beat takes longer"],
    e: "If each beat pumps more blood, fewer beats per minute are needed to supply the same amount." },
  { c: "Capillary networks", q: "Why is there a capillary close to almost every cell in the body?",
    o: ["So that substances only diffuse a short distance","To hold each cell firmly in place in the tissue","To keep every cell warm at body temperature","To produce new blood cells wherever needed"],
    e: "Diffusion is only fast over short distances. A dense network of capillaries makes sure every cell is supplied." },
  { c: "Lumen of veins", q: "Veins have a wider lumen (space inside) than arteries. How does this help?",
    o: ["It lets low-pressure blood flow back to the heart easily","It lets veins hold blood at very high pressure","It lets substances diffuse out through the wall","It lets the vein contract and pump blood itself"],
    e: "Blood pressure in veins is low, so a wide passage reduces resistance to flow." },
  { c: "Muscles help veins", q: "Why can standing still for a very long time make your feet swell or make you feel faint?",
    o: ["Leg muscles are not squeezing the veins, so blood returns slowly","The heart stops pumping when you stand still for a long time","Arteries close up when you stand, so blood cannot reach the feet","Blood starts to turn solid in the legs after a few minutes"],
    e: "When you move, muscles squeeze the veins and, with the valves, push blood upwards. Without this, blood collects in the legs." },
  { c: "Hormones in blood", q: "When you are frightened, adrenaline from a gland near the kidneys makes your heart beat faster. How does adrenaline reach the heart?",
    o: ["It is carried dissolved in the blood plasma","It travels along nerves","It is carried by red blood cells","It diffuses through the body tissues"],
    e: "Hormones are chemical messengers carried in the plasma." },
  { c: "Heat transport", q: "Blood also transports heat. Why is this useful?",
    o: ["Heat from active organs is spread around the body, keeping it at an even temperature","It lets blood warm up food in the stomach so that it digests faster","Heat makes blood flow faster, so it reaches the cells sooner","Warm blood cannot clot, so it never blocks the blood vessels"],
    e: "Muscles and the liver produce a lot of heat. Blood carries it to other parts and to the skin, where it can be lost." },
  { c: "Haemoglobin", q: "Haemoglobin picks up oxygen in the lungs. Where does it release it?",
    o: ["In body tissues where the oxygen concentration is low","In the heart, which needs the most oxygen","In the lungs, straight after picking it up","In the small intestine, to help digest food"],
    e: "Haemoglobin combines with oxygen where oxygen is plentiful and releases it where oxygen is scarce, such as in respiring muscles." },
  { c: "Advantage of double circulation", q: "Why is it useful that blood returns to the heart after going through the lungs?",
    o: ["The heart can pump it again at high pressure to reach the whole body","It needs to collect more carbon dioxide from the heart before going to the body","The lungs have no other blood vessels that blood could leave through","The heart cools the blood down after it has been warmed in the lungs"],
    e: "Blood loses pressure going through the lung capillaries. Pumping it again means it reaches the body quickly." },
  { c: "Heart disease risks", q: "Which lifestyle is most likely to increase the risk of heart disease?",
    o: ["Smoking, eating lots of saturated fat and taking little exercise","Eating plenty of vegetables and exercising regularly","Drinking plenty of water","Getting enough sleep"],
    e: "Smoking and a high-fat diet help fatty deposits build up in arteries. Exercise strengthens the heart." },
  { c: "First vessel from the left ventricle", q: "Trace the blood: it leaves the left ventricle. Where does it go next?",
    o: ["Into the aorta, to the body","Into the pulmonary artery, to the lungs","Into the right ventricle","Into the vena cava"],
    e: "The left side of the heart sends oxygenated blood to the body through the aorta." },
  { c: "Collecting digested food", q: "Where does blood pick up most of the digested food such as glucose and amino acids?",
    o: ["The small intestine","The lungs","The kidneys","The large intestine"],
    e: "The villi of the small intestine are full of capillaries that absorb digested food." },
  { c: "Removing urea", q: "Urea is a waste product carried by the blood. Which organ removes it?",
    o: ["The kidneys","The lungs","The heart","The stomach"],
    e: "The kidneys filter urea out of the blood, and it leaves the body in urine. The lungs remove carbon dioxide." },
  { c: "Flow in arteries vs veins", q: "If an artery is cut, blood spurts out. If a vein is cut, blood flows out steadily. Why?",
    o: ["Blood in arteries is under high pressure that rises with each heartbeat","Arteries contain more blood than veins, so more comes out at once","Veins hold only a little blood, so it trickles out slowly","Blood in arteries is thinner, so it squirts out more easily"],
    e: "Arteries carry blood straight from the heart, so it surges with each beat. Pressure in veins is low and steady." },
  { c: "Exercise effect", q: "Why does regular exercise help keep the heart healthy?",
    o: ["The heart muscle becomes stronger and arteries stay healthier","Exercise stops the heart needing oxygen","Exercise removes all fat from the blood permanently","It makes the heart grow extra chambers"],
    e: "Like other muscles, the heart gets stronger with use. Exercise also helps control body mass and blood pressure." },
  { c: "Blood components", q: "Which part of the blood makes up more than half its volume?",
    o: ["Plasma","Red blood cells","White blood cells","Platelets"],
    e: "Blood is about 55% plasma. Red cells make up most of the rest; white cells and platelets are a tiny fraction." },
  { c: "Oxygen and red cells", q: "People who live high up in mountains often have more red blood cells than people at sea level. Why is this useful?",
    o: ["Air there has less oxygen, so more red cells help carry enough oxygen","Mountain air contains more carbon dioxide, which red cells remove","They need extra red cells because their blood clots more often","Cold air destroys red cells, so the body makes extra to replace them"],
    e: "More red cells mean more haemoglobin, which helps collect enough oxygen from thinner air." }
  ]},
{ n: 4, title: "Respiration", strand: "Biology", topics: "Aerobic respiration, gas exchange, breathing, smoking and health",
  qs: [
  { c: "Respiration vs breathing", q: "Which statement correctly describes the difference between respiration and breathing?",
    o: ["Respiration releases energy in cells; breathing moves air in and out","They are two words for the same process of getting oxygen in","Breathing happens in all cells; respiration happens only in the lungs","Respiration is breathing out; breathing is taking in oxygen"],
    e: "Respiration happens in every living cell and releases energy from glucose. Breathing is the movement of air that supplies oxygen and removes carbon dioxide." },
  { c: "Respiration equation", q: "Which word equation shows aerobic respiration?",
    o: ["glucose + oxygen → carbon dioxide + water","carbon dioxide + water → glucose + oxygen","glucose + carbon dioxide → oxygen + water","oxygen + water → glucose + carbon dioxide"],
    e: "Aerobic respiration uses glucose and oxygen and releases energy, with carbon dioxide and water as waste products. Photosynthesis is the reverse reaction." },
  { c: "Where respiration happens", q: "Which cells carry out respiration?",
    o: ["All living cells, including plant cells and microorganisms","Only cells in the lungs, where oxygen enters the body","Only animal cells, since plants photosynthesise instead","Only muscle cells, and only during exercise"],
    e: "Every living cell needs energy, so every living cell respires, all the time. In plant and animal cells it happens in the mitochondria." },
  { c: "Alveoli", q: "Which set of features makes the alveoli good at gas exchange?",
    o: ["Very large total surface area, thin walls and a rich blood supply","Thick walls, few capillaries and a dry surface to stop leaks","Muscular walls that pump air directly into the blood","A small surface area so that gases cannot escape again"],
    e: "Millions of alveoli give a huge surface area. Their walls and the capillary walls are one cell thick, and the blood flow keeps the concentration difference high." },
  { c: "Composition of breath", q: "Compared with inhaled air, exhaled air contains:",
    o: ["less oxygen and more carbon dioxide, but still quite a lot of oxygen","no oxygen at all, because all of it is absorbed by the blood","more oxygen and less carbon dioxide, because the lungs make oxygen","the same amounts of oxygen and carbon dioxide as inhaled air"],
    e: "Inhaled air has about 21% oxygen and exhaled air about 16%. Carbon dioxide rises from about 0.04% to about 4%. This leftover oxygen is why rescue breathing works." },
  { c: "Breathing mechanism", q: "What happens when you breathe in?",
    o: ["The diaphragm contracts and flattens, the ribs move up and out, and air flows in","The lungs expand by themselves, sucking air in through the trachea and bronchi","The diaphragm relaxes and moves up, pushing air down into the lungs from above","The ribs move down and in, squeezing air from the trachea down into the lungs"],
    e: "Muscles make the chest cavity bigger. This lowers the pressure inside the lungs, so air from outside, at higher pressure, flows in. The lungs have no muscle of their own." },
  { c: "Testing breath", q: "Air is breathed out through limewater in one tube and room air is bubbled through limewater in another. The first tube turns milky much faster. What does this show?",
    o: ["Exhaled air contains more carbon dioxide than room air","Exhaled air contains more oxygen than room air","Exhaled air contains no water vapour","Room air contains no carbon dioxide"],
    e: "Limewater turns milky with carbon dioxide. Room air has a little carbon dioxide, so it changes slowly. Exhaled air has much more, so it changes quickly." },
  { c: "Smoking and cilia", q: "Smokers often have a cough and get chest infections. Which explanation is correct?",
    o: ["Tar damages the cilia, so mucus and trapped bacteria are not swept away from the lungs","Nicotine makes the lungs produce oxygen too quickly, which irritates them","Smoke makes the alveoli bigger, so bacteria have more space to grow","Carbon monoxide kills bacteria in the lungs, and coughing removes them"],
    e: "Cilia normally sweep mucus, dust and microorganisms up out of the airways. When they are damaged, mucus builds up, causing coughing and infections." },
  { c: "Carbon monoxide", q: "Cigarette smoke contains carbon monoxide. Why does this make it harder to exercise?",
    o: ["It combines with haemoglobin, so red blood cells carry less oxygen","It blocks the stomata in the lungs, so less air can get in","It makes the heart beat more slowly, so blood moves less","It is used up instead of glucose, so muscles get less energy"],
    e: "Carbon monoxide binds to haemoglobin more strongly than oxygen does. Less oxygen reaches the muscles, so less energy is released by respiration." },
  { c: "Emphysema", q: "In emphysema, the walls of many alveoli break down. Why does the person become breathless?",
    o: ["The surface area for gas exchange is reduced, so less oxygen gets into the blood","The diaphragm stops working, so the lungs cannot fill with air","Their blood stops carrying carbon dioxide, which builds up in the cells","Their airways become too wide, so air rushes out before it is used"],
    e: "Fewer, larger air sacs have much less total surface area. Less oxygen can diffuse into the blood, even when the person breathes hard." },
  { c: "Exercise and breathing", q: "Why do you breathe faster and more deeply during exercise?",
    o: ["To take in more oxygen for respiration and remove extra carbon dioxide","To cool the lungs down, because they heat up when muscles work hard","Because the working muscles need extra air to be pumped inside them","To get rid of the extra glucose that is made during hard exercise"],
    e: "Muscles respire faster during exercise. They need more oxygen and produce more carbon dioxide, so breathing rate and depth increase." },
  { c: "Respiration releases heat", q: "Germinating seeds are placed in a sealed vacuum flask with a thermometer. After two days the temperature has risen. Why?",
    o: ["The seeds are respiring, and some of the energy released is lost as heat","The seeds are photosynthesising inside the flask and producing heat","The vacuum flask slowly creates heat when it is kept closed","The seeds are absorbing heat from the thermometer bulb"],
    e: "Respiration releases energy from glucose. Some of this energy is transferred to the surroundings as heat. A control flask with boiled (dead) seeds would show no rise." },
  { c: "Diffusion in gas exchange", q: "Why does oxygen move from the alveoli into the blood?",
    o: ["Its concentration is higher in the alveoli than in the blood","The heart sucks oxygen out of the alveoli each time it beats","Muscles in the alveoli walls push oxygen into the blood","Blood always contains more oxygen than air, so it attracts more"],
    e: "Diffusion is the net movement of particles from a high concentration to a low concentration. Blood arriving at the lungs is low in oxygen, so oxygen diffuses into it." },
  { c: "Need for oxygen and glucose", q: "Why do body cells need a constant supply of glucose and oxygen?",
    o: ["They use them in respiration to release energy for life processes","They store them to build bones","They turn them into carbon dioxide for photosynthesis","They need them to make blood"],
    e: "Energy released by respiration is used for movement, growth, keeping warm, sending nerve messages and much more." },
  { c: "Mitochondria", q: "Muscle cells contain many more mitochondria than most other cells. Why?",
    o: ["Mitochondria carry out respiration, and muscle cells need a lot of energy","Mitochondria make the muscle stronger by contracting themselves","Mitochondria store oxygen for use when the muscle works hard","Mitochondria carry out photosynthesis to make glucose for the muscle"],
    e: "Aerobic respiration happens in mitochondria. Cells that use a lot of energy have lots of them." },
  { c: "Airway path", q: "Which is the correct path air takes into the lungs?",
    o: ["Trachea → bronchi → bronchioles → alveoli","Bronchi → trachea → alveoli → bronchioles","Alveoli → bronchioles → bronchi → trachea","Trachea → alveoli → bronchi → bronchioles"],
    e: "The trachea divides into two bronchi, which branch into many bronchioles ending in tiny air sacs called alveoli." },
  { c: "Cartilage rings", q: "The trachea is held open by rings of cartilage. Why is this needed?",
    o: ["To stop it collapsing when air pressure inside falls during breathing in","To make the trachea squeeze air into the lungs by itself","To filter dust and microorganisms out of the incoming air","To let oxygen diffuse through the trachea wall into the blood"],
    e: "The trachea must stay open all the time so air can always pass through." },
  { c: "Nose and mucus", q: "How do the nose and airways protect the lungs?",
    o: ["Hairs and sticky mucus trap dust and microorganisms","They absorb oxygen before it reaches the lungs","They make the air colder","They remove carbon dioxide from the air"],
    e: "Mucus traps particles, and cilia sweep it up and away from the lungs. The nose also warms and moistens the air." },
  { c: "Breathing out", q: "What happens when you breathe out normally?",
    o: ["The diaphragm relaxes and domes up, the ribs move down and in, and air is pushed out","The diaphragm contracts and flattens, the ribs move out, and the air is pushed out","The lungs contract like a muscle and squeeze the air out through the trachea","The ribs move up and out, so the chest gets bigger and pushes the air out"],
    e: "A smaller chest volume raises the pressure in the lungs above that outside, so air flows out." },
  { c: "Bell jar model", q: "In a bell jar model of the chest, pulling down the rubber sheet at the bottom makes the balloons inflate. What does the rubber sheet represent?",
    o: ["The diaphragm","The ribs","The trachea","The alveoli"],
    e: "Pulling the sheet down increases the volume inside the jar, just as the diaphragm flattening increases chest volume. One limitation: the jar's walls cannot move like ribs." },
  { c: "Water vapour in breath", q: "When you breathe onto a cold mirror, it mists up. What does this show?",
    o: ["Exhaled air contains water vapour, partly produced by respiration","Exhaled air contains carbon dioxide gas that turns liquid","The mirror has absorbed oxygen","Exhaled air contains no water"],
    e: "Water is a product of respiration. Water vapour in breath condenses on the cold surface." },
  { c: "Nitrogen in breath", q: "About 78% of inhaled air is nitrogen. Roughly how much of exhaled air is nitrogen?",
    o: ["About 78%, because the body does not use nitrogen gas","About 16%, because most nitrogen is absorbed","About 4%, because nitrogen turns into carbon dioxide","Almost none, because nitrogen is used in respiration"],
    e: "Nitrogen is breathed in and out unchanged. Only oxygen and carbon dioxide (and water vapour) change significantly." },
  { c: "Moist alveoli", q: "Why are the walls of the alveoli moist?",
    o: ["Gases dissolve in the moisture before diffusing across the walls","Moisture stops dust reaching the blood by trapping it on the walls","Moisture adds extra oxygen to the air because water contains oxygen","Water is needed in the alveoli to make glucose for the lung cells"],
    e: "Oxygen dissolves in the thin film of water and then diffuses into the blood." },
  { c: "Maintaining diffusion", q: "Breathing keeps air in the alveoli fresh, and blood keeps flowing through the capillaries. Why do both matter?",
    o: ["They keep oxygen concentration higher in the alveoli than in the blood","They stop too much oxygen entering the blood, which would harm the cells","They stretch the alveoli so that they grow larger with every breath","They make carbon dioxide move from the outside air into the alveoli"],
    e: "If either stopped, the concentrations would even out and diffusion would slow down and stop." },
  { c: "Lung cancer", q: "Which substance in cigarette smoke is the main cause of lung cancer?",
    o: ["Tar, which contains cancer-causing chemicals","Nicotine, which makes smoking addictive","Carbon monoxide, which reduces oxygen in blood","Water vapour, which makes the lungs damp"],
    e: "Tar coats the airways and contains carcinogens, substances that can cause cells to divide out of control." },
  { c: "Nicotine", q: "Why do many smokers find it hard to give up?",
