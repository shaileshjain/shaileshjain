<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Science 8 Unit Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: exam-paper column. Unit index as a ruled list; each test runs one question at a time with instant "why" feedback. */
:root {
  --bg: #f2f4f3;
  --paper: #ffffff;
  --ink: #17202a;
  --muted: #5b6670;
  --rule: #d9dfdd;
  --accent: #23408e;
  --bio: #2c7a4b;
  --chem: #a33b67;
  --phys: #2a5fb3;
  --good: #1f7a45;
  --good-bg: #e3f3e9;
  --bad: #b3261e;
  --bad-bg: #fbe7e5;
  --warn: #8a5a00;
  --warn-bg: #fbf0d9;
  --shadow: 0 1px 2px rgba(23,32,42,.06), 0 4px 16px rgba(23,32,42,.05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --paper: #19212a; --ink: #e6ebef; --muted: #9aa6b1; --rule: #2b3540;
    --accent: #8fa8ff; --bio: #5fc58a; --chem: #e57fab; --phys: #7aa8f5;
    --good: #6fd39a; --good-bg: #173226; --bad: #ff8a80; --bad-bg: #3a1c1b; --warn: #f2c464; --warn-bg: #352b14;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --paper: #19212a; --ink: #e6ebef; --muted: #9aa6b1; --rule: #2b3540;
  --accent: #8fa8ff; --bio: #5fc58a; --chem: #e57fab; --phys: #7aa8f5;
  --good: #6fd39a; --good-bg: #173226; --bad: #ff8a80; --bad-bg: #3a1c1b; --warn: #f2c464; --warn-bg: #352b14;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.45rem; font-weight: 700; }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
header.top { display: grid; gap: 10px; margin-bottom: 28px; }
header.top .lede { color: var(--muted); max-width: 60ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 4px; font-size: .9rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); display: inline-block; }

/* Unit index */
.units { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.unit-row { border-bottom: 1px solid var(--rule); }
.unit-no { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.unit-main { min-width: 0; display: grid; gap: 4px; }
.unit-title { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; }
.unit-topics { color: var(--muted); font-size: .92rem; }
.unit-meta { display: grid; justify-items: end; gap: 6px; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); white-space: nowrap; }
.strand { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--c); border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
.best { font-variant-numeric: tabular-nums; }
.best.secure { color: var(--good); }
.best.developing { color: var(--warn); }
.best.revisit { color: var(--bad); }
.unit-head { display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 14px; align-items: start; }
.unit-row { padding: 16px 4px; display: grid; gap: 12px; }
.unit-body { display: grid; gap: 10px; padding-left: calc(3.2rem + 14px); }
.mastery { display: grid; gap: 4px; }
.mbar { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; max-width: 420px; }
.mbar i { display: block; height: 100%; background: var(--muted); }
.mbar i.secure { background: var(--good); }
.mbar i.developing { background: var(--warn); }
.mbar i.revisit { background: var(--bad); }
.mtext { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.sm { padding: 6px 12px; font-size: .88rem; }
.btn.sm:not(.ghost) { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: var(--paper); }
.btn.sm.ghost { border-color: var(--c, var(--ink)); color: var(--c, var(--ink)); }
.howto { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 16px; max-width: 64ch; font-size: .95rem; }
.tnum { font-variant-numeric: tabular-nums; }
.mline { color: var(--muted); font-size: .95rem; }
.link.danger { color: var(--bad); }
.mixed { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; }
.mixed p { color: var(--muted); font-size: .95rem; min-width: 0; flex: 1 1 260px; }

/* Buttons */
.btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 10px 18px; font-weight: 700; }
.btn:hover { opacity: .9; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: .92rem; }
.link:hover { color: var(--ink); text-decoration: underline; }

/* Quiz */
.qbar { display: grid; gap: 10px; margin-bottom: 20px; }
.qbar-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.progress { height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--c); width: 0; transition: width .3s ease; }
.tally { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 28px); display: grid; gap: 18px; }
.qhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.qtext { font-size: 1.15rem; font-weight: 700; line-height: 1.45; }
.options { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: start; text-align: left; background: transparent; border: 1.5px solid var(--rule); border-radius: 9px; padding: 11px 12px; }
.opt:hover:not(:disabled) { border-color: var(--c); }
.opt:disabled { cursor: default; }
.opt .key { font-family: var(--f-mono); font-weight: 500; width: 1.7rem; height: 1.7rem; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--rule); font-size: .85rem; }
.opt span:last-child { min-width: 0; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .key { background: var(--good); color: var(--paper); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: var(--paper); border-color: var(--bad); }
.opt.dim { opacity: .55; }
.why { border-left: 4px solid var(--fb); background: color-mix(in srgb, var(--fb) 8%, transparent); padding: 12px 14px; border-radius: 0 8px 8px 0; display: grid; gap: 4px; }
.why strong { color: var(--fb); font-family: var(--f-display); }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hint { font-size: .82rem; color: var(--muted); }

/* Results */
.result-head { display: grid; gap: 6px; }
.score { font-family: var(--f-display); font-weight: 800; font-size: clamp(3rem, 12vw, 4.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .35em; color: var(--muted); font-weight: 500; }
.band { justify-self: start; font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.band.secure { color: var(--good); background: var(--good-bg); }
.band.developing { color: var(--warn); background: var(--warn-bg); }
.band.revisit { color: var(--bad); background: var(--bad-bg); }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.review li { border-top: 1px solid var(--rule); padding-top: 12px; display: grid; gap: 4px; }
.review .ans { font-size: .93rem; }
.review .ans b { color: var(--good); }
.review .ans s { color: var(--bad); }
.review .exp { color: var(--muted); font-size: .93rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.note { margin-top: 28px; font-size: .85rem; color: var(--muted); max-width: 62ch; }
@media (max-width: 520px) {
  .unit-head { grid-template-columns: 2.4rem 1fr; gap: 10px; }
  .unit-body { padding-left: 0; }
  .unit-meta { grid-column: 2; justify-items: start; grid-auto-flow: column; justify-content: start; gap: 10px; }
  .unit-no { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }

/* ---------- v3: learners, adaptive tests, reports ---------- */
:root { --st-mastered: #1f7a45; --st-secure: #4f9d6c; --st-developing: #b07a12; --st-needs: #b3261e; --st-none: #b9c2c0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --st-mastered: #6fd39a; --st-secure: #4fae78; --st-developing: #e2b04a; --st-needs: #ff8a80; --st-none: #4a5561; } }
:root[data-theme="dark"] { --st-mastered: #6fd39a; --st-secure: #4fae78; --st-developing: #e2b04a; --st-needs: #ff8a80; --st-none: #4a5561; }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.learner { display: inline-flex; align-items: center; gap: 8px; }
.learner select, input[type="text"] { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 8px; padding: 7px 10px; }
.learner select:focus-visible, input[type="text"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--ink); margin-top: 6px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; font-family: var(--f-display); font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.banner { font-size: .9rem; padding: 8px 12px; border-radius: 8px; background: var(--paper); border: 1px solid var(--rule); color: var(--muted); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: clamp(16px, 4vw, 24px); display: grid; gap: 14px; margin-bottom: 20px; }
.panel.narrow { max-width: 520px; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.suggest { display: grid; gap: 8px; margin: 18px 0; }
.suggest .btn small { font-weight: 400; opacity: .8; margin-left: 4px; }
.keyline { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tchip { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.tchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--st-none); }
.tchip b { font-variant-numeric: tabular-nums; font-weight: 700; }
.tchip.mastered i { background: var(--st-mastered); } .tchip.secure i { background: var(--st-secure); }
.tchip.developing i { background: var(--st-developing); } .tchip.needs i { background: var(--st-needs); }
.unit-row .unit-actions { padding-left: calc(3.2rem + 14px); align-items: center; }
.dpill { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; margin-right: 4px; white-space: nowrap; }
.dpill.d1 { color: var(--st-secure); } .dpill.d2 { color: var(--accent); } .dpill.d3 { color: var(--chem); }
.opt.picked { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.opt.picked .key { background: var(--c); color: var(--paper); border-color: var(--c); }
.conf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 9px; background: color-mix(in srgb, var(--c) 7%, transparent); }
.conf span { font-weight: 700; margin-right: 4px; }
.conf .btn.sm:not(.ghost) { background: var(--c); border-color: var(--c); color: var(--paper); }
.conf .btn.sm.ghost { border-color: var(--c); color: var(--ink); }
kbd { font-family: var(--f-mono); font-size: .7rem; opacity: .7; margin-left: 4px; }
.misc { font-size: .92rem; color: var(--bad); }
.scoreline { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.facts { display: grid; gap: 6px; justify-items: start; }
.quad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.quad > div { border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; border: 1px solid var(--rule); }
.quad b { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.quad span { font-weight: 700; font-size: .9rem; display: grid; }
.quad small { font-weight: 400; color: var(--muted); font-size: .78rem; }
.q-known b { color: var(--good); } .q-lucky b { color: var(--warn); } .q-misc { background: var(--bad-bg); border-color: transparent !important; } .q-misc b { color: var(--bad); } .q-gaps b { color: var(--muted); }
.tablewrap { overflow-x: auto; }
.ttable { width: 100%; border-collapse: collapse; font-size: .92rem; }
.ttable th { text-align: left; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.ttable td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.ttable td:nth-child(2) { min-width: 120px; }
.bar { height: 7px; border-radius: 999px; background: var(--rule); overflow: hidden; min-width: 80px; max-width: 220px; }
.bar i { display: block; height: 100%; background: var(--st-none); }
.bar.mastered i { background: var(--st-mastered); } .bar.secure i { background: var(--st-secure); } .bar.developing i { background: var(--st-developing); } .bar.needs i { background: var(--st-needs); }
.up { color: var(--good); font-size: .8rem; } .down { color: var(--bad); font-size: .8rem; }
.band.needs { color: var(--bad); background: var(--bad-bg); }
.misc-item { border-left: 3px solid var(--bad); padding-left: 10px; }
details summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.link.strong { color: var(--ink); font-weight: 700; text-align: left; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--rule); border-radius: 10px; padding: 12px; display: grid; gap: 4px; }
.tile b { font-family: var(--f-display); font-size: 1.8rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile b small { font-size: .5em; color: var(--muted); font-weight: 500; }
.tile span { color: var(--muted); font-size: .85rem; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.split > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
.acc { display: grid; grid-template-columns: 9rem 1fr; gap: 2px 10px; align-items: center; font-size: .9rem; }
.acc small { grid-column: 2; color: var(--muted); }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.unit-report { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; display: grid; gap: 8px; }
.unit-report h3 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.unit-no.sm { font-size: 1.1rem; }
.trend { display: inline-flex; gap: 3px; }
.trend i { width: 9px; height: 9px; border-radius: 2px; background: var(--bad); }
.trend i.y { background: var(--good); }
.summary-box { border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); padding: 12px 14px; border-radius: 0 8px 8px 0; display: grid; gap: 6px; }
.pre { white-space: pre-wrap; }
.flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; max-width: calc(100% - 32px); z-index: 10; font-size: .92rem; }
@media (max-width: 640px) {
  .quad, .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: 1fr; }
  .unit-row .unit-actions { padding-left: 0; }
  .acc { grid-template-columns: 7rem 1fr; }
}
[hidden] { display: none !important; }

/* ---------- diagrams ---------- */
:root { --fig-red: #e8a59c; --fig-blue: #a9c3e8; --fig-green: #b7dcb0; --fig-chl: #3f8f4a; --fig-yellow: #f1dc8a; --fig-skin: #f0cdb2; --fig-glass: #eef4f7; --fig-liquid: #bfdcf0; --fig-iron: #8e959c; --fig-pa: #5b6fb3; --fig-pb: #f3f0e6; --fig-org: #e9b6b0; --fig-brown: #c79a7a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fig-red: #8a4a43; --fig-blue: #3e5a82; --fig-green: #3f6a45; --fig-chl: #7fd08a; --fig-yellow: #7a6a2a; --fig-skin: #7a5a46; --fig-glass: #24303a; --fig-liquid: #2f5570; --fig-iron: #9aa3ab; --fig-pa: #8fa2e8; --fig-pb: #3a3f48; --fig-org: #7d4b47; --fig-brown: #7a5a44; } }
:root[data-theme="dark"] { --fig-red: #8a4a43; --fig-blue: #3e5a82; --fig-green: #3f6a45; --fig-chl: #7fd08a; --fig-yellow: #7a6a2a; --fig-skin: #7a5a46; --fig-glass: #24303a; --fig-liquid: #2f5570; --fig-iron: #9aa3ab; --fig-pa: #8fa2e8; --fig-pb: #3a3f48; --fig-org: #7d4b47; --fig-brown: #7a5a44; }
.figwrap { overflow-x: auto; }
.fig { display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto; }
.fig text { fill: var(--ink); font-family: var(--f-body); font-size: 11px; }
.fig .tick { fill: var(--muted); font-size: 10px; font-family: var(--f-mono); }
.fig .axl { font-size: 11px; fill: var(--muted); }
.fig .small { font-size: 10px; fill: var(--muted); }
.fig .labt { font-weight: 700; font-size: 11px; fill: var(--ink); }
.fig .colt { font-weight: 700; font-size: 12px; }
.fig .angt { font-weight: 700; font-size: 12px; fill: var(--chem); }
.fig .labc { fill: var(--paper); stroke: var(--ink); stroke-width: 1.3; }
.fig .lead { stroke: var(--ink); stroke-width: 1; }
.fig .dotp { fill: var(--ink); }
.fig .ln, .fig .wire { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.fig .grid { stroke: var(--rule); stroke-width: 1; }
.fig .ax { stroke: var(--ink); stroke-width: 1.5; }
.fig .plot { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linejoin: round; }
.fig .pt { fill: var(--accent); }
.fig .shade { fill: var(--warn-bg); }

const UNITS = [
{ n: 1, title: "Plants", strand: "Biology", topics: "Photosynthesis, testing leaves for starch, leaf structure, water and minerals, roots",
  qs: [
  {"t":"a3A","c":"Where plant mass comes from","q":"A seedling with a mass of 1 g grows into a plant with a mass of 500 g. Where did most of the extra mass come from?","o":["Carbon dioxide from the air and water, turned into glucose by photosynthesis","Soil taken in through the roots, which is why pots of soil slowly lose mass","Energy from sunlight, which is turned into matter inside the leaves","Minerals such as nitrates, which are absorbed from the soil in large amounts"],"e":"Photosynthesis builds glucose from carbon dioxide and water, and glucose is used to make the rest of the plant. The soil supplies only small amounts of minerals. Light provides energy, not mass."},
  {"t":"a1K","c":"Photosynthesis equation","q":"Which word equation correctly describes photosynthesis?","o":["carbon dioxide + water → glucose + oxygen (using light and chlorophyll)","glucose + oxygen → carbon dioxide + water (using light)","oxygen + water → glucose + carbon dioxide (using chlorophyll)","carbon dioxide + oxygen → glucose + water (using light)"],"e":"The reactants are carbon dioxide and water. Light energy is absorbed by chlorophyll, and the products are glucose and oxygen. The reverse equation is respiration."},
  {"t":"b2A","c":"Why test for starch","q":"When we want to know whether a leaf has been photosynthesising, why do we test it for starch rather than for glucose?","o":["Glucose made in the leaf is quickly turned into starch for storage","Iodine reacts with glucose only when it has been heated in a water bath","Leaves store all their glucose in the roots, so none is left to detect","Starch is made first in photosynthesis and only later turned into glucose"],"e":"Glucose is soluble and is quickly converted into insoluble starch to be stored. Starch builds up in the leaf, so it is a reliable sign that photosynthesis has happened."},
  {"t":"b2E","c":"Destarching (controls)","q":"Before an experiment, a plant is kept in the dark for 48 hours. What is the purpose of this?","o":["To use up its stored starch, so any starch found later was made in the experiment","To make the plant photosynthesise faster when it is put back in the light again","To kill the leaf cells so that the iodine solution can get into them later","To let the leaves build up extra chlorophyll before the experiment begins"],"e":"In the dark the plant cannot photosynthesise, so it uses up its stored starch. Any starch found at the end must have been made during the experiment. This makes the test fair."},
  {"t":"b2E","c":"Chlorophyll is needed","q":"A variegated leaf has green parts and white parts. After a day in bright light it is tested with iodine. What result do you expect?","o":["Only the green parts turn blue-black","The whole leaf turns blue-black","Only the white parts turn blue-black","No part turns blue-black, because variegated leaves cannot make starch"],"e":"Only the green parts contain chlorophyll, which absorbs the light energy needed for photosynthesis. The white parts have no chlorophyll, so they make no starch and stay orange-brown."},
  {"t":"b1E","c":"Starch test method","q":"In the starch test, why is the leaf placed in hot ethanol before iodine is added?","o":["To remove the green chlorophyll so the colour change can be seen clearly","To turn any glucose in the leaf into starch so that the iodine can detect it","To add the heat energy that iodine needs before it can react with starch","To soften the leaf so it absorbs more iodine solution in the final step"],"e":"Ethanol dissolves chlorophyll and makes the leaf pale. Without this step, the green colour would hide the blue-black colour of iodine reacting with starch."},
  {"t":"b2E","c":"Light intensity and rate","q":"A student counts oxygen bubbles from pondweed with a lamp at different distances. Moving the lamp closer increases the number of bubbles per minute. Which conclusion is best?","o":["The rate of photosynthesis increases as light intensity increases","Pondweed only photosynthesises when a lamp is very close","The bubbles are carbon dioxide, which increases with light","The pondweed respires faster when the lamp is closer"],"e":"The bubbles are oxygen, a product of photosynthesis. A closer lamp means brighter light, so more bubbles means a faster rate. Light intensity is the independent variable in this investigation."},
  {"t":"c2A","c":"Leaf shape and function","q":"Most leaves are broad and thin. How does this help photosynthesis?","o":["A large surface area absorbs plenty of light, and gases only have a short distance to diffuse","A thin leaf is light, so the stem can hold up more leaves without bending over","A broad leaf collects more rainwater, which is absorbed straight into the cells","A broad, thin leaf has room to store more starch in each of its cells"],"e":"A broad leaf traps more light. A thin leaf means carbon dioxide can diffuse quickly from the air spaces to every cell that has chloroplasts."},
  {"t":"c2A","c":"Stomata","q":"Why are most stomata found on the lower surface of a leaf?","o":["They let gases in and out while losing less water, because the lower surface is cooler and shaded","Light enters the leaf mainly through the lower surface, so gas exchange happens there","Water from the roots arrives at the lower surface and needs stomata to get out","The lower surface has more chlorophyll, so it needs the most carbon dioxide"],"e":"Stomata let carbon dioxide in and oxygen out, but water vapour also escapes through them. The lower surface is cooler and out of direct sun, so less water is lost there."},
  {"t":"c1A","c":"Palisade cells","q":"Palisade cells are packed just below the upper surface of a leaf and contain many chloroplasts. Why is this a good arrangement?","o":["They are in the position that receives the most light","They are closest to the stomata for taking in water","They protect the leaf from insects","They store all the minerals the leaf needs"],"e":"Light falls on the upper surface, so cells placed there with many chloroplasts can absorb the most light for photosynthesis."},
  {"t":"d1A","c":"Root hair cells","q":"Root hair cells have a long, thin extension. What is the main advantage of this shape?","o":["It gives a large surface area for absorbing water and minerals from the soil","It lets the root make glucose in the dark","It anchors the plant by growing into rocks","It allows the root to take in carbon dioxide for photosynthesis"],"e":"A larger surface area in contact with the soil means water and dissolved minerals can be absorbed faster. Root hair cells have no chloroplasts because they are underground."},
  {"t":"d2A","c":"Minerals","q":"A plant has yellow leaves even though it has plenty of light and water. A lack of which mineral is most likely?","o":["Magnesium, because it is needed to make chlorophyll","Glucose, because it is needed to make leaves","Oxygen, because it is needed for photosynthesis","Carbon, because it is needed to make roots"],"e":"Chlorophyll molecules contain magnesium. Without enough magnesium the plant makes less chlorophyll and its leaves turn yellow. Nitrates are needed to make proteins for growth."},
  {"t":"a2A","c":"Plants also respire","q":"What is happening in a plant's leaves at night?","o":["Respiration continues, using oxygen and releasing carbon dioxide","Nothing happens, because plants only respire while photosynthesis is happening","Photosynthesis continues slowly, using light energy stored during the day","The leaves take in carbon dioxide and give out oxygen, just as in daytime"],"e":"All living cells respire all the time. In daylight, photosynthesis is usually faster than respiration so a plant gives out oxygen overall. At night only respiration happens, so the plant gives out carbon dioxide."},
  {"t":"b3E","c":"Carbon dioxide is needed","q":"A destarched plant has one leaf sealed in a flask with sodium hydroxide, which absorbs carbon dioxide. After a day in the light, that leaf has no starch but the other leaves do. What does this show?","o":["Carbon dioxide is needed for photosynthesis","Sodium hydroxide blocks light, so the leaf in the flask could not photosynthesise","Leaves in a flask cannot get water, so they cannot photosynthesise","Sodium hydroxide destroys starch, so any starch made was broken down"],"e":"The only difference for the sealed leaf is that it had no carbon dioxide. It made no starch, so carbon dioxide is needed. The other leaves act as the control."},
  {"t":"a1K","c":"Chloroplasts","q":"In which part of a leaf cell does photosynthesis take place?","o":["Chloroplasts","Nucleus, which controls the cell","Cell wall, which faces the light","Vacuole, which holds the water used"],"e":"Chloroplasts contain chlorophyll, which absorbs light. The reactions of photosynthesis happen inside them."},
  {"t":"a1K","c":"Role of chlorophyll","q":"What is the job of chlorophyll in photosynthesis?","o":["It absorbs light energy","It provides the carbon dioxide","It stores the glucose that is made","It takes in water from the soil"],"e":"Chlorophyll is a green pigment that absorbs light energy. The plant uses this energy to make glucose from carbon dioxide and water."},
  {"t":"a2K","c":"Energy transfer","q":"Which energy change takes place during photosynthesis?","o":["Light energy is changed into chemical energy stored in glucose","Chemical energy in carbon dioxide is changed into light energy","Heat energy from the Sun is changed into kinetic energy in the leaf","Chemical energy in glucose is changed into heat and light energy"],"e":"Photosynthesis stores energy from light in the glucose molecule. Respiration later releases this chemical energy."},
  {"t":"a2K","c":"Uses of glucose","q":"A plant uses some of its glucose to make cellulose. What is cellulose used for?","o":["Building cell walls","Absorbing light","Carrying oxygen","Making chlorophyll directly"],"e":"Glucose is used for respiration, stored as starch, and turned into cellulose for cell walls. With minerals, it is also used to make proteins."},
  {"t":"d2K","c":"Nitrates","q":"A plant grows very slowly and its older leaves turn yellow. A lack of nitrates is the cause. Why are nitrates needed?","o":["To make proteins needed for growth","To make glucose in photosynthesis","To absorb light","To open the stomata"],"e":"Plants combine nitrogen from nitrates with sugars to make proteins. Without proteins, new cells cannot be made, so growth is poor."},
  {"t":"d1A","c":"Fertilisers","q":"Why do farmers add fertilisers to fields?","o":["To replace minerals that crops have taken from the soil","To give the plants extra carbon dioxide so they photosynthesise faster","To provide glucose that the roots can absorb when photosynthesis is slow","To kill insects and weeds that compete with the crop for light"],"e":"When crops are harvested, the minerals in them are removed from the field. Fertilisers containing nitrogen, phosphorus and potassium replace them."},
  {"t":"d2A","c":"Minerals are dissolved","q":"Why can a plant not take in minerals from very dry soil, even if the soil contains plenty of them?","o":["Minerals are absorbed dissolved in water, so without water they cannot get into the roots","Minerals are only made in the soil when it rains, so dry soil has none","Dry soil blocks oxygen from the roots, so the root cells all die at once","Roots only absorb minerals at night, when the soil has cooled down"],"e":"Root hair cells take up minerals as ions dissolved in soil water. No water means no route in for the minerals."},
  {"t":"d1K","c":"Xylem","q":"What is the job of xylem vessels in a plant?","o":["Carrying water and minerals up from the roots to the leaves","Carrying glucose down from the leaves to the roots","Absorbing light for photosynthesis","Letting gases in and out of the leaf"],"e":"Xylem vessels are long, hollow tubes that run from the roots, through the stem, to every leaf."},
  {"t":"d2E","c":"Celery experiment","q":"A stick of celery is left in water with red dye. Later, red dots appear when the stem is cut across. What does this show?","o":["Water travels up the stem in particular tubes (xylem)","The celery is making red pigment","Water travels through every cell in the stem equally","The dye is being photosynthesised"],"e":"The dye only colours the xylem vessels, which shows the route water takes through the plant."},
  {"t":"d2A","c":"Transpiration","q":"Water evaporates from the leaves and escapes through the stomata. How does this help the plant?","o":["It pulls water and minerals up the xylem from the roots","It makes glucose in the leaf by turning the water vapour into sugar","It lets the plant get rid of oxygen produced in the roots overnight","It stops the roots absorbing too much water when the soil is very wet"],"e":"As water is lost from leaves, more is drawn up to replace it, like drinking through a straw. This flow also carries minerals."},
  {"t":"d2A","c":"Wilting","q":"A plant in a pot wilts on a hot, sunny afternoon. Why?","o":["It is losing water from its leaves faster than its roots can absorb it","It is making so much glucose that the stem becomes too heavy to stand","The bright sunlight has destroyed the chlorophyll in all of its leaves","It is absorbing too many minerals, which makes the leaves go soft"],"e":"Cells that are full of water keep the plant firm. When more water is lost than taken in, the cells go soft and the plant droops."},
  {"t":"c3A","c":"Closing stomata","q":"In very dry conditions, a plant closes its stomata. What is the disadvantage of this?","o":["Less carbon dioxide can enter, so photosynthesis slows down","The plant loses more water, because it can no longer cool itself down","The roots stop growing, because no oxygen can reach them through the leaves","Light can no longer reach the chloroplasts once the stomata are closed"],"e":"Closing stomata saves water but also blocks gas exchange. The plant has a trade-off between saving water and photosynthesising."},
  {"t":"c2A","c":"Waxy cuticle","q":"The upper surface of many leaves is covered in a thin, clear, waxy layer. Why is it useful that it is clear?","o":["Light can pass through it to reach the palisade cells","It lets carbon dioxide pass through it into the palisade cells","It makes the leaf shiny, which attracts insects for pollination","It stores starch made in the cells just beneath it"],"e":"The wax reduces water loss by evaporation. Because it is transparent, light still reaches the cells that photosynthesise."},
  {"t":"c1K","c":"Air spaces","q":"Why does the spongy layer of a leaf have many air spaces?","o":["So gases can diffuse easily to and from the cells","To store water so the leaf survives dry periods","To make the leaf lighter so it can float on air","To hold the starch made by the palisade cells"],"e":"Carbon dioxide entering through the stomata spreads through the air spaces to reach the photosynthesising cells. Oxygen leaves the same way."},
  {"t":"b2A","c":"Greenhouses","q":"Some greenhouse growers burn a heater that releases carbon dioxide. Why does this increase their crop?","o":["Extra carbon dioxide and warmth increase the rate of photosynthesis","The heater gives out extra light, so photosynthesis can continue at night","The carbon dioxide kills insect pests, so fewer leaves are eaten","The smoke from the heater contains minerals that the leaves absorb"],"e":"Carbon dioxide is a raw material of photosynthesis. Warmth helps the enzymes involved. Both can make the rate faster."},
  {"t":"b3A","c":"Limiting factors","q":"Pondweed is in very bright light. Making the light even brighter does not increase the bubble rate. What is the best explanation?","o":["Something else, such as carbon dioxide or temperature, is now limiting the rate","Photosynthesis has stopped, because the plant has made enough glucose","Bright light damages the pondweed, so it stops releasing oxygen","The pondweed has run out of chlorophyll, so no more light is absorbed"],"e":"The rate is held back by whichever factor is in shortest supply. Once light is plentiful, adding more makes no difference."},
  {"t":"b2A","c":"Temperature","q":"How does temperature affect the rate of photosynthesis?","o":["The rate rises as it gets warmer up to an optimum, then falls if it gets too hot","The rate keeps rising as temperature rises, however hot it gets","Temperature has no effect on the rate; only light and carbon dioxide do","The rate is fastest at low temperatures, because enzymes are protected"],"e":"Photosynthesis is controlled by enzymes. They work faster when warmer, but very high temperatures damage them."},
  {"t":"b3E","c":"Fair test with a lamp","q":"In a pondweed experiment, a lamp is moved closer. Why should a beaker of water (heat shield) be put between the lamp and the pondweed?","o":["The lamp also gives out heat, and temperature must be kept the same","The water makes the light brighter by focusing it onto the pondweed","The water adds dissolved carbon dioxide to the pondweed's beaker","The water stops the pondweed respiring, so only photosynthesis is measured"],"e":"Only light intensity should change. If the water warms up, you cannot tell whether light or temperature caused the change."},
  {"t":"b1E","c":"Testing for oxygen","q":"How could you show that the gas given off by pondweed in light is oxygen?","o":["It relights a glowing splint","It turns limewater milky","It makes a lighted splint pop","It turns iodine blue-black"],"e":"Oxygen relights a glowing splint. Carbon dioxide turns limewater milky, and hydrogen gives a squeaky pop."},
  {"t":"a1K","c":"Producers","q":"Why are green plants called producers?","o":["They make their own food using light energy","They produce the carbon dioxide that animals need","They are eaten by more animals than anything else","They produce seeds, which grow into new plants"],"e":"Plants make glucose by photosynthesis. Almost every food chain starts with a producer, so energy from the Sun enters food chains through plants."},
  {"t":"d1A","c":"Roots have no chloroplasts","q":"Root hair cells do not contain chloroplasts. Why?","o":["They are underground, where there is no light for photosynthesis","Roots make their glucose in a different way that does not need chloroplasts","Chloroplasts would block water from entering the root hair cells","Roots get chlorophyll directly from the soil, so they do not need chloroplasts"],"e":"Chloroplasts would be useless without light. Root cells get their glucose from the leaves instead."},
  {"t":"c3E","c":"Blocking stomata","q":"Petroleum jelly is smeared on the lower surface of a destarched leaf, then the plant is put in the light. The leaf makes very little starch. Why?","o":["The jelly blocked the stomata, so carbon dioxide could not enter","The jelly blocked light from reaching the chloroplasts in the leaf","The jelly stopped water reaching the leaf through the veins","The jelly killed the chlorophyll, so no light could be absorbed"],"e":"Most stomata are on the lower surface. Blocking them stops carbon dioxide getting in, so photosynthesis cannot happen."},
  {"t":"c2A","c":"Stomata in daylight","q":"Why are most stomata open during the day?","o":["To let carbon dioxide in for photosynthesis","To let light into the leaf for photosynthesis","To let glucose leave the leaf for the roots","To let water vapour in from the damp air"],"e":"Photosynthesis happens in the light, so this is when the leaf needs carbon dioxide. Many plants close their stomata at night to save water."},
  {"t":"d2E","c":"Minerals from soil","q":"A plant grows in washed sand watered with pure distilled water. It grows poorly even with good light. Why?","o":["It has no source of minerals","It has no source of carbon dioxide","Sand blocks light from the leaves","Distilled water cannot be absorbed"],"e":"Light, water and carbon dioxide allow photosynthesis, but the plant still needs minerals such as nitrates and magnesium to grow healthily."},
  {"t":"a3A","c":"Oxygen over a day","q":"A plant is kept in a sealed glass jar in bright light for a day. What happens to the amount of oxygen in the jar?","o":["It increases, because photosynthesis is faster than respiration","It decreases, because the plant respires","It stays the same, because plants do not exchange gases","It falls to zero"],"e":"In bright light the plant produces oxygen by photosynthesis faster than it uses oxygen in respiration."},
  {"t":"a2A","c":"Comparing day and night","q":"Which statement about a plant is true?","o":["It photosynthesises only in the light but respires all the time","It respires only in the dark and photosynthesises all the time","It photosynthesises and respires only in the light","It never respires because it photosynthesises"],"e":"Photosynthesis needs light. Respiration releases energy for the cells and never stops while the plant is alive."},
  {"t":"b3E","c":"Interpreting results","q":"Bubbles per minute from pondweed: lamp at 10 cm → 40, 20 cm → 22, 30 cm → 12, 40 cm → 6. What do these results show?","o":["As the lamp moves away, light gets dimmer and photosynthesis slows","Pondweed photosynthesises fastest when the lamp is furthest away","The number of bubbles does not depend on where the lamp is","As the lamp moves away, the water warms and photosynthesis slows"],"e":"Distance from the lamp controls light intensity. Fewer bubbles means less oxygen made, so a slower rate of photosynthesis."},
  {"t":"b2E","c":"Improving the method","q":"Why is collecting the gas in a syringe and measuring its volume better than counting bubbles?","o":["Bubbles can be different sizes, so counting them is less accurate","Counting bubbles takes far too long for most experiments","Measuring the volume speeds up the rate of photosynthesis","Bubbles of oxygen are too small to be seen with the eye"],"e":"Two small bubbles and one big bubble may hold the same amount of gas. Measuring volume gives a fairer, more accurate result."},
  {"t":"a2A","c":"Overall gas exchange","q":"Overall, in bright sunlight a green plant takes in one gas and gives out another. Which?","o":["Takes in carbon dioxide; gives out oxygen","Takes in oxygen; gives out carbon dioxide","Takes in nitrogen; gives out oxygen","Takes in oxygen; gives out water vapour only"],"e":"In bright light, photosynthesis is faster than respiration. So overall the plant uses more carbon dioxide than it makes, and makes more oxygen than it uses."},
  {"t":"a3A","c":"Why plants need both","q":"Why does a plant need both photosynthesis and respiration?","o":["Photosynthesis stores energy in glucose; respiration releases it for the cells","Photosynthesis releases energy; respiration stores it in glucose","Respiration makes the glucose that photosynthesis then breaks down","Plants use one process in summer and the other in winter"],"e":"Photosynthesis makes food. Respiration, in every living cell, releases the energy stored in that food so the plant can grow and stay alive."},
  {"t":"a2K","c":"What is not needed","q":"Which of these is NOT needed for photosynthesis?","o":["Oxygen","Light","Carbon dioxide","Chlorophyll"],"e":"Oxygen is a product of photosynthesis, not a raw material. Light, carbon dioxide, water and chlorophyll are all needed."},
  {"t":"c2K","c":"Guard cells","q":"What do guard cells do?","o":["They open and close the stomata","They carry water from the roots to the leaf","They make most of the leaf's glucose","They protect the leaf from insect attack"],"e":"A pair of guard cells surrounds each stoma. They change shape to open the pore for gas exchange or close it to save water."},
  {"t":"c3A","c":"Desert plants","q":"Many desert plants have small leaves, thick waxy cuticles and few stomata. Why?","o":["To reduce water loss in hot, dry conditions","To absorb more light in the bright desert sun","To let more carbon dioxide into the leaves","To store extra starch for cold desert nights"],"e":"Each feature cuts down evaporation. The trade-off is slower gas exchange, so these plants often grow slowly."},
  {"t":"c3A","c":"Floating leaves","q":"Water lily leaves float on ponds. Unlike most leaves, their stomata are on the upper surface. Why?","o":["The underside touches water, so gases are exchanged with the air above","The upper surface is cooler than the lower one, so less water is lost","Water lilies need to lose as much water as they possibly can","Light only reaches the lower surface of a leaf that floats"],"e":"Stomata must open into air for carbon dioxide to get in. Water lilies have no shortage of water, so losing some from the upper surface is not a problem."},
  {"t":"d2K","c":"Route of water","q":"Which order shows the path water takes through a plant?","o":["Soil → root hair → xylem in root and stem → leaf → out through stomata","Soil → stomata → leaf → xylem in stem → root hair","Air → stomata → xylem in root → root hair → soil","Soil → leaf → root hair → xylem in stem → out through stomata"],"e":"Water enters root hair cells, travels up the xylem to the leaves and evaporates out through the stomata."},
  {"t":"d3A","c":"Transplanting","q":"When seedlings are moved to a new place, they often wilt for a few days. Why?","o":["Many root hairs are damaged, so less water is absorbed","Moving the plant stops its leaves photosynthesising","The roots release water into the new soil","Moving the plant removes chlorophyll from its leaves"],"e":"Root hairs are delicate and easily torn. Until new ones grow, the plant cannot take in water as fast as it loses it."},
  {"t":"d1K","c":"NPK fertiliser","q":"A fertiliser bag is labelled NPK. Which elements does it contain?","o":["Nitrogen, phosphorus and potassium","Nitrogen, protein and potassium","Nickel, phosphorus and potassium","Nitrogen, phosphorus and carbon"],"e":"N, P and K are the chemical symbols for nitrogen, phosphorus and potassium, three minerals plants need in large amounts."},
  {"t":"b3E","c":"Light is needed","q":"Part of a destarched leaf is covered with black paper, then the plant is left in light. After the starch test, what do you expect, and what does it show?","o":["Only the uncovered part turns blue-black, showing light is needed","Only the covered part turns blue-black, showing darkness helps","The whole leaf turns blue-black, showing light is not needed","No part turns blue-black, showing paper blocks carbon dioxide"],"e":"The covered part is a control within the same leaf. Everything else is the same, so the difference must be caused by light."},
  {"t":"b2E","c":"Boiling the leaf","q":"In the starch test, the leaf is first dipped in boiling water. Why?","o":["To kill the cells so iodine can reach the starch","To remove the chlorophyll before ethanol is added","To turn the glucose in the leaf into starch","To add the water needed for the iodine reaction"],"e":"Boiling breaks down the cell membranes. Ethanol then removes the chlorophyll, and iodine can reach the starch."},
  {"t":"b2E","c":"Ethanol safety","q":"Why is the ethanol warmed in a beaker of hot water rather than directly over a Bunsen flame?","o":["Ethanol is flammable, so it must be kept away from a flame","Ethanol boils at a higher temperature than water does","A flame would turn the ethanol into iodine solution","A water bath helps the ethanol remove the starch"],"e":"Ethanol catches fire easily. The Bunsen burner should be turned off before the ethanol is used."},
  {"t":"a3A","c":"Van Helmont's willow","q":"In a famous experiment, a willow tree grew by 74 kg in five years, but the soil in its pot lost only 57 g. What can you conclude?","o":["Very little of the tree's mass came from the soil","Most of the tree's mass came from the soil","The tree's mass came from the energy in sunlight","The soil gained mass as the tree grew bigger"],"e":"Van Helmont thought the mass came from water. We now know it comes mainly from carbon dioxide and water, combined by photosynthesis."},
  {"t":"a2K","c":"Photosynthesis needs energy","q":"What kind of process is photosynthesis?","o":["A chemical reaction that needs a supply of energy","A physical change that releases energy","A type of respiration that happens in the light","A process that only happens at night"],"e":"New substances (glucose and oxygen) are made, so it is a chemical reaction. It takes in light energy, so it needs a constant energy supply."},
  {"t":"d2A","c":"Growing without soil","q":"Some farms grow lettuces with their roots in water containing dissolved minerals, with no soil at all. What does this show?","o":["Plants need water and minerals, not the soil itself","Plants can grow well without any minerals at all","Plants get most of their mass from the soil","Soil is needed to make chlorophyll in the leaves"],"e":"This is called hydroponics. Soil mainly holds the plant up and supplies water and minerals, which can be given in other ways."},
  {"t":"c1K","c":"Most chloroplasts","q":"Which layer of a leaf contains the most chloroplasts?","o":["Palisade layer","Spongy layer","Upper epidermis","Lower epidermis"],"e":"Palisade cells are packed with chloroplasts and sit near the upper surface, where light is brightest."},
  {"t":"d3E","c":"Transpiration experiment","q":"Two identical potted plants, with their pots sealed in plastic bags, are weighed. One is left in the sun and one in the shade. After a day, the plant in the sun has lost more mass. Why?","o":["More water evaporated from its leaves in the warm, bright conditions","It used more of its mass to make glucose in the bright light","Sunlight broke down some of its starch into a gas","The plastic bag absorbed water from the soil in the sun"],"e":"Sealing the pots means water can only be lost through the plant. Warmth and light increase the rate of transpiration."},
  {"t":"b2A","c":"Destarching explained","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"A plant kept in the dark for two days has no starch in its leaves.","R":"Without light it cannot photosynthesise, so it uses up its stored starch.","a":0,"e":"Both are true, and the reason explains why the starch disappears."},
  {"t":"d2A","c":"Root hair cells","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Root hair cells contain many chloroplasts.","R":"Root hair cells absorb water from the soil.","a":3,"e":"Root hair cells are underground and have no chloroplasts, so the assertion is false. The reason is true."},
  {"t":"c1K","c":"Two true facts","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Most leaves are green.","R":"Most leaves have stomata on their lower surface.","a":1,"e":"Both statements are true, but stomata have nothing to do with the colour. Leaves are green because of chlorophyll."},
  {"t":"a2K","c":"Needs of photosynthesis","type":"multi","q":"Which of these are needed for photosynthesis? Select all that apply.","o":["Light","Carbon dioxide","Water","Chlorophyll","Oxygen","Glucose"],"k":4,"e":"Light, carbon dioxide, water and chlorophyll are needed. Oxygen and glucose are the products."},
  {"t":"c2A","c":"Getting carbon dioxide in","type":"multi","q":"Which features help carbon dioxide reach the cells that photosynthesise? Select all that apply.","o":["Stomata","Air spaces in the spongy layer","A thin leaf","A waxy cuticle","Root hairs"],"k":3,"e":"Carbon dioxide enters through stomata and diffuses through air spaces; a thin leaf keeps the distance short. The cuticle reduces water loss; root hairs absorb water."},
  {"t":"b2E","c":"Starch test steps","type":"order","q":"Put the steps of the starch test on a leaf in the right order.","o":["Dip the leaf in boiling water","Warm the leaf in ethanol in a water bath","Rinse the leaf in water to soften it","Spread it out and add iodine solution"],"e":"Boiling water kills the cells, ethanol removes chlorophyll, rinsing softens the brittle leaf, then iodine shows where starch is."},
  {"t":"d1A","c":"Odd one out: chloroplasts","q":"Which cell is the odd one out because it has no chloroplasts?","o":["Root hair cell","Palisade cell","Spongy cell","Guard cell"],"e":"Palisade, spongy and guard cells all contain chloroplasts. Root hair cells are underground, where there is no light."},
  {"t":"b3N","c":"Temperature data","q":"Bubbles per minute from pondweed: 10 °C → 5, 20 °C → 12, 30 °C → 24, 40 °C → 30, 50 °C → 8. What is the best explanation for the result at 50 °C?","o":["The enzymes controlling photosynthesis are damaged at high temperature","At 50 °C the plant runs out of light to use","Hot water contains more carbon dioxide than cool water","The pondweed photosynthesises faster but makes no gas"],"e":"Photosynthesis speeds up as it gets warmer, but above the optimum the enzymes are denatured and the rate falls sharply."}
  ]},
{ n: 2, title: "Food and digestion", strand: "Biology", topics: "Nutrients, a balanced diet, deficiency diseases, the digestive system, enzymes, absorption",
  qs: [
  {"t":"d2A","c":"Why digest food","q":"Why must large food molecules such as starch and protein be digested?","o":["They are too large to pass through the wall of the small intestine into the blood","They contain no energy until enzymes have broken them into smaller pieces","They would dissolve the wall of the intestine if they were left undigested","The body can only use molecules that have first been mixed with water"],"e":"Digestion breaks large, insoluble molecules into small, soluble molecules. Only small molecules can be absorbed through the gut wall into the blood."},
  {"t":"d1A","c":"Mechanical digestion","q":"How does chewing food help digestion?","o":["It breaks food into smaller pieces, giving enzymes a larger surface area to work on","It turns starch into sugar by crushing the starch molecules between the teeth","It breaks proteins into amino acids, which can then be absorbed straight away","It warms the food to body temperature so the enzymes in saliva can start"],"e":"Chewing is mechanical digestion. It does not change the molecules, but smaller pieces have more surface for enzymes to act on, so chemical digestion is faster."},
  {"t":"e1K","c":"Enzyme products","q":"What are proteins broken down into during digestion?","o":["Amino acids","Glucose","Fatty acids and glycerol","Vitamins"],"e":"Protease enzymes break proteins into amino acids. Carbohydrase enzymes such as amylase break starch into sugars. Lipase breaks fats into fatty acids and glycerol."},
  {"t":"e2E","c":"Enzymes and temperature","q":"Amylase is mixed with starch at 5 °C, 37 °C and 90 °C. In which tube is starch digested fastest?","o":["37 °C, because human enzymes work best at about body temperature","90 °C, because higher temperatures always make reactions faster","5 °C, because enzymes are protected from damage","All three, because temperature does not affect enzymes"],"e":"Enzymes work fastest near their optimum temperature, which is about 37 °C for human enzymes. At 5 °C they work slowly. At 90 °C their shape is permanently changed (denatured), so they stop working."},
  {"t":"d2A","c":"Villi","q":"The small intestine is lined with millions of villi. How do they help?","o":["They give a huge surface area, with thin walls and a rich blood supply","They grind the food into smaller pieces so that enzymes can reach it","They produce stomach acid that kills bacteria before food is absorbed","They beat like tiny hairs, pushing food along to the large intestine"],"e":"Villi make the inner surface of the small intestine very large. Each one has a thin wall and many capillaries, so digested food can diffuse into the blood quickly."},
  {"t":"a1A","c":"Fibre","q":"Fibre is not digested and does not enter the blood. Why is it still an important part of a balanced diet?","o":["It adds bulk that helps food move through the gut and prevents constipation","It is the body's main source of energy, because it is digested slowly","It is needed to build new muscle cells after they have been damaged","It is changed into vitamins by bacteria in the large intestine"],"e":"Fibre gives the muscles of the intestine something to push against, which keeps food moving and prevents constipation."},
  {"t":"a2A","c":"Balanced diet depends on need","q":"Which person most needs a diet with more energy-rich food?","o":["A teenage athlete who trains for two hours each day","An adult who works at a desk all day","An elderly person who rarely exercises","Everyone needs exactly the same amount of energy"],"e":"A balanced diet depends on age, sex and how active a person is. Active, growing people use more energy and need more carbohydrate and fat."},
  {"t":"b2A","c":"Rickets","q":"A child has soft, weak leg bones that bend. Which deficiency is the most likely cause?","o":["Too little vitamin D or calcium","Too little vitamin C or protein","Too little iron or haemoglobin","Too little fibre or water"],"e":"Calcium is needed to build strong bones, and vitamin D helps the body absorb calcium. A lack of either causes rickets. Lack of vitamin C causes scurvy; lack of iron causes anaemia."},
  {"t":"b3A","c":"Anaemia","q":"Why does a person with iron-deficiency anaemia feel tired?","o":["Iron is needed to make haemoglobin, so less oxygen is carried to cells for respiration","Iron is the main source of energy in the diet, so less energy is released","Iron is needed to digest carbohydrates, so less glucose reaches the blood","Iron keeps muscles strong, so a lack of it makes every movement harder"],"e":"Haemoglobin in red blood cells carries oxygen and contains iron. With less haemoglobin, cells get less oxygen and release less energy by respiration."},
  {"t":"b2A","c":"Scurvy","q":"Sailors on long voyages long ago often got scurvy, with bleeding gums. Eating limes or oranges cured it. What does this show?","o":["Scurvy is caused by a lack of vitamin C, which citrus fruits contain","Scurvy is caused by bacteria that citrus fruits kill","Sailors were short of protein, which citrus fruits contain","Sailors were eating too much fat"],"e":"Citrus fruits are rich in vitamin C. Scurvy is a deficiency disease, so it is cured by supplying the missing nutrient."},
  {"t":"d1K","c":"Stomach acid","q":"What is one job of the hydrochloric acid in the stomach?","o":["It kills most bacteria in food","It digests starch into glucose","It absorbs water from food","It turns fats into protein"],"e":"Stomach acid kills many microorganisms in food. It also gives the right acidic conditions for the stomach's protease enzyme to work."},
  {"t":"d1K","c":"Large intestine","q":"What is the main job of the large intestine?","o":["Absorbing water from undigested food","Digesting protein with enzymes","Absorbing most of the glucose into the blood","Storing food before it is digested"],"e":"Most digested food is absorbed in the small intestine. The large intestine absorbs water from what is left. If food passes through too quickly, too little water is absorbed and diarrhoea results."},
  {"t":"a2A","c":"Energy in nutrients","q":"Why do people who need to lose weight often reduce the amount of fat they eat?","o":["One gram of fat contains about twice as much energy as one gram of carbohydrate","Fat cannot be digested at all, so it stays in the body and builds up","Fat contains no useful nutrients, so cutting it out loses nothing","Fat is turned directly into muscle, which weighs more than fat"],"e":"Fat is the most energy-dense nutrient. If energy taken in is more than energy used, the extra is stored as body fat. Some fat is still needed in a balanced diet."},
  {"t":"a1K","c":"Carbohydrates","q":"What is the main job of carbohydrates in the diet?","o":["To provide energy","To build and repair cells","To prevent deficiency diseases","To help food move through the gut"],"e":"Sugars and starch are the body's main fuel for respiration. Protein is for growth and repair; fibre keeps food moving."},
  {"t":"a1K","c":"Protein","q":"Why do growing children and people recovering from injury need plenty of protein?","o":["Protein is used to build new cells and repair damaged tissue","Protein is the quickest source of energy, and healing uses a lot of energy","Protein is stored as body fat, which protects injured parts of the body","Protein absorbs water in the gut, which keeps the body's cells hydrated"],"e":"Amino acids from protein are used to make new proteins for muscles, skin, enzymes and other tissues."},
  {"t":"a1K","c":"Fats","q":"Which is a job of fat in the body?","o":["Storing energy and insulating the body","Carrying oxygen in the blood","Building strong bones and teeth","Digesting starch in the gut"],"e":"Fat is a concentrated energy store. A layer under the skin helps reduce heat loss, and fat also protects some organs."},
  {"t":"a2A","c":"Water","q":"Why is water an essential part of the diet even though it contains no energy?","o":["Most chemical reactions in the body happen in solution, and water transports substances","It is digested into glucose in the small intestine and used for respiration","It is needed to build bones, which are made mostly of hardened water","It provides the vitamins that keep the body healthy and free from disease"],"e":"Cells are mostly water, blood plasma is mostly water and water is lost in sweat, urine and breath, so it must be replaced."},
  {"t":"c1E","c":"Starch test","q":"Iodine solution is added to a food and turns blue-black. What does this show?","o":["Starch is present","Sugar is present","Protein is present","Fat is present"],"e":"Iodine solution is orange-brown. It turns blue-black only if starch is present."},
  {"t":"c1E","c":"Sugar test","q":"Benedict's solution is added to a food solution and heated. It changes from blue to orange-red. What is present?","o":["A sugar, such as glucose","Starch, such as in bread","Protein, such as in egg","Fat, such as in butter"],"e":"Benedict's test needs heating. The more sugar there is, the further the colour goes from blue through green and yellow to orange-red."},
  {"t":"c1E","c":"Protein test","q":"Biuret solution is added to some egg white and turns purple. What does this show?","o":["Protein is present","Starch is present","Glucose is present","Fat is present"],"e":"Biuret solution is blue and turns purple (lilac) when protein is present. Egg white is rich in protein."},
  {"t":"c2E","c":"Fat test","q":"A food is rubbed on paper and leaves a see-through mark that does not dry. What does this suggest?","o":["The food contains fat","The food contains water","The food contains starch","The food contains sugar"],"e":"Water would leave a mark that dries and disappears. A translucent spot that stays shows fat."},
  {"t":"a2N","c":"Reading food labels","q":"Crisps contain 2200 kJ per 100 g. An apple contains 220 kJ per 100 g. What does this tell you?","o":["The same mass of crisps provides ten times as much energy as apple","Apples contain almost no energy, so they cannot be used as food","A packet of crisps weighs ten times as much as an apple does","Apples are a better source of fat, so they keep you full for longer"],"e":"Food labels compare foods per 100 g. Crisps are energy-dense because of their high fat content."},
  {"t":"b2A","c":"Malnutrition","q":"Which statement about malnutrition is correct?","o":["It means eating the wrong balance of food, which includes eating too much","It only means not having enough food to eat, so it is a lack of energy","It only affects people in poor countries, where food is hard to find","It is caused by eating too many fruits and vegetables and not enough meat"],"e":"Malnutrition is any unbalanced diet. Eating too much energy-rich food, leading to obesity, is also malnutrition."},
  {"t":"b2A","c":"Protein deficiency","q":"A child gets plenty of starchy food but very little protein. What is most likely to happen?","o":["The child's growth will be poor","The child will get scurvy","The child will have too much energy","The child will get rickets"],"e":"Without enough protein the body cannot build new tissue properly. Severe protein deficiency causes a disease called kwashiorkor."},
  {"t":"d1K","c":"Order of the gut","q":"Which order shows the path food takes?","o":["Mouth → oesophagus → stomach → small intestine → large intestine","Mouth → stomach → oesophagus → large intestine → small intestine","Mouth → oesophagus → small intestine → stomach → large intestine","Mouth → stomach → small intestine → oesophagus → large intestine"],"e":"The oesophagus carries food to the stomach. Digestion finishes and absorption happens in the small intestine. Water is absorbed in the large intestine."},
  {"t":"d2A","c":"Peristalsis","q":"Astronauts can swallow food in space, and you can swallow while upside down. Why?","o":["Muscles in the gut wall squeeze food along; gravity is not needed","Food is sucked down the oesophagus by the lungs when you breathe in","Saliva makes food sticky, so it slides down whichever way you face","Food is always pulled towards the stomach by a magnet-like force"],"e":"Waves of muscle contraction, called peristalsis, push food through the gut in one direction."},
  {"t":"d3A","c":"Bile","q":"Bile is made in the liver and released into the small intestine. What does it do to fats?","o":["It breaks fat into small droplets, giving a larger surface area for enzymes","It digests fat into fatty acids and glycerol, just like an enzyme","It turns fat into protein so that it can be used for growth","It absorbs fat into the blood through the wall of the intestine"],"e":"Bile is not an enzyme. It physically splits large fat globules into tiny droplets so that lipase can work faster."},
  {"t":"d2K","c":"Pancreas","q":"What does the pancreas contribute to digestion?","o":["It releases several digestive enzymes into the small intestine","It absorbs digested food from the small intestine into the blood","It stores bile and releases it whenever fatty food arrives","It produces the hydrochloric acid that kills bacteria in the stomach"],"e":"The pancreas makes enzymes that digest starch, protein and fat. They flow into the small intestine."},
  {"t":"e2A","c":"Saliva","q":"If you chew a piece of bread for a long time, it starts to taste sweet. Why?","o":["Amylase in saliva is breaking starch down into sugar","Saliva contains sugar","Bread turns into sugar when it is warm","Chewing makes your taste buds more sensitive"],"e":"Saliva contains the enzyme amylase. It begins the digestion of starch in the mouth."},
  {"t":"e1K","c":"Enzymes as catalysts","q":"Which statement about enzymes is correct?","o":["They speed up reactions and are not used up","They are a type of food","They are used up in the reactions they speed up","They are only found in the stomach"],"e":"Enzymes are biological catalysts made of protein. One enzyme molecule can be used again and again."},
  {"t":"e2A","c":"Enzymes are specific","q":"Amylase is added to a mixture of starch and protein. What happens?","o":["Only the starch is digested","Both starch and protein are digested","Only the protein is digested","Neither is digested"],"e":"Each enzyme works on one type of molecule. Its shape only fits that molecule, like a key fits one lock."},
  {"t":"d3E","c":"Visking tubing model","q":"Starch and glucose solution is put inside a bag of Visking tubing, standing in water. Later the water outside contains glucose but not starch. What does this model show?","o":["Small molecules can pass through the gut wall but large molecules cannot","Starch is digested by water, so it disappears from inside the bag","Glucose is made from starch when it touches the water outside the bag","The tubing absorbs starch into its walls and lets only glucose stay"],"e":"The tubing acts like the wall of the small intestine. Only small molecules fit through its tiny holes, which is why food must be digested."},
  {"t":"d2K","c":"Digestion vs absorption","q":"What is the difference between digestion and absorption?","o":["Digestion breaks food into small molecules; absorption moves them into the blood","Digestion happens in the blood; absorption happens in the mouth","They are the same process, given two names in different textbooks","Absorption breaks food down; digestion moves it into body cells"],"e":"First large molecules are digested, mainly in the mouth, stomach and small intestine. Then the small molecules are absorbed through the wall of the small intestine."},
  {"t":"d2K","c":"Assimilation","q":"After amino acids are absorbed, what happens to many of them?","o":["They are carried to cells and built into new proteins","They are sent back to the gut and turned into food again","They are broken down in the lungs and breathed out","They are joined together and stored in the liver as starch"],"e":"Using absorbed food molecules to build the body is called assimilation."},
  {"t":"d1K","c":"Teeth","q":"Which type of tooth is best for grinding food?","o":["Molars","Incisors","Canines","All teeth grind equally"],"e":"Incisors at the front cut and bite. Canines grip and tear. Molars and premolars at the back have broad surfaces for grinding."},
  {"t":"b2A","c":"Tooth decay","q":"Why do sugary snacks between meals increase tooth decay?","o":["Bacteria on teeth feed on sugar and make acid that dissolves enamel","Sugar crystals are harder than enamel, so they scratch the teeth","Sugar stops saliva being made, so teeth dry out and crack","Sugar is itself a strong acid that dissolves the enamel"],"e":"Every time you eat sugar, bacteria in plaque produce acid for a while. Frequent snacks keep teeth under acid attack for longer."},
  {"t":"a2A","c":"Energy balance","q":"A person regularly takes in more energy in food than they use. What will happen?","o":["They will gain mass, as the extra energy is stored as fat","They will lose mass, because digesting extra food uses up energy","Nothing will happen, because extra energy is breathed out as heat","Their extra energy will be stored as vitamins in the liver"],"e":"Energy in that is greater than energy out leads to weight gain. Energy out that is greater than energy in leads to weight loss."},
  {"t":"a1K","c":"Vitamins and minerals","q":"Vitamins and minerals are needed only in small amounts. What is their role?","o":["They keep the body healthy and help it work properly, but do not provide energy","They are the main source of energy, because they are needed every day","They are used to build most of the body's muscle and other tissues","They add bulk to food, which helps it move through the gut"],"e":"Small amounts are essential. A lack of one causes a specific deficiency disease, such as scurvy or rickets."},
  {"t":"d3A","c":"Glucose needs no digestion","q":"Why does a glucose drink give an athlete energy very quickly?","o":["Glucose is already a small molecule, so it can be absorbed without being digested","Glucose is digested in the mouth by saliva, before it reaches the stomach","Glucose contains more energy per gram than any other food, including fat","Glucose goes straight to the muscles from the stomach without entering blood"],"e":"Starch has to be broken down into sugars first. Glucose is absorbed directly from the small intestine into the blood."},
  {"t":"d1K","c":"Egestion","q":"What happens to the undigested food left at the end of the large intestine?","o":["It leaves the body as faeces through the anus (egestion)","It is absorbed into the blood through the wall of the rectum","It is carried to the liver, where it is digested a second time","It is stored in the large intestine and used when food runs out"],"e":"Food that is never digested, such as fibre, passes out of the body. Removing it is called egestion."},
  {"t":"e3E","c":"Timing digestion","q":"Amylase is mixed with starch. Every 30 s a drop is tested with iodine. At 37 °C the iodine stops turning blue-black after 2 minutes; at 20 °C, after 6 minutes. What does this show?","o":["Amylase digests starch faster at 37 °C than at 20 °C","Amylase digests starch faster at 20 °C than at 37 °C","Iodine does not work properly at lower temperatures","Starch is made faster at higher temperatures"],"e":"When iodine stops turning blue-black, all the starch has gone. Less time means faster digestion."},
  {"t":"e2E","c":"Control tube","q":"In the amylase experiment, one tube has starch and water but no amylase. What is it for?","o":["To show the starch is broken down by amylase, not by anything else","To show that iodine reacts with amylase as well as starch","To make the experiment finish more quickly","To give the amylase some extra starch to digest"],"e":"If the control stays blue-black, you know the change in the other tube was caused by the enzyme."},
  {"t":"d1K","c":"Where food is absorbed","q":"Where is most digested food absorbed into the blood?","o":["Small intestine","Stomach","Large intestine","Oesophagus"],"e":"The small intestine is long and lined with villi, giving a huge surface area for absorption."},
  {"t":"d3A","c":"Length of the small intestine","q":"The small intestine is about 6 metres long. How does its length help?","o":["It gives time and area for digestion and absorption","It stores food until the body needs the energy","It lets food cool down before it is absorbed","It stops bacteria reaching the large intestine"],"e":"Food moves through slowly, so enzymes have time to finish digestion and there is a large area for absorption."},
  {"t":"d2A","c":"Damaged villi","q":"In some illnesses the villi become flattened. Why might the person lose weight even if they eat well?","o":["The surface area is smaller, so less digested food is absorbed","The flattened villi digest food too quickly to be used","Food stays in the stomach for much longer than usual","The large intestine absorbs too much water from food"],"e":"Less surface area means less absorption. Much of the digested food passes out of the body unused."},
  {"t":"a2A","c":"Vegetarian protein","q":"Which meal is the best source of protein for a vegetarian?","o":["Lentil curry with rice","A bowl of fruit salad","Bread with butter and jam","A green salad with an oil dressing"],"e":"Lentils, beans, nuts, eggs and dairy are good protein sources for vegetarians."},
  {"t":"a2N","c":"Reading a serving size","q":"A cereal has 8 g of protein per 100 g. How much protein is in a 40 g serving?","o":["3.2 g","8 g","20 g","0.32 g"],"e":"40 g is 0.4 of 100 g, so 0.4 × 8 g = 3.2 g."},
  {"t":"a3A","c":"Babies and protein","q":"Babies need more protein for each kilogram of body mass than adults do. Why?","o":["Babies grow very quickly, building lots of new tissue","Babies cannot digest carbohydrates at all","Babies use protein as their main source of energy","Babies lose most of their protein in tears"],"e":"Protein provides the amino acids used to build new cells. The faster you grow, the more you need."},
  {"t":"b2A","c":"Obesity","q":"Why is obesity a risk to health?","o":["It raises the risk of heart disease and diabetes","It causes deficiency diseases such as scurvy","It stops the body absorbing any vitamins at all","It makes the bones too strong and heavy to bend"],"e":"Too much body fat puts strain on the heart and joints and is linked to type 2 diabetes and high blood pressure."},
  {"t":"b2A","c":"One-food diet","q":"A person eats only white rice for months. Which problem is most likely?","o":["Deficiency diseases from too few vitamins and protein","Obesity caused by eating far too much protein","Scurvy caused by eating too much starch every day","Anaemia caused by eating too much fibre every day"],"e":"Rice provides energy but little protein and few vitamins or minerals, so the diet is unbalanced."},
  {"t":"c2E","c":"Interpreting food tests","q":"A food gives these results: iodine turns blue-black, Benedict's stays blue, biuret turns purple. What does the food contain?","o":["Starch and protein, but no sugar","Sugar and protein, but no starch","Starch and sugar, but no protein","Only fat, with no starch or protein"],"e":"Each test detects one nutrient. Blue-black = starch, purple = protein. Benedict's staying blue means no reducing sugar."},
  {"t":"c2E","c":"Benedict's must be heated","q":"A student forgets to heat the Benedict's test. The glucose solution stays blue. Why?","o":["The test only works when the mixture is heated","Glucose only dissolves in hot water","Benedict's solution reacts with cold starch instead","Heating is only needed for safety reasons"],"e":"Benedict's solution needs heating in a hot water bath before it changes colour with sugar."},
  {"t":"d1K","c":"Oesophagus","q":"What does the oesophagus do?","o":["Carries food from the mouth to the stomach","Digests protein with enzymes and acid","Absorbs water from undigested food","Makes bile to break up fat droplets"],"e":"Muscles in the wall of the oesophagus push food down to the stomach by peristalsis."},
  {"t":"d2K","c":"Gall bladder","q":"Where is bile stored before it is released into the small intestine?","o":["Gall bladder","Pancreas","Stomach","Large intestine"],"e":"Bile is made in the liver and stored in the gall bladder until fatty food arrives."},
  {"t":"e2A","c":"Same idea twice","q":"Chewing food, and bile acting on fat, both help digestion in the same way. How?","o":["They increase the surface area for enzymes to act on","They both digest food into small molecules","They both add enzymes to the food","They both kill bacteria in the food"],"e":"Neither breaks molecules apart. Both make smaller pieces or droplets so enzymes work faster."},
  {"t":"e3A","c":"Washing powders","q":"Biological washing powders contain enzymes. Why do they work poorly in very hot washes?","o":["High temperatures denature the enzymes, so they stop working","Enzymes need cold water before they will dissolve","Hot water washes the enzymes out of the clothes","Hot water makes the stains too large to digest"],"e":"Like digestive enzymes, these enzymes have an optimum temperature, usually around 30–40 °C."},
  {"t":"d2K","c":"Organs food does not pass through","q":"Which organs are part of the digestive system even though food does not pass through them?","o":["The liver and the pancreas","The stomach and the oesophagus","The small and large intestines","The mouth and the rectum"],"e":"The liver and pancreas make substances (bile and enzymes) that flow into the small intestine."},
  {"t":"a2A","c":"Drinking on hot days","q":"On a hot day you sweat a lot. Why should you drink more?","o":["To replace water lost in sweat, which the body needs","Because water gives you energy to cool down","Because sweat contains most of your vitamins","Because water helps digest protein faster"],"e":"Losing water without replacing it causes dehydration. Water is needed for transport, reactions and keeping cool."},
  {"t":"b2A","c":"Food for anaemia","q":"Which foods would help someone with iron-deficiency anaemia?","o":["Spinach and red meat","Oranges and lemons","Butter and cream","White bread and rice"],"e":"Spinach, beans and red meat are good sources of iron. Citrus fruits are rich in vitamin C."},
  {"t":"a2A","c":"Fibre","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Fibre is an important part of a healthy diet.","R":"Fibre is digested into glucose in the small intestine.","a":2,"e":"Fibre is important, but humans cannot digest it. It helps food move through the gut."},
