<style>
/* Layout: exam-paper column. Unit index as a ruled list; each test runs one question at a time with instant "why" feedback. */
:root {
  --bg: #f2f4f3;
  --paper: #ffffff;
  --ink: #17202a;
  --muted: #5b6670;
  --rule: #d9dfdd;
  --accent: #23408e;
  --bio: #2c7a4b;
  --chem: #a33b67;
  --phys: #2a5fb3;
  --good: #1f7a45;
  --good-bg: #e3f3e9;
  --bad: #b3261e;
  --bad-bg: #fbe7e5;
  --warn: #8a5a00;
  --warn-bg: #fbf0d9;
  --shadow: 0 1px 2px rgba(23,32,42,.06), 0 4px 16px rgba(23,32,42,.05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --paper: #19212a; --ink: #e6ebef; --muted: #9aa6b1; --rule: #2b3540;
    --accent: #8fa8ff; --bio: #5fc58a; --chem: #e57fab; --phys: #7aa8f5;
    --good: #6fd39a; --good-bg: #173226; --bad: #ff8a80; --bad-bg: #3a1c1b; --warn: #f2c464; --warn-bg: #352b14;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --paper: #19212a; --ink: #e6ebef; --muted: #9aa6b1; --rule: #2b3540;
  --accent: #8fa8ff; --bio: #5fc58a; --chem: #e57fab; --phys: #7aa8f5;
  --good: #6fd39a; --good-bg: #173226; --bad: #ff8a80; --bad-bg: #3a1c1b; --warn: #f2c464; --warn-bg: #352b14;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.45rem; font-weight: 700; }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
header.top { display: grid; gap: 10px; margin-bottom: 28px; }
header.top .lede { color: var(--muted); max-width: 60ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 4px; font-size: .9rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); display: inline-block; }

/* Unit index */
.units { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.unit-row { border-bottom: 1px solid var(--rule); }
.unit-btn { width: 100%; background: none; border: 0; text-align: left; display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 14px; align-items: start; padding: 16px 4px; }
.unit-btn:hover { background: color-mix(in srgb, var(--c) 6%, transparent); }
.unit-no { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.unit-main { min-width: 0; display: grid; gap: 4px; }
.unit-title { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; }
.unit-topics { color: var(--muted); font-size: .92rem; }
.unit-meta { display: grid; justify-items: end; gap: 6px; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); white-space: nowrap; }
.strand { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--c); border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
.best { font-variant-numeric: tabular-nums; }
.best.secure { color: var(--good); }
.best.developing { color: var(--warn); }
.best.revisit { color: var(--bad); }
.mixed { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; }
.mixed p { color: var(--muted); font-size: .95rem; min-width: 0; flex: 1 1 260px; }

/* Buttons */
.btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 10px 18px; font-weight: 700; }
.btn:hover { opacity: .9; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: .92rem; }
.link:hover { color: var(--ink); text-decoration: underline; }

/* Quiz */
.qbar { display: grid; gap: 10px; margin-bottom: 20px; }
.qbar-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.progress { height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--c); width: 0; transition: width .3s ease; }
.tally { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 28px); display: grid; gap: 18px; }
.qhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.qtext { font-size: 1.15rem; font-weight: 700; line-height: 1.45; }
.options { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: start; text-align: left; background: transparent; border: 1.5px solid var(--rule); border-radius: 9px; padding: 11px 12px; }
.opt:hover:not(:disabled) { border-color: var(--c); }
.opt:disabled { cursor: default; }
.opt .key { font-family: var(--f-mono); font-weight: 500; width: 1.7rem; height: 1.7rem; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--rule); font-size: .85rem; }
.opt span:last-child { min-width: 0; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .key { background: var(--good); color: var(--paper); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: var(--paper); border-color: var(--bad); }
.opt.dim { opacity: .55; }
.why { border-left: 4px solid var(--fb); background: color-mix(in srgb, var(--fb) 8%, transparent); padding: 12px 14px; border-radius: 0 8px 8px 0; display: grid; gap: 4px; }
.why strong { color: var(--fb); font-family: var(--f-display); }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hint { font-size: .82rem; color: var(--muted); }

/* Results */
.result-head { display: grid; gap: 6px; }
.score { font-family: var(--f-display); font-weight: 800; font-size: clamp(3rem, 12vw, 4.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .35em; color: var(--muted); font-weight: 500; }
.band { justify-self: start; font-family: var(--f-mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.band.secure { color: var(--good); background: var(--good-bg); }
.band.developing { color: var(--warn); background: var(--warn-bg); }
.band.revisit { color: var(--bad); background: var(--bad-bg); }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.review li { border-top: 1px solid var(--rule); padding-top: 12px; display: grid; gap: 4px; }
.review .ans { font-size: .93rem; }
.review .ans b { color: var(--good); }
.review .ans s { color: var(--bad); }
.review .exp { color: var(--muted); font-size: .93rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.note { margin-top: 28px; font-size: .85rem; color: var(--muted); max-width: 62ch; }
@media (max-width: 520px) {
  .unit-btn { grid-template-columns: 2.4rem 1fr; }
  .unit-meta { grid-column: 2; justify-items: start; grid-auto-flow: column; justify-content: start; gap: 10px; }
  .unit-no { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const STRANDS = { Biology: "var(--bio)", Chemistry: "var(--chem)", Physics: "var(--phys)" };

/* Each question: c = concept, q = question, o = options (correct answer first; shuffled on screen), e = explanation */
const UNITS = [
{ n: 1, title: "Plants", strand: "Biology", topics: "Photosynthesis, testing leaves for starch, leaf structure, water and minerals, roots",
  qs: [
  { c: "Where plant mass comes from", q: "A seedling with a mass of 1 g grows into a plant with a mass of 500 g. Where did most of the extra mass come from?",
    o: ["Carbon dioxide from the air and water, turned into glucose by photosynthesis", "Soil taken in through the roots", "Energy from sunlight that has been turned into matter", "Minerals such as nitrates absorbed from the soil"],
    e: "Photosynthesis builds glucose from carbon dioxide and water, and glucose is used to make the rest of the plant. The soil supplies only small amounts of minerals. Light provides energy, not mass." },
  { c: "Photosynthesis equation", q: "Which word equation correctly describes photosynthesis?",
    o: ["carbon dioxide + water → glucose + oxygen (using light and chlorophyll)", "glucose + oxygen → carbon dioxide + water (using light)", "oxygen + water → glucose + carbon dioxide (using chlorophyll)", "carbon dioxide + oxygen → glucose + water (using light)"],
    e: "The reactants are carbon dioxide and water. Light energy is absorbed by chlorophyll, and the products are glucose and oxygen. The reverse equation is respiration." },
  { c: "Why test for starch", q: "When we want to know whether a leaf has been photosynthesising, why do we test it for starch rather than for glucose?",
    o: ["Glucose made in the leaf is quickly turned into starch for storage", "Leaves never contain any glucose", "Starch is the gas given off during photosynthesis", "Iodine solution only works on living cells"],
    e: "Glucose is soluble and is quickly converted into insoluble starch to be stored. Starch builds up in the leaf, so it is a reliable sign that photosynthesis has happened." },
  { c: "Destarching (controls)", q: "Before an experiment, a plant is kept in the dark for 48 hours. What is the purpose of this?",
    o: ["To use up the starch already in its leaves, so any starch found later was made during the experiment", "To make the plant photosynthesise faster when it is put back in the light", "To kill the leaf cells so that iodine can get in", "To make the leaves produce more chlorophyll"],
    e: "In the dark the plant cannot photosynthesise, so it uses up its stored starch. Any starch found at the end must have been made during the experiment. This makes the test fair." },
  { c: "Chlorophyll is needed", q: "A variegated leaf has green parts and white parts. After a day in bright light it is tested with iodine. What result do you expect?",
    o: ["Only the green parts turn blue-black", "The whole leaf turns blue-black", "Only the white parts turn blue-black", "No part turns blue-black, because variegated leaves cannot make starch"],
    e: "Only the green parts contain chlorophyll, which absorbs the light energy needed for photosynthesis. The white parts have no chlorophyll, so they make no starch and stay orange-brown." },
  { c: "Starch test method", q: "In the starch test, why is the leaf placed in hot ethanol before iodine is added?",
    o: ["To remove the green chlorophyll so the colour change can be seen clearly", "To turn the glucose in the leaf into starch", "To add the energy needed for the iodine to react", "To keep the leaf cells alive during the test"],
    e: "Ethanol dissolves chlorophyll and makes the leaf pale. Without this step, the green colour would hide the blue-black colour of iodine reacting with starch." },
  { c: "Light intensity and rate", q: "A student counts oxygen bubbles from pondweed with a lamp at different distances. Moving the lamp closer increases the number of bubbles per minute. Which conclusion is best?",
    o: ["The rate of photosynthesis increases as light intensity increases", "Pondweed only photosynthesises when a lamp is very close", "The bubbles are carbon dioxide, which increases with light", "The pondweed respires faster when the lamp is closer"],
    e: "The bubbles are oxygen, a product of photosynthesis. A closer lamp means brighter light, so more bubbles means a faster rate. Light intensity is the independent variable in this investigation." },
  { c: "Leaf shape and function", q: "Most leaves are broad and thin. How does this help photosynthesis?",
    o: ["A large surface area absorbs plenty of light, and gases only have a short distance to diffuse", "It makes the leaf lighter so the plant does not fall over", "It stops water from reaching the leaf cells", "It lets the leaf store more starch in its cells"],
    e: "A broad leaf traps more light. A thin leaf means carbon dioxide can diffuse quickly from the air spaces to every cell that has chloroplasts." },
  { c: "Stomata", q: "Why are most stomata found on the lower surface of a leaf?",
    o: ["They let gases in and out while losing less water, because the lower surface is cooler and shaded", "Light can only enter the leaf through the lower surface", "Roots push water up through the lower surface", "Chlorophyll is only found in the lower surface"],
    e: "Stomata let carbon dioxide in and oxygen out, but water vapour also escapes through them. The lower surface is cooler and out of direct sun, so less water is lost there." },
  { c: "Palisade cells", q: "Palisade cells are packed just below the upper surface of a leaf and contain many chloroplasts. Why is this a good arrangement?",
    o: ["They are in the position that receives the most light", "They are closest to the stomata for taking in water", "They protect the leaf from insects", "They store all the minerals the leaf needs"],
    e: "Light falls on the upper surface, so cells placed there with many chloroplasts can absorb the most light for photosynthesis." },
  { c: "Root hair cells", q: "Root hair cells have a long, thin extension. What is the main advantage of this shape?",
    o: ["It gives a large surface area for absorbing water and minerals from the soil", "It lets the root make glucose in the dark", "It anchors the plant by growing into rocks", "It allows the root to take in carbon dioxide for photosynthesis"],
    e: "A larger surface area in contact with the soil means water and dissolved minerals can be absorbed faster. Root hair cells have no chloroplasts because they are underground." },
  { c: "Minerals", q: "A plant has yellow leaves even though it has plenty of light and water. A lack of which mineral is most likely?",
    o: ["Magnesium, because it is needed to make chlorophyll", "Glucose, because it is needed to make leaves", "Oxygen, because it is needed for photosynthesis", "Carbon, because it is needed to make roots"],
    e: "Chlorophyll molecules contain magnesium. Without enough magnesium the plant makes less chlorophyll and its leaves turn yellow. Nitrates are needed to make proteins for growth." },
  { c: "Plants also respire", q: "What is happening in a plant's leaves at night?",
    o: ["Respiration continues, using oxygen and releasing carbon dioxide", "Nothing, because plants only respire during the day", "Photosynthesis continues, using stored light", "The leaves take in oxygen and release glucose"],
    e: "All living cells respire all the time. In daylight, photosynthesis is usually faster than respiration so a plant gives out oxygen overall. At night only respiration happens, so the plant gives out carbon dioxide." }
  ]},
{ n: 2, title: "Food and digestion", strand: "Biology", topics: "Nutrients, a balanced diet, deficiency diseases, the digestive system, enzymes, absorption",
  qs: [
  { c: "Why digest food", q: "Why must large food molecules such as starch and protein be digested?",
    o: ["They are too large to pass through the wall of the small intestine into the blood", "They contain no energy until they are broken down", "They would dissolve the wall of the intestine", "The body can only use molecules that contain water"],
    e: "Digestion breaks large, insoluble molecules into small, soluble molecules. Only small molecules can be absorbed through the gut wall into the blood." },
  { c: "Mechanical digestion", q: "How does chewing food help digestion?",
    o: ["It breaks food into smaller pieces, giving enzymes a larger surface area to work on", "It turns starch into sugar", "It breaks proteins into amino acids", "It absorbs nutrients into the blood through the teeth"],
    e: "Chewing is mechanical digestion. It does not change the molecules, but smaller pieces have more surface for enzymes to act on, so chemical digestion is faster." },
  { c: "Enzyme products", q: "What are proteins broken down into during digestion?",
    o: ["Amino acids", "Glucose", "Fatty acids and glycerol", "Vitamins"],
    e: "Protease enzymes break proteins into amino acids. Carbohydrase enzymes such as amylase break starch into sugars. Lipase breaks fats into fatty acids and glycerol." },
  { c: "Enzymes and temperature", q: "Amylase is mixed with starch at 5 °C, 37 °C and 90 °C. In which tube is starch digested fastest?",
    o: ["37 °C, because human enzymes work best at about body temperature", "90 °C, because higher temperatures always make reactions faster", "5 °C, because enzymes are protected from damage", "All three, because temperature does not affect enzymes"],
    e: "Enzymes work fastest near their optimum temperature, which is about 37 °C for human enzymes. At 5 °C they work slowly. At 90 °C their shape is permanently changed (denatured), so they stop working." },
  { c: "Villi", q: "The small intestine is lined with millions of villi. How do they help?",
    o: ["They give a very large surface area, with thin walls and a good blood supply, for absorption", "They grind food into smaller pieces", "They produce stomach acid to kill bacteria", "They push food along by beating like hairs"],
    e: "Villi make the inner surface of the small intestine very large. Each one has a thin wall and many capillaries, so digested food can diffuse into the blood quickly." },
  { c: "Fibre", q: "Fibre is not digested and does not enter the blood. Why is it still an important part of a balanced diet?",
    o: ["It adds bulk that helps food move through the gut and prevents constipation", "It is the body's main source of energy", "It is needed to build new muscle", "It is changed into vitamins in the large intestine"],
    e: "Fibre gives the muscles of the intestine something to push against, which keeps food moving and prevents constipation." },
  { c: "Balanced diet depends on need", q: "Which person most needs a diet with more energy-rich food?",
    o: ["A teenage athlete who trains for two hours each day", "An adult who works at a desk all day", "An elderly person who rarely exercises", "Everyone needs exactly the same amount of energy"],
    e: "A balanced diet depends on age, sex and how active a person is. Active, growing people use more energy and need more carbohydrate and fat." },
  { c: "Rickets", q: "A child has soft, weak leg bones that bend. Which deficiency is the most likely cause?",
    o: ["Too little vitamin D or calcium", "Too little vitamin C", "Too little iron", "Too little fibre"],
    e: "Calcium is needed to build strong bones, and vitamin D helps the body absorb calcium. A lack of either causes rickets. Lack of vitamin C causes scurvy; lack of iron causes anaemia." },
  { c: "Anaemia", q: "Why does a person with iron-deficiency anaemia feel tired?",
    o: ["Iron is needed to make haemoglobin, so less oxygen is carried to cells for respiration", "Iron is the main source of energy in the diet", "Iron is needed to digest carbohydrates", "Iron keeps the bones strong for movement"],
    e: "Haemoglobin in red blood cells carries oxygen and contains iron. With less haemoglobin, cells get less oxygen and release less energy by respiration." },
  { c: "Scurvy", q: "Sailors on long voyages long ago often got scurvy, with bleeding gums. Eating limes or oranges cured it. What does this show?",
    o: ["Scurvy is caused by a lack of vitamin C, which citrus fruits contain", "Scurvy is caused by bacteria that citrus fruits kill", "Sailors were short of protein, which citrus fruits contain", "Sailors were eating too much fat"],
    e: "Citrus fruits are rich in vitamin C. Scurvy is a deficiency disease, so it is cured by supplying the missing nutrient." },
  { c: "Stomach acid", q: "What is one job of the hydrochloric acid in the stomach?",
    o: ["It kills most bacteria in food", "It digests starch into glucose", "It absorbs water from food", "It turns fats into protein"],
    e: "Stomach acid kills many microorganisms in food. It also gives the right acidic conditions for the stomach's protease enzyme to work." },
  { c: "Large intestine", q: "What is the main job of the large intestine?",
    o: ["Absorbing water from undigested food", "Digesting protein with enzymes", "Absorbing most of the glucose into the blood", "Storing food before it is digested"],
    e: "Most digested food is absorbed in the small intestine. The large intestine absorbs water from what is left. If food passes through too quickly, too little water is absorbed and diarrhoea results." },
  { c: "Energy in nutrients", q: "Why do people who need to lose weight often reduce the amount of fat they eat?",
    o: ["One gram of fat contains about twice as much energy as one gram of carbohydrate", "Fat cannot be digested and stays in the body", "Fat contains no useful nutrients at all", "Fat is turned directly into muscle"],
    e: "Fat is the most energy-dense nutrient. If energy taken in is more than energy used, the extra is stored as body fat. Some fat is still needed in a balanced diet." }
  ]},
{ n: 3, title: "The circulatory system", strand: "Biology", topics: "The heart, double circulation, arteries, veins and capillaries, blood",
  qs: [
  { c: "Artery structure", q: "Why do arteries have thick walls containing muscle and elastic tissue?",
    o: ["They carry blood at high pressure, pumped directly from the heart", "They carry blood at very low pressure back to the heart", "They need to let substances diffuse through their walls", "They store blood when the body is resting"],
    e: "Each heartbeat pushes blood into the arteries at high pressure. Thick, stretchy walls withstand this pressure and help smooth out the flow." },
  { c: "Valves in veins", q: "Veins contain valves but arteries (apart from where they leave the heart) do not. Why?",
    o: ["Blood in veins is at low pressure, so valves stop it flowing backwards", "Valves make blood in veins move faster than in arteries", "Valves let oxygen into the blood in veins", "Veins carry blood away from the heart and need valves to push it"],
    e: "By the time blood reaches the veins, its pressure is low. Valves make sure it only flows towards the heart, especially in the legs." },
  { c: "Capillaries", q: "Capillary walls are only one cell thick. Why is this important?",
    o: ["Substances such as oxygen and glucose can diffuse quickly between blood and cells", "Blood can flow through them at very high pressure", "They can contract to pump blood around the body", "It stops white blood cells from leaving the blood"],
    e: "Capillaries are where exchange happens. A very thin wall means only a short distance for diffusion between the blood and the body's cells." },
  { c: "Ventricle walls", q: "The wall of the left ventricle is much thicker than the wall of the right ventricle. Why?",
    o: ["The left ventricle pumps blood all around the body, but the right only pumps to the lungs", "The left ventricle holds deoxygenated blood, which is heavier", "The right ventricle does not need to pump blood at all", "The left ventricle receives blood from the lungs at high pressure"],
    e: "Pushing blood around the whole body needs a much higher pressure than pushing it to the nearby lungs, so the left ventricle has more muscle." },
  { c: "Arteries defined by direction", q: "The pulmonary artery carries deoxygenated blood. Why is it still called an artery?",
    o: ["Arteries are vessels that carry blood away from the heart", "Arteries are vessels that carry deoxygenated blood", "All vessels connected to the lungs are arteries", "It has valves along its length"],
    e: "Arteries carry blood away from the heart and veins carry it back. The pulmonary artery takes deoxygenated blood from the heart to the lungs. The pulmonary vein brings oxygenated blood back." },
  { c: "Double circulation", q: "Which route does blood take in the human double circulation, starting from the body?",
    o: ["Body → right side of heart → lungs → left side of heart → body", "Body → left side of heart → lungs → right side of heart → body", "Body → lungs → right side of heart → left side of heart → body", "Body → right side of heart → left side of heart → lungs → body"],
    e: "Blood passes through the heart twice in one full circuit. The right side sends it to the lungs to collect oxygen. It returns to the left side, which pumps it around the body." },
  { c: "Red blood cells", q: "Red blood cells have no nucleus. How does this help them do their job?",
    o: ["There is more space for haemoglobin, so each cell can carry more oxygen", "It lets them destroy bacteria more easily", "It allows them to divide quickly to make new cells", "It helps them form blood clots"],
    e: "Red blood cells are packed with haemoglobin, which carries oxygen. Their biconcave disc shape also gives a large surface area for oxygen to diffuse in and out." },
  { c: "Plasma", q: "Which list shows substances carried dissolved in the plasma?",
    o: ["Glucose, carbon dioxide, urea and hormones", "Oxygen, haemoglobin and platelets", "Red blood cells and white blood cells", "Starch, protein and fat molecules"],
    e: "Plasma is the liquid part of blood. It carries digested food such as glucose, waste such as carbon dioxide and urea, and hormones. Most oxygen is carried by haemoglobin in red cells." },
  { c: "Platelets", q: "You cut your finger. Which part of the blood helps stop the bleeding?",
    o: ["Platelets, which help form a clot", "Red blood cells, which carry oxygen to the cut", "Plasma, which washes the cut clean", "White blood cells, which seal the skin"],
    e: "Platelets are cell fragments that help blood clot. The clot seals the wound and stops blood loss and microorganisms entering." },
  { c: "White blood cells", q: "What is the main job of white blood cells?",
    o: ["Defending the body against pathogens such as bacteria and viruses", "Carrying oxygen from the lungs", "Carrying digested food to cells", "Making the heart beat"],
    e: "Some white blood cells engulf pathogens. Others make antibodies that help destroy them." },
  { c: "Heart rate and exercise", q: "Why does your heart rate increase when you exercise?",
    o: ["Muscles need oxygen and glucose delivered faster, and carbon dioxide removed faster", "The heart needs to cool the body down", "Blood becomes thicker during exercise", "The lungs stop working during exercise"],
    e: "Working muscles respire faster. A faster heartbeat delivers more oxygen and glucose to them and removes carbon dioxide more quickly." },
  { c: "Coronary arteries", q: "A fatty blockage forms in a coronary artery. Why can this cause a heart attack?",
    o: ["Part of the heart muscle does not get enough oxygen and glucose, so it stops working", "Blood can no longer reach the lungs", "The heart chambers fill with fat", "The valves in the heart can no longer close"],
    e: "Heart muscle has its own blood supply through the coronary arteries. If this is blocked, the muscle cannot respire and that part of the heart can die." },
  { c: "Pulmonary vein", q: "Where does the pulmonary vein carry blood, and what kind of blood is it?",
    o: ["From the lungs to the heart; oxygenated blood", "From the heart to the lungs; deoxygenated blood", "From the body to the heart; deoxygenated blood", "From the heart to the body; oxygenated blood"],
    e: "Veins carry blood towards the heart. The pulmonary vein brings blood that has just collected oxygen in the lungs back to the left atrium." }
  ]},
{ n: 4, title: "Respiration", strand: "Biology", topics: "Aerobic respiration, gas exchange, breathing, smoking and health",
  qs: [
  { c: "Respiration vs breathing", q: "Which statement correctly describes the difference between respiration and breathing?",
    o: ["Respiration is a chemical reaction in cells that releases energy; breathing moves air in and out of the lungs", "They are two words for the same process", "Breathing happens in all cells; respiration happens only in the lungs", "Respiration is breathing out; breathing is breathing in"],
    e: "Respiration happens in every living cell and releases energy from glucose. Breathing is the movement of air that supplies oxygen and removes carbon dioxide." },
  { c: "Respiration equation", q: "Which word equation shows aerobic respiration?",
    o: ["glucose + oxygen → carbon dioxide + water", "carbon dioxide + water → glucose + oxygen", "glucose + carbon dioxide → oxygen + water", "oxygen + water → glucose + carbon dioxide"],
    e: "Aerobic respiration uses glucose and oxygen and releases energy, with carbon dioxide and water as waste products. Photosynthesis is the reverse reaction." },
  { c: "Where respiration happens", q: "Which cells carry out respiration?",
    o: ["All living cells, including plant cells and microorganisms", "Only cells in the lungs", "Only animal cells", "Only muscle cells during exercise"],
    e: "Every living cell needs energy, so every living cell respires, all the time. In plant and animal cells it happens in the mitochondria." },
  { c: "Alveoli", q: "Which set of features makes the alveoli good at gas exchange?",
    o: ["Very large total surface area, thin walls and a rich blood supply", "Thick walls, few capillaries and a dry surface", "Muscular walls that pump air into the blood", "A small surface area so gases do not escape"],
    e: "Millions of alveoli give a huge surface area. Their walls and the capillary walls are one cell thick, and the blood flow keeps the concentration difference high." },
  { c: "Composition of breath", q: "Compared with inhaled air, exhaled air contains:",
    o: ["less oxygen and more carbon dioxide, but still quite a lot of oxygen", "no oxygen at all and only carbon dioxide", "more oxygen and less carbon dioxide", "the same amounts of oxygen and carbon dioxide"],
    e: "Inhaled air has about 21% oxygen and exhaled air about 16%. Carbon dioxide rises from about 0.04% to about 4%. This leftover oxygen is why rescue breathing works." },
  { c: "Breathing mechanism", q: "What happens when you breathe in?",
    o: ["The diaphragm contracts and flattens, the ribs move up and out, chest volume increases and air flows in", "The lungs expand by themselves and suck air in", "The diaphragm relaxes and moves up, pushing air into the lungs", "The ribs move down and in, squeezing air into the lungs"],
    e: "Muscles make the chest cavity bigger. This lowers the pressure inside the lungs, so air from outside, at higher pressure, flows in. The lungs have no muscle of their own." },
  { c: "Testing breath", q: "Air is breathed out through limewater in one tube and room air is bubbled through limewater in another. The first tube turns milky much faster. What does this show?",
    o: ["Exhaled air contains more carbon dioxide than room air", "Exhaled air contains more oxygen than room air", "Exhaled air contains no water vapour", "Room air contains no carbon dioxide"],
    e: "Limewater turns milky with carbon dioxide. Room air has a little carbon dioxide, so it changes slowly. Exhaled air has much more, so it changes quickly." },
  { c: "Smoking and cilia", q: "Smokers often have a cough and get chest infections. Which explanation is correct?",
    o: ["Tar damages the cilia, so mucus and trapped bacteria are not swept away from the lungs", "Nicotine makes the lungs produce oxygen too quickly", "Smoke makes the alveoli bigger", "Carbon monoxide kills bacteria in the lungs"],
    e: "Cilia normally sweep mucus, dust and microorganisms up out of the airways. When they are damaged, mucus builds up, causing coughing and infections." },
  { c: "Carbon monoxide", q: "Cigarette smoke contains carbon monoxide. Why does this make it harder to exercise?",
    o: ["It combines with haemoglobin, so red blood cells carry less oxygen", "It blocks the stomata in the lungs", "It makes the heart beat more slowly", "It is a source of extra energy for muscles"],
    e: "Carbon monoxide binds to haemoglobin more strongly than oxygen does. Less oxygen reaches the muscles, so less energy is released by respiration." },
  { c: "Emphysema", q: "In emphysema, the walls of many alveoli break down. Why does the person become breathless?",
    o: ["The surface area for gas exchange is reduced, so less oxygen gets into the blood", "The diaphragm stops working", "Their blood stops carrying carbon dioxide", "Their airways become too wide"],
    e: "Fewer, larger air sacs have much less total surface area. Less oxygen can diffuse into the blood, even when the person breathes hard." },
  { c: "Exercise and breathing", q: "Why do you breathe faster and more deeply during exercise?",
    o: ["To take in more oxygen for respiration in muscles and remove the extra carbon dioxide", "To cool the lungs down", "Because the muscles need extra air inside them", "To get rid of the extra glucose being made"],
    e: "Muscles respire faster during exercise. They need more oxygen and produce more carbon dioxide, so breathing rate and depth increase." },
  { c: "Respiration releases heat", q: "Germinating seeds are placed in a sealed vacuum flask with a thermometer. After two days the temperature has risen. Why?",
    o: ["The seeds are respiring, and some of the energy released is lost as heat", "The seeds are photosynthesising inside the flask", "The vacuum flask creates heat", "The seeds are absorbing heat from the thermometer"],
    e: "Respiration releases energy from glucose. Some of this energy is transferred to the surroundings as heat. A control flask with boiled (dead) seeds would show no rise." },
  { c: "Diffusion in gas exchange", q: "Why does oxygen move from the alveoli into the blood?",
    o: ["The oxygen concentration is higher in the alveoli than in the blood, so it diffuses", "The heart sucks oxygen out of the alveoli", "Muscles in the alveoli push oxygen into the blood", "Blood always contains more oxygen than air"],
    e: "Diffusion is the net movement of particles from a high concentration to a low concentration. Blood arriving at the lungs is low in oxygen, so oxygen diffuses into it." }
  ]},
{ n: 5, title: "Reproduction and development", strand: "Biology", topics: "Gametes, fertilisation, the menstrual cycle, pregnancy, growth and adolescence",
  qs: [
  { c: "Sperm cell adaptations", q: "Sperm cells have a tail and contain many mitochondria. How do these help?",
    o: ["The tail lets the sperm swim, and the mitochondria release the energy it needs", "The tail anchors the sperm to the egg, and mitochondria store food", "The mitochondria carry the genetic information", "They help the sperm divide into many cells"],
    e: "A sperm must swim a long way to reach the egg. Mitochondria are where respiration happens, so many mitochondria provide plenty of energy for swimming." },
  { c: "Egg cell adaptations", q: "Why is an egg cell much larger than a sperm cell?",
    o: ["It contains a store of food for the early embryo", "It needs to swim further than a sperm", "It contains more chromosomes than a sperm", "It needs a larger nucleus to fuse with the sperm"],
    e: "The egg's large cytoplasm contains nutrients that supply energy until the embryo implants and gets food from the mother." },
  { c: "Fertilisation", q: "What exactly happens at fertilisation?",
    o: ["The nucleus of a sperm fuses with the nucleus of an egg", "A sperm enters the uterus", "An egg is released from the ovary", "The embryo attaches to the wall of the uterus"],
    e: "Fertilisation is the joining of the two nuclei. It usually happens in the oviduct. Release of the egg is ovulation; attaching to the uterus wall is implantation." },
  { c: "Half the chromosomes", q: "Why do gametes contain only half the number of chromosomes of a normal body cell?",
    o: ["So that when two gametes fuse, the zygote has the full number of chromosomes", "So that gametes are small enough to swim", "Because chromosomes are only needed in body cells", "So that the baby has only the mother's features"],
    e: "Each gamete brings half. When egg and sperm nuclei fuse, the zygote has a complete set, half from each parent." },
  { c: "Placenta", q: "What does the placenta do?",
    o: ["It lets oxygen and nutrients pass from mother to fetus, and wastes pass back, without the two bloods mixing", "It pumps the mother's blood directly into the fetus", "It protects the fetus from bumps", "It produces eggs during pregnancy"],
    e: "The mother's blood and the fetus's blood come very close in the placenta, so substances diffuse across. They do not mix, which protects the fetus." },
  { c: "Lifestyle in pregnancy", q: "Why are pregnant women advised not to smoke?",
    o: ["Harmful substances cross the placenta and the fetus may get less oxygen, leading to low birth weight", "Smoke enters the uterus through the mother's lungs", "Smoking makes the amniotic fluid evaporate", "Smoking only harms the mother, not the fetus"],
    e: "Carbon monoxide and nicotine can cross the placenta. Carbon monoxide reduces the oxygen carried in the blood, so the baby may grow more slowly." },
  { c: "Amniotic fluid", q: "What is the main function of the amniotic fluid?",
    o: ["It cushions and protects the fetus from knocks", "It supplies the fetus with food", "It carries oxygen to the fetus", "It removes carbon dioxide from the fetus"],
    e: "The fetus floats in amniotic fluid inside the amnion. The fluid absorbs bumps. Food and oxygen arrive through the placenta and umbilical cord." },
  { c: "Menstrual cycle", q: "Why does the lining of the uterus thicken during each menstrual cycle?",
    o: ["To prepare for a fertilised egg to implant", "To push the egg out of the ovary", "To make sperm cells", "To store food for the mother"],
    e: "A thick lining with a good blood supply is ready to receive an embryo. If no egg is fertilised, the lining breaks down and is lost during menstruation." },
  { c: "Ovulation timing", q: "In a typical 28-day cycle, starting on the first day of menstruation, roughly when is an egg released?",
    o: ["Around day 14", "Around day 1", "Around day 5", "Around day 28"],
    e: "Ovulation usually happens about halfway through the cycle. Days 1 to 5 are menstruation. This is a typical pattern; real cycles vary." },
  { c: "Puberty and hormones", q: "What causes the body changes at puberty?",
    o: ["Sex hormones such as testosterone and oestrogen", "A sudden increase in the amount of food eaten", "Growth of new organs that were not there before", "Changes in the number of chromosomes in body cells"],
    e: "At puberty the testes start producing testosterone and the ovaries produce oestrogen. These hormones cause secondary sexual characteristics to develop." },
  { c: "Twins", q: "How are identical twins formed?",
    o: ["One fertilised egg splits into two embryos", "Two eggs are fertilised by two different sperm", "One egg is fertilised by two sperm", "Two eggs are fertilised by one sperm"],
    e: "Identical twins come from one zygote, so they have the same genetic information. Non-identical twins come from two eggs fertilised by two sperm." },
  { c: "Growth vs development", q: "Which statement shows the difference between growth and development?",
    o: ["Growth is an increase in size; development is becoming more complex, with new features", "Growth only happens before birth; development only after", "Growth means getting older; development means getting taller", "They mean exactly the same thing"],
    e: "A baby grows by getting bigger. It develops when it gains new abilities and features, such as walking, or body changes at puberty." },
  { c: "Many sperm", q: "Millions of sperm are released, but only one fertilises an egg. Why are so many produced?",
    o: ["Most sperm die or never reach the egg, so large numbers increase the chance that one will", "Each sperm carries only one chromosome", "Many sperm must join together to fertilise the egg", "The extra sperm become food for the embryo"],
    e: "The journey to the oviduct is long and most sperm do not survive it. Producing huge numbers makes fertilisation more likely." }
  ]},
{ n: 6, title: "States of matter", strand: "Chemistry", topics: "Particle theory, changes of state, diffusion, gas pressure, expansion",
  qs: [
  { c: "Melting at particle level", q: "What happens to the particles in ice when it melts?",
    o: ["They gain energy, vibrate more and break free of their fixed positions, but stay close together", "The particles themselves melt and become liquid", "The particles get bigger and push each other apart", "The particles stop moving"],
    e: "Particles do not change in size or melt. In a liquid they are still close together but can move past each other." },
  { c: "Compressing gases", q: "Why can a gas be squashed into a smaller volume, but a liquid cannot?",
    o: ["There are large spaces between gas particles; liquid particles are already touching", "Gas particles are smaller than liquid particles", "Gas particles are soft and can be squeezed", "Liquid particles do not move at all"],
    e: "In a gas the particles are far apart, so pushing them closer is easy. In a liquid the particles are already close together, so there is almost no space to remove." },
  { c: "Spaces between particles", q: "What is in the space between the particles of a gas?",
    o: ["Nothing; it is empty space", "Air", "Water vapour", "Smaller particles of the same gas"],
    e: "Air is itself made of particles. Between gas particles there is simply empty space." },
  { c: "Diffusion", q: "Someone opens a bottle of perfume at the front of a classroom. A few minutes later students at the back can smell it. Which explanation is best?",
    o: ["Perfume particles move randomly and spread from where they are concentrated to where there are fewer of them", "Perfume particles are attracted to people's noses", "The perfume particles grow until they fill the room", "Air particles push the perfume particles in a straight line to the back"],
    e: "This is diffusion. Particles move randomly and collide, which causes a net movement from a high concentration to a low concentration." },
  { c: "Diffusion and temperature", q: "A drop of food colouring spreads faster in hot water than in cold water. Why?",
    o: ["Particles in hot water have more energy and move faster", "Hot water has more spaces between particles because the particles shrink", "Food colouring dissolves only in hot water", "Cold water particles do not move at all"],
    e: "Higher temperature means particles have more kinetic energy. They move and collide faster, so the dye spreads more quickly." },
  { c: "Diffusion in gases vs liquids", q: "Why does diffusion happen faster in gases than in liquids?",
    o: ["Gas particles move faster and have more space between them", "Gas particles are heavier than liquid particles", "Liquid particles are not able to move", "Gases are always hotter than liquids"],
    e: "Gas particles move quickly and travel further before hitting another particle, so they spread out faster than particles in a liquid." },
  { c: "Gas pressure", q: "What causes the pressure of a gas inside a container?",
    o: ["Gas particles colliding with the walls of the container", "Gas particles sticking to the walls", "The weight of the container", "Gas particles getting bigger"],
    e: "Each collision pushes on the wall. Millions of collisions every second produce a steady force on the walls, which we measure as pressure." },
  { c: "Heating a sealed gas", q: "A sealed can of gas is heated. Why does the pressure inside increase?",
    o: ["The particles move faster, so they hit the walls more often and harder", "More gas particles are made when the gas is heated", "The particles expand and press on the walls", "Heat particles enter the can"],
    e: "The number of particles stays the same. Faster particles collide with the walls more often and with more force, so pressure rises. That is why aerosol cans warn against heating." },
  { c: "Expansion", q: "Gaps are left between sections of some bridges. Why?",
    o: ["In hot weather the particles vibrate more and take up more space, so the bridge expands", "The particles of metal get larger when they are heated", "Gaps let rain drain away so the bridge does not rust", "Metal shrinks in summer and needs room"],
    e: "When a solid is heated its particles vibrate more and move slightly further apart. The particles do not grow. The gaps stop the bridge from buckling when it expands." },
  { c: "Constant temperature while boiling", q: "Water keeps boiling on a cooker but its temperature stays at 100 °C. Where is the energy going?",
    o: ["Into separating the particles as liquid turns into gas", "Into the saucepan only", "It is destroyed by the boiling water", "Into making the water particles bigger"],
    e: "During a change of state, energy is used to overcome the attraction between particles rather than to raise the temperature." },
  { c: "Evaporation vs boiling", q: "Which statement about evaporation is correct?",
    o: ["It can happen at any temperature, but only from the surface of a liquid", "It only happens at the boiling point", "It happens throughout the whole liquid, forming bubbles", "It only happens when a liquid is heated"],
    e: "Some surface particles always have enough energy to escape. Boiling happens only at the boiling point and throughout the liquid." },
  { c: "Cooling by evaporation", q: "Why does sweating cool you down?",
    o: ["The particles with the most energy escape as vapour, leaving the remaining liquid with less energy", "Sweat is colder than the body", "Sweat reflects heat away from the skin", "Sweat stops the body making heat"],
    e: "Evaporating particles take energy with them. The average energy of the particles left on the skin falls, so the skin cools." },
  { c: "Using melting and boiling points", q: "A substance melts at −39 °C and boils at 357 °C. What state is it in at 25 °C?",
    o: ["Liquid", "Solid", "Gas", "It cannot be in any state at 25 °C"],
    e: "25 °C is above the melting point, so it is not a solid, and below the boiling point, so it is not a gas. This substance is mercury." },
  { c: "Cooling a gas", q: "A balloon is taken from a warm room into a freezer and shrinks. Why?",
    o: ["The gas particles slow down, hitting the inside of the balloon less often and less hard", "Some gas particles are destroyed by the cold", "The particles shrink in the cold", "Cold air particles enter the balloon"],
    e: "Slower particles produce less pressure. The higher pressure outside squashes the balloon until the pressures balance." }
  ]},
{ n: 7, title: "Elements and compounds", strand: "Chemistry", topics: "Atoms, elements and symbols, the Periodic Table, metals and non-metals, compounds and formulae",
  qs: [
  { c: "What an element is", q: "Which is the best definition of an element?",
    o: ["A substance made of only one type of atom", "A substance made of two or more types of atom joined together", "Any substance found in the Periodic Table or in nature", "A substance that is always a metal"],
    e: "An element cannot be broken down into simpler substances by chemical reactions, because all its atoms are the same type." },
  { c: "Molecules of an element", q: "Oxygen gas is made of O₂ molecules. Is oxygen an element or a compound?",
    o: ["An element, because both atoms in the molecule are oxygen atoms", "A compound, because its atoms are joined together", "A mixture, because it contains two atoms", "A compound, because it is a molecule"],
    e: "A molecule is any group of atoms joined together. It is only a compound if the atoms are of different elements." },
  { c: "Compound properties differ", q: "Sodium is a soft, very reactive metal. Chlorine is a poisonous green gas. They react to form sodium chloride, which is table salt. What does this show?",
    o: ["A compound can have completely different properties from the elements it is made from", "Sodium chloride is a mixture of sodium and chlorine", "Sodium chloride is still poisonous", "Elements keep their properties when they form compounds"],
    e: "When elements react, their atoms join to make a new substance. The new substance has its own properties, which can be very different from those of the elements." },
  { c: "Reading a formula", q: "What does the formula H₂O tell you?",
    o: ["Each molecule contains two hydrogen atoms joined to one oxygen atom", "Water contains two oxygen atoms and one hydrogen atom", "Water is a mixture of hydrogen and oxygen gases", "There are two water molecules"],
    e: "The small number after a symbol tells you how many atoms of that element there are. No number means one atom." },
  { c: "Counting atoms", q: "Calcium carbonate has the formula CaCO₃. How many different elements and how many atoms in total does one unit contain?",
    o: ["3 elements, 5 atoms", "3 elements, 3 atoms", "2 elements, 5 atoms", "4 elements, 6 atoms"],
    e: "The elements are calcium (Ca), carbon (C) and oxygen (O). There is 1 Ca, 1 C and 3 O, which makes 5 atoms." },
  { c: "Naming compounds", q: "What is the name of the compound formed when iron reacts with sulfur?",
    o: ["Iron sulfide", "Iron sulfate", "Sulfur iron", "Iron sulfur oxide"],
    e: "The metal is named first. A compound of just two elements ends in -ide. Names ending in -ate, like sulfate, mean oxygen is also present." },
  { c: "-ate compounds", q: "Which elements are present in copper sulfate?",
    o: ["Copper, sulfur and oxygen", "Copper and sulfur only", "Copper, sulfur and hydrogen", "Copper and oxygen only"],
    e: "The ending -ate tells you the compound contains oxygen as well as the other elements named. Copper sulfate is CuSO₄." },
  { c: "Metal or non-metal", q: "An unknown solid element is dull, breaks when hammered and does not conduct electricity. What is it most likely to be?",
    o: ["A non-metal", "A metal", "A compound", "An alloy"],
    e: "Metals are usually shiny, malleable and good conductors of electricity and heat. Dull, brittle and non-conducting are typical non-metal properties." },
  { c: "Groups in the Periodic Table", q: "Lithium, sodium and potassium are in the same column (group) of the Periodic Table. What would you expect?",
    o: ["They have similar chemical properties", "They have the same mass", "They are all gases", "They are all compounds"],
    e: "Elements in the same group react in similar ways. These three are all soft metals that react strongly with water." },
  { c: "Where metals are", q: "Where are most metals found in the Periodic Table?",
    o: ["On the left and in the middle", "On the right-hand side", "Only in the top row", "Only in the bottom row"],
    e: "Most elements are metals, and they are found on the left and in the centre. Non-metals are mainly on the right." },
  { c: "Chemical symbols", q: "Which pair of element and symbol is correct?",
    o: ["Iron, Fe", "Sodium, S", "Potassium, P", "Copper, Co"],
    e: "Some symbols come from Latin names: Fe (ferrum) is iron, Na (natrium) is sodium, K (kalium) is potassium and Cu (cuprum) is copper. S is sulfur, P is phosphorus and Co is cobalt." },
  { c: "Compounds only", q: "Which list contains only compounds?",
    o: ["H₂O, CO₂, NaCl", "O₂, H₂O, CO₂", "Fe, Cu, NaCl", "N₂, O₂, Cl₂"],
    e: "A compound has at least two different elements chemically joined. O₂, N₂, Cl₂, Fe and Cu each contain only one element." },
  { c: "Separating a compound", q: "How can the elements in a compound be separated?",
    o: ["Only by a chemical reaction", "By filtering", "With a magnet", "By evaporating the compound"],
    e: "The atoms in a compound are chemically joined. Physical methods like filtering or using a magnet can separate mixtures, but not compounds." }
  ]},
{ n: 8, title: "Mixtures", strand: "Chemistry", topics: "Mixtures vs compounds, solutions and solubility, filtration, evaporation, distillation, chromatography, purity",
  qs: [
  { c: "Conservation of mass in dissolving", q: "10 g of salt is dissolved completely in 100 g of water. What is the mass of the solution?",
    o: ["110 g, because the salt particles are still there, spread among the water particles", "100 g, because the salt has disappeared", "Less than 100 g, because some water is used up", "More than 110 g, because a new substance is made"],
    e: "Dissolving is a physical change. No particles are lost, so total mass stays the same even though you cannot see the salt." },
  { c: "Solute and solvent", q: "In a sugar solution, which is the solute and which is the solvent?",
    o: ["Sugar is the solute; water is the solvent", "Water is the solute; sugar is the solvent", "Both are solutes", "The solution is the solvent"],
    e: "The solute is the substance that dissolves. The solvent is the liquid it dissolves in. Together they make a solution." },
  { c: "Saturated solutions", q: "What is a saturated solution?",
    o: ["A solution in which no more solute will dissolve at that temperature", "A solution that is very hot", "A solution that contains a lot of solvent", "Any solution that has a colour"],
    e: "When a solution is saturated, extra solute stays undissolved. Changing the temperature can change how much will dissolve." },
  { c: "Solubility and temperature", q: "A hot saturated solution of copper sulfate is left to cool. Crystals appear. Why?",
    o: ["Solubility decreases as the solution cools, so less solid can stay dissolved", "Cooling turns the water into copper sulfate", "The solvent freezes into crystals", "New copper sulfate is made by a chemical reaction"],
    e: "Most solids are more soluble in hot water. As the solution cools, the extra solute comes out of solution as crystals." },
  { c: "Rate vs amount", q: "Stirring helps sugar dissolve faster in tea. Does stirring increase the total amount of sugar that can dissolve?",
    o: ["No, it only speeds up dissolving; the maximum amount depends on temperature", "Yes, stirring always increases solubility", "Yes, because stirring adds energy that makes room for more sugar", "No, because stirring stops sugar dissolving"],
    e: "Stirring brings fresh solvent to the solid, so it dissolves sooner. Solubility, the maximum that can dissolve, depends on the solvent and the temperature." },
  { c: "Filtration and evaporation", q: "How would you get dry salt from a mixture of sand, salt and water?",
    o: ["Filter to remove the sand, then evaporate the water from the filtrate", "Evaporate the water, then filter out the salt", "Use a magnet to remove the salt", "Filter the mixture; the salt stays on the filter paper"],
    e: "Salt is dissolved, so it passes through the filter paper with the water. Sand is insoluble and stays as the residue. Evaporating the filtrate leaves the salt." },
  { c: "Distillation", q: "Which method gives pure water from sea water?",
    o: ["Distillation: the water evaporates and is then condensed and collected", "Filtration, because filter paper traps the salt", "Chromatography, because the water travels up the paper", "Evaporation, because the water is left behind"],
    e: "Salt is dissolved, so filtering does not remove it. In distillation the water turns to vapour and is cooled back to liquid, leaving the salt behind." },
  { c: "Reading a chromatogram", q: "A spot of black ink separates into three coloured spots on chromatography paper. What does this show?",
    o: ["The ink is a mixture of at least three dyes", "The ink is a pure substance", "The ink reacted with the solvent to make three new substances", "The ink contains three different solvents"],
    e: "Each dye travels a different distance depending on how soluble it is in the solvent and how strongly it sticks to the paper. Three spots means at least three dyes." },
  { c: "Chromatography method", q: "Why is the start line in chromatography drawn in pencil and placed above the level of the solvent?",
    o: ["Pencil does not dissolve in the solvent, and the spots must not dissolve straight into the solvent in the beaker", "Pencil lines help the solvent move faster", "Pen ink is too dark to see the spots", "The spots need to be below the solvent to dissolve"],
    e: "Ink from a pen would separate too and spoil the result. If the spots are under the solvent, they wash off into the beaker instead of moving up the paper." },
  { c: "Purity and boiling point", q: "Pure water boils at 100 °C. A sample of water boils at 102 °C. What does this suggest?",
    o: ["The water is not pure; it contains dissolved substances", "The thermometer must be broken", "The water is extra pure", "The water is turning into a different element"],
    e: "Pure substances have fixed melting and boiling points. Dissolved impurities change them; salt water, for example, boils above 100 °C." },
  { c: "Air is a mixture", q: "Why is air described as a mixture and not a compound?",
    o: ["Its gases are not chemically joined and their proportions can vary", "It contains only one element", "It has a chemical formula", "Its gases cannot be separated"],
    e: "Nitrogen, oxygen and the other gases in air keep their own properties. They can be separated by physical methods, such as fractional distillation of liquid air." },
  { c: "Mixture vs compound", q: "Iron filings and sulfur powder are mixed. Then some of the mixture is heated to make iron sulfide. What happens if a magnet is held near each?",
    o: ["The magnet removes iron from the mixture, but not from iron sulfide", "The magnet removes iron from both", "The magnet removes iron from iron sulfide only", "The magnet attracts the sulfur in both"],

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const band = pct => pct >= 80 ? ["secure", "Secure"] : pct >= 50 ? ["developing", "Developing"] : ["revisit", "Revisit"];

  return { q, unit, opts: order.map(k => q.o[k]), correctIdx: order.indexOf(0), chosen: null };
}

    let bestHtml = "Not tried";
    if (b) { const [cls] = band(Math.round(b.score / b.of * 100)); bestHtml = `<span class="best ${cls}">Best ${b.score}/${b.of}</span>`; }
    return `<li class="unit-row" style="--c:${STRANDS[u.strand]}">
      <button class="unit-btn" data-unit="${u.n}" aria-label="Start Unit ${u.n} test: ${esc(u.title)}">
        <span class="unit-no">${String(u.n).padStart(2, "0")}</span>
        <span class="unit-main"><span class="unit-title">${esc(u.title)}</span><span class="unit-topics">${esc(u.topics)}</span></span>
        <span class="unit-meta"><span class="strand">${u.strand}</span><span>${u.qs.length} questions</span>${bestHtml}</span>
      </button></li>`;
  }).join("");
  const mb = best.mixed;
  app.innerHTML = `
    <header class="top">
      <span class="eyebrow">Cambridge Checkpoint Science · Coursebook 8</span>
      <h1>Science 8 Unit Tests</h1>
      <p class="lede">One test per unit, ${total} questions in all. Each question checks an idea, not a definition to recite. Many wrong options are common misconceptions. You get an explanation after every answer.</p>
      <div class="legend">
        <span><i class="dot" style="--c:var(--bio)"></i>Biology</span>
        <span><i class="dot" style="--c:var(--chem)"></i>Chemistry</span>
        <span><i class="dot" style="--c:var(--phys)"></i>Physics</span>
        <span>Score bands: Secure ≥ 80% · Developing 50–79% · Revisit &lt; 50%</span>
      </div>
    </header>
    <ol class="units">${rows}</ol>
    <section class="mixed">
      <p><strong>Mixed review.</strong> Two random questions from every unit (26 questions). Good for checking that earlier units have stuck.${mb ? ` Best so far: ${mb.score}/${mb.of}.` : ""}</p>
      <button class="btn" id="mixed">Start mixed review</button>
    </section>
    <p class="note">Unit order and titles follow the first edition of the Coursebook 8. Best scores are saved only in this browser.</p>`;
  app.querySelectorAll("[data-unit]").forEach(b => b.addEventListener("click", () => startUnit(+b.dataset.unit)));
  document.getElementById("mixed").addEventListener("click", startMixed);
  window.scrollTo(0, 0);
}

function startUnit(n) {
  const u = UNITS.find(x => x.n === n);
  run = { key: "u" + n, label: `Unit ${n}`, title: u.title, color: STRANDS[u.strand], n,
          items: shuffle(u.qs).map(q => prepare(q, u)), i: 0, score: 0 };
  question();
}
function startMixed() {
  const items = shuffle(UNITS.flatMap(u => shuffle(u.qs).slice(0, 2).map(q => prepare(q, u))));
  run = { key: "mixed", label: "All units", title: "Mixed review", color: "var(--accent)", items, i: 0, score: 0 };
  question();
}

function question() {
  const it = run.items[run.i], N = run.items.length;
  const answered = it.chosen !== null;
  const opts = it.opts.map((t, k) => {
    let cls = "opt";
    if (answered) { if (k === it.correctIdx) cls += " correct"; else if (k === it.chosen) cls += " wrong"; else cls += " dim"; }
    return `<button class="${cls}" data-k="${k}" ${answered ? "disabled" : ""}><span class="key">${"ABCD"[k]}</span><span>${esc(t)}</span></button>`;
  }).join("");
  const right = answered && it.chosen === it.correctIdx;
  const fb = answered ? `<div class="why" style="--fb:${right ? "var(--good)" : "var(--bad)"}" role="status">
      <strong>${right ? "Correct" : "Not quite. The answer is " + "ABCD"[it.correctIdx] + "."}</strong><p>${esc(it.q.e)}</p></div>` : "";
  const unitTag = run.key === "mixed" ? `Unit ${it.unit.n} · ` : "";
  app.innerHTML = `
    <div class="qbar" style="--c:${run.color}">
      <div class="qbar-row"><button class="link" id="quit">← All units</button><span class="tally">Score ${run.score} · Q ${run.i + 1} of ${N}</span></div>
      <div class="qbar-row"><h2>${esc(run.label)}: ${esc(run.title)}</h2></div>
      <div class="progress" aria-hidden="true"><i style="width:${(run.i + (answered ? 1 : 0)) / N * 100}%"></i></div>
    </div>
    <article class="card" style="--c:${run.color}">
      <div class="qhead"><span class="eyebrow">${unitTag}${esc(it.q.c)}</span></div>
      <p class="qtext">${esc(it.q.q)}</p>
      <div class="options">${opts}</div>
      ${fb}
      <div class="qfoot">
        <span class="hint">Keys: 1–4 or A–D to answer${answered ? ", Enter for next" : ""}</span>
        <button class="btn" id="next" ${answered ? "" : "disabled"}>${run.i + 1 === N ? "See results" : "Next question"}</button>
      </div>
    </article>`;
  document.getElementById("quit").addEventListener("click", home);
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(+b.dataset.k)));
  const next = document.getElementById("next");
  next.addEventListener("click", advance);
  if (answered) next.focus();
}

function answer(k) {
  const it = run.items[run.i];
  if (it.chosen !== null) return;
  it.chosen = k;
  if (k === it.correctIdx) run.score++;
  question();
}
function advance() {
  if (run.items[run.i].chosen === null) return;
  if (run.i + 1 < run.items.length) { run.i++; question(); window.scrollTo(0, 0); } else results();
}

function results() {
  const N = run.items.length, pct = Math.round(run.score / N * 100), [cls, label] = band(pct);
  const prev = best[run.key];
  if (!prev || run.score / N > prev.score / prev.of) { best[run.key] = { score: run.score, of: N }; saveBest(best); }
  const missed = run.items.filter(it => it.chosen !== it.correctIdx);
  const reviewHtml = missed.length ? `<h3>Ideas to revisit</h3><ul class="review">${missed.map(it => `
      <li><span class="eyebrow">${run.key === "mixed" ? "Unit " + it.unit.n + " · " : ""}${esc(it.q.c)}</span>
      <p>${esc(it.q.q)}</p>
      <p class="ans">You chose <s>${esc(it.opts[it.chosen])}</s>. Correct: <b>${esc(it.opts[it.correctIdx])}</b></p>
      <p class="exp">${esc(it.q.e)}</p></li>`).join("")}</ul>` : `<p>Every answer correct. Try the mixed review, or move on to the next unit.</p>`;
  const nextUnit = run.n && run.n < UNITS.length ? `<button class="btn ghost" id="nextunit">Unit ${run.n + 1} test</button>` : "";
  app.innerHTML = `
    <div class="qbar" style="--c:${run.color}">
      <div class="qbar-row"><button class="link" id="quit">← All units</button></div>
    </div>
    <article class="card" style="--c:${run.color}">
      <div class="result-head">
        <span class="eyebrow">${esc(run.label)}: ${esc(run.title)}</span>
        <div class="score">${run.score}<small> / ${N}</small></div>
        <span class="band ${cls}">${label} · ${pct}%</span>
      </div>
      ${reviewHtml}
      <div class="actions"><button class="btn" id="retry">Retake this test</button>${nextUnit}</div>
    </article>`;
  document.getElementById("quit").addEventListener("click", home);
  document.getElementById("retry").addEventListener("click", () => run.key === "mixed" ? startMixed() : startUnit(run.n));
  const nu = document.getElementById("nextunit");
  if (nu) nu.addEventListener("click", () => startUnit(run.n + 1));
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  if (!run || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = run.items[run.i];
  if (!it || !document.querySelector(".opt")) return;
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
  const k = map[e.key.toLowerCase()];
  if (k !== undefined && it.chosen === null) { e.preventDefault(); answer(k); }
  else if (e.key === "Enter" && it.chosen !== null && document.activeElement?.id !== "next") { e.preventDefault(); advance(); }
});

home();
</script>
</body>
</html>
