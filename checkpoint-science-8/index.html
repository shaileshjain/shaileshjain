  ]},
{ n: 9, title: "Material changes", strand: "Chemistry", topics: "Physical and chemical changes, word equations, conservation of mass, burning, rusting, energy changes",
  qs: [
  {"t":"a1K","c":"Physical vs chemical change","q":"Which of these is a chemical change?","o":["Frying an egg","Melting chocolate","Dissolving sugar in water","Freezing water"],"e":"In a chemical change, new substances are made and the change is usually hard to reverse. Melting, dissolving and freezing make no new substance."},
  {"t":"a2A","c":"Candle burning","q":"A candle is lit. Which part involves a chemical change?","o":["The wax vapour burning in the flame","The wax melting near the wick","The liquid wax rising up the wick","The melted wax going solid again"],"e":"Melting and solidifying are physical changes. Burning makes new substances: carbon dioxide and water vapour."},
  {"t":"b2A","c":"Mass increases on burning","q":"Magnesium ribbon is heated in a crucible and burns to form a white powder. The powder has a greater mass than the magnesium. Why?","o":["Magnesium has combined with oxygen from the air to form magnesium oxide","Heat has mass, and some of it has been added to the powder","Pieces of the crucible have broken off into the powder","The magnesium atoms have grown bigger as they were heated"],"e":"magnesium + oxygen → magnesium oxide. The extra mass is the oxygen atoms that have joined on. No mass is created."},
  {"t":"b2A","c":"Mass seems to decrease","q":"A piece of wood burns and the ash weighs much less than the wood. Has mass been destroyed?","o":["No; gases such as carbon dioxide and water vapour escaped into the air","Yes; burning destroys some of the mass of the wood","Yes; the energy given out took some of the mass with it","No; the ash weighs the same as the wood but feels lighter"],"e":"If you collected all the products, including the gases, their total mass would equal the mass of the wood plus the oxygen that reacted."},
  {"t":"b2A","c":"Conservation of mass","q":"Two solutions react in a sealed flask on a balance and a solid forms. What happens to the reading on the balance?","o":["It stays the same, because atoms are rearranged, not created or destroyed","It increases, because a solid is heavier than the liquids that made it","It decreases, because some particles are used up in the reaction","It falls to zero, because the reactants have all been used up"],"e":"In a closed system nothing can enter or leave. The same atoms are present before and after; they are just joined in new ways."},
  {"t":"d2E","c":"Conditions for rusting","q":"Three iron nails are set up: A in air and water, B in boiled water with oil on top, C in dry air with a drying agent. Which nail rusts?","o":["Only A","Only B","Only C","A and B"],"e":"Rusting needs both oxygen and water. Boiling removes dissolved oxygen and the oil stops more getting in (B). The drying agent removes water (C)."},
  {"t":"d1A","c":"Preventing rust","q":"How does painting a steel gate stop it rusting?","o":["It stops oxygen and water reaching the surface of the iron","It makes the iron into a different element","It adds oxygen to the iron","Paint reacts with rust and turns it back into iron"],"e":"Rust prevention methods such as paint, oil and plastic coatings work by keeping air and water away from the metal."},
  {"t":"c2K","c":"Combustion products","q":"Methane (natural gas) burns in plenty of air. What are the products?","o":["Carbon dioxide and water","Carbon and hydrogen","Oxygen and water","Methane oxide only"],"e":"Methane contains carbon and hydrogen. When it burns, carbon combines with oxygen to make carbon dioxide, and hydrogen combines with oxygen to make water."},
  {"t":"c1A","c":"Putting out fires","q":"Why does a fire blanket put out a small fire in a pan?","o":["It cuts off the supply of oxygen","It cools the fuel to below freezing","It removes the fuel","It absorbs the flames"],"e":"A fire needs fuel, heat and oxygen. Remove any one and the fire goes out. A blanket stops oxygen reaching the fuel."},
  {"t":"e2K","c":"Thermal decomposition","q":"Copper carbonate is heated and forms copper oxide and carbon dioxide. What type of reaction is this?","o":["Thermal decomposition: one substance breaks down into simpler substances when heated","Combustion, because oxygen from the air is used to break up the carbonate","A physical change, because the copper carbonate can easily be made again","Neutralisation, because a gas is given off when the solid is heated"],"e":"Only one reactant is involved and it splits up when heated. No oxygen from the air is needed."},
  {"t":"e1E","c":"Reactants and products","q":"magnesium + hydrochloric acid → magnesium chloride + hydrogen. How could you test for the gas produced?","o":["Hold a lighted splint near it; it burns with a pop","Bubble it through limewater; it turns milky","Hold a glowing splint in it; it relights","Hold damp blue litmus paper in it; it turns red"],"e":"The squeaky pop test identifies hydrogen. Limewater tests for carbon dioxide and a relighting glowing splint tests for oxygen."},
  {"t":"e1K","c":"Exothermic reactions","q":"A reaction makes the test tube feel hot. What does this tell you?","o":["The reaction is exothermic: it transfers energy to the surroundings","The reaction is endothermic: it takes energy in from the surroundings","No reaction has happened; it is only a physical change in the liquid","The reactants are being destroyed, and their mass is turned into heat"],"e":"Exothermic reactions give out energy, so the temperature of the surroundings rises. Endothermic reactions take in energy, so the surroundings get colder."},
  {"t":"a2A","c":"Energy change ≠ chemical change","q":"Ice takes in energy when it melts. Is melting a chemical change?","o":["No; no new substance is made, it is still water","Yes; any change involving energy is chemical","Yes; because it cannot be reversed","No; because melting gives out energy"],"e":"Physical changes also involve energy. The test for a chemical change is whether a new substance is formed."},
  {"t":"a1A","c":"Signs of a reaction","q":"Which observation is good evidence that a chemical reaction has taken place?","o":["Bubbles of a new gas form when a carbonate is added to acid","Ice melts and turns into water when it is warmed","Salt disappears completely when it is stirred into water","Water vapour condenses as droplets on a cold window"],"e":"Fizzing shows that a new substance (carbon dioxide) has been made. The others are physical changes."},
  {"t":"a1K","c":"Precipitate","q":"Two clear solutions are mixed and a cloudy solid forms. What is this solid called?","o":["A precipitate","A solvent","A filtrate","A catalyst"],"e":"A precipitate is an insoluble solid formed by a reaction between two solutions. It is a sign of a chemical change."},
  {"t":"a3A","c":"Reversible chemical change","q":"Blue copper sulfate crystals turn white when heated. Adding water turns them blue again and they get hot. What does this show?","o":["Some chemical changes can be reversed, so reversing does not prove a change is physical","This is a physical change, because any change that can be reversed must be physical","No reaction happens; the crystals just dry out and then get wet again","Heating turns copper sulfate into a different element, which the water then reverses"],"e":"Water is removed from and added back to the compound, forming different substances each time. The temperature change is another sign of a chemical reaction."},
  {"t":"a1A","c":"Cooking","q":"Why is baking a cake a chemical change?","o":["New substances form, and the change cannot be undone","The mixture changes shape as it rises in the tin","The mixture gets hotter while it is in the oven","The ingredients are all mixed together in a bowl"],"e":"Heat causes reactions such as a gas being produced and proteins changing permanently."},
  {"t":"e1K","c":"Word equations","q":"In a word equation, what are the substances on the left of the arrow called?","o":["Reactants","Products","Solvents","Catalysts"],"e":"Reactants → products. The arrow means 'react to make'."},
  {"t":"c1K","c":"Burning carbon","q":"Which word equation shows carbon burning completely in oxygen?","o":["carbon + oxygen → carbon dioxide","carbon dioxide → carbon + oxygen","carbon + water → carbon dioxide","carbon → oxygen + heat"],"e":"When an element burns, it combines with oxygen to form an oxide."},
  {"t":"c1K","c":"Burning sulfur","q":"Sulfur burns with a blue flame. What is the product?","o":["Sulfur dioxide","Sulfuric acid","Sulfur carbonate","Sulfur and oxygen"],"e":"Sulfur combines with oxygen to make sulfur dioxide, a gas that contributes to acid rain."},
  {"t":"c2K","c":"Oxidation","q":"What is oxidation?","o":["A reaction in which a substance gains oxygen","A reaction in which a substance loses mass","Any change of state","A substance dissolving in water"],"e":"Burning and rusting are both oxidation reactions."},
  {"t":"c3A","c":"Incomplete combustion","q":"A gas heater in a poorly ventilated room is dangerous. Why?","o":["With too little oxygen, fuel burns incompletely and makes carbon monoxide","The heater makes too much oxygen, which is poisonous in large amounts","Gas heaters make no products, but they use up all of the nitrogen","The heater gives off hydrogen gas, which builds up and then explodes"],"e":"Carbon monoxide is colourless and has no smell, so it cannot be detected without an alarm."},
  {"t":"c1K","c":"Fuels","q":"What is a fuel?","o":["A substance that releases useful energy when it burns","Any substance that contains oxygen atoms","A substance that is used to put out fires","A substance that never takes part in reactions"],"e":"Fuels such as wood, coal, gas and petrol store chemical energy released by combustion."},
  {"t":"c2A","c":"Fire triangle: heat","q":"Firefighters often spray water on burning wood. Which side of the fire triangle does this remove?","o":["Heat, by cooling the fuel","Fuel, by washing it away","Oxygen, by blocking the air","None; water only stops smoke"],"e":"Water absorbs a lot of energy as it heats up and evaporates, cooling the fuel below the temperature it needs to keep burning."},
  {"t":"c2A","c":"Fire triangle: fuel","q":"Firefighters cut down strips of trees to make firebreaks in forests. How does this help?","o":["It removes the fuel, so the fire cannot spread","It removes the oxygen, so the fire cannot breathe","It cools the fire, so the flames cannot spread","It adds moisture, so the trees cannot catch fire"],"e":"Without fuel the fire cannot continue past the firebreak."},
  {"t":"c2A","c":"Electrical fires","q":"Why should water not be used on an electrical fire or a burning chip pan?","o":["Water conducts electricity, and it makes burning oil spit and spread","Water adds extra oxygen to the fire, making it burn much more fiercely","Water is itself a fuel, so it burns when it touches the hot oil","Water cannot cool anything that is hotter than 100 °C, so it is useless"],"e":"A fire blanket or the right extinguisher cuts off oxygen without these dangers."},
  {"t":"d2K","c":"Rust word equation","q":"Which is the correct word equation for rusting?","o":["iron + oxygen + water → hydrated iron(III) oxide (rust)","iron + carbon dioxide → rust + carbon","iron → rust + oxygen (no other reactant needed)","rust + water → iron + oxygen"],"e":"Both oxygen and water are reactants, which is why both are needed."},
  {"t":"d2A","c":"Salt and rusting","q":"Cars in coastal towns or where salt is spread on roads tend to rust faster. Why?","o":["Salt water speeds up rusting","Salt contains oxygen","Salt makes iron softer","Salt stops rust forming"],"e":"Rusting needs water and oxygen, and dissolved salt makes the reaction happen faster."},
  {"t":"d3A","c":"Galvanising","q":"Galvanised iron is coated with zinc. Even when scratched, the iron does not rust. Why?","o":["Zinc is more reactive than iron, so it reacts with oxygen and water instead","Zinc is a non-metal, so it seals the iron completely like paint","Zinc removes all water vapour from the air around the iron","Zinc mixes into the iron and turns it into stainless steel"],"e":"This is called sacrificial protection. The zinc corrodes instead of the iron."},
  {"t":"b3A","c":"Rust gains mass","q":"An iron nail is weighed, left to rust and weighed again when dry. What happens to its mass?","o":["It increases, because oxygen and water have combined with the iron","It decreases, because the iron is eaten away by the rust","It stays exactly the same, because mass is always conserved","It falls to almost zero, because rust is so light and flaky"],"e":"The rust contains the original iron atoms plus the oxygen and water that reacted."},
  {"t":"b3E","c":"Open container reaction","q":"Marble chips react with acid in an open flask on a balance. The reading goes down. Why?","o":["Carbon dioxide gas escapes into the air","Mass is destroyed in the reaction","The acid evaporates instantly","The marble turns into energy"],"e":"If the flask were sealed, the mass would stay the same. The decrease is the mass of gas that left."},
  {"t":"e2K","c":"Acid and metal","q":"Zinc is added to dilute hydrochloric acid. What are the products?","o":["Zinc chloride and hydrogen","Zinc oxide and water","Zinc chloride and oxygen","Zinc and chlorine"],"e":"metal + acid → salt + hydrogen. Hydrochloric acid makes chloride salts."},
  {"t":"e2K","c":"Acid and carbonate","q":"What is produced when a carbonate reacts with an acid?","o":["A salt, water and carbon dioxide","A salt and hydrogen gas only","Water and heat, but no salt","Oxygen and the pure metal"],"e":"The fizzing is carbon dioxide, which you can test with limewater."},
  {"t":"e2K","c":"Neutralisation","q":"An acid is added to an alkali until the solution is neutral. What forms?","o":["A salt and water","Hydrogen and oxygen","Carbon dioxide only","A metal and oxygen"],"e":"Neutralisation: acid + alkali → salt + water. An indicator shows when the solution is neutral."},
  {"t":"e2A","c":"Endothermic reactions","q":"When citric acid and sodium hydrogencarbonate react in water, the temperature drops. What type of reaction is this?","o":["Endothermic: it takes in energy","Exothermic: it gives energy out","A physical change only, not a reaction","No reaction; the water just cools down"],"e":"Instant cold packs use an endothermic process to cool injuries."},
  {"t":"e3A","c":"Burning and photosynthesis","q":"Burning is exothermic. Which of these is endothermic?","o":["Photosynthesis, which takes in light","Respiration, which releases energy","Rusting, which slowly warms iron","Burning methane, which uses fuel"],"e":"Photosynthesis needs a continuous supply of energy (light) to make glucose. The others release energy."},
  {"t":"e1E","c":"Thermal decomposition test","q":"How could you show that carbon dioxide is given off when copper carbonate is heated?","o":["Pass the gas through limewater; it turns milky","Hold a glowing splint in it; it relights","Hold a lighted splint in it; it pops","Add iodine; it turns blue-black"],"e":"Limewater turning milky is the test for carbon dioxide."},
  {"t":"c2E","c":"Candle in a jar","q":"A jar is placed over a burning candle. After a short time the candle goes out. Why?","o":["The oxygen in the jar is used up","The jar fills with water","The wax runs out","The jar makes the flame too hot"],"e":"Combustion needs oxygen. Once there is not enough left in the jar, burning stops."},
  {"t":"c2A","c":"Hydrogen as a fuel","q":"Hydrogen burns to form only water. Why is it sometimes called a clean fuel?","o":["It produces no carbon dioxide when it burns","It does not release any energy, so it is safe","It burns without needing any oxygen at all","It is a liquid at room temperature, so it is easy to store"],"e":"Fuels containing carbon produce carbon dioxide when burned. Burning hydrogen does not."},
  {"t":"c3A","c":"Surface area and burning","q":"An iron nail does not burn in a Bunsen flame, but iron wool or iron filings sprinkled into the flame burn with sparks. Why?","o":["The filings have a much larger surface area in contact with oxygen","Iron filings are a different element from the iron in a nail","The nail is too cold to react, because it has not been heated","Filings contain oxygen inside them, so they burn without air"],"e":"More surface exposed to oxygen means the reaction can happen much faster."},
  {"t":"b2K","c":"Conservation of atoms","q":"Why is mass conserved in a chemical reaction?","o":["The same atoms are present before and after; they are only rearranged","New atoms are made to replace the old ones that were used up","Atoms are destroyed, but they are replaced by an equal mass of energy","Mass is not conserved; it only seems to be because balances are inaccurate"],"e":"Atoms are not created or destroyed in chemical reactions. The total mass of the products equals the total mass of the reactants."},
  {"t":"a2A","c":"Dissolving is physical","q":"Is dissolving sugar in water a physical or a chemical change?","o":["Physical, because the sugar can be got back by evaporating the water","Chemical, because the sugar disappears from sight","Chemical, because a new substance called sugar water forms","Physical, because no energy change ever happens"],"e":"No new substance is made. The sugar particles are still there, spread among the water particles."},
  {"t":"a3A","c":"Smashed glass","q":"A glass is smashed. Is this a chemical change?","o":["No; it is still glass, so nothing new has formed","Yes, because it cannot easily be reversed","Yes, because the glass has changed its shape","No, because glass does not count as a chemical"],"e":"Being hard to reverse is not the test. The test is whether a new substance is made."},
  {"t":"c3A","c":"Soot on a pan","q":"Black soot forms on the bottom of a pan held over a yellow Bunsen flame. Why?","o":["There is too little oxygen, so some carbon does not burn","The pan reacts with the flame to make carbon","A yellow flame has more oxygen than a blue one","Soot is made from the metal of the pan"],"e":"This is incomplete combustion. Opening the air hole gives a hotter, blue flame with no soot."},
  {"t":"c2A","c":"Blue flame","q":"Why does a Bunsen burner give a blue flame when the air hole is open?","o":["Extra air lets the gas burn completely","Less gas is used when the hole is open","Blue flames contain no fuel at all","Blue flames are cooler and safer"],"e":"With plenty of oxygen, the fuel burns completely to carbon dioxide and water, releasing more energy."},
  {"t":"d2E","c":"Boiled water in rust test","q":"In a rusting experiment, why is the water boiled before the nail is added?","o":["To remove dissolved air (oxygen) from the water","To kill bacteria that cause rusting","To make the water warm enough to rust iron","To remove salt from the tap water"],"e":"Water normally has some air dissolved in it. Boiling drives it out, and a layer of oil stops it coming back."},
  {"t":"d2A","c":"Oiling a chain","q":"Why is oil put on a bicycle chain?","o":["It keeps air and water away from the iron","It reacts with the iron to make stainless steel","It adds oxygen to stop rust forming","It dissolves any rust that has already formed"],"e":"Rusting needs both oxygen and water. Oil also helps moving parts slide smoothly."},
  {"t":"e2K","c":"Indigestion tablets","q":"Indigestion tablets react with extra stomach acid. What type of reaction is this?","o":["Neutralisation","Combustion","Thermal decomposition","Rusting"],"e":"The tablets contain a base, which reacts with the acid to make a salt and water."},
  {"t":"e3A","c":"Taking in energy","q":"Which of these takes in energy from the surroundings?","o":["Ice melting","Wood burning","Iron rusting","Water freezing"],"e":"Melting needs energy to separate particles. Burning and rusting release energy, and freezing releases energy too."},
  {"t":"e2K","c":"Heating limestone","q":"Calcium carbonate (limestone) is heated strongly. What are the products?","o":["Calcium oxide and carbon dioxide","Calcium and carbon dioxide","Calcium oxide and oxygen","Calcium carbonate and water"],"e":"This is thermal decomposition: calcium carbonate → calcium oxide + carbon dioxide."},
  {"t":"b3A","c":"Burning steel wool","q":"Steel wool is heated on a balance and burns. What happens to the reading?","o":["It increases, because oxygen combines with the iron","It decreases, because burning always loses mass","It stays the same, because mass is always conserved","It decreases, because smoke escapes into the air"],"e":"The product, iron oxide, contains the iron atoms plus oxygen atoms taken from the air."},
  {"t":"b2N","c":"Precipitate mass","q":"50 g of solution A and 30 g of solution B are mixed in an open beaker. A solid precipitate forms, but no gas. What is the total mass afterwards?","o":["80 g","50 g","30 g","Less than 80 g, because a solid forms"],"e":"No gas escapes, so nothing leaves the beaker. The total mass stays 80 g."},
  {"t":"c2A","c":"Silent killer","q":"Why is carbon monoxide called a silent killer?","o":["It has no colour or smell, so people do not notice it","It makes no sound when it explodes in a room","It only harms people when they are asleep","It is given off silently by electrical items"],"e":"Carbon monoxide alarms are the only way to detect it at home."},
  {"t":"a2A","c":"Sour milk","q":"Milk left out for days turns sour and smells bad. What kind of change is this?","o":["Chemical, because new substances form that cannot change back","Physical, because the milk is still a liquid afterwards","Physical, because it happens without any heating at all","Chemical, because the milk becomes colder as it sours"],"e":"Bacteria change substances in the milk into new ones, such as acids. That is a chemical change."},
  {"t":"e2E","c":"Showing a reaction is exothermic","q":"How can you show that a reaction is exothermic?","o":["Measure the temperature before and after; it rises","Weigh the mixture before and after; it gets heavier","Watch the colour; it turns blue","Measure the temperature before and after; it falls"],"e":"Exothermic reactions transfer energy to the surroundings, so the temperature rises."},
  {"t":"c3A","c":"Choosing a fuel","q":"Why is natural gas often preferred to coal as a fuel?","o":["It burns more cleanly, producing less soot and sulfur dioxide","It produces no carbon dioxide at all when it burns","It does not need any oxygen to burn","It releases no energy, so it is safer to use"],"e":"Natural gas still makes carbon dioxide, but coal also releases soot and sulfur dioxide, which cause pollution and acid rain."},
  {"t":"d3A","c":"Zinc blocks on ships","q":"Blocks of zinc are fixed to the steel hulls of ships. Why?","o":["Zinc corrodes instead of the steel hull","Zinc makes the ship float higher in the water","Zinc stops sea water touching the whole hull","Zinc turns the steel into stainless steel"],"e":"Zinc is more reactive than iron, so it corrodes first. The blocks are replaced from time to time."},
  {"t":"b2A","c":"Burning candle loses mass","q":"A burning candle on a balance gets lighter. Why?","o":["Wax reacts to form gases that escape into the air","Burning destroys some of the atoms in the wax","The light from the flame carries mass away","The wax melts and so loses some of its mass"],"e":"The wax reacts with oxygen to form carbon dioxide and water vapour, which escape. Atoms are not destroyed."},
  {"t":"e1E","c":"Fizzing","q":"When a metal is added to an acid, which observation shows that a gas is being made?","o":["Fizzing (bubbles)","A colour change","The solution warms up","The metal gets bigger"],"e":"Bubbles show a gas is produced. Metals and acids produce hydrogen."},
  {"t":"b2A","c":"Burning magnesium","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Magnesium gains mass when it burns.","R":"Magnesium combines with oxygen from the air.","a":0,"e":"Both true; the extra mass is the oxygen atoms that have joined on."},
  {"t":"a2A","c":"Melting is physical","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Melting ice is a chemical change.","R":"Melting ice takes in energy.","a":3,"e":"Melting is physical: no new substance forms. Energy changes happen in physical changes too."},
  {"t":"d1K","c":"Colour of rust","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Rusting is a chemical change.","R":"Rust is orange-brown.","a":1,"e":"Both true, but the colour is not why it is chemical. It is chemical because a new substance (iron oxide) forms."},
  {"t":"a1A","c":"Chemical changes","type":"multi","q":"Which are chemical changes? Select all that apply.","o":["Burning wood","Iron rusting","Baking bread","Dissolving salt","Melting wax","Boiling water"],"k":3,"e":"New substances form when wood burns, iron rusts and bread bakes. The others are physical changes."},
  {"t":"d1K","c":"Needs for rusting","type":"multi","q":"Which must be present for iron to rust? Select all that apply.","o":["Oxygen","Water","Carbon dioxide","Salt","Heat"],"k":2,"e":"Rusting needs oxygen and water. Salt speeds it up but is not needed."},
  {"t":"a2A","c":"Odd one out: reactions","q":"Which is the odd one out?","o":["Melting","Rusting","Burning","Respiration"],"e":"Rusting, burning and respiration are chemical reactions with oxygen. Melting is a physical change."},
  {"t":"e1E","c":"Heating copper carbonate","type":"order","q":"Put the steps in order to show that heating copper carbonate gives off carbon dioxide.","o":["Put copper carbonate in a test tube","Fit a delivery tube leading into limewater","Heat the copper carbonate","Watch the limewater turn milky"],"e":"The gas must be led into limewater before heating starts, so none escapes. Milky limewater shows carbon dioxide."}
  ]},
{ n: 10, title: "Measuring motion", strand: "Physics", topics: "Speed, average speed, distance–time graphs, measuring speed accurately",
  qs: [
  {"t":"a1N","c":"Calculating speed","q":"A car travels 150 km in 3 hours. What is its average speed?","o":["50 km/h","450 km/h","0.02 km/h","153 km/h"],"e":"speed = distance ÷ time = 150 km ÷ 3 h = 50 km/h."},
  {"t":"a1N","c":"Calculating speed (m/s)","q":"A runner finishes a 100 m race in 12.5 s. What is the runner's average speed?","o":["8 m/s","1250 m/s","0.125 m/s","12.5 m/s"],"e":"speed = 100 m ÷ 12.5 s = 8 m/s."},
  {"t":"a2N","c":"Rearranging the equation","q":"A cyclist moves at a steady 15 m/s. How long does it take to travel 300 m?","o":["20 s","4500 s","0.05 s","285 s"],"e":"time = distance ÷ speed = 300 m ÷ 15 m/s = 20 s."},
  {"t":"a2K","c":"Average speed","q":"A bus has an average speed of 40 km/h on a journey. What does this tell you?","o":["Total distance ÷ total time was 40 km/h; its speed may have varied","The bus travelled at exactly 40 km/h for every part of the journey","The fastest the bus went at any point in the journey was 40 km/h","The bus never stopped, because stopping would lower the average"],"e":"Average speed ignores changes along the way. A bus that stops at traffic lights and then speeds up can still have an average of 40 km/h."},
  {"t":"a3N","c":"Average speed trap","q":"A car drives 60 km at 60 km/h, then another 60 km at 120 km/h. What is its average speed for the whole journey?","o":["80 km/h","90 km/h","60 km/h","180 km/h"],"e":"The first part takes 1 h and the second part takes 0.5 h. Total: 120 km in 1.5 h = 80 km/h. You cannot just average the two speeds, because the car spent more time at the slower speed."},
  {"t":"b1K","c":"Flat line on a distance–time graph","q":"On a distance–time graph, a section of the line is horizontal. What is the object doing?","o":["Standing still","Moving at a constant speed","Speeding up","Moving backwards"],"e":"A horizontal line means time is passing but the distance is not changing, so the object is stationary."},
  {"t":"b2A","c":"Gradient = speed","q":"Two straight lines on a distance–time graph both start at the origin. Line A is steeper than line B. What does this show?","o":["A is moving faster than B","A is moving slower than B","A has travelled for longer than B","A is speeding up and B is slowing down"],"e":"The gradient (steepness) of a distance–time graph is the speed. A steeper line means more distance covered in each second."},
  {"t":"b2A","c":"Curved line","q":"A line on a distance–time graph curves upwards, getting steeper and steeper. What is happening?","o":["The object is speeding up (accelerating)","The object is slowing down","The object is moving at a steady speed","The object is stationary"],"e":"The gradient is increasing, so the speed is increasing. A line that gets less steep shows the object slowing down."},
  {"t":"a3N","c":"Units","q":"A speed of 36 km/h is the same as:","o":["10 m/s","36 m/s","3.6 m/s","100 m/s"],"e":"36 km = 36 000 m, and 1 h = 3600 s. 36 000 m ÷ 3600 s = 10 m/s."},
  {"t":"a2N","c":"Comparing speeds","q":"Cyclist A rides 100 m in 20 s. Cyclist B rides 120 m in 30 s. Who is faster?","o":["A, at 5 m/s compared with 4 m/s","B, because B travelled further","B, because B rode for longer","They have the same speed"],"e":"Speed depends on both distance and time. A: 100 ÷ 20 = 5 m/s. B: 120 ÷ 30 = 4 m/s."},
  {"t":"c2E","c":"Measurement accuracy","q":"Why do light gates connected to a timer give a more accurate speed than a person using a stopwatch?","o":["They remove the error caused by human reaction time","They make the object move at a steady speed","They measure distance as well as time","Stopwatches always run slow"],"e":"A person takes a fraction of a second to react when starting and stopping a stopwatch. For short times this is a large error."},
  {"t":"c1E","c":"Repeat readings","q":"Why should you repeat a speed measurement several times and calculate a mean?","o":["To reduce random errors and spot anomalous results","To make the object move faster on each repeat","Because the first reading is always the wrong one","To change the independent variable each time"],"e":"Each reading may be slightly off in a random way. Averaging several readings gives a more reliable value, and repeats help you spot a result that does not fit."},
  {"t":"b2A","c":"Going back to the start","q":"A distance-from-home–time graph rises, stays flat, then slopes back down to zero. What does the downward part show?","o":["The person is travelling back towards home","The person is falling down","The person is slowing down but still moving away","The person is stationary"],"e":"On a graph of distance from a starting point, a falling line means that distance is getting smaller, so the person is returning."},
  {"t":"a1K","c":"Units of speed","q":"Which of these is a unit of speed?","o":["m/s","m","s","m × s"],"e":"Speed is distance divided by time, so its unit is a distance unit divided by a time unit, such as m/s or km/h."},
  {"t":"a2A","c":"Realistic speeds","q":"Which is a realistic walking speed for a person?","o":["1.5 m/s","15 m/s","150 m/s","0.015 m/s"],"e":"15 m/s is faster than the world's fastest sprinters (about 10 m/s). A sensible estimate helps you spot calculation mistakes."},
  {"t":"a2N","c":"Distance from speed and time","q":"A car travels at a steady 20 m/s for 1 minute. How far does it go?","o":["1200 m","20 m","120 m","3 m"],"e":"First change 1 minute into 60 s. distance = speed × time = 20 × 60 = 1200 m."},
  {"t":"a1N","c":"Distance in km","q":"A coach travels at 45 km/h for 2 hours. How far does it travel?","o":["90 km","22.5 km","47 km","45 km"],"e":"distance = speed × time = 45 km/h × 2 h = 90 km."},
  {"t":"b2N","c":"Gradient from a graph","q":"A straight line on a distance–time graph goes from 0 m at 0 s to 50 m at 10 s. What is the speed?","o":["5 m/s","50 m/s","500 m/s","0.2 m/s"],"e":"Speed = gradient = change in distance ÷ change in time = 50 ÷ 10 = 5 m/s."},
  {"t":"b2A","c":"Not at the origin","q":"A distance–time graph is a horizontal line at 20 m from 0 s to 10 s. What does this show?","o":["It is not moving; it is 20 m from the start","It is moving at a steady speed of 20 m/s","It travelled a distance of 20 m in the 10 s","It is moving at a steady speed of 2 m/s"],"e":"Distance is not changing, so the object is not moving. The line's height tells you where it is."},
  {"t":"b3N","c":"Average over two parts","q":"A toy car travels 40 m in the first 4 s, then stops for 6 s. What is its average speed over the whole 10 s?","o":["4 m/s","10 m/s","6.7 m/s","0 m/s"],"e":"Average speed = total distance ÷ total time = 40 m ÷ 10 s = 4 m/s. The time spent stopped still counts."},
  {"t":"b1K","c":"Constant speed","q":"What does a straight, sloping line on a distance–time graph show?","o":["Constant (steady) speed","Increasing speed","The object is stationary","Decreasing speed"],"e":"A straight line has the same gradient everywhere, so the speed does not change."},
  {"t":"b2A","c":"Lines crossing","q":"On a distance–time graph, the lines for two runners cross at 30 s. What does this mean?","o":["They are at the same place at 30 s","They have the same speed at 30 s","They have both stopped at 30 s","They are both speeding up at 30 s"],"e":"Where the lines cross, both have the same distance value at the same time, so one runner is overtaking the other."},
  {"t":"c1E","c":"Equipment","q":"Which pair of instruments would you use to measure the average speed of someone walking down a corridor?","o":["A measuring tape and a stopwatch","A thermometer and a stopwatch","A balance and a ruler","A newton meter and a clock"],"e":"You need the distance and the time."},
  {"t":"c3N","c":"Light gate calculation","q":"A card 0.10 m long passes through a light gate, blocking the beam for 0.02 s. What is the speed of the card?","o":["5 m/s","0.002 m/s","0.2 m/s","50 m/s"],"e":"speed = 0.10 m ÷ 0.02 s = 5 m/s."},
  {"t":"c2A","c":"Speed cameras","q":"Average speed cameras record a car at two points 2 km apart. How do they find the car's speed?","o":["Divide the distance between the cameras by the time taken between them","Multiply the distance between the cameras by the time taken","Measure how loud the engine is at each of the two cameras","Measure the car's mass and divide it by the distance travelled"],"e":"This gives an average speed over that stretch of road."},
  {"t":"c3E","c":"Precision and reaction time","q":"A stopwatch displays times to 0.01 s, but you time a 1 m fall by hand. Why is the result not accurate to 0.01 s?","o":["Human reaction time (about 0.2 s) is much larger than 0.01 s","Stopwatches cannot measure fractions of a second","Objects fall at a different speed every time","The display is too small to read accurately"],"e":"The uncertainty comes from the person, not the stopwatch display."},
  {"t":"c3E","c":"Reducing timing error","q":"Why is it better to time a trolley over a 5 m track than over a 0.5 m track when using a stopwatch?","o":["Reaction-time errors become a smaller fraction of the time","The trolley will go much faster on a longer track","Shorter tracks are always more slippery than long ones","It makes no difference, as the stopwatch is the same"],"e":"Reaction time adds about the same error each time. A longer measured time means a smaller percentage error."},
  {"t":"a3N","c":"Using minutes","q":"A cyclist rides 3 km in 15 minutes. What is the average speed in km/h?","o":["12 km/h","0.2 km/h","45 km/h","5 km/h"],"e":"15 minutes is 0.25 hours. 3 km ÷ 0.25 h = 12 km/h. Alternatively, 4 × 15 min = 1 h, so 4 × 3 km = 12 km."},
  {"t":"a2K","c":"Instantaneous speed","q":"A car's speedometer reads 50 km/h. What does this show?","o":["Its speed at that moment","Its average speed for the whole journey","The distance it has travelled","Its top speed"],"e":"Speed at a particular moment is called instantaneous speed. It can be different from the average speed."},
  {"t":"a2N","c":"Slow speeds","q":"A snail moves at 1 mm/s. How long does it take to travel 1 m?","o":["1000 s","1 s","100 s","10 s"],"e":"1 m = 1000 mm. time = 1000 mm ÷ 1 mm/s = 1000 s, about 17 minutes. Use the same units for distance."},
  {"t":"a1K","c":"Rearranging","q":"Which equation correctly gives time?","o":["time = distance ÷ speed","time = speed ÷ distance","time = distance × speed","time = speed − distance"],"e":"From speed = distance ÷ time, rearranging gives time = distance ÷ speed and distance = speed × time."},
  {"t":"b3A","c":"Round trip","q":"You walk 200 m to a shop and 200 m back home. On a graph of distance from home, where does the line end?","o":["At 0 m, because you are back home, even though you walked 400 m","At 400 m, because that is the total distance walked","At 200 m, because that is how far away the shop is","Off the top of the graph, because the line keeps rising"],"e":"The graph shows how far you are from home, not the total distance walked."},
  {"t":"a2N","c":"Round trip speed","q":"The 400 m round trip to the shop and back took 400 s in total, including time in the shop. What was the average speed?","o":["1 m/s","0 m/s","0.5 m/s","2 m/s"],"e":"Average speed uses the total distance travelled: 400 m ÷ 400 s = 1 m/s."},
  {"t":"a1N","c":"Running track","q":"An athlete runs one 400 m lap in 50 s. What is the average speed?","o":["8 m/s","20 000 m/s","0.125 m/s","450 m/s"],"e":"400 m ÷ 50 s = 8 m/s."},
  {"t":"b1A","c":"Steepest section","q":"A journey graph has three straight sloping sections. Section B is the steepest. What can you say?","o":["The speed was greatest during section B","The object was stationary during section B","Section B lasted the longest","Section B covered the shortest distance"],"e":"The gradient of a distance–time graph is the speed, so the steepest part shows the fastest motion."},
  {"t":"b2A","c":"Slowing down","q":"A line on a distance–time graph curves and becomes less steep, eventually flat. What happened?","o":["The object slowed down and stopped","The object sped up","The object moved at a steady speed","The object went backwards"],"e":"Decreasing gradient means decreasing speed. Flat means stopped."},
  {"t":"c2E","c":"Independent variable","q":"A student measures how the height of a ramp affects the speed of a toy car at the bottom. What is the independent variable?","o":["The height of the ramp","The speed of the car","The mass of the car","The length of the ramp"],"e":"The independent variable is the one you choose to change. Speed is measured, so it is the dependent variable."},
  {"t":"c2E","c":"Control variables","q":"In the ramp investigation, which variable should be kept the same?","o":["The car and the ramp surface","The height of the ramp","The speed at the bottom","Nothing; all of them can change"],"e":"Only the independent variable should change, so you know it is the cause of any difference in speed."},
  {"t":"a3N","c":"Comparing units","q":"Which is faster: 72 km/h or 18 m/s?","o":["72 km/h","18 m/s","They are the same speed","You cannot compare different units"],"e":"Convert to the same units first. 72 km/h = 72 000 m ÷ 3600 s = 20 m/s, which is faster than 18 m/s."},
  {"t":"c2E","c":"Anomalous results","q":"Five timings for the same run are 4.1 s, 4.0 s, 4.2 s, 6.5 s and 4.1 s. What should you do with 6.5 s?","o":["Treat it as anomalous, check it and leave it out of the mean","Include it, because every result must be used in the mean","Use only 6.5 s, because the largest value is the most accurate","Repeat the whole experiment with a different variable instead"],"e":"A result far from the others is probably a mistake. The mean of the rest, 4.1 s, is more reliable."},
  {"t":"b3A","c":"Describing a graph","q":"A runner's distance–time graph is steep, then less steep, then flat. Describe the run.","o":["Fast, then slower, then stopped","Slow, then faster, then stopped","Stopped, then fast, then slower","Fast, then stopped, then backwards"],"e":"Steeper means faster. A flat line means the distance is not changing, so the runner has stopped."},
  {"t":"b3A","c":"Vertical line","q":"Could a real object's distance–time graph contain a vertical line?","o":["No, because it would mean travelling a distance in no time","Yes, it would show an object moving at a steady speed","Yes, it would show an object that is standing still","No, because graphs are never allowed vertical lines"],"e":"A vertical line would mean infinite speed, which is impossible."},
  {"t":"b2A","c":"Parallel lines","q":"Two straight lines on a distance–time graph are parallel, one above the other. What does this show?","o":["Both objects are moving at the same speed","The object shown by the upper line is faster","The object shown by the lower line is faster","Both objects are standing still"],"e":"Parallel lines have the same gradient, so the speeds are equal. One object simply started further along."},
  {"t":"a3N","c":"Comparing different units","q":"Which is faster: 1 km in 4 minutes, or 400 m in 1 minute?","o":["400 m in 1 minute","1 km in 4 minutes","They are the same speed","You cannot compare them"],"e":"1 km in 4 minutes is 1000 ÷ 4 = 250 m per minute, which is slower than 400 m per minute."},
  {"t":"c3E","c":"Drawing a conclusion","q":"Speed at the bottom of a ramp: 10 cm high → 0.8 m/s; 20 cm → 1.1 m/s; 30 cm → 1.4 m/s. What is the best conclusion?","o":["The higher the ramp, the faster the car at the bottom","The higher the ramp, the slower the car at the bottom","Doubling the height always doubles the speed","The height of the ramp has no effect on speed"],"e":"Speed increases as height increases, but not in proportion: doubling 10 cm to 20 cm does not double 0.8 m/s."},
  {"t":"a2K","c":"What 60 km/h means","q":"A speedometer reads 60 km/h. What does this mean?","o":["At this speed the car would travel 60 km in one hour","The car has travelled 60 km so far on this journey","The car would take 60 hours to travel 1 km","The car travels 60 m in each second"],"e":"Speed tells you the distance covered in each unit of time."},
  {"t":"a3N","c":"Plane or cheetah","q":"A plane cruises at 900 km/h. A cheetah sprints at 30 m/s. Which is faster?","o":["The plane, which is going about 250 m/s","The cheetah, because 30 m/s is the bigger unit","They are travelling at the same speed","The cheetah, because 900 km/h is about 25 m/s"],"e":"900 km/h = 900 000 m ÷ 3600 s = 250 m/s, which is much faster than 30 m/s."},
  {"t":"c2E","c":"Starting the stopwatch","q":"When timing a toy car between two lines, why should you start the stopwatch as it crosses the first line, not when it is released?","o":["So the time matches the distance between the lines","So the car has time to stop before the second line","So the stopwatch has time to warm up","So the car goes faster between the lines"],"e":"Speed = distance ÷ time. The time must be for exactly the distance you measured."},
  {"t":"a2K","c":"Average speed","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"A car with an average speed of 50 km/h may have stopped during the journey.","R":"Average speed is total distance divided by total time.","a":0,"e":"Both true; the average hides the changes in speed, including stops."},
  {"t":"b2A","c":"Flat line","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"A horizontal line on a distance–time graph shows a constant speed.","R":"The gradient of a distance–time graph is the speed.","a":3,"e":"A horizontal line has zero gradient, so it shows a stationary object. The reason is true."},
  {"t":"a1K","c":"Units of speed","type":"multi","q":"Which are units of speed? Select all that apply.","o":["m/s","km/h","cm/s","kg","s/m"],"k":3,"e":"Speed is a distance divided by a time."},
  {"t":"c2E","c":"Reducing timing errors","type":"multi","q":"Which would make the timing of a rolling ball more accurate? Select all that apply.","o":["Use light gates and a timer","Repeat and calculate a mean","Time over a longer distance","Use a stopwatch that shows 0.001 s","Round all times to the nearest second"],"k":3,"e":"A more precise display does not remove reaction time, and rounding makes results worse."},
  {"t":"a3N","c":"Ordering speeds","type":"order","q":"Put these speeds in order from slowest to fastest.","o":["1 m/s","18 km/h","10 m/s","72 km/h"],"e":"18 km/h = 5 m/s and 72 km/h = 20 m/s."},
  {"t":"b1A","c":"Odd one out: graphs","q":"On a distance–time graph, which is the odd one out?","o":["A horizontal line","A steep straight line","A gentle straight line","A curve getting steeper"],"e":"All the others show movement. A horizontal line shows an object that is not moving."}
  ]},
{ n: 11, title: "Sound", strand: "Physics", topics: "Vibrations, how sound travels, loudness and amplitude, pitch and frequency, the ear, echoes",
  qs: [
  {"t":"a2E","c":"Sound needs a medium","q":"An electric bell rings inside a glass jar. As the air is pumped out, the sound fades, but you can still see the hammer moving. What does this show?","o":["Sound needs particles (a medium) to travel through, but light does not","The bell stops vibrating once there is no air around it","Light needs air to travel through, just like sound does","Glass absorbs sound but lets light through, so the jar blocks it"],"e":"Sound is passed on by particles vibrating and bumping into each other. In a vacuum there are no particles, so sound cannot travel. Light can travel through a vacuum."},
  {"t":"a3A","c":"Sound in space","q":"Two astronauts are on a spacewalk with their radios switched off. Can they talk to each other?","o":["Only if their helmets touch, so sound travels through the solid helmets","Yes, if they shout loudly enough inside their helmets","Yes, because sound travels even faster in space than in air","No, because sound cannot travel through any material at all"],"e":"Space is a vacuum, so sound cannot travel through it. Touching helmets gives a solid path for the vibrations."},
  {"t":"a1K","c":"Speed in different media","q":"In which of these does sound travel fastest?","o":["Steel","Water","Air","A vacuum"],"e":"Sound travels fastest in solids, slower in liquids and slowest in gases, because particles in solids are close together and strongly linked. It cannot travel in a vacuum."},
  {"t":"a3A","c":"What travels","q":"When you hear someone speak across a room, what has travelled from them to you?","o":["Energy, passed on by air particles vibrating back and forth","Air particles from their mouth that have moved across the room","Light given off by their voice","Sound particles"],"e":"Air particles vibrate around fixed positions and pass the vibration on. They do not travel across the room with the sound."},
  {"t":"b2N","c":"Amplitude and loudness","q":"Two sounds are shown on an oscilloscope. Trace X has taller waves than trace Y, with the same spacing. What can you say?","o":["X is louder than Y; they have the same pitch","X is higher pitched than Y; they are equally loud","X is quieter than Y","X is both louder and higher pitched than Y"],"e":"The height of the wave (amplitude) shows loudness. The number of waves on the screen shows frequency, which is pitch."},
  {"t":"b2N","c":"Frequency and pitch","q":"A trace on an oscilloscope changes so that more waves fit across the screen, with the same height. What has changed?","o":["The pitch is higher","The sound is louder","The sound is quieter","The sound is travelling faster"],"e":"More waves across the same time means more vibrations per second, a higher frequency, and so a higher pitch."},
  {"t":"b2A","c":"Changing pitch","q":"How can you make a guitar string produce a higher note?","o":["Make the vibrating part of the string shorter or tighter","Pluck the string harder so it vibrates more","Use a longer, looser string that vibrates more","Play the guitar in a bigger room with echoes"],"e":"Shorter, tighter or thinner strings vibrate more times per second, giving a higher frequency. Plucking harder makes the sound louder, not higher."},
  {"t":"b1K","c":"Frequency definition","q":"A sound has a frequency of 500 Hz. What does this mean?","o":["The source vibrates 500 times each second","The sound travels 500 m every second","The sound is 500 times louder than silence","The sound lasts 500 seconds"],"e":"Frequency is the number of vibrations per second, measured in hertz (Hz)."},
  {"t":"a1A","c":"Light vs sound speed","q":"In a storm you see lightning before you hear the thunder. Why?","o":["Light travels much faster than sound","The thunder is made after the lightning","Sound has to travel further than light","Your eyes work faster than your ears"],"e":"Both are made at the same moment. Light travels at about 300 000 km/s, while sound in air travels at only about 340 m/s."},
  {"t":"c2N","c":"Calculating distance","q":"You hear thunder 3 seconds after you see the lightning. The speed of sound in air is about 340 m/s. Roughly how far away is the storm?","o":["About 1 km","About 113 m","About 340 m","About 3 km"],"e":"distance = speed × time = 340 m/s × 3 s = 1020 m, which is about 1 km. The light arrives almost instantly."},
  {"t":"c3N","c":"Echoes","q":"You stand 170 m from a large wall and clap. The speed of sound is 340 m/s. When do you hear the echo?","o":["After 1 second","After 0.5 seconds","After 2 seconds","Straight away"],"e":"The sound must travel to the wall and back: 340 m in total. 340 m ÷ 340 m/s = 1 s."},
  {"t":"d2K","c":"Range of hearing","q":"A dog whistle has a frequency of 25 000 Hz. Why can a dog hear it but a person cannot?","o":["It is above the human range of hearing, about 20 Hz to 20 000 Hz","It is too quiet for humans","Sound at that frequency cannot travel in air","Human ears only detect low-pitched sound below 2000 Hz"],"e":"Sound above about 20 000 Hz is called ultrasound. Humans cannot hear it, but many animals, including dogs and bats, can."},
  {"t":"d2K","c":"The ear","q":"Which part of the ear changes vibrations into electrical signals that go to the brain?","o":["The cochlea","The eardrum","The ear canal","The small bones (ossicles)"],"e":"The eardrum vibrates and the ossicles pass and amplify the vibrations. Hair cells in the cochlea turn them into nerve signals sent along the auditory nerve."},
  {"t":"a1E","c":"All sounds come from vibrations","q":"Grains of rice on a drum skin jump when the drum is hit. What does this show?","o":["The drum skin vibrates when it makes a sound","Sound is made of rice-sized particles","The drum is blowing air upwards","Sound pushes objects away from the drum"],"e":"Every sound is produced by something vibrating. The rice makes the drum skin's vibrations visible."},
  {"t":"a1E","c":"Tuning fork","q":"A sounding tuning fork is dipped into water and makes splashes. What does this show?","o":["The prongs of the fork are vibrating","Water makes the tuning fork louder","Sound is a liquid","The fork is hot"],"e":"The vibrations are too fast to see, but they show up when the fork hits the water."},
  {"t":"a1K","c":"Voice","q":"How do you make the sound of your voice?","o":["Air from the lungs makes the vocal cords in the larynx vibrate","The tongue vibrates against the teeth","Air particles are thrown out of the mouth at high speed","The lungs vibrate"],"e":"Muscles change the tension of the vocal cords to change the pitch."},
  {"t":"a2K","c":"Compressions","q":"How does sound travel through air?","o":["Particles vibrate back and forth, making regions of squashed-together and spread-out particles","Particles move up and down at right angles to the direction of the sound, like a rope","Particles travel all the way from the source to your ear, carrying the sound","Particles stop moving as the sound passes, then start again once it has gone"],"e":"Sound is a longitudinal wave of compressions and rarefactions. The vibrations are in the same direction as the wave travels."},
  {"t":"a2K","c":"Sound speeds","q":"Which is closest to the speed of sound in water?","o":["1500 m/s","340 m/s","300 000 km/s","0 m/s"],"e":"Sound is about four times faster in water than in air (about 340 m/s), and even faster in solids such as steel."},
  {"t":"b2A","c":"Amplitude and energy","q":"Why can a very loud sound damage your ears?","o":["A loud sound has a large amplitude and carries more energy","Loud sounds are always higher pitched than quiet sounds","Loud sounds travel faster, so they hit the ear harder","Loud sounds contain more air particles than quiet sounds"],"e":"Large vibrations deliver more energy to the ear and can damage the delicate hair cells in the cochlea."},
  {"t":"b2A","c":"Distance and loudness","q":"Why does a sound get quieter as you move further from it?","o":["Its energy spreads out, so the amplitude reaching you is smaller","The sound slows down as it travels, so less arrives each second","The pitch drops as you move away, and lower sounds seem quieter","Air particles further away stop vibrating, so the sound fades"],"e":"The same energy is shared over a bigger area. Some energy is also absorbed by the air."},
  {"t":"b1K","c":"Decibels","q":"Loudness is measured in decibels (dB). Which sound would have the highest decibel value?","o":["A jet engine nearby","A whisper","Normal conversation","Leaves rustling"],"e":"Whispers are around 30 dB, conversation around 60 dB and a nearby jet engine over 120 dB, which can cause pain and damage."},
  {"t":"d1A","c":"Hearing protection","q":"Why do people who use loud machines wear ear defenders?","o":["To reduce the amplitude reaching their ears and prevent damage","To make the machines quieter for other people who are nearby","To change the pitch of the machine so it is less annoying","To help them hear the machines more clearly over other noise"],"e":"Damage to hair cells in the cochlea from loud noise does not repair itself."},
  {"t":"c1A","c":"Soft surfaces","q":"Why are recording studios lined with soft materials like foam?","o":["Soft materials absorb sound and reduce echoes","Soft materials reflect sound back into the room","Foam makes the sounds come out higher pitched","Foam makes the sound travel faster to the microphone"],"e":"Hard, smooth surfaces reflect sound. Soft, uneven surfaces absorb it."},
  {"t":"c3N","c":"Sonar","q":"A ship sends a sound pulse to the sea bed and receives the echo 2 s later. Sound travels at 1500 m/s in water. How deep is the sea?","o":["1500 m","3000 m","750 m","300 m"],"e":"In 2 s the sound travels 1500 × 2 = 3000 m. That is down and back, so the depth is 3000 ÷ 2 = 1500 m."},
  {"t":"c2A","c":"Echolocation","q":"Bats find insects in the dark by making high-pitched sounds. How does this work?","o":["They listen for echoes reflected from the insects","The sound attracts insects towards the bat's mouth","The sound stuns the insects so that they fall","The bats can see the sound waves bouncing around"],"e":"The time and direction of the echo tell the bat where the insect is. Bats use ultrasound, which humans cannot hear."},
  {"t":"c2A","c":"Ultrasound scans","q":"Ultrasound is used to check on a baby developing in the uterus. Why is it suitable?","o":["It reflects from boundaries inside the body to form an image and is not harmful","It is very loud, so it can force its way through skin and muscle","It is a type of light that can shine through the body","It kills harmful bacteria in the uterus while it makes an image"],"e":"Ultrasound echoes from different tissues build up a picture without the risks of X-rays."},
  {"t":"b2A","c":"Size and pitch","q":"Why do large drums and long pipes make lower notes than small drums and short pipes?","o":["Larger objects vibrate more slowly, giving a lower frequency","Larger objects vibrate faster","Larger objects make sounds with smaller amplitude","Size does not affect pitch"],"e":"Frequency, and so pitch, depends on how fast the object vibrates. Bigger objects tend to vibrate at lower frequencies."},
  {"t":"b3A","c":"Blowing across bottles","q":"You blow across the tops of bottles holding different amounts of water. The column of air vibrates. Which bottle gives the highest note?","o":["The one with the most water (shortest air column)","The one with the least water (longest air column)","They all give the same note","The empty bottle"],"e":"A shorter column of air vibrates faster, giving a higher frequency."},
  {"t":"d2A","c":"Hearing and age","q":"Why can older people often not hear very high-pitched sounds that teenagers can hear?","o":["The upper limit of hearing usually falls with age","Older people's ears are more sensitive","High sounds travel more slowly to older people","Older people hear only ultrasound"],"e":"Hair cells that detect high frequencies are damaged first over a lifetime."},
  {"t":"d1K","c":"Infrasound","q":"Elephants communicate using sounds below 20 Hz. What are these called?","o":["Infrasound","Ultrasound","Echoes","Decibels"],"e":"Sounds too low for humans to hear are infrasound. Sounds too high are ultrasound."},
  {"t":"b2K","c":"Microphones","q":"When sound is displayed on an oscilloscope, what does the microphone do?","o":["It changes the sound vibrations into an electrical signal","It makes the sound louder so the screen can show it","It changes the sound into light that the screen displays","It stores the sound so it can be played back later"],"e":"The oscilloscope shows how the electrical signal, which copies the sound wave, changes over time."},
  {"t":"b3A","c":"Same note, different instruments","q":"A piano and a violin play the same note equally loudly. You can still tell them apart. Why?","o":["The shapes of their sound waves are different (different quality or timbre)","They have different frequencies, even though the note is the same","They have different amplitudes, even though they are equally loud","Sound from the violin travels faster than sound from the piano"],"e":"Same pitch means same frequency, and same loudness means same amplitude. The difference is in the wave shape."},
  {"t":"a2A","c":"String telephone","q":"A string telephone only works when the string is pulled tight. Why?","o":["Vibrations pass along a taut string, but a slack string does not pass them on","A tight string is shorter, so the sound has less distance to go","Sound travels through the air next to the string, which a tight string guides","A loose string absorbs the light that carries the sound signal"],"e":"The vibrations travel through the solid string. When it is slack, the vibrations die away."},
  {"t":"a2A","c":"Sound in solids","q":"In old films, people put their ear to a railway track to hear a train coming. Why does this work?","o":["Sound travels faster through the solid metal than through air","Metal makes sounds louder by itself, like a speaker","Light from the train travels along the shiny track","Air does not carry sound over long distances at all"],"e":"In the steel rail, sound is faster and loses less energy, so the train is heard earlier."},
  {"t":"b2N","c":"Calculating frequency","q":"A loudspeaker cone vibrates 600 times in 3 seconds. What is the frequency?","o":["200 Hz","1800 Hz","600 Hz","3 Hz"],"e":"Frequency is vibrations per second: 600 ÷ 3 = 200 Hz."},
  {"t":"d2A","c":"Damaged eardrum","q":"Why can a burst eardrum cause hearing loss?","o":["The eardrum cannot vibrate properly to pass the vibrations on to the ossicles","The eardrum makes the electrical signals, so none are sent to the brain","Sound can no longer enter the ear canal once the eardrum is burst","The cochlea stops producing sound when the eardrum is damaged"],"e":"The eardrum is the first part to vibrate. It passes vibrations to the ossicles and then the cochlea."},
  {"t":"d2K","c":"Ossicles","q":"What do the three small bones (ossicles) in the middle ear do?","o":["They pass on and amplify vibrations from the eardrum","They change sound vibrations into electrical signals","They keep you balanced, but play no part in hearing","They absorb loud sounds completely to protect the ear"],"e":"The ossicles act as levers, making the vibrations larger as they pass them to the inner ear."},
  {"t":"a3A","c":"Double glazing","q":"Double-glazed windows have a gap between two panes. How does this reduce noise from outside?","o":["The gap has few particles to carry the vibrations, so less sound passes","Glass reflects all sound, and two panes reflect twice as much","The gap makes the sound higher pitched, so it is harder to hear","The gap makes sound travel faster, so it passes through quickly"],"e":"Sound needs a medium. A gap with very few particles, or a vacuum, passes sound poorly."},
  {"t":"c3A","c":"Small rooms","q":"Why do you not usually hear a separate echo in a small room?","o":["The reflection returns so quickly it merges with the sound","Sound is not reflected by walls in small rooms","Small rooms have too little air to carry an echo","The sound travels too slowly to come back in time"],"e":"To hear a separate echo, the reflected sound must return about 0.1 s or more after the original, which needs a reflecting surface about 17 m or more away."},
  {"t":"a2A","c":"Light and sound in space","q":"Why can we see the Sun but not hear the huge explosions happening on it?","o":["Light can travel through the vacuum of space, but sound cannot","The Sun is silent, because nothing on it makes vibrations","Sound from the Sun is too high-pitched for us to hear","The atmosphere blocks all sound but lets light through"],"e":"There are almost no particles in space to carry sound vibrations."},
  {"t":"b3A","c":"Plucking harder","q":"A guitar string is plucked harder. What changes on the oscilloscope?","o":["The waves get taller but stay the same distance apart","The waves get closer together but stay the same height","The waves get both taller and closer together","Nothing changes, because it is the same note"],"e":"Plucking harder increases the amplitude (loudness). The note (frequency) stays the same."},
  {"t":"b3N","c":"Two traces","q":"Which describes the oscilloscope traces for a loud, low note and a quiet, high note?","o":["Loud low: tall, widely spaced waves; quiet high: short, closely spaced waves","Loud low: short, closely spaced waves; quiet high: tall, widely spaced waves","Loud low: tall, closely spaced waves; quiet high: short, widely spaced waves","Both notes give exactly the same trace, just at different times"],"e":"Height shows loudness (amplitude). Spacing shows pitch: closer waves mean higher frequency."},
  {"t":"d1K","c":"Outer ear","q":"Which part of the ear collects sound and funnels it inwards?","o":["The outer ear (pinna)","The cochlea","The ossicles","The auditory nerve"],"e":"The shape of the outer ear directs sound waves down the ear canal to the eardrum."},
  {"t":"d2A","c":"Hearing aids","q":"How does a hearing aid help someone with damaged hearing?","o":["It makes sounds louder for ears that detect them poorly","It changes sound into light for the brain to see","It replaces the cochlea with a tiny microphone","It slows sound down so it is easier to hear"],"e":"A hearing aid amplifies sounds, increasing their amplitude before they reach the ear."},
  {"t":"b2K","c":"Amplitude","q":"What is the amplitude of a sound wave?","o":["The size of the vibration, shown by the wave's height","The number of vibrations made in each second","The speed at which the sound travels through air","The time between one vibration and the next one"],"e":"Larger amplitude means a louder sound. The number of vibrations per second is the frequency."},
  {"t":"b2A","c":"Ordering by frequency","q":"Put these in order from lowest to highest frequency: a dog whistle, thunder, a human voice.","o":["Thunder, human voice, dog whistle","Dog whistle, human voice, thunder","Human voice, thunder, dog whistle","Thunder, dog whistle, human voice"],"e":"Thunder rumbles at low frequencies, voices are in the middle, and dog whistles are very high, often above human hearing."},
  {"t":"a2E","c":"Sound through water","q":"How could you show that sound travels through water?","o":["Listen underwater while someone taps stones together under the water","Watch ripples form on the water when a bell rings nearby","Pour water on a speaker and see whether it gets quieter","Shine a torch through some water while music is playing"],"e":"Hearing the tapping underwater shows the vibrations have travelled through the water to your ears."},
  {"t":"c2A","c":"Echo sounding","q":"A ship's echo sounder finds that echoes return more quickly than before. What does this tell the crew?","o":["The water is shallower","The water is deeper","The water is saltier","The water is warmer"],"e":"A shorter time means the sound travelled a shorter distance to the sea bed and back."},
  {"t":"b2A","c":"Ruler twang","q":"A ruler is twanged over the edge of a desk. Shortening the overhanging part makes the note higher. Why?","o":["A shorter part vibrates faster, giving a higher frequency","A shorter part vibrates with a larger amplitude","A shorter part makes the sound travel faster","A shorter part makes fewer vibrations each second"],"e":"Shorter, smaller vibrating objects vibrate more times per second, so the pitch is higher."},
  {"t":"a2A","c":"Sound in space","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Sound cannot travel through space.","R":"Space is a vacuum, with no particles to pass on vibrations.","a":0,"e":"Both true, and the reason explains the assertion."},
  {"t":"b2A","c":"Louder is not higher","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"A louder sound always has a higher frequency.","R":"A louder sound has a larger amplitude.","a":3,"e":"Loudness depends on amplitude, not frequency, so the assertion is false."},
  {"t":"a1A","c":"Light before thunder","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Light travels faster than sound.","R":"Light can travel through a vacuum.","a":1,"e":"Both true, but travelling through a vacuum is not why light is faster."},
  {"t":"b2A","c":"Raising pitch","type":"multi","q":"Which would make a guitar string play a higher note? Select all that apply.","o":["Shorten the vibrating length","Tighten the string","Use a thinner string","Pluck it harder","Use a longer string"],"k":3,"e":"Plucking harder makes the note louder, not higher. A longer string gives a lower note."},
  {"t":"c2A","c":"Uses of echoes","type":"multi","q":"Which use echoes? Select all that apply.","o":["Sonar on ships","Bats hunting insects","Ultrasound scans","Ear defenders","Hearing aids"],"k":3,"e":"Sonar, echolocation and ultrasound scans all time reflected sound."},
  {"t":"d1K","c":"Sound into the ear","type":"order","q":"Put these in the order a sound passes through them.","o":["Outer ear","Ear canal","Eardrum","Ossicles","Cochlea","Auditory nerve"],"e":"The vibration travels inwards and is changed into electrical signals in the cochlea."},
  {"t":"a1K","c":"Odd one out: media","q":"Which is the odd one out?","o":["A vacuum","Steel","Water","Air"],"e":"Sound can travel through steel, water and air, but not through a vacuum."}
  ]},
{ n: 12, title: "Light", strand: "Physics", topics: "How we see, straight-line travel, reflection, refraction, dispersion, colour and filters",
  qs: [
  {"t":"a1A","c":"How we see objects","q":"How are you able to see this page?","o":["Light from a source reflects off the page and enters your eyes","Light leaves your eyes, lands on the page and lets you see it","The page gives out its own light, which travels into your eyes","Your eyes send out signals that bounce off the page and return"],"e":"Non-luminous objects are seen because they reflect light from a luminous source, such as the Sun or a lamp, into our eyes. Eyes detect light; they do not send it out."},
  {"t":"a1K","c":"Luminous objects","q":"Which of these is a non-luminous object?","o":["The Moon","The Sun","A candle flame","A lit torch bulb"],"e":"The Moon does not make its own light. We see it because it reflects sunlight."},
  {"t":"a1A","c":"Shadows","q":"Why do shadows form?","o":["Light travels in straight lines and cannot bend around an opaque object","Opaque objects give out darkness, which fills the area behind them","Light slows down behind objects, so less of it reaches the ground","Light is reflected back by the shadow, so the area looks dark"],"e":"Light travels in straight lines. An opaque object blocks the light, leaving an area behind it that light cannot reach."},
  {"t":"b1N","c":"Law of reflection","q":"A ray hits a plane mirror with an angle of incidence of 35°. What is the angle of reflection?","o":["35°","55°","70°","145°"],"e":"The angle of incidence equals the angle of reflection. Both are measured from the normal, the line at 90° to the mirror."},
  {"t":"b3N","c":"Measure from the normal","q":"A ray makes an angle of 30° with the surface of a mirror. What is the angle of reflection?","o":["60°","30°","90°","120°"],"e":"Angles are measured from the normal, not the mirror. If the ray is 30° from the surface, it is 90° − 30° = 60° from the normal. So both angles are 60°."},
  {"t":"b2N","c":"Mirror images","q":"You stand 2 m in front of a plane mirror. How far are you from your image?","o":["4 m","2 m","1 m","0 m"],"e":"The image appears as far behind the mirror as you are in front of it: 2 m + 2 m = 4 m. The image is also the same size and laterally inverted."},
  {"t":"b2A","c":"Diffuse reflection","q":"Paper reflects most of the light that hits it. Why can't you see your reflection in it?","o":["Its surface is rough, so it scatters reflected light in many directions","Paper absorbs all of the light that falls on it","Paper only reflects white light, not the colours of your face","The law of reflection does not apply to paper surfaces"],"e":"Every tiny part of the paper still obeys the law of reflection, but the surface is uneven, so the rays leave in many directions. A smooth mirror reflects them all in an orderly way."},
  {"t":"c2K","c":"Refraction into glass","q":"A ray of light passes at an angle from air into a glass block. What happens?","o":["It slows down and bends towards the normal","It speeds up and bends away from the normal","It slows down and bends away from the normal","It travels straight on without changing"],"e":"Light travels more slowly in glass than in air. When it enters at an angle, the change in speed makes it bend towards the normal."},
  {"t":"c2A","c":"Ray along the normal","q":"A ray of light enters a glass block along the normal (at 90° to the surface). What happens?","o":["It slows down but does not change direction","It slows down and bends towards the normal","It is totally reflected back out of the block","It speeds up and bends away from the normal"],"e":"The ray still changes speed, but because it hits the surface straight on, it does not bend."},
  {"t":"c3A","c":"Apparent depth","q":"A swimming pool looks shallower than it really is. Why?","o":["Light bends away from the normal as it leaves the water, so the bottom seems higher","Water magnifies the bottom of the pool, so it seems nearer, like a lens would","Light reflects off the water surface, so you see the sky rather than the bottom","Light travels faster in water than in air, so it reaches your eye too early"],"e":"Your brain assumes light travels in straight lines. The refracted rays seem to come from a point higher than the real bottom."},
  {"t":"c2A","c":"Dispersion","q":"White light passes through a prism and a spectrum appears. Why?","o":["White light is a mixture of colours, and each colour is refracted by a different amount","The prism adds colours to the white light as it passes through the glass","The prism reflects each colour from a different face of the glass","Only red light is refracted by the prism; the other colours are made by it"],"e":"Violet is refracted the most and red the least, so the colours spread out. The prism does not create the colours; it separates them."},
  {"t":"d2A","c":"Coloured objects","q":"A red shirt is lit only by blue light. What colour does it appear?","o":["Black","Red","Blue","Purple"],"e":"A red object reflects red light and absorbs other colours. With no red light falling on it, it reflects nothing, so it looks black."},
  {"t":"d3A","c":"Filters","q":"White light passes through a red filter and then a green filter. What comes out?","o":["No light","Red light","Green light","Yellow light"],"e":"A filter only lets through its own colour and absorbs the rest. Only red light leaves the red filter, and the green filter absorbs red. Filters remove colours; they do not add them."},
  {"t":"d1A","c":"White objects","q":"A white sheet of paper is lit only by green light. What colour does it appear?","o":["Green","White","Black","Magenta"],"e":"A white object reflects all colours that fall on it. If only green light falls on it, it reflects green."},
  {"t":"a1K","c":"Speed of light","q":"Which is the speed of light?","o":["About 300 000 km/s","About 340 m/s","About 1500 m/s","About 300 km/h"],"e":"Nothing travels faster than light. It could go around the Earth more than seven times in one second."},
  {"t":"a2A","c":"Light from the Sun","q":"Light takes about 8 minutes to reach us from the Sun. What does this mean?","o":["We see the Sun as it was about 8 minutes ago","The Sun is 8 km away","Sunlight is slower than sound","We see the Sun 8 minutes in the future"],"e":"Because light takes time to travel, distant objects are always seen as they were when the light left them."},
  {"t":"a1K","c":"Transparent, translucent, opaque","q":"Frosted glass in a bathroom window lets light through but you cannot see clearly through it. What is it?","o":["Translucent","Transparent","Opaque","Luminous"],"e":"Transparent materials let light through clearly. Translucent materials let light through but scatter it. Opaque materials let no light through."},
  {"t":"a2A","c":"Shadow size","q":"A puppet is moved closer to a lamp. What happens to its shadow on the wall?","o":["It gets bigger","It gets smaller","It stays the same size","It disappears"],"e":"Closer to the lamp, the object blocks a wider cone of light."},
  {"t":"a3A","c":"Pinhole camera","q":"Why is the image in a pinhole camera upside down?","o":["Light travels in straight lines, so rays from the top and bottom cross at the pinhole","The pinhole turns the light around as it passes through, like a mirror would","The screen is fitted upside down, so the image appears that way round","Light bends as it passes through the hole, curving down to the screen"],"e":"Rays from top and bottom of the object cross over as they pass through the small hole."},
  {"t":"a2A","c":"Ray direction","q":"In a ray diagram showing how you see a tree, which way should the arrows point?","o":["From the Sun to the tree, then from the tree to the eye","From your eye to the tree, because your eye sends out light","From the tree to the Sun, because the tree reflects light back","Arrows are not needed, because light goes both ways at once"],"e":"Light travels from a source, reflects off objects and enters the eye."},
  {"t":"b2A","c":"Periscope","q":"A periscope uses two plane mirrors. How are they arranged?","o":["Parallel to each other, each at 45° to the tube","Facing each other, both at 90° to the tube","Both lying flat along the inside of the tube","One at 45° and the other at 90° to the tube"],"e":"Each mirror turns the light through 90°, so light enters at the top and leaves at the bottom going in the same direction."},
  {"t":"b2A","c":"Lateral inversion","q":"Why is AMBULANCE written backwards on the front of ambulances?","o":["Drivers ahead read it the right way round in their mirrors","So the patient can read it from inside the ambulance","Because mirrors turn images upside down, and this corrects it","Because backwards letters are easier to paint quickly"],"e":"A plane mirror image is laterally inverted, so reversed writing appears normal in a mirror."},
  {"t":"b3K","c":"Virtual images","q":"Why is the image in a plane mirror called a virtual image?","o":["Light only seems to come from behind the mirror; no screen can show it","It is always smaller than the object, so it is not a real copy","It is upside down, so it cannot count as a real image","It is made of real light that collects behind the glass"],"e":"No light actually travels behind the mirror. Your brain traces the reflected rays back in straight lines."},
  {"t":"b2A","c":"Ray along the normal","q":"A ray hits a mirror along the normal. In what direction is it reflected?","o":["Straight back along the same path","Along the mirror surface","At 90° to the incident ray","It passes through the mirror"],"e":"The angle of incidence is 0°, so the angle of reflection is also 0°."},
  {"t":"c2K","c":"Why refraction happens","q":"What causes light to refract when it passes from air into water at an angle?","o":["Its speed changes as it enters a different medium","Water absorbs some of the colours of the light","The water surface reflects part of the light","The light gains energy as it enters the water"],"e":"Light slows down in water. Hitting at an angle, one side of the beam slows first, so the beam changes direction."},
  {"t":"c2A","c":"Glass into air","q":"A ray leaves a glass block and goes back into air at an angle. Which way does it bend?","o":["Away from the normal, as it speeds up","Towards the normal, as it slows down","It does not bend","It reflects straight back"],"e":"This is the reverse of light entering the glass."},
  {"t":"c2A","c":"Bent pencil","q":"A pencil standing in a glass of water looks bent at the water surface. Why?","o":["Light from the underwater part refracts at the surface","The water really bends the pencil a little","Light from the pencil is reflected by the glass","The water makes the pencil look much smaller"],"e":"Your brain assumes light travels in straight lines, so the underwater part appears in a different place."},
  {"t":"c2K","c":"Lenses","q":"A convex (converging) lens can bring parallel rays of light together at a point. How?","o":["It refracts the rays as they enter and leave the glass","It reflects the rays from its curved surfaces","It absorbs the rays that would spread out","It speeds the rays up inside the glass"],"e":"The curved surfaces mean rays hit at different angles and are bent by different amounts towards one point."},
  {"t":"c2A","c":"Rainbows","q":"How does a rainbow form?","o":["Raindrops refract and split sunlight into its colours","Clouds give out coloured light after it has rained","Raindrops absorb all colours except one, which we see","Sunlight reflects off wet ground into coloured bands"],"e":"Each raindrop acts like a tiny prism. You see a rainbow with the Sun behind you."},
  {"t":"c1K","c":"Order of the spectrum","q":"Which colour of light is refracted least by a prism?","o":["Red","Violet","Green","Blue"],"e":"The order is red, orange, yellow, green, blue, indigo, violet. Red bends least and violet bends most."},
  {"t":"c3E","c":"Recombining colours","q":"A spectrum from one prism passes into a second prism, turned the other way. White light comes out. What does this show?","o":["White light is a mixture of colours that can be recombined","Prisms create colours, and a second one destroys them","The second prism absorbs all of the colours","Light can only travel in straight lines through glass"],"e":"Newton used this experiment to show that colours are already in white light, not added by the prism."},
  {"t":"d2K","c":"Primary colours of light","q":"Red light and green light shine on the same part of a white screen. What colour do you see there?","o":["Yellow","Brown","White","Black"],"e":"Red, green and blue are the primary colours of light. Red + green = yellow, red + blue = magenta, green + blue = cyan."},
