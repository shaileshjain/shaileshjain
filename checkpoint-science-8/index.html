  {"t":"d2K","c":"Adding all three","q":"Red, green and blue light overlap on a white screen. What colour appears where all three meet?","o":["White","Black","Brown","Grey"],"e":"Adding all three primary colours of light gives white. Mixing light is different from mixing paints."},
  {"t":"d1A","c":"Green leaves","q":"Why does a leaf look green in sunlight?","o":["It reflects green light and absorbs the rest","It produces its own green light","It absorbs green light and reflects others","It reflects all colours of light equally"],"e":"The colour we see is the colour of the light reflected into our eyes."},
  {"t":"d3A","c":"Yellow under red light","q":"A yellow object reflects red and green light. What colour does it look under red light?","o":["Red","Yellow","Black","Green"],"e":"Only red light falls on it, and it reflects red, so it looks red."},
  {"t":"d2A","c":"Black objects","q":"Why does a black car get hotter in sunlight than a white car?","o":["Black absorbs all colours of light, transferring more energy","Black reflects all colours, so it heats up more","Black cars have bigger engines that give out more heat","White surfaces reflect only heat, not light"],"e":"Black surfaces absorb most of the light falling on them. White surfaces reflect most of it."},
  {"t":"d2A","c":"Blue under green light","q":"A blue book is lit only by green light. What colour does it appear?","o":["Black","Blue","Green","Cyan"],"e":"The blue book reflects only blue light. With no blue light falling on it, it reflects nothing."},
  {"t":"d3A","c":"Filters and objects","q":"You look at a red apple through a green filter. What colour does it appear?","o":["Black","Red","Green","Yellow"],"e":"The apple reflects red light. The green filter absorbs red light, so no light from the apple reaches your eye."},
  {"t":"d2K","c":"Colour is not inside objects","q":"Which statement about the colour of an object is correct?","o":["It depends on the light falling on it and the colours it reflects","It is always the same, whatever coloured light is used","The object makes its own coloured light, which we see","It depends only on how hot or cold the object is"],"e":"Change the light and the colour you see can change."},
  {"t":"a1K","c":"The eye","q":"Which part of the eye focuses light onto the retina?","o":["The lens","The pupil","The iris","The optic nerve"],"e":"Light enters through the pupil. The cornea and lens focus it onto the retina, which sends signals to the brain along the optic nerve."},
  {"t":"b1N","c":"Mirror distances","q":"A cat sits 1.5 m in front of a mirror. How far behind the mirror does its image appear?","o":["1.5 m","3 m","0.75 m","0 m"],"e":"In a plane mirror the image is the same distance behind the mirror as the object is in front."},
  {"t":"a2A","c":"Seeing in the dark","q":"In a completely dark room with no light at all, can you see a white sheet of paper?","o":["No, because there is no light to reflect from it into your eyes","Yes, because white objects glow faintly in the dark","Yes, once your eyes have had time to adjust to the dark","Only if the paper is held very close to your eyes"],"e":"Eyes need light to enter them. With no light source, there is nothing to reflect."},
  {"t":"b2A","c":"Seeing round corners","q":"How can a mirror let a driver see round a sharp bend?","o":["It reflects light, changing its direction","It bends light as it passes through the glass","It makes its own light that shines round the bend","It absorbs light from cars and gives it out again"],"e":"Light reflects off the mirror at the same angle it hit it, so it can be sent towards the driver."},
  {"t":"b2A","c":"Rippled water","q":"Calm water gives a clear reflection of trees, but rippled water does not. Why?","o":["The rippled surface scatters light in many directions","Rippled water absorbs all of the light that hits it","Calm water makes its own light, but rippled water does not","The law of reflection only works for very calm water"],"e":"Every small part of the surface obeys the law of reflection, but an uneven surface sends rays off in different directions."},
  {"t":"c3A","c":"Appearing coin","q":"A coin in an empty cup is just hidden behind the rim. When water is poured in, the coin comes into view. Why?","o":["Light from the coin bends as it leaves the water, reaching your eye","The water reflects the coin up over the rim of the cup","The coin floats up to the surface of the water","The water magnifies the coin, making it look larger"],"e":"Light refracts away from the normal as it leaves the water, so it bends over the rim to your eye."},
  {"t":"c2A","c":"Spearing a fish","q":"Someone tries to spear a fish. Where should they aim?","o":["Below where the fish appears, because it is deeper than it looks","Above where the fish appears, because it is higher than it looks","Exactly where the fish appears, as light travels straight","To one side, because water reflects light sideways"],"e":"Refraction makes underwater objects look shallower than they are."},
  {"t":"d3A","c":"Red object in cyan light","q":"Cyan light is a mixture of green and blue light. What colour does a red object look under cyan light?","o":["Black","Red","Cyan","Magenta"],"e":"A red object reflects only red light. Cyan light contains no red, so nothing is reflected."},
  {"t":"d2A","c":"White clothes in hot places","q":"Why do people in hot, sunny places often wear white clothes?","o":["White reflects most light, so the clothes absorb less energy","White absorbs all colours of light and stores them","White clothes make their own cooling light","White fabric lets the wind through more easily"],"e":"Dark colours absorb more light and get hotter. White reflects most of the light falling on it."},
  {"t":"a2A","c":"Eclipse","q":"What causes a solar eclipse?","o":["The Moon passes between the Sun and Earth, casting a shadow","The Earth passes between the Sun and the Moon at midday","The Sun stops giving out its light for a short time","Thick clouds block out the Sun completely for hours"],"e":"The Moon is opaque, and light travels in straight lines, so the Moon's shadow falls on part of the Earth."},
  {"t":"c2K","c":"Slowest light","q":"In which of these does light travel most slowly?","o":["Glass","Air","Water","It is the same in all of them"],"e":"Light is fastest in a vacuum, almost as fast in air, slower in water and slower still in glass."},
  {"t":"d2K","c":"Blue object","q":"Which colours of white light does a blue object absorb?","o":["All colours except blue","Only blue light","None of the colours","Only red and green light"],"e":"It reflects blue light into our eyes and absorbs the rest."},
  {"t":"b2K","c":"The normal","q":"What is the normal in a ray diagram?","o":["A line at 90° to the surface where the ray hits","A line drawn along the surface of the mirror","The path the ray takes after it reflects","The angle between the ray and the mirror"],"e":"Angles of incidence, reflection and refraction are all measured from the normal."},
  {"t":"d3A","c":"Paint vs light","q":"Red and green paint mix to make a dark brown, but red and green light mix to make yellow. Why the difference?","o":["Paints absorb colours, but coloured lights add together","Paints contain far more particles than light does","Mixing light only works in a completely dark room","Paints reflect all of the colours equally well"],"e":"Each paint absorbs some colours, so mixing paints removes more colours. Mixing lights adds colours that reach your eye."},
  {"t":"a3A","c":"Seeing a beam","q":"A laser beam is invisible from the side in clean air, but you can see it in a dusty or smoky room. Why?","o":["Dust scatters some of the light sideways into your eyes","Dust makes the laser give out more light","Light only travels in straight lines in dusty air","Smoke turns the light into a different colour"],"e":"You only see light that enters your eye. In clean air, the beam's light carries straight on, away from you."},
  {"t":"a1A","c":"Seeing a book","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"We can see a book in a lit room.","R":"Light reflected from the book enters our eyes.","a":0,"e":"Both true, and the reason explains how we see non-luminous objects."},
  {"t":"d2A","c":"What filters do","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"A red filter adds red colour to white light.","R":"A red filter absorbs all colours except red.","a":3,"e":"Filters remove colours; they do not add them."},
  {"t":"a1K","c":"Luminous objects","type":"multi","q":"Which are luminous (give out their own light)? Select all that apply.","o":["The Sun","A candle flame","A glowing bulb","The Moon","A mirror"],"k":3,"e":"The Moon and a mirror only reflect light."},
  {"t":"a1K","c":"Transparent materials","type":"multi","q":"Which are transparent? Select all that apply.","o":["Clear glass","Clean water","Air","Frosted glass","Wood"],"k":3,"e":"Frosted glass is translucent and wood is opaque."},
  {"t":"c1K","c":"The spectrum","type":"order","q":"Put these colours in the order they appear in the spectrum, starting with the one refracted least.","o":["Red","Yellow","Green","Blue","Violet"],"e":"Red is refracted least and violet most."},
  {"t":"a1K","c":"Odd one out: materials","q":"Which is the odd one out?","o":["Wood","Glass","Water","Air"],"e":"Glass, water and air let light through. Wood is opaque."}
  ]},
{ n: 13, title: "Magnetism", strand: "Physics", topics: "Magnetic materials, poles, magnetic fields, the Earth's field, electromagnets",
  qs: [
  {"t":"a1K","c":"Magnetic materials","q":"Which of these metals is attracted to a magnet?","o":["Nickel","Aluminium","Copper","Gold"],"e":"Only a few metals are magnetic: iron, nickel and cobalt, and alloys such as steel. Most metals, including aluminium, copper and gold, are not."},
  {"t":"a3E","c":"Testing for a magnet","q":"You have two identical-looking metal bars. One is a magnet and the other is plain iron. How can you be sure which is the magnet?","o":["Find a bar that repels one end of a known magnet","Find a bar that attracts a known magnet","Find a bar that attracts paper clips with both ends","See which bar is heavier"],"e":"A magnet attracts unmagnetised iron, so attraction does not prove anything. Only a magnet can repel another magnet."},
  {"t":"a1K","c":"Poles","q":"The north pole of one magnet is brought near the north pole of another. What happens?","o":["They repel","They attract","Nothing happens","They attract, then join permanently"],"e":"Like poles repel; unlike poles attract."},
  {"t":"b2K","c":"Field lines","q":"Which statement about magnetic field lines around a bar magnet is correct?","o":["They go from the north pole to the south pole, and are closest together where the field is strongest","They go from the south pole to the north pole outside the magnet, and are evenly spaced","They are evenly spaced all around the magnet, because the field is the same everywhere","They cross each other near the poles, which is where the field is strongest"],"e":"Field lines show the direction a compass's north end would point. They are most crowded at the poles, where the field is strongest, and never cross."},
  {"t":"a2A","c":"Breaking a magnet","q":"A bar magnet is snapped in half. What do you get?","o":["Two smaller magnets, each with a north and a south pole","One north pole and one south pole on separate pieces","Two pieces of unmagnetised metal","One magnet and one piece of plain iron"],"e":"Every magnet has two poles. A new pair of poles forms at the break, so each half is a complete magnet."},
  {"t":"c3A","c":"Earth's magnetic field","q":"The north pole of a compass needle points towards the Arctic. What does this tell you about the Earth's magnetism?","o":["There is a magnetic south pole near the geographic North Pole","There is a magnetic north pole near the geographic North Pole","The compass is attracted by the cold","The Earth's magnetism only works in the northern hemisphere"],"e":"Unlike poles attract. Since the compass's north pole is pulled towards the Arctic, the Earth's magnetic pole there must behave as a south pole."},
  {"t":"b2A","c":"Magnetism passes through materials","q":"A magnet under a wooden table can move a paper clip on top of it. What does this show?","o":["Magnetic fields can pass through non-magnetic materials","Wood is a magnetic material, so it passes the force on","The paper clip is a magnet that is attracted to the table","Magnets work through wood only, not through other materials"],"e":"Non-magnetic materials such as wood, paper, plastic and glass do not block a magnetic field."},
  {"t":"d2A","c":"Current makes a field","q":"A plotting compass is placed beside a wire. When a current is switched on, the needle moves. Why?","o":["An electric current produces a magnetic field around the wire","The wire has become hot, and heat moves the compass needle","The wire must be made of iron, which attracts the needle","The current pushes air out of the wire onto the compass"],"e":"Any wire carrying a current has a magnetic field around it in circles. This is the basis of an electromagnet."},
  {"t":"d1K","c":"Electromagnet strength","q":"Which change would make an electromagnet stronger?","o":["Increasing the number of turns in the coil","Reversing the direction of the current","Using a plastic core instead of an iron core","Using a longer wire with the same number of turns"],"e":"An electromagnet is stronger with more turns, a larger current and an iron core. Reversing the current swaps the poles but does not change strength."},
  {"t":"d2A","c":"Reversing the current","q":"The battery in an electromagnet circuit is turned round. What happens?","o":["The north and south poles of the electromagnet swap","The electromagnet stops working","The electromagnet becomes twice as strong","Nothing changes at all"],"e":"The direction of the magnetic field depends on the direction of the current. Reverse the current and the poles reverse."},
  {"t":"d3A","c":"Choice of core","q":"Why does a scrapyard crane electromagnet use an iron core rather than a steel core?","o":["Iron loses its magnetism when the current is switched off, so the crane can drop the scrap","Iron is not a magnetic material, so it does not hold onto the scrap metal","Steel cannot be magnetised at all, so it would not lift anything","Iron makes the current flow faster, so the crane lifts more scrap"],"e":"Iron (soft iron) is easy to magnetise and demagnetise. Steel keeps its magnetism, so the scrap would not drop when the current is switched off."},
  {"t":"d1A","c":"Why electromagnets are useful","q":"What is the main advantage of an electromagnet over a permanent magnet?","o":["It can be switched on and off, and its strength can be changed","It never needs any electricity once it has been made","It is always stronger than every permanent magnet","It attracts all metals, including copper and aluminium"],"e":"Controlling the current lets you control the magnetism. This is why electromagnets are used in cranes, door locks, relays and electric bells."},
  {"t":"d2E","c":"Fair testing","q":"A student tests how the number of turns on a coil affects how many paper clips an electromagnet picks up. Which variable must be kept the same?","o":["The current in the coil","The number of turns","The number of paper clips picked up","None; all can change"],"e":"Number of turns is the independent variable and paper clips picked up is the dependent variable. Current also affects strength, so it must be controlled."},
  {"t":"a1A","c":"Steel","q":"Steel paper clips are attracted to a magnet. Why?","o":["Steel is mostly iron, which is a magnetic material","All metals are magnetic, and steel is a metal","Paper clips are made as magnets in the factory","Steel contains copper, which is magnetic"],"e":"Steel is an alloy of iron with a little carbon. Alloys containing iron are usually magnetic."},
  {"t":"a2K","c":"Magnetic vs magnet","q":"What is the difference between a magnetic material and a magnet?","o":["A magnetic material is attracted to magnets; a magnet has its own N and S poles","There is no difference; any magnetic material is a magnet with two poles","A magnet is made from non-magnetic materials that have been charged up","A magnetic material repels magnets, while a magnet attracts them"],"e":"An iron nail is a magnetic material. It is attracted to a magnet but cannot repel one unless it has been magnetised."},
  {"t":"a2A","c":"Induced magnetism","q":"A chain of iron paper clips hangs from a magnet. Why do the clips stick to each other?","o":["Each clip becomes a temporary magnet while it is in the magnet's field","The clips are coated with a sticky layer that holds them","Iron clips are always magnets, even before they touch one","Gravity pulls the clips together into a hanging chain"],"e":"The magnet induces magnetism in the clips. Each clip then attracts the next one."},
  {"t":"a3A","c":"Temporary and permanent","q":"The magnet is removed. Iron clips fall apart, but some steel pins still stick to each other. What does this show?","o":["Iron loses induced magnetism; steel keeps it","Steel is not a magnetic material at all","Iron is a permanent magnet, unlike steel","The steel pins are heavier than the clips"],"e":"Iron makes a good temporary magnet. Steel is used for permanent magnets."},
  {"t":"a2K","c":"Making a magnet","q":"How can a steel needle be magnetised?","o":["Stroke it repeatedly in one direction with a magnet","Heat it strongly in a Bunsen flame for a minute","Hammer it while it points in any direction","Leave it soaking in water for a few hours"],"e":"Stroking lines up the tiny magnetic regions inside the steel."},
  {"t":"a2K","c":"Demagnetising","q":"Which would destroy the magnetism of a bar magnet?","o":["Heating it strongly or hammering it","Storing it with an iron keeper","Cooling it gently in a fridge","Placing it on a wooden table"],"e":"Heating and hammering jumble up the magnetic regions inside, so they no longer line up."},
  {"t":"b1E","c":"Iron filings","q":"Iron filings are sprinkled on paper over a bar magnet. Where do most filings gather?","o":["Around the poles, where the field is strongest","In the middle, where the magnet is thickest","Evenly everywhere around the magnet","Far away, where the field spreads out"],"e":"The pattern of the filings shows the shape of the field. The field is strongest at the poles."},
  {"t":"b2A","c":"Compass","q":"Why does a plotting compass line up with a magnet's field?","o":["The compass needle is itself a small magnet","The needle is made of copper","The needle is attracted to all metals","The needle is pulled by gravity"],"e":"The needle's north pole points along the field lines, away from the magnet's north pole and towards its south pole."},
  {"t":"b3A","c":"Like poles field","q":"Two north poles face each other. What does the field look like between them?","o":["The field lines push apart, leaving a point in the middle with almost no field","Lines go straight from one north pole to the other, joining them together","There are no field lines anywhere near either magnet when like poles face","The field is strongest exactly in the middle, where the lines meet and cross"],"e":"Lines from both north poles curve away from each other, showing repulsion."},
  {"t":"b2A","c":"Unlike poles field","q":"A north pole faces a south pole. What does the field between them look like?","o":["Lines go across from the north pole to the south pole","Lines curve away from each other, leaving a gap","There is no field between the two poles at all","Lines go from the south pole to the north pole"],"e":"The lines linking the two poles show the attraction between them."},
  {"t":"b1K","c":"Non-contact force","q":"A magnet can move a paper clip without touching it. What does this tell you?","o":["Magnetism is a non-contact force","The magnet blows air at the paper clip","The paper clip is electrically charged","Magnetism is a contact force like friction"],"e":"Magnetism, like gravity, acts at a distance. Its effect gets weaker further away."},
  {"t":"b1A","c":"Distance","q":"How does the force of a magnet on a paper clip change as the clip is moved further away?","o":["It gets weaker","It gets stronger","It stays the same","It changes from attraction to repulsion"],"e":"Field lines spread out further from the magnet, so the field is weaker."},
  {"t":"c2A","c":"Unreliable compasses","q":"Why can a compass give a false reading near a steel desk or a car?","o":["The steel affects the magnetic field near the compass","Steel blocks light, so you cannot read it","Steel is non-magnetic, so it stops the field","The heat of the car melts the needle"],"e":"Nearby magnetic materials or magnets change the field the needle responds to."},
  {"t":"c2K","c":"Earth's field","q":"What is the Earth's magnetic field thought to be caused by?","o":["Movements in its molten iron outer core","A giant bar magnet buried in the ground","Magnetic rocks on the surface only","The Moon's gravity"],"e":"Flowing molten metal deep inside the Earth produces a field shaped like that of a bar magnet."},
  {"t":"c2K","c":"Magnetic north","q":"Is the Earth's magnetic pole in the north at exactly the geographic North Pole?","o":["No; it is some distance away and slowly moves over time","Yes; they are always in exactly the same place","No; it is at the South Pole","There is no magnetic pole in the north"],"e":"Navigators must allow for the angle between true north and magnetic north."},
  {"t":"d2K","c":"Solenoid","q":"What shape is the magnetic field around a long coil of wire (solenoid) carrying a current?","o":["Like the field of a bar magnet","Circles around one end only","There is no field","Straight lines along the wire only"],"e":"One end acts as a north pole and the other as a south pole, just like a bar magnet."},
  {"t":"d2A","c":"Finding the north end","q":"The north pole of a compass is repelled by one end of an electromagnet. What is that end?","o":["A north pole","A south pole","Not magnetic","You cannot tell"],"e":"Like poles repel, so that end must be a north pole."},
  {"t":"d2A","c":"More cells","q":"More cells are added to the circuit of an electromagnet. Why does it pick up more paper clips?","o":["The current increases, making a stronger field","The coil gets more turns when cells are added","The core changes from iron into steel","The wire gets thinner, which makes it stronger"],"e":"More cells give a higher voltage, which pushes a bigger current through the coil."},
  {"t":"d3A","c":"Too much current","q":"Why can't you make an electromagnet stronger and stronger simply by increasing the current?","o":["The wire heats up and could melt its insulation or the battery could be damaged","Current has no effect on strength, so increasing it does nothing at all","The iron core would melt instantly at even a slightly larger current","The core would turn into copper if too much current passed through it"],"e":"Large currents produce a lot of heat in the wire. Real electromagnets are designed to balance strength and heating."},
  {"t":"d3A","c":"Electric bell","q":"In an electric bell, an electromagnet pulls an iron arm that hits the bell. This breaks the circuit. What happens next?","o":["The electromagnet switches off, the arm springs back, the circuit is completed and it repeats","The bell stays silent, because the circuit cannot be completed again","The electromagnet becomes a permanent magnet and holds the arm forever","The arm stays stuck to the electromagnet because the iron is now magnetised"],"e":"The repeated switching on and off makes the arm vibrate rapidly and the bell ring continuously."},
  {"t":"a1A","c":"Recycling cans","q":"At a recycling centre, how can steel cans be separated from aluminium cans?","o":["With a large magnet or electromagnet, which attracts only the steel cans","By putting them in water, because only aluminium cans float","By heating them, because aluminium melts and steel does not","They cannot be separated, because both cans are made of metal"],"e":"Steel contains iron and is magnetic. Aluminium is not."},
  {"t":"d2N","c":"Investigation results","q":"An electromagnet picks up 4 clips with 10 turns, 8 clips with 20 turns and 12 clips with 30 turns. What is the best conclusion?","o":["The more turns there are, the more clips are picked up; doubling the turns doubles the clips","The number of turns does not matter, because the clips are all the same size","More turns make the electromagnet weaker, because the wire is longer","Only 30 turns makes a working electromagnet; fewer turns are not enough"],"e":"As the independent variable increases, the dependent variable increases in proportion in this data."},
  {"t":"d2A","c":"Copper coil","q":"The coil of an electromagnet is usually made of insulated copper wire. Why copper?","o":["Copper conducts electricity well; the iron core gives the magnetism","Copper is strongly magnetic, so it adds to the field from the core","Copper is heavy, so it holds the core firmly in place","Copper stops the current flowing, so the coil does not get hot"],"e":"The current produces the magnetic field. The iron core makes it much stronger. The insulation stops current jumping between turns."},
  {"t":"a1A","c":"Fridge magnets","q":"Fridge magnets stick to the fridge door. What does this tell you about the door?","o":["It is made of a magnetic material","The door is a magnet itself","The door is made of aluminium","The door is made of plastic"],"e":"The magnet attracts the steel door. A magnet does not stick to aluminium, copper or plastic."},
  {"t":"d1A","c":"Electromagnet uses","q":"Which device uses an electromagnet?","o":["An electric door lock","A wooden ruler","A glass magnifying lens","A candle"],"e":"Electromagnets are used where magnetism must be controlled: locks, relays, bells, loudspeakers and cranes."},
  {"t":"d2E","c":"Testing strength fairly","q":"Why should paper clips of the same size be used throughout an electromagnet investigation?","o":["So the number of clips fairly measures strength","So that the electromagnet gets stronger","So that the current stays the same throughout","So that fewer clips need to be used each time"],"e":"If the clips were different sizes, the count would not compare like with like."},
  {"t":"c1A","c":"Using a compass","q":"How does a compass help people find their way?","o":["Its needle lines up with the Earth's field and points north","Its needle always points towards wherever the Sun is","Its needle points to the nearest iron object instead","Its needle is pulled downwards by the Earth's gravity"],"e":"Knowing where north is lets you use a map to choose a direction."},
  {"t":"c3A","c":"Compass near the pole","q":"Near the Earth's magnetic pole in the north, a compass needle that is free to tilt points steeply down into the ground. Why?","o":["The field lines there point steeply into the ground","Gravity is much stronger near the poles than elsewhere","The needle is attracted to the large amounts of ice","The Earth's magnetic field is zero at the poles"],"e":"Like a bar magnet, the Earth's field lines go into and out of the planet near its magnetic poles."},
  {"t":"c2E","c":"Making a compass","q":"How can you make a simple compass?","o":["Magnetise a needle and float it on a cork in water","Float a strip of aluminium foil on water","Rub a plastic straw on your hair and hang it up","Hang a copper wire from a piece of thread"],"e":"A magnetised needle that can turn freely lines up with the Earth's magnetic field."},
  {"t":"b2E","c":"Plotting compass","q":"A small plotting compass is moved around a bar magnet and its direction is marked at many points. What does this show?","o":["The direction of the magnetic field at each point","The strength of gravity around the magnet","How hot each part of the magnet is","Which parts of the magnet are made of iron"],"e":"Joining the arrows gives the field lines. They run from the north pole to the south pole."},
  {"t":"a2A","c":"Bank cards","q":"Why should bank cards with a magnetic stripe be kept away from strong magnets?","o":["The stripe stores data as a magnetic pattern that can be scrambled","Strong magnets make the plastic card soften and melt","Strong magnets pull the metal chip out of the card","The card attracts the magnet and gets badly scratched"],"e":"Many cards also have chips, but the magnetic stripe can still be damaged."},
  {"t":"d3E","c":"Two variables at once","q":"A student increases both the number of turns and the current, and the electromagnet gets stronger. What is wrong with this investigation?","o":["Two variables changed, so you can't tell which one caused it","The electromagnet should have become weaker, not stronger","Current has no effect at all on an electromagnet's strength","The number of turns should have been reduced instead"],"e":"In a fair test, change only one independent variable at a time."},
  {"t":"d2A","c":"Why use an iron core","q":"Why is an electromagnet much stronger with an iron core than without one?","o":["The iron becomes magnetised and adds to the field","The iron carries the current instead of the wire","The iron stops the wire from getting too hot","The iron gives the coil some extra turns of wire"],"e":"The coil's field magnetises the iron, and the iron's own field adds to it."},
  {"t":"d1K","c":"Switching off","q":"What happens to an electromagnet with an iron core when the current is switched off?","o":["It loses almost all of its magnetism","It becomes a permanent magnet","Its poles swap over","It becomes twice as strong"],"e":"Iron is easily demagnetised, which is why electromagnets can be switched on and off."},
  {"t":"d2A","c":"Current and a wire's field","q":"The current in a straight wire is increased. What happens to the magnetic field around it?","o":["It gets stronger","It gets weaker","It disappears","It stays exactly the same"],"e":"A larger current produces a stronger magnetic field."},
  {"t":"a1K","c":"Which poles attract","q":"Which pair of poles attract each other?","o":["North and south","North and north","South and south","All pairs attract"],"e":"Unlike poles attract; like poles repel."},
  {"t":"b3K","c":"Do field lines cross?","q":"Can two magnetic field lines ever cross?","o":["No, because the field has one direction at each point","Yes, wherever two magnets are close to each other","Yes, but only when very close to the poles","No, because lines are only drawn on one side"],"e":"If lines crossed, a compass at that point would have to point two ways at once."},
  {"t":"a2A","c":"Permanent magnets","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"A steel needle can be made into a permanent magnet.","R":"Steel keeps its magnetism once it is magnetised.","a":0,"e":"Both true, and the reason explains it."},
  {"t":"a1K","c":"Aluminium cans","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Aluminium cans are attracted to magnets.","R":"Aluminium is a metal.","a":3,"e":"Aluminium is a metal but it is not magnetic."},
  {"t":"a1K","c":"Magnetic materials","type":"multi","q":"Which are magnetic materials? Select all that apply.","o":["Iron","Nickel","Cobalt","Steel","Copper","Aluminium"],"k":4,"e":"Iron, nickel, cobalt and steel (mostly iron) are magnetic."},
  {"t":"d1K","c":"Stronger electromagnets","type":"multi","q":"Which would make an electromagnet stronger? Select all that apply.","o":["More turns of wire","A larger current","An iron core","Reversing the current","A copper core"],"k":3,"e":"Reversing the current swaps the poles. Copper is not magnetic."},
  {"t":"a1K","c":"Odd one out: metals","q":"Which is the odd one out?","o":["Copper","Iron","Nickel","Cobalt"],"e":"Iron, nickel and cobalt are magnetic. Copper is not."},
  {"t":"c2A","c":"Compass needles","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"A compass needle points north.","R":"A compass needle is a small magnet that lines up with the Earth's magnetic field.","a":0,"e":"Both true, and the reason explains it."}
  ]}

/* ---------- number-question generators: fresh values every time, so they never repeat exactly ---------- */
/* Generators draw from a seeded random source, so a stored seed recreates exactly the question (and diagram) that was shown. */
let rnd = Math.random;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function runGen(g, seed) { const prev = rnd; rnd = mulberry32(seed); numOpts.last = null; try { const r = g.make(); if (numOpts.last && r.nv === undefined && (!r.type || r.type === "mcq") && r.o && r.o[0] === numOpts.last.text) { r.nv = numOpts.last.v; r.nu = numOpts.last.unit; } return r; } finally { rnd = prev; } }
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

/* ---------- question index ---------- */
const STRANDS = { Biology: "var(--bio)", Chemistry: "var(--chem)", Physics: "var(--phys)" };
const DIFF = { 1: "Foundation", 2: "Core", 3: "Stretch" };
const SKILL = { K: "Knowing facts", A: "Applying ideas", E: "Experiments", N: "Numbers and data" };
const BDIFF = { 1: -1.2, 2: 0, 3: 1.2 };            // difficulty on the ability scale
const INTERVAL_DAYS = [0, 1, 4, 10, 30];            // spacing after 0,1,2,3,4+ correct answers in a row
const QMAP = new Map();
UNITS.forEach(u => u.qs.forEach((q, i) => { Object.assign(q, { id: u.n + "-" + i, u: u.n, topic: q.t[0], d: +q.t[1], s: q.t[2] }); QMAP.set(q.id, q); }));
const ALLGENS = [...GENS, ...DIAGRAM_GENS];
ALLGENS.forEach(g => { Object.assign(g, { topic: g.t[0], d: +g.t[1], s: g.t[2], gen: true }); QMAP.set(g.id, g); });
const FORMAT = { mcq: "Multiple choice", diagram: "Diagrams and graphs", ar: "Assertion–reason", multi: "Select all that apply", order: "Putting in order", num: "Typed number answers" };
const formatOf = e => e.gen && QMAP.get(e.q)?.diagram ? "diagram" : (e.type || "mcq");
const unitOf = n => UNITS[n - 1];
const topicName = key => TOPICS[parseInt(key)][key.replace(/^\d+/, "")];
const topicKeys = n => Object.keys(TOPICS[n]).map(l => n + l);
const poolFor = (n, letter) => [...QMAP.values()].filter(q => q.u === n && (!letter || q.topic === letter));
const TOTAL_WRITTEN = UNITS.reduce((s, u) => s + u.qs.length, 0);

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const sig = x => 1 / (1 + Math.exp(-x));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const fmtDate = ms => new Date(ms).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
const fmtDay = ms => new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short" });
const fmtDur = ms => { const s = Math.round(ms / 1000); return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + (s % 60) + " s"; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function status(tp) {
  if (!tp || tp.n < 3) return { cls: "none", label: tp && tp.n ? "Too early to tell" : "Not tested yet" };
  const p = understanding(tp);
  if (p >= 85) return { cls: "mastered", label: "Mastered" };
  if (p >= 70) return { cls: "secure", label: "Secure" };
  if (p >= 45) return { cls: "developing", label: "Developing" };
  return { cls: "needs", label: "Needs work" };
}
const understanding = tp => tp ? Math.round(100 * sig(tp.theta)) : 0;

/* ---------- learner model: replays every answer in time order ---------- */
function emptyModel() { return { topics: new Map(), qs: new Map(), events: [] }; }
function applyEvent(m, e) {
  const key = e.u + e.t;
  const tp = m.topics.get(key) || { theta: 0, n: 0, right: 0, hist: [], last: 0 };
  const p = sig(tp.theta - BDIFF[e.d]);
  const r = e.ok ? (e.conf === "guess" ? 0.6 : 1) : 0;          // a lucky guess counts for less
  const k = Math.max(0.3, 1 / Math.sqrt(1 + tp.n)) * (!e.ok && e.conf === "sure" ? 1.2 : 1);
  tp.theta = Math.max(-3, Math.min(3, tp.theta + k * (r - p)));
  tp.n++; if (e.ok) tp.right++; tp.hist.push(e.ok ? 1 : 0); tp.last = e.at;
  m.topics.set(key, tp);
  const st = m.qs.get(e.q) || { seen: 0, right: 0, streak: 0, last: 0, lastOk: null, lastConf: null };
  st.seen++; if (e.ok) st.right++; st.last = e.at; st.lastOk = e.ok; st.lastConf = e.conf;
  st.streak = e.ok ? (e.conf === "guess" ? st.streak : st.streak + 1) : 0;
  m.qs.set(e.q, st);
  m.events.push(e);
}
function buildModel(attempts) {
  const m = emptyModel();
  const evs = [];
  for (const a of attempts) for (const it of a.items || []) evs.push(it);
  evs.sort((x, y) => x.at - y.at).forEach(e => applyEvent(m, e));
  return m;
}
function unitUnderstanding(m, n) {
  let w = 0, s = 0;
  for (const k of topicKeys(n)) { const tp = m.topics.get(k); if (tp && tp.n) { s += understanding(tp) * tp.n; w += tp.n; } }
  return w ? Math.round(s / w) : null;
}
function misconceptions(m) {
  return [...m.qs.entries()].filter(([id, st]) => st.lastOk === false && st.lastConf === "sure" && !QMAP.get(id)?.gen)
    .sort((a, b) => b[1].last - a[1].last).map(([id]) => id);
}
function mistakes(m, n) {
  return [...m.qs.entries()].filter(([id, st]) => st.lastOk === false && !QMAP.get(id)?.gen && (!n || QMAP.get(id)?.u === n))
    .sort((a, b) => b[1].last - a[1].last).map(([id]) => id);
}

/* ---------- adaptive selection ---------- */
function weightFor(q, m, now) {
  const st = m.qs.get(q.id);
  let w = 1;
  if (st) {
    const ageDays = (now - st.last) / 864e5;
    if (st.lastOk === false) w *= ageDays < 0.007 ? 0.05 : 2.2;            // retry mistakes, but not straight away
    else if (q.gen) w *= ageDays < 0.5 ? 0.35 : 0.9;                       // fresh numbers each time, still spaced
    else w *= ageDays < INTERVAL_DAYS[Math.min(st.streak, 4)] ? 0.03 : 0.9; // answered right: wait before asking again
  } else w *= q.gen ? 0.8 : 1.15;
  const tp = m.topics.get(q.u + q.topic);
  const theta = tp ? tp.theta : 0, n = tp ? tp.n : 0;
  w *= 0.2 + (1 - sig(theta)) + (n < 3 ? 0.35 : 0);                      // weaker topics get more questions
  const target = Math.max(-1.2, Math.min(1.2, theta - 0.4));             // aim for about 60–65% success, within the range we have
  w *= Math.exp(-Math.pow(BDIFF[q.d] - target, 2) / 0.9);
  return w;
}
function weightedPick(cands) {
  const top = cands.sort((a, b) => b.w - a.w).slice(0, 8);
  const sum = top.reduce((s, c) => s + c.w, 0);
  let r = Math.random() * sum;
  for (const c of top) { r -= c.w; if (r <= 0) return c.q; }
  return top[0]?.q;
}
function nextQuestion(run) {
  if (run.fixed) return run.fixed[run.items.length] ? QMAP.get(run.fixed[run.items.length]) : null;
  const now = Date.now();
  let pool = run.pool.filter(q => !run.used.has(q.id) && !(q.gen && run.gensUsed >= 5));
  if (run.coverage.length) { const t = run.coverage[0]; const sub = pool.filter(q => q.u + q.topic === t); if (sub.length) pool = sub; run.coverage.shift(); }
  // never repeat while unseen questions remain: allow only new questions, generators, and mistakes from an earlier sitting
  const fresh = pool.filter(q => { if (q.gen) return true; const st = model.qs.get(q.id); return !st || (st.lastOk === false && (now - st.last) > 10 * 60000); });
  if (fresh.some(q => !q.gen)) pool = fresh;
  if (!pool.length) return null;

/* ---------- storage: artifact database when available, this browser otherwise ---------- */
const store = { mode: "connecting", db: null, canWrite: true, learners: [], attempts: [], unsub: null, chains: {} };

const learnerName = () => store.learners.find(l => l.key === learnerKey)?.name || "the learner";

async function initStore() {

}
function loadLocal() {

}
async function addLearner(name) {

const HINT = { mcq: "Choose one answer (keys 1–4)", ar: "Choose one statement (keys 1–4)", multi: "Select every correct answer, then say how sure you are", order: "Tap the items in the correct order (Backspace undoes)", num: "Type your answer as a number" };
function renderQuiz() {
  const it = cur(), N = run.N, k = run.items.length, done = it.done, exam = run.noFeedback;
  const strandColor = STRANDS[unitOf(it.u).strand];
  let body = "";
  if (it.type === "ar") body += `<div class="arbox"><p><b>Assertion:</b> ${esc(it.A)}</p><p><b>Reason:</b> ${esc(it.R)}</p></div>`;
  if (it.fig) body += `<div class="figwrap">${it.fig}</div>`;
  let opts = "";
  if (it.type === "num") {
    opts = `<div class="numrow"><label class="sr" for="num-in">Your answer</label><input id="num-in" type="text" inputmode="decimal" autocomplete="off" placeholder="Your answer" value="${esc(it.sel)}" ${done ? "disabled" : ""}><span>${esc(it.nu)}</span></div>`;
  } else if (it.type === "order") {
    const items = it.sel.map((i, n) => `<li class="${done && !exam ? (i === it.seq[n] ? "ok" : "bad") : ""}">${esc(it.opts[i])}</li>`).join("");
    opts = `<ol class="seq">${items}${it.sel.length < it.opts.length ? `<li class="slot">Tap the ${ordinal(it.sel.length + 1)} item</li>` : ""}</ol>
      <div class="options">${it.opts.map((t, i) => it.sel.includes(i) ? "" : `<button class="opt" data-k="${i}" ${done ? "disabled" : ""}><span class="key">${i + 1}</span><span>${esc(t)}</span></button>`).join("")}</div>
      ${!done && it.sel.length ? `<button class="link" id="undo">Undo last</button>` : ""}`;
  } else {
    opts = `<div class="options">${it.opts.map((t, i) => {
      const picked = it.type === "multi" ? it.sel.includes(i) : it.sel === i;
      let cls = "opt" + (it.type === "multi" ? " multi" : "");
      if (done && !exam) { const corr = it.correct.includes(i); cls += corr ? (picked || it.type !== "multi" ? " correct" : " missed") : picked ? " wrong" : " dim"; }
      else if (picked) cls += " picked";
      return `<button class="${cls}" data-k="${i}" ${done ? "disabled" : ""} aria-pressed="${picked}"><span class="key">${it.type === "multi" ? (picked ? "✓" : "") : "ABCDEFGH"[i]}</span><span>${esc(t)}</span></button>`;
    }).join("")}</div>`;
  }
  let fb = "";
  if (done && !exam) {
    const misc = !it.ok && it.conf === "sure", lucky = it.ok && it.conf === "guess";
    const head = it.ok ? (lucky ? "Correct, though it was a guess" : "Correct") : (it.type === "mcq" || it.type === "ar") ? `Not quite. The answer is ${"ABCDEFGH"[it.correct[0]]}.` : "Not quite.";
    const extra = it.ok ? "" : it.type === "order" ? `<p>Correct order: ${esc(ansText(it))}</p>` : it.type === "num" ? `<p>Correct answer: <b>${esc(ansText(it))}</b></p>` : it.type === "multi" ? `<p>The correct answers are: ${esc(ansText(it))}</p>` : "";
    fb = `<div class="why" style="--fb:${it.ok ? "var(--good)" : "var(--bad)"}" role="status"><strong>${head}</strong>${extra}<p>${esc(it.e)}</p>
      ${misc ? `<p class="misc">You were sure about this one, so it may be a misconception. It will come back in a later test.</p>` : ""}
      ${lucky ? `<p class="misc">Because it was a guess, this question will come back so you can show you really know it.</p>` : ""}</div>`;
  }

      <button class="btn sm" data-conf="sure">Sure <kbd>S</kbd></button><button class="btn sm ghost" data-conf="think">Think so <kbd>T</kbd></button><button class="btn sm ghost" data-conf="guess">Guessing <kbd>G</kbd></button></div>`;
  const score = run.items.filter(x => x.done && x.ok).length;
  const fmtPill = it.type === "mcq" ? (it.fig ? "Diagram" : "") : { ar: "Assertion–reason", multi: "Select all that apply", order: "Put in order", num: "Type the answer" }[it.type];
  app.innerHTML = `
    <div class="qbar" style="--c:${strandColor}">
      <div class="qbar-row"><button class="link" id="quit">← Stop and save</button><span class="tally">${esc(learnerName())} · ${exam ? `Answered ${run.items.filter(x => x.done).length}` : `Score ${score}`} · Q ${k} of ${N}${run.deadline ? ` · <b id="timer" class="timer">${fmtClock(run.deadline - Date.now())}</b> left` : ""}</span></div>
      <div class="qbar-row"><h2>${esc(run.title)}</h2></div>
      <div class="progress" aria-hidden="true"><i style="width:${(k - (done ? 0 : 1)) / N * 100}%"></i></div>
    </div>
    <article class="card" style="--c:${strandColor}">
      <div class="qhead"><span class="eyebrow">Unit ${it.u} · ${esc(topicName(it.u + it.t))}</span><span>${fmtPill ? `<span class="dpill fmt">${fmtPill}</span>` : ""}<span class="dpill d${it.d}">${DIFF[it.d]}</span></span></div>
      <p class="qtext">${esc(it.text)}</p>

      </div>
    </article>`;
  document.getElementById("quit").onclick = quit;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => select(+b.dataset.k));
  app.querySelectorAll("[data-conf]").forEach(b => b.onclick = () => commit(b.dataset.conf));
  const undo = document.getElementById("undo"); if (undo) undo.onclick = () => { it.sel.pop(); renderQuiz(); };
  const num = document.getElementById("num-in");
  if (num && !done) { num.oninput = () => { it.sel = num.value; const c = app.querySelector(".conf"); if (c) c.hidden = !isComplete(it); }; if (!it.sel) num.focus(); }
  const nx = document.getElementById("next"); if (nx) nx.onclick = () => advance(false);
}
document.addEventListener("keydown", e => {
  if (!run || view.name !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = cur(); if (!it) return;
  const inInput = e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName), key = e.key.toLowerCase();
  const confKey = { s: "sure", t: "think", g: "guess" }[key];
  if (inInput) { if (e.key === "Enter" && !it.done && isComplete(it)) { e.preventDefault(); document.querySelector(".conf button")?.focus(); } return; }
  if (!it.done) {
    if (confKey && isComplete(it)) { e.preventDefault(); commit(confKey); return; }
    if (it.type === "order" && e.key === "Backspace" && it.sel.length) { e.preventDefault(); it.sel.pop(); renderQuiz(); return; }
    const n = "123456789".indexOf(key), l = "abcdefgh".indexOf(key);
    const i = n >= 0 ? n : (it.type === "mcq" || it.type === "ar") && !confKey && l >= 0 ? l : -1;
    if (i >= 0 && i < it.opts.length && it.type !== "num") { e.preventDefault(); select(i); }
    return;
  }
  if (e.key === "Enter" && document.activeElement?.id !== "next") { e.preventDefault(); advance(false); }
});
setInterval(() => {
  if (!run || !run.deadline || view.name !== "quiz") return;
  const left = run.deadline - Date.now(), el = document.getElementById("timer");
  if (el) el.textContent = fmtClock(left);
  if (left <= 0) { run.timeUp = true; finish(); }
}, 1000);

/* ---------- scorecard for one test ---------- */
function itemView(it) {
  if (it.gen) {
    const g = QMAP.get(it.q); let b = null;
    if (g && it.seed !== undefined && it.seed !== null) { try { b = runGen(g, it.seed); } catch (e) { b = null; } }
    return { ...it, text: b ? b.q : it.qt, e: b ? b.e : it.e, fig: b ? b.fig : null };
  }
  const q = QMAP.get(it.q) || { q: "(question removed)", e: "", c: "" };
  return { ...it, text: q.q, e: q.e, c: q.c, A: q.A, R: q.R };
}
const itemExtras = i => (i.A ? `<p class="ar-s"><b>Assertion:</b> ${esc(i.A)}<br><b>Reason:</b> ${esc(i.R)}</p>` : "") + (i.fig ? `<div class="figwrap sm">${i.fig}</div>` : "");
function formatChips(items) {
  return Object.keys(FORMAT).map(f => { const xs = items.filter(i => formatOf(i) === f); return xs.length ? `<span class="dpill fmt">${FORMAT[f]} ${xs.filter(i => i.ok).length}/${xs.length}</span>` : ""; }).join("");
}
function renderCard(a, before) {
  const items = (a.items || []).map(itemView);
  const N = items.length, score = items.filter(i => i.ok).length, p = pct(score, N);
  const band = p >= 80 ? ["secure", "Secure"] : p >= 50 ? ["developing", "Developing"] : ["needs", "Revisit"];
  const time = items.reduce((s, i) => s + (i.ms || 0), 0);
  const groups = { known: items.filter(i => i.ok && i.conf !== "guess"), lucky: items.filter(i => i.ok && i.conf === "guess"),
                   misc: items.filter(i => !i.ok && i.conf === "sure"), gaps: items.filter(i => !i.ok && i.conf !== "sure") };
  const byDiff = [1, 2, 3].map(d => { const xs = items.filter(i => i.d === d); return xs.length ? `<span class="dpill d${d}">${DIFF[d]} ${xs.filter(i => i.ok).length}/${xs.length}</span>` : ""; }).join("");
  const keys = [...new Set(items.map(i => i.u + i.t))];
  const topicRows = keys.map(k => {
    const xs = items.filter(i => i.u + i.t === k), tp = model.topics.get(k), now = understanding(tp), st = status(tp);
    const was = before?.get(k);
    const delta = was === undefined || !before ? "" : now > was ? `<span class="up">▲ ${now - was}</span>` : now < was ? `<span class="down">▼ ${was - now}</span>` : `<span class="muted">–</span>`;
    return `<tr><td>${esc(topicName(k))}<br><small class="muted">Unit ${parseInt(k)}</small></td><td class="tnum">${xs.filter(i => i.ok).length}/${xs.length}</td>
      <td><div class="bar ${st.cls}"><i style="width:${now}%"></i></div><small>${now}% · ${st.label}</small> ${delta}</td></tr>`;
  }).join("");
  const wrongs = items.filter(i => !i.ok).map(i => `
      <li class="${i.conf === "sure" ? "misc-item" : ""}"><span class="eyebrow">Unit ${i.u} · ${esc(topicName(i.u + i.t))} · ${DIFF[i.d]}${i.conf === "sure" ? " · Misconception" : ""}</span>
      <p>${esc(i.text)}</p>${itemExtras(i)}
      <p class="ans">${esc(learnerName())} chose <s>${esc(i.pick)}</s> (${confLabel(i.conf)}). Correct: <b>${esc(i.ans)}</b></p>
      <p class="exp">${esc(i.e)}</p></li>`).join("");
  const rights = items.filter(i => i.ok).map(i => `<li><span class="eyebrow">${esc(topicName(i.u + i.t))} · ${DIFF[i.d]} · ${confLabel(i.conf)}</span><p>${esc(i.text)}</p><p class="ans">Answer: <b>${esc(i.ans)}</b></p></li>`).join("");
  const weakest = keys.map(k => [k, model.topics.get(k)]).filter(([, tp]) => tp).sort((x, y) => x[1].theta - y[1].theta)[0];
  const statusNote = a.timeUp ? `<span class="band developing">Time ran out after ${N} of ${a.planned} questions</span>` : a.status === "complete" ? "" : `<span class="band developing">${a.status === "stopped" ? "Stopped early" : "Not finished"}</span>`;
  return `
    <article class="card">
      <div class="result-head">
        <span class="eyebrow">${esc(learnerName())} · ${esc(fmtDate(a.startedAt))}</span>

const confLabel = c => ({ sure: "sure", think: "thought so", guess: "guessed" }[c] || "no confidence given");

/* ---------- all scorecards ---------- */
function renderHistory() {
  const list = store.attempts.slice().reverse();

  const rows = list.map(a => {
    const p = pct(a.score, a.answered), misc = (a.items || []).filter(i => !i.ok && i.conf === "sure").length;
    const cls = p >= 80 ? "secure" : p >= 50 ? "developing" : "needs";
    return `<tr><td>${esc(fmtDate(a.startedAt))}</td><td><button class="link strong" data-act="card" data-v="${esc(a.id)}">${esc(a.title)}</button>${a.status !== "complete" ? ` <small class="muted">(${a.status === "stopped" ? "stopped early" : "not finished"})</small>` : ""}</td>

/* ---------- understanding report ---------- */
function accuracyBy(field, labels) {
  return Object.entries(labels).map(([k, label]) => {
    const xs = model.events.filter(e => String(e[field]) === String(k));
    const p = pct(xs.filter(e => e.ok).length, xs.length);
    return `<div class="acc"><span>${label}</span><div class="bar ${xs.length ? (p >= 70 ? "secure" : p >= 45 ? "developing" : "needs") : "none"}"><i style="width:${p}%"></i></div><small class="tnum">${xs.length ? p + "% of " + xs.length : "no answers yet"}</small></div>`;
  }).join("");
}
function renderReport() {
  const ev = model.events;

      <p class="ans">Chose <s>${esc(last?.pick)}</s> and was sure. Correct: <b>${esc(last?.ans)}</b></p><p class="exp">${esc(q.e)}</p></li>`;
  }).join("");

    }).join("");
    return `<section class="unit-report" style="--c:${STRANDS[u.strand]}"><h3><span class="unit-no sm">${String(u.n).padStart(2, "0")}</span> ${esc(u.title)} <small class="muted">${uu === null ? "not started" : uu + "% understood"}</small></h3>
      <div class="tablewrap"><table class="ttable"><thead><tr><th>Topic</th><th>Understanding</th><th>Right</th><th>Recent answers</th><th>Last practised</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join("");
  return `
    <section class="panel">
      <h2>${esc(learnerName())}'s conceptual understanding</h2>
      <p class="muted">Understanding is the estimated chance of answering a Core question on that topic correctly. It rises faster for correct answers on harder questions, counts lucky guesses for less, and drops more for confident wrong answers. A topic needs at least 3 answers before it gets a label.</p>
      <div class="tiles">
        <div class="tile"><b>${overall === null ? "–" : overall + "%"}</b><span>Overall understanding</span></div>
        <div class="tile"><b>${secure}<small>/56</small></b><span>Topics secure or mastered</span></div>
        <div class="tile"><b>${ev.length}</b><span>Questions answered</span></div>

        <div><h3>Question bank covered</h3><p class="muted">${esc(learnerName())} has answered <b>${[...model.qs.keys()].filter(id => !QMAP.get(id)?.gen).length}</b> of ${TOTAL_WRITTEN} written questions. New questions are always chosen before repeats, and the ${ALLGENS.length} generators make fresh diagrams and numbers every time.</p></div></div>
      <div class="split">
        <div><h3>Focus next</h3>${focus.length ? `<ul class="plain">${focus.map(([k, tp]) => `<li><button class="link strong" data-act="topic" data-v="${k}">${esc(topicName(k))}</button> <small class="muted">Unit ${parseInt(k)} · ${understanding(tp)}%</small></li>`).join("")}</ul>` : `<p class="muted">No weak topics yet among those tested.</p>`}</div>
        <div><h3>Strengths</h3>${strong.length ? `<ul class="plain">${strong.map(([k, tp]) => `<li>${esc(topicName(k))} <small class="muted">Unit ${parseInt(k)} · ${understanding(tp)}%</small></li>`).join("")}</ul>` : `<p class="muted">Strengths appear once a topic reaches 85%.</p>`}</div>
      </div>
      <div class="summary-box" id="summary-box" hidden><h3>Summary for parents</h3><p id="summary-text" class="pre"></p></div>
      <div class="row"><button class="btn ghost" data-act="summary" id="summary-btn" hidden>Write a summary for parents with Claude</button></div>
    </section>
    ${mis ? `<section class="panel"><h2>Misconceptions to talk through</h2><p class="muted">Questions ${esc(learnerName())} answered wrongly while sure, and has not yet got right since. These are the most useful ones to discuss together.</p><ul class="review">${mis}</ul></section>` : ""}
    ${units}`;

/* ---------- optional: plain-language summary written by Claude ---------- */
let sampleNs = null;

  const misc = misconceptions(model).slice(0, 10).map(id => QMAP.get(id).c);
  const diff = [1, 2, 3].map(d => { const xs = model.events.filter(e => e.d === d); return { level: DIFF[d], answered: xs.length, right: xs.filter(e => e.ok).length }; });
  const prompt = `You write short progress notes for a parent about their child's Grade 8 science (Cambridge Checkpoint Science 8). The learner's name is ${learnerName()}.
Data (JSON): ${JSON.stringify({ topics, misconceptions: misc, byDifficulty: diff, tests: store.attempts.length })}
Write 130–180 words in plain English, no markdown symbols. Use three short labelled parts: "Going well:", "Needs work:", "Try this week:" (the last with three concrete activities, such as a topic to practise or a misconception to discuss). Only use facts from the data; topics with fewer than 3 answers are too early to judge.`;
  try {
    const res = await sampleNs(prompt, { onText: ({ text }) => { out.textContent = text; } });
    out.textContent = res.text;
  } catch (e) { out.textContent = e?.code === "rate_limited" ? "Too many requests just now. Try again in a minute." : "The summary could not be written."; if (e?.code === "not_granted") btn.hidden = true; }
  btn.disabled = false;
}

/* ---------- start ---------- */
render();
initStore().then(() => render());
(async () => { try { sampleNs = await window.claude?.use?.("sample"); } catch (e) { sampleNs = null; } if (sampleNs) render(); })();
</script>
</body>
</html>
