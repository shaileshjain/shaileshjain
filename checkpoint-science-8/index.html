    o: ["Nicotine is addictive","Tar makes the lungs need smoke","Carbon monoxide gives them energy","Smoke contains vitamins the body needs"],
    e: "Nicotine is an addictive drug. It also raises heart rate and blood pressure." },
  { c: "Passive smoking", q: "Why can smoking harm people who do not smoke themselves?",
    o: ["They breathe in smoke from other people's cigarettes","Smoking uses up the oxygen in a room, so others cannot breathe","Smokers breathe out germs from the tar that infect other people","It cannot harm them, because smoke only affects the smoker's lungs"],
    e: "Breathing in second-hand smoke exposes people, including children, to the same harmful substances." },
  { c: "Bronchitis", q: "A smoker has bronchitis, with inflamed airways and lots of mucus. Why does the person cough a lot?",
    o: ["To try to clear mucus that the damaged cilia can no longer remove","Because the alveoli have grown larger and need more air to fill them","Because the diaphragm has stopped working and coughing replaces it","To get more nicotine from the smoke deeper into the lungs"],
    e: "Damaged cilia cannot sweep mucus away, so coughing is the body's way of trying to remove it." },
  { c: "Germinating seeds", q: "Germinating peas are put in a tube with limewater, and boiled (dead) peas in another. Only the first limewater turns milky. What does this show?",
    o: ["Living seeds respire and release carbon dioxide","Seeds photosynthesise in the dark","Boiled peas release more carbon dioxide","Limewater makes seeds respire"],
    e: "Only living cells respire. The boiled peas are a control, showing that the change is caused by living seeds." },
  { c: "Seeds need oxygen", q: "Seeds will not germinate without oxygen. Why?",
    o: ["They need oxygen for respiration to release energy for growth","Oxygen softens the seed coat","Oxygen is used for photosynthesis inside the seed","They need oxygen to absorb water"],
    e: "Growing needs energy, and seeds get this energy from aerobic respiration of their food stores." },
  { c: "Altitude", q: "Mountain climbers breathe faster at high altitude even when resting. Why?",
    o: ["There is less oxygen in each breath of air, so they must breathe more to get enough","There is more carbon dioxide high up, which they must breathe out faster","Cold mountain air cannot enter the lungs easily, so they take more breaths","Their muscles respire less at altitude, so less oxygen is needed each breath"],
    e: "Air at altitude is thinner, so each breath delivers less oxygen to the alveoli." },
  { c: "Comparing equations", q: "How are respiration and photosynthesis related?",
    o: ["The products of one are the reactants of the other","They are the same reaction, happening in different cells","Both use oxygen and both release glucose as a product","Both only happen in plants, and only in the light"],
    e: "Photosynthesis: carbon dioxide + water → glucose + oxygen. Respiration: glucose + oxygen → carbon dioxide + water." },
  { c: "Energy is released, not made", q: "Which phrase describes what respiration does with energy?",
    o: ["It releases energy stored in glucose","It creates new energy","It makes energy out of oxygen","It destroys energy"],
    e: "Energy cannot be created or destroyed. Respiration transfers the chemical energy stored in glucose into a form cells can use." },
  { c: "Breathing rate", q: "A student breathes 6 times in 20 seconds. What is their breathing rate?",
    o: ["18 breaths per minute","6 breaths per minute","120 breaths per minute","3 breaths per minute"],
    e: "There are three lots of 20 seconds in a minute: 6 × 3 = 18." },
  { c: "Smoking and fitness", q: "Why does smoking make it harder to run long distances?",
    o: ["Less oxygen reaches the muscles, because of carbon monoxide and damaged alveoli","Smoking makes the leg muscles grow too large to move quickly","Nicotine stops the heart beating for a few seconds at a time","Tar gives the muscles extra glucose, which makes them tire quickly"],
    e: "Carbon monoxide reduces the oxygen blood can carry, and damage to the alveoli reduces gas exchange." },
  { c: "Gas exchange surface", q: "Fish have gills instead of lungs. Which feature would you expect gills to share with alveoli?",
    o: ["A large surface area with a good blood supply and thin walls","Thick, dry walls that stop water getting into the blood","Very few blood vessels, so that the gills stay light","Cartilage rings that keep the gills open like a trachea"],
    e: "All efficient gas exchange surfaces share these features, because they make diffusion fast." },
  { c: "Asthma", q: "During an asthma attack the muscles around the bronchioles tighten. Why does the person struggle to breathe?",
    o: ["The airways become narrower, so less air can flow through","The alveoli fill with blood, so no air can get in","The diaphragm stops working, so the chest cannot expand","The trachea collapses, so air cannot reach the lungs"],
    e: "Narrow airways make it hard to move air in and out. Inhalers contain a drug that relaxes these muscles." },
  { c: "Respiration never stops", q: "When does respiration happen in your body?",
    o: ["All the time, day and night, even when asleep","Only when you are exercising and need extra energy","Only when you are breathing in and have fresh oxygen","Only during the day, when you are awake and moving"],
    e: "Cells always need energy, so respiration never stops while you are alive. The rate changes with activity." },
  { c: "Where energy goes", q: "Which is a use of the energy released by respiration in humans?",
    o: ["Contracting muscles, growth and keeping the body warm","Making glucose from carbon dioxide and water in the liver","Absorbing light energy through the skin to make vitamin D","Producing oxygen in the lungs to be used by the blood"],
    e: "Respiration provides energy for all life processes. Making glucose from carbon dioxide is what plants do in photosynthesis." }
  ]},
{ n: 5, title: "Reproduction and development", strand: "Biology", topics: "Gametes, fertilisation, the menstrual cycle, pregnancy, growth and adolescence",
  qs: [
  { c: "Sperm cell adaptations", q: "Sperm cells have a tail and contain many mitochondria. How do these help?",
    o: ["The tail lets the sperm swim, and the mitochondria release the energy it needs","The tail anchors the sperm to the egg, and mitochondria store food","The mitochondria carry the genetic information","They help the sperm divide into many cells"],
    e: "A sperm must swim a long way to reach the egg. Mitochondria are where respiration happens, so many mitochondria provide plenty of energy for swimming." },
  { c: "Egg cell adaptations", q: "Why is an egg cell much larger than a sperm cell?",
    o: ["It contains a store of food for the early embryo","It needs to swim further than a sperm","It contains more chromosomes than a sperm","It needs a larger nucleus to fuse with the sperm"],
    e: "The egg's large cytoplasm contains nutrients that supply energy until the embryo implants and gets food from the mother." },
  { c: "Fertilisation", q: "What exactly happens at fertilisation?",
    o: ["The nucleus of a sperm fuses with the nucleus of an egg","A sperm enters the uterus","An egg is released from the ovary","The embryo attaches to the wall of the uterus"],
    e: "Fertilisation is the joining of the two nuclei. It usually happens in the oviduct. Release of the egg is ovulation; attaching to the uterus wall is implantation." },
  { c: "Half the chromosomes", q: "Why do gametes contain only half the number of chromosomes of a normal body cell?",
    o: ["So that when two gametes fuse, the zygote has the full number of chromosomes","So that gametes are small and light enough to travel to each other","Because chromosomes are only needed in body cells, not in gametes","So that the baby gets all its features from just one of its parents"],
    e: "Each gamete brings half. When egg and sperm nuclei fuse, the zygote has a complete set, half from each parent." },
  { c: "Placenta", q: "What does the placenta do?",
    o: ["It lets oxygen and food pass to the fetus and wastes pass back, without the bloods mixing","It pumps the mother's blood directly into the fetus through the umbilical cord","It surrounds the fetus with fluid and protects it from bumps and knocks","It produces new egg cells so that the next pregnancy can begin straight away"],
    e: "The mother's blood and the fetus's blood come very close in the placenta, so substances diffuse across. They do not mix, which protects the fetus." },
  { c: "Lifestyle in pregnancy", q: "Why are pregnant women advised not to smoke?",
    o: ["Harmful substances cross the placenta and the fetus may get less oxygen, leading to low birth weight","Smoke enters the uterus directly through the mother's lungs and fills the amnion","Smoking makes the amniotic fluid evaporate, so the fetus has no protection","Smoking only harms the mother's lungs; nothing can reach the fetus"],
    e: "Carbon monoxide and nicotine can cross the placenta. Carbon monoxide reduces the oxygen carried in the blood, so the baby may grow more slowly." },
  { c: "Amniotic fluid", q: "What is the main function of the amniotic fluid?",
    o: ["It cushions and protects the fetus from knocks","It supplies the fetus with food","It carries oxygen to the fetus","It removes carbon dioxide from the fetus"],
    e: "The fetus floats in amniotic fluid inside the amnion. The fluid absorbs bumps. Food and oxygen arrive through the placenta and umbilical cord." },
  { c: "Menstrual cycle", q: "Why does the lining of the uterus thicken during each menstrual cycle?",
    o: ["To prepare for a fertilised egg to implant","To push the egg out of the ovary","To produce hormones that make sperm","To store food for the mother"],
    e: "A thick lining with a good blood supply is ready to receive an embryo. If no egg is fertilised, the lining breaks down and is lost during menstruation." },
  { c: "Ovulation timing", q: "In a typical 28-day cycle, starting on the first day of menstruation, roughly when is an egg released?",
    o: ["Around day 14","Around day 1","Around day 5","Around day 28"],
    e: "Ovulation usually happens about halfway through the cycle. Days 1 to 5 are menstruation. This is a typical pattern; real cycles vary." },
  { c: "Puberty and hormones", q: "What causes the body changes at puberty?",
    o: ["Sex hormones such as testosterone and oestrogen","A sudden increase in the amount of food eaten","Growth of new organs that were not there before","Changes in the number of chromosomes in body cells"],
    e: "At puberty the testes start producing testosterone and the ovaries produce oestrogen. These hormones cause secondary sexual characteristics to develop." },
  { c: "Twins", q: "How are identical twins formed?",
    o: ["One fertilised egg splits into two embryos","Two eggs are fertilised by two different sperm","One egg is fertilised by two sperm","Two eggs are fertilised by one sperm"],
    e: "Identical twins come from one zygote, so they have the same genetic information. Non-identical twins come from two eggs fertilised by two sperm." },
  { c: "Growth vs development", q: "Which statement shows the difference between growth and development?",
    o: ["Growth is an increase in size; development is becoming more complex, with new features","Growth only happens before birth; development only happens after birth","Growth means getting older; development means getting taller and heavier","They mean exactly the same thing and can always be swapped"],
    e: "A baby grows by getting bigger. It develops when it gains new abilities and features, such as walking, or body changes at puberty." },
  { c: "Many sperm", q: "Millions of sperm are released, but only one fertilises an egg. Why are so many produced?",
    o: ["Most sperm die or never reach the egg, so large numbers increase the chance that one will","Each sperm carries only one chromosome, so many are needed to give a full set","Many sperm must join together and combine before they can fertilise an egg","The extra sperm are absorbed and become food for the growing embryo"],
    e: "The journey to the oviduct is long and most sperm do not survive it. Producing huge numbers makes fertilisation more likely." },
  { c: "Testes", q: "What are the two main jobs of the testes?",
    o: ["Making sperm and testosterone","Storing urine and releasing sperm","Making eggs and the hormone oestrogen","Making the fluid that becomes semen"],
    e: "Sperm are produced in the testes all the time from puberty onwards. Testosterone causes male secondary sexual characteristics." },
  { c: "Scrotum", q: "Why do the testes hang outside the body in the scrotum?",
    o: ["Sperm develop best at a slightly lower temperature than body temperature","Being outside the body makes it easier for the sperm to swim away","The scrotum protects the testes from bumps better than the body could","There is no room left for them inside the body next to the bladder"],
    e: "Keeping the testes a little cooler than the rest of the body helps healthy sperm form." },
  { c: "Semen", q: "Glands add fluid to sperm to make semen. Why is this fluid important?",
    o: ["It provides nutrients and a liquid for the sperm to swim in","It contains extra chromosomes that the sperm pass on","It makes the sperm divide into more sperm cells","It kills off the weaker sperm before they leave"],
    e: "The fluid gives sperm energy-rich sugar and a liquid to move in." },
  { c: "Ovaries", q: "What is released from an ovary about once a month?",
    o: ["An egg cell","A sperm cell","An embryo","A placenta"],
    e: "Each ovary contains many immature eggs. Usually one is released at ovulation each cycle." },
  { c: "Moving the egg", q: "An egg cell cannot swim. How does it move along the oviduct?",
    o: ["Cilia and gentle muscle contractions move it along","It is pulled along by sperm that attach to it","It rolls down the oviduct because of gravity","Blood flowing past the oviduct carries it along"],
    e: "Tiny beating cilia and gentle muscle movement carry the egg towards the uterus." },
  { c: "Uterus", q: "What is the function of the uterus?",
    o: ["It is where the fetus develops during pregnancy","It produces eggs","It is where fertilisation usually happens","It produces sperm"],
    e: "The uterus has a thick, muscular wall. The embryo implants in its lining and grows there." },
  { c: "Cervix", q: "What is the cervix?",
    o: ["A ring of muscle at the entrance to the uterus","The tube that carries eggs from the ovary","The organ that makes eggs","Part of the placenta"],
    e: "The cervix keeps the uterus closed during pregnancy and widens during birth to let the baby out." },
  { c: "Fertile time", q: "An egg survives about one day after release, but sperm can survive for a few days. What does this mean?",
    o: ["Fertilisation is possible if intercourse happens a few days before ovulation","Fertilisation can happen at any time in the cycle, so timing does not matter","Fertilisation can only happen on day 1 of the cycle, during menstruation","Sperm must be released after the egg has died for fertilisation to happen"],
    e: "Sperm that are already waiting in the oviduct can fertilise the egg soon after it is released." },
  { c: "After fertilisation", q: "What happens to the zygote after fertilisation?",
    o: ["It divides many times into a ball of cells that implants in the uterus","It immediately becomes a fully formed but very tiny baby","It travels back up to the ovary, where it grows for nine months","It joins with another egg to double its number of chromosomes"],
    e: "The zygote divides as it moves down the oviduct. The ball of cells (embryo) sinks into the soft uterus lining." },
  { c: "Embryo and fetus", q: "When is a developing baby called a fetus rather than an embryo?",
    o: ["Once its main organs have formed (about 8 weeks)","As soon as the sperm and egg nuclei have fused","Only once it has been born and starts breathing","From the first day, when the heart starts to beat"],
    e: "In the early weeks it is an embryo. From about eight weeks, when it has recognisable organs, it is called a fetus." },
  { c: "Gestation", q: "How long does a human pregnancy usually last?",
    o: ["About 40 weeks (9 months)","About 4 weeks (1 month)","About 20 weeks (5 months)","About 2 years (24 months)"],
    e: "The time from fertilisation to birth is called gestation. In humans it is about nine months." },
  { c: "Umbilical cord", q: "What does the umbilical cord do?",
    o: ["It connects the fetus to the placenta, carrying its blood","It connects the mother's heart to the fetus's heart","It carries the mother's blood into the fetus","It holds amniotic fluid"],
    e: "Blood vessels in the cord carry the fetus's blood to and from the placenta, where exchange with the mother's blood happens." },
  { c: "Alcohol", q: "Why should pregnant women avoid alcohol?",
    o: ["Alcohol crosses the placenta and can damage the developing brain and body of the fetus","Alcohol cannot cross the placenta, but it makes the mother too tired to eat well","Alcohol thickens the amniotic fluid, so the fetus cannot move around","Alcohol stops the placenta forming, so the fetus gets no food at all"],
    e: "Many substances in the mother's blood can cross the placenta. The fetus cannot break down alcohol well." },
  { c: "Viruses and the placenta", q: "Some viruses, such as rubella, can cross the placenta. Why are girls often vaccinated against rubella?",
    o: ["To protect a future fetus from damage if they catch rubella while pregnant","Because rubella stops the ovaries making any more eggs after infection","Because the vaccine makes the placenta stronger in a future pregnancy","Because rubella only affects adults, so it must be prevented before then"],
    e: "Rubella in early pregnancy can harm the fetus. Being immune before pregnancy prevents this." },
  { c: "Birth", q: "What causes the baby to be pushed out during birth?",
    o: ["Strong contractions of the muscle in the uterus wall","The baby swimming out using its arms and legs","The placenta pushing the baby out in front of it","The baby's first breath pushing it out of the uterus"],
    e: "The muscular uterus contracts. The cervix widens and the baby is pushed out through the vagina." },
  { c: "Breast milk", q: "Why is breast milk especially good for a newborn baby?",
    o: ["It contains nutrients and antibodies that help protect the baby from disease","It contains no water, so the baby's kidneys do not need to work","It is the only food that contains glucose, which babies need most","It contains calcium that makes the baby's teeth appear straight away"],
    e: "Breast milk has the right balance of nutrients, and antibodies from the mother give the baby some protection against infections." },
  { c: "No periods in pregnancy", q: "Why does menstruation stop during pregnancy?",
    o: ["The uterus lining is needed to support the developing fetus, so it is not broken down","No eggs are left in the ovaries, so the cycle can never start again","The menstrual cycle only happens in girls under 18, so it stops naturally","Blood is not needed in the uterus during pregnancy, so the lining disappears"],
    e: "Menstruation is the loss of the lining when no embryo implants. In pregnancy the lining stays and supports the placenta." },
  { c: "Hormones and the cycle", q: "What controls the menstrual cycle?",
    o: ["Hormones","The amount of food eaten","The phases of the Moon","The number of sperm present"],
    e: "Hormones from the brain and ovaries control when eggs mature, when ovulation happens and when the lining thickens." },
  { c: "Changes at puberty (boys)", q: "Which change happens at puberty in boys but not in girls?",
    o: ["The voice becomes much deeper","Pubic and underarm hair grows","A rapid growth spurt happens","Sweat glands become more active"],
    e: "Pubic hair, growth spurts and body odour happen in both. The larynx grows more in boys, deepening the voice." },
  { c: "Changes at puberty (girls)", q: "Which change happens at puberty in girls?",
    o: ["Breasts develop and menstruation begins","Sperm production begins in the ovaries","Thick facial hair starts to grow","The voice breaks and becomes deep"],
    e: "Oestrogen causes breasts to develop and hips to widen. Ovulation and menstruation start." },
  { c: "Variation in timing", q: "Two friends are both 12. One has started puberty and the other has not. What does this show?",
    o: ["The age when puberty starts varies a lot between people, and both are normal","The one who has not started must be ill and should see a doctor","Puberty always starts on a person's 12th birthday, so one is early","Only girls go through puberty at 12; boys always start at 16"],
    e: "Puberty can start at any time from about 8 to 14 years. Differences in timing are normal." },
  { c: "Puberty and adolescence", q: "What is the difference between puberty and adolescence?",
    o: ["Puberty is the body's physical change; adolescence also includes emotional change","They mean exactly the same thing: the body changing into an adult's body","Adolescence happens before birth; puberty happens in the teenage years","Puberty is only the emotional change; adolescence is only the physical change"],
    e: "Adolescence covers the teenage years, including changes in feelings, independence and relationships as well as the body." },
  { c: "Diet in pregnancy", q: "Which is the best dietary advice for a pregnant woman?",
    o: ["Eat a balanced diet with extra iron and calcium, and only a little extra energy","Eat twice as much of everything, because she is eating for two people now","Avoid protein completely, because it makes the baby grow too large","Eat only fruit and vegetables, because they contain all the nutrients needed"],
    e: "Iron helps make extra blood, and calcium builds the baby's bones. The energy needed increases only slightly." },
  { c: "Teenage diet", q: "Why do teenagers often need more protein and energy than younger children?",
    o: ["They go through a growth spurt and build a lot of new tissue","They respire less than adults, so they store protein instead","They lose all their muscle at puberty and must rebuild it","Their digestive system works less well, so they absorb less"],
    e: "Rapid growth needs protein for new cells and energy for building them." },
  { c: "Inheritance", q: "Why does a child often look a bit like each parent?",
    o: ["Half of its genetic information came from each parent","The child learns to copy its parents' expressions and behaviour","All of the child's features come from the mother's egg cell","The placenta passes on the father's features during pregnancy"],
    e: "The zygote has chromosomes from both parents, so it inherits a mix of features." },
  { c: "Placenta surface area", q: "The placenta has many finger-like projections. Why?",
    o: ["To give a large surface area for exchange","To grip the fetus firmly in place","To pump blood to and from the fetus","To store food ready for after the birth"],
    e: "A large surface area means oxygen, nutrients and wastes can diffuse across faster, like villi in the intestine." },
  { c: "Fetal waste", q: "How does the fetus get rid of carbon dioxide and urea?",
    o: ["They diffuse across the placenta into the mother's blood","The fetus breathes them out into the amniotic fluid","They are stored in the fetus's body until after birth","The umbilical cord changes them into food for the fetus"],
    e: "The fetus's lungs and kidneys are not doing this job yet. The mother's lungs and kidneys remove the waste." }
  ]},
{ n: 6, title: "States of matter", strand: "Chemistry", topics: "Particle theory, changes of state, diffusion, gas pressure, expansion",
  qs: [
  { c: "Melting at particle level", q: "What happens to the particles in ice when it melts?",
    o: ["They gain energy and break free of fixed positions, but stay close together","The particles themselves melt and turn into liquid particles","The particles get bigger and push each other further apart","The particles stop vibrating and start to flow past each other"],
    e: "Particles do not change in size or melt. In a liquid they are still close together but can move past each other." },
  { c: "Compressing gases", q: "Why can a gas be squashed into a smaller volume, but a liquid cannot?",
    o: ["There are large spaces between gas particles; liquid particles are already touching","Gas particles are much smaller than liquid particles, so they fit together","Gas particles are soft and can be squeezed into a smaller size","Liquid particles do not move at all, so they cannot be pushed closer"],
    e: "In a gas the particles are far apart, so pushing them closer is easy. In a liquid the particles are already close together, so there is almost no space to remove." },
  { c: "Spaces between particles", q: "What is in the space between the particles of a gas?",
    o: ["Nothing; it is empty space","Air","Water vapour","Smaller particles of the same gas"],
    e: "Air is itself made of particles. Between gas particles there is simply empty space." },
  { c: "Diffusion", q: "Someone opens a bottle of perfume at the front of a classroom. A few minutes later students at the back can smell it. Which explanation is best?",
    o: ["Perfume particles move randomly and spread out to where there are fewer of them","Perfume particles are attracted to people's noses and move straight towards them","The perfume particles grow larger and larger until they fill the whole room","Air particles push all of the perfume particles in a straight line to the back"],
    e: "This is diffusion. Particles move randomly and collide, which causes a net movement from a high concentration to a low concentration." },
  { c: "Diffusion and temperature", q: "A drop of food colouring spreads faster in hot water than in cold water. Why?",
    o: ["Particles in hot water have more energy and move faster","Hot water has more spaces between particles because the particles shrink","Food colouring dissolves only in hot water","Cold water particles do not move at all"],
    e: "Higher temperature means particles have more kinetic energy. They move and collide faster, so the dye spreads more quickly." },
  { c: "Diffusion in gases vs liquids", q: "Why does diffusion happen faster in gases than in liquids?",
    o: ["Gas particles move faster and have more space between them","Gas particles are heavier than liquid particles","Liquid particles are not able to move","Gases are always hotter than liquids"],
    e: "Gas particles move quickly and travel further before hitting another particle, so they spread out faster than particles in a liquid." },
  { c: "Gas pressure", q: "What causes the pressure of a gas inside a container?",
    o: ["Gas particles colliding with the walls","Gas particles sticking to the walls","The weight of the container pressing down","Gas particles growing until they fill it"],
    e: "Each collision pushes on the wall. Millions of collisions every second produce a steady force on the walls, which we measure as pressure." },
  { c: "Heating a sealed gas", q: "A sealed can of gas is heated. Why does the pressure inside increase?",
    o: ["The particles move faster, so they hit the walls more often and harder","More gas particles are made when the gas is heated, so it gets crowded","The particles themselves expand and press harder on the walls","Particles of heat enter the can and add to the number hitting the walls"],
    e: "The number of particles stays the same. Faster particles collide with the walls more often and with more force, so pressure rises. That is why aerosol cans warn against heating." },
  { c: "Expansion", q: "Gaps are left between sections of some bridges. Why?",
    o: ["In hot weather the particles vibrate more and take up more space, so the bridge expands","The particles of metal get larger when heated, so the bridge gets longer","The gaps let rainwater drain away so that the bridge does not rust","The metal shrinks in hot weather and the gaps stop the bridge cracking"],
    e: "When a solid is heated its particles vibrate more and move slightly further apart. The particles do not grow. The gaps stop the bridge from buckling when it expands." },
  { c: "Constant temperature while boiling", q: "Water keeps boiling on a cooker but its temperature stays at 100 °C. Where is the energy going?",
    o: ["Into separating the particles as liquid turns into gas","Into heating the saucepan, while the water stays the same","It is destroyed by the boiling water as the bubbles burst","Into making the water particles bigger so they become gas"],
    e: "During a change of state, energy is used to overcome the attraction between particles rather than to raise the temperature." },
  { c: "Evaporation vs boiling", q: "Which statement about evaporation is correct?",
    o: ["It can happen at any temperature, but only from the surface of a liquid","It only happens at the boiling point, when bubbles appear","It happens throughout the whole liquid, forming bubbles of vapour","It only happens when a liquid is being heated by a flame or the Sun"],
    e: "Some surface particles always have enough energy to escape. Boiling happens only at the boiling point and throughout the liquid." },
  { c: "Cooling by evaporation", q: "Why does sweating cool you down?",
    o: ["The most energetic particles evaporate, so the rest of the sweat has less energy","Sweat is made at a lower temperature than the body, so it cools the skin","Sweat forms a shiny layer that reflects heat away from the skin","Sweat tells the brain to stop the body making heat for a while"],
    e: "Evaporating particles take energy with them. The average energy of the particles left on the skin falls, so the skin cools." },
  { c: "Using melting and boiling points", q: "A substance melts at −39 °C and boils at 357 °C. What state is it in at 25 °C?",
    o: ["Liquid","Solid","Gas","It cannot be in any state at 25 °C"],
    e: "25 °C is above the melting point, so it is not a solid, and below the boiling point, so it is not a gas. This substance is mercury." },
  { c: "Cooling a gas", q: "A balloon is taken from a warm room into a freezer and shrinks. Why?",
    o: ["The particles slow down and hit the inside of the balloon less hard","Some of the gas particles are destroyed by the cold temperature","The gas particles themselves shrink when they get cold","Cold air particles enter the balloon and take up less space"],
    e: "Slower particles produce less pressure. The higher pressure outside squashes the balloon until the pressures balance." },
  { c: "Solids", q: "Why does a solid keep a fixed shape?",
    o: ["Its particles are held in fixed positions by strong forces, and can only vibrate","Its particles do not move at all, so they stay where they are","Its particles are larger than those of liquids, so they cannot move","There are no forces between its particles, so nothing pulls them apart"],
    e: "Particles in a solid vibrate about fixed positions. They cannot move past each other, so the shape stays the same." },
  { c: "Liquids", q: "Why can a liquid be poured and take the shape of its container?",
    o: ["Its particles are close together but can slide past each other","Its particles are far apart and move quickly in all directions","Its particles are fixed in place but can bend into new shapes","Its particles are soft, so they change shape to fit the container"],
    e: "The particles stay touching, so the volume stays fixed, but they move around each other, so the liquid flows." },
  { c: "Gases fill containers", q: "A small amount of gas is released into an empty box. What happens?",
    o: ["It spreads out to fill the whole box","It stays in one corner","It sinks to the bottom as a liquid","It takes up only half the box"],
    e: "Gas particles move quickly in all directions and keep going until they hit something, so a gas fills any container." },
  { c: "Density of gases", q: "Why is a gas much less dense than the same substance as a liquid?",
    o: ["The particles are much further apart, so there is less mass in each cm³","Gas particles are lighter than the particles of the same liquid","Gas particles have no mass at all, so a gas weighs nothing","Gas particles are smaller than liquid particles of the same substance"],
    e: "The particles are the same. In a gas, they are spread out, so a given volume contains far fewer of them." },
  { c: "Condensation", q: "A glass of iced drink gets droplets of water on the outside. Where do they come from?",
    o: ["Water vapour in the air cools on the glass and condenses","The cold drink leaks out through tiny holes in the glass","The ice melts and its water soaks through the glass wall","The glass itself produces water when it becomes very cold"],
    e: "Water vapour particles touching the cold glass lose energy, move closer together and become liquid." },
  { c: "Sublimation", q: "Solid carbon dioxide (dry ice) turns straight into a gas without melting. What is this change called?",
    o: ["Sublimation","Evaporation","Condensation","Melting"],
    e: "Sublimation is a change directly from solid to gas. Iodine also sublimes when gently heated." },
  { c: "Melting and freezing points", q: "Pure water freezes at 0 °C. At what temperature does pure ice melt?",
    o: ["0 °C","100 °C","−10 °C","It has no melting point"],
    e: "For a pure substance, the melting point and the freezing point are the same temperature." },
  { c: "Heating curve", q: "A solid is heated steadily and its temperature is recorded. The graph has two flat sections. What is happening during them?",
    o: ["The substance is changing state","The heater has been switched off","The particles have stopped moving","The substance is being destroyed"],
    e: "During melting and boiling, energy is used to separate particles, so the temperature stays constant until the change is complete." },
  { c: "Changes that release energy", q: "Which change of state releases energy to the surroundings?",
    o: ["Condensing","Melting","Boiling","Evaporating"],
    e: "When a gas condenses or a liquid freezes, particles move closer together and attract each other, releasing energy. Melting and boiling take energy in." },
  { c: "Brownian motion", q: "Under a microscope, smoke particles in air jiggle about randomly. What causes this?",
    o: ["They are hit by fast-moving air particles that are too small to see","The smoke particles are tiny living things that swim about","Light from the microscope pushes the particles in random directions","The smoke particles are attracted to and repelled by each other"],
    e: "This is evidence that air is made of particles in constant, random motion." },
  { c: "Diffusion and particle mass", q: "Cotton wool soaked in ammonia is put at one end of a long tube and hydrochloric acid at the other. A white ring forms where the gases meet, nearer the acid end. Why?",
    o: ["Ammonia particles are lighter and move faster, so they travel further","The acid particles are lighter and move faster, so they travel further","Gases can only diffuse in one direction along a tube","The white ring is attracted towards the acid end of the tube"],
    e: "Lighter particles move faster at the same temperature, so they diffuse more quickly." },
  { c: "Diffusion in liquids", q: "A crystal of purple potassium manganate(VII) is dropped into still water. After an hour the purple colour has spread through the water. Why?",
    o: ["The dissolved particles moved randomly and spread out by diffusion","The crystal moved around and stirred the water as it dissolved","The crystal grew larger until it filled the whole beaker","Gravity pulled the purple particles evenly through the water"],
    e: "Even without stirring, particles in a liquid move randomly, so the colour spreads, though more slowly than in a gas." },
  { c: "Diffusion in solids", q: "Why does diffusion hardly happen at all in solids?",
    o: ["The particles are held in fixed positions and cannot move past each other","Solid particles are too large to fit between other particles","Solids have no particles, so there is nothing to diffuse","Solid particles move too fast to stay in one place for long"],
    e: "Diffusion needs particles to move from place to place. In a solid they only vibrate." },
  { c: "Compressing a gas", q: "You push in the plunger of a sealed syringe full of air. Why does it get harder to push?",
    o: ["The particles are squeezed closer, so they hit the walls more often and pressure rises","The air particles get bigger and push back against the plunger","The air turns into a liquid immediately, which cannot be squashed","The particles stop moving, so they jam together and block the plunger"],
    e: "The same number of particles in a smaller space means more collisions per second with each part of the wall." },
  { c: "Pumping up a ball", q: "Why does pumping more air into a football make it firmer?",
    o: ["More particles inside means more collisions with the wall","The air particles inside expand and press harder on the wall","The ball's material gets thicker as more air is pumped in","The air inside gets colder, and cold air presses harder"],
    e: "Pressure depends on how many particles hit the walls and how hard. Adding particles increases the pressure." },
  { c: "Tyres after a journey", q: "A car's tyre pressure is higher after a long drive. Why?",
    o: ["The air in the tyres has warmed up, so particles move faster and collide harder","More air has leaked into the tyres through the valve during the drive","The tyres have shrunk because of the friction with the road","The air particles have become heavier, so they press down harder"],
    e: "Friction warms the tyres and the air inside. Faster particles produce higher pressure." },
  { c: "Thermometers", q: "How does a liquid-in-glass thermometer work?",
    o: ["The liquid expands when heated and rises up the narrow tube","The liquid particles get bigger when heated and fill more of the tube","Heat particles enter the bulb and push the liquid up the tube","The glass shrinks when heated and squeezes the liquid upwards"],
    e: "Heated liquid particles move more and take up a little more space, so the liquid expands along the tube." },
  { c: "Ball and ring", q: "A metal ball just fits through a metal ring. After the ball is heated, it will not fit through. Why?",
    o: ["The ball has expanded because its particles vibrate more and move slightly apart","The ball's particles have each grown larger because of the heat","The ball has gained extra particles from the flame that heated it","The ring has expanded too, but the ball expanded in a different way"],
    e: "The number and size of particles stay the same. They take up more space because they vibrate more." },
  { c: "Bimetallic strip", q: "A strip made of brass and iron joined together bends when it is heated. Why?",
    o: ["Brass expands more than iron for the same temperature rise","Iron melts at a lower temperature than brass and softens first","Only one of the metals is heated; the other stays cold","The two metals react with each other to form a new alloy"],
    e: "Different materials expand by different amounts. The strip bends towards the metal that expands less. This is used in some thermostats." },
  { c: "Power lines", q: "Overhead power cables are hung loosely, sagging between pylons. Why?",
    o: ["They contract in cold weather and could snap if they were tight","They are too heavy to be pulled tight between the pylons","Sagging cables let electricity flow more easily","They expand in cold weather and need room to grow"],
    e: "In cold weather the cables get shorter. Leaving slack stops them pulling tight and breaking." },
  { c: "Jar lids", q: "Running hot water over a tight metal lid on a glass jar makes it easier to open. Why?",
    o: ["The metal lid expands more than the glass","The glass shrinks in hot water, pulling away from the lid","Hot water makes the metal lid lighter and easier to turn","The water acts as a lubricant that dissolves the seal"],
    e: "Metals expand more than glass when heated, so the lid loosens." },
  { c: "Water is unusual", q: "Water pipes can burst in very cold weather. Why?",
    o: ["Water expands when it freezes into ice","Ice is denser than water","Cold metal pipes expand","Water particles grow in the cold"],
    e: "Most substances contract when they freeze, but water expands. This is also why ice floats." },
  { c: "Mass during melting", q: "100 g of ice melts completely. What is the mass of the water?",
    o: ["100 g","More than 100 g","Less than 100 g","It depends on the temperature"],
    e: "Changing state does not change the number of particles, so mass stays the same." },
  { c: "Drying washing", q: "Washing dries faster on a warm, windy day. Why does the wind help?",
    o: ["It carries away water vapour, so more water particles can escape from the clothes","The wind gives extra energy to the water particles in the clothes","The wind pushes liquid water out of the clothes, like wringing them","The wind makes the water in the clothes boil at a lower temperature"],
    e: "Evaporation is faster when the air next to the surface is not full of water vapour. Warmth and a larger surface area also help." },
  { c: "Temperature and particles", q: "What does a higher temperature tell you about the particles in a substance?",
    o: ["They are moving faster on average","They are bigger","There are more of them","They have stopped vibrating"],
    e: "Temperature is related to the average kinetic energy of the particles." },
  { c: "Limits of the model", q: "In diagrams, particles are drawn as coloured circles. Which statement about the model is true?",
    o: ["Real particles are much too small to see and do not have colour like this","Real particles look exactly like the drawings, only smaller","Real particles are large enough to see with a hand lens","Gas particles are drawn far apart because they are bigger"],
    e: "The particle model is a simplified picture that helps explain observations. Colour is a property of large amounts of a substance, not single particles." },
  { c: "Identifying states from data", q: "Substance X melts at 80 °C and boils at 218 °C. What state is it in at 100 °C?",
    o: ["Liquid","Solid","Gas","Solid and gas at once"],
    e: "100 °C is above its melting point but below its boiling point." }
  ]},
{ n: 7, title: "Elements and compounds", strand: "Chemistry", topics: "Atoms, elements and symbols, the Periodic Table, metals and non-metals, compounds and formulae",
  qs: [
  { c: "What an element is", q: "Which is the best definition of an element?",
    o: ["A substance made of only one type of atom","A substance made of two or more types of atom joined together","Any substance found in the Periodic Table or in nature","A substance that is always a metal"],
    e: "An element cannot be broken down into simpler substances by chemical reactions, because all its atoms are the same type." },
  { c: "Molecules of an element", q: "Oxygen gas is made of O₂ molecules. Is oxygen an element or a compound?",
    o: ["An element, because both atoms in the molecule are oxygen atoms","A compound, because its two atoms are joined together","A mixture, because each molecule contains two atoms","A compound, because anything made of molecules is one"],
    e: "A molecule is any group of atoms joined together. It is only a compound if the atoms are of different elements." },
  { c: "Compound properties differ", q: "Sodium is a soft, very reactive metal. Chlorine is a poisonous green gas. They react to form sodium chloride, which is table salt. What does this show?",
    o: ["A compound can have completely different properties from the elements it is made from","Sodium chloride is just a mixture of sodium and chlorine kept together","Sodium chloride must still be poisonous, because it contains chlorine","Elements keep all their properties when they combine to form compounds"],
    e: "When elements react, their atoms join to make a new substance. The new substance has its own properties, which can be very different from those of the elements." },
  { c: "Reading a formula", q: "What does the formula H₂O tell you?",
    o: ["Each molecule contains two hydrogen atoms joined to one oxygen atom","Each molecule contains two oxygen atoms joined to one hydrogen atom","Water is a mixture of hydrogen gas and oxygen gas in the ratio 2 : 1","There are two water molecules, each containing one H and one O atom"],
    e: "The small number after a symbol tells you how many atoms of that element there are. No number means one atom." },
  { c: "Counting atoms", q: "Calcium carbonate has the formula CaCO₃. How many different elements and how many atoms in total does one unit contain?",
    o: ["3 elements, 5 atoms","3 elements, 3 atoms","2 elements, 5 atoms","4 elements, 6 atoms"],
    e: "The elements are calcium (Ca), carbon (C) and oxygen (O). There is 1 Ca, 1 C and 3 O, which makes 5 atoms." },
  { c: "Naming compounds", q: "What is the name of the compound formed when iron reacts with sulfur?",
    o: ["Iron sulfide","Iron sulfate","Sulfur iron","Iron sulfur oxide"],
    e: "The metal is named first. A compound of just two elements ends in -ide. Names ending in -ate, like sulfate, mean oxygen is also present." },
  { c: "-ate compounds", q: "Which elements are present in copper sulfate?",
    o: ["Copper, sulfur and oxygen","Copper and sulfur only","Copper, sulfur and hydrogen","Copper and oxygen only"],
    e: "The ending -ate tells you the compound contains oxygen as well as the other elements named. Copper sulfate is CuSO₄." },
  { c: "Metal or non-metal", q: "An unknown solid element is dull, breaks when hammered and does not conduct electricity. What is it most likely to be?",
    o: ["A non-metal","A metal","A compound","An alloy"],
    e: "Metals are usually shiny, malleable and good conductors of electricity and heat. Dull, brittle and non-conducting are typical non-metal properties." },
  { c: "Groups in the Periodic Table", q: "Lithium, sodium and potassium are in the same column (group) of the Periodic Table. What would you expect?",
    o: ["They have similar chemical properties","They have exactly the same mass","They are all non-metals that conduct","They are all gases at room temperature"],
    e: "Elements in the same group react in similar ways. These three are all soft metals that react strongly with water." },
  { c: "Where metals are", q: "Where are most metals found in the Periodic Table?",
    o: ["On the left and in the middle","On the right-hand side","Only along the top row","Only along the bottom row"],
    e: "Most elements are metals, and they are found on the left and in the centre. Non-metals are mainly on the right." },
  { c: "Chemical symbols", q: "Which pair of element and symbol is correct?",
    o: ["Iron, Fe","Sodium, S","Potassium, P","Copper, Co"],
    e: "Some symbols come from Latin names: Fe (ferrum) is iron, Na (natrium) is sodium, K (kalium) is potassium and Cu (cuprum) is copper. S is sulfur, P is phosphorus and Co is cobalt." },
  { c: "Compounds only", q: "Which list contains only compounds?",
    o: ["H₂O, CO₂, NaCl","O₂, H₂O, CO₂","Fe, Cu, NaCl","N₂, O₂, Cl₂"],
    e: "A compound has at least two different elements chemically joined. O₂, N₂, Cl₂, Fe and Cu each contain only one element." },
  { c: "Separating a compound", q: "How can the elements in a compound be separated?",
    o: ["Only by a chemical reaction","By filtering","With a magnet","By evaporating the compound"],
    e: "The atoms in a compound are chemically joined. Physical methods like filtering or using a magnet can separate mixtures, but not compounds." },
  { c: "Atoms", q: "What is an atom?",
    o: ["The smallest particle of an element that can take part in a chemical reaction","A particle made of two or more different elements joined together","A tiny piece broken off a compound during a chemical reaction","A type of molecule that is found only in gases such as oxygen"],
    e: "Everything is made from atoms. Each element has its own type of atom." },
  { c: "Number of elements", q: "Roughly how many elements are known?",
    o: ["About 118, of which around 90 occur naturally","Exactly 4: earth, air, fire and water","About 1 million","About 12"],
    e: "All the millions of different substances are made from combinations of this fairly small number of elements." },
  { c: "Writing symbols", q: "Why is the symbol for cobalt written Co and not CO?",
    o: ["CO means carbon and oxygen; a symbol's second letter is lower case","There is no difference; both are correct ways to write cobalt","CO is the symbol for copper, so cobalt needs a different one","Capital letters are only used for non-metals, so cobalt uses Co"],
    e: "Each symbol starts with a capital letter. CO is carbon monoxide, a compound of carbon (C) and oxygen (O)." },
  { c: "Groups and periods", q: "In the Periodic Table, what are the horizontal rows called?",
    o: ["Periods","Groups","Families","Columns"],
    e: "Rows are periods. Columns are groups; elements in a group have similar properties." },
  { c: "Noble gases", q: "Helium, neon and argon are in the last group of the Periodic Table. What property do they share?",
    o: ["They are very unreactive gases","They are very reactive metals","They are all solids","They all conduct electricity well"],
    e: "The noble gases hardly react at all. That is why argon is used inside light bulbs and helium in balloons." },
  { c: "Trends in a group", q: "Lithium reacts gently with water, sodium reacts strongly and potassium reacts violently. Rubidium is below potassium. How would you expect it to react?",
    o: ["Even more violently than potassium","Less strongly than lithium","Not at all with water","Exactly like lithium"],
    e: "In Group 1, reactivity increases down the group. The Periodic Table lets you predict properties from patterns." },
  { c: "Mendeleev", q: "When Mendeleev made his Periodic Table, he left gaps. Why was this important?",
    o: ["He predicted elements to fill them, and they were later found as predicted","He had made mistakes and simply ran out of space for some elements","The gaps were left for compounds that he planned to add later on","He did not know where to put the metals, so he left them out for now"],
    e: "Successful predictions were strong evidence that the patterns in his table were real." },
  { c: "States of elements", q: "Which statement about elements at room temperature is correct?",
    o: ["Most metals are solid, while non-metals may be solid, liquid or gas","All elements are solids at room temperature, including oxygen","All non-metals are gases, while all metals are solids","Most metals are liquids, while non-metals are always solids"],
    e: "Mercury is the only liquid metal at room temperature. Bromine is a liquid non-metal, and many non-metals, such as oxygen and nitrogen, are gases." },
  { c: "Exceptions", q: "Graphite (a form of carbon) conducts electricity. Is carbon a metal?",
    o: ["No; carbon is a non-metal, and graphite is an unusual exception","Yes; anything that conducts electricity must be a metal","Yes; because it is a shiny solid at room temperature","No; graphite is a compound of carbon and a metal"],
    e: "Classifying elements uses several properties together. Carbon has mostly non-metal properties." },
  { c: "Non-metal oxides", q: "Sulfur burns to form sulfur dioxide, which dissolves in water to form an acidic solution. What does this suggest about non-metal oxides?",
    o: ["Many non-metal oxides form acidic solutions","All oxides are neutral when they dissolve in water","Non-metal oxides always contain a hidden metal atom","Non-metal oxides always form alkaline solutions"],
    e: "Non-metal oxides such as carbon dioxide and sulfur dioxide are acidic. Many metal oxides are basic." },
  { c: "Fixed composition", q: "Water from a tap, a river or a melted glacier always has the formula H₂O. What does this show about compounds?",
    o: ["A compound always contains its elements in the same fixed ratio","Water is a mixture","The ratio of elements in a compound can be anything","Only pure water is a compound"],
    e: "A mixture of hydrogen and oxygen gases can be in any proportions, but the compound water always has 2 H for every 1 O." },
  { c: "Same elements, different compound", q: "Water is H₂O and hydrogen peroxide is H₂O₂. What does this show?",
    o: ["The same elements combined in different ratios make different substances","They are the same substance, written in two different ways","Hydrogen peroxide is a mixture of water and oxygen gas","The formula does not matter as long as the elements match"],
    e: "Hydrogen peroxide is a bleach and has very different properties from water, even though both contain only hydrogen and oxygen." },
  { c: "Carbon oxides", q: "What is the difference between carbon monoxide (CO) and carbon dioxide (CO₂)?",
    o: ["CO has one oxygen atom per carbon atom; CO₂ has two","CO contains no oxygen; only CO₂ contains oxygen","CO₂ contains two carbon atoms for each oxygen atom","They are the same compound, written in two ways"],
    e: "Mono- means one and di- means two. The names tell you about the formula." },
  { c: "Counting atoms", q: "How many atoms are in one molecule of glucose, C₆H₁₂O₆?",
    o: ["24","3","18","6"],
    e: "6 carbon + 12 hydrogen + 6 oxygen = 24 atoms, made from 3 elements." },
  { c: "Counting atoms 2", q: "Sulfuric acid is H₂SO₄. How many atoms are shown in this formula?",
    o: ["7","3","4","6"],
    e: "2 hydrogen + 1 sulfur + 4 oxygen = 7 atoms." },
  { c: "Ammonia", q: "Ammonia has the formula NH₃. What does it contain?",
    o: ["One nitrogen atom joined to three hydrogen atoms","Three nitrogen atoms and one hydrogen atom","Nitrogen, hydrogen and oxygen","One nickel atom and three hydrogen atoms"],
    e: "N is nitrogen and H is hydrogen. The 3 belongs to the hydrogen." },
  { c: "Naming oxides", q: "Magnesium burns in oxygen. What is the product called?",
    o: ["Magnesium oxide","Magnesium oxygenate","Oxygen magnesium","Magnesium dioxide gas"],
    e: "Metal first, then the non-metal with -ide: magnesium oxide, MgO." },
  { c: "Iron and sulfur", q: "A mixture of iron and sulfur is heated. It glows and a black solid forms that is not attracted to a magnet. What has happened?",
    o: ["A chemical reaction has formed a new compound, iron sulfide","The iron has melted into the sulfur and coloured it black","The sulfur has turned into iron, which is now not magnetic","Nothing has changed; it is still a mixture that has been burnt"],
    e: "The product has new properties: it is not magnetic and looks different. This shows a compound has formed." },
  { c: "Elements and compounds in air", q: "Which substances in air are compounds?",
    o: ["Carbon dioxide and water vapour","Nitrogen and oxygen gases","Argon and neon gases","Oxygen and argon gases"],
    e: "Nitrogen (N₂), oxygen (O₂) and argon (Ar) are elements. Carbon dioxide and water contain two elements each." },
  { c: "Particle diagrams", q: "A diagram shows a box of identical particles. Each particle is one black atom joined to two white atoms. What does the box contain?",
    o: ["A pure compound","A pure element","A mixture of two elements","A mixture of compounds"],
    e: "Every particle is the same, so it is a pure substance. Each particle contains two different types of atom, so it is a compound." },
  { c: "Particle diagrams 2", q: "A box contains single black atoms and separate pairs of white atoms, not joined to each other. What does the box contain?",
    o: ["A mixture of two elements","A compound","A single element","A mixture of compounds"],
    e: "There are two different kinds of particle, so it is a mixture. Each kind contains only one type of atom, so both are elements." },
  { c: "Diatomic elements", q: "Chlorine exists as Cl₂ molecules. Which statement is correct?",
    o: ["Chlorine is an element whose molecules have two atoms","Chlorine is a compound of two different elements","Cl₂ means chlorine has two different types of atom","Chlorine gas is a mixture of two chlorine compounds"],
    e: "Several gaseous elements, including hydrogen, nitrogen, oxygen and chlorine, exist as pairs of atoms." },
  { c: "Properties and uses", q: "Copper is used for electrical wires. Which property is most important for this?",
    o: ["It conducts electricity well and can be drawn into wires","It is shiny and does not rust in damp air","It is magnetic, so it attracts the current","It is a non-metal, so it stays cool when used"],
    e: "Uses of materials depend on their properties. Copper is ductile and conducts electricity very well." },
  { c: "Metal properties", q: "Why are saucepans often made of aluminium or steel?",
    o: ["Metals are good conductors of heat and have high melting points","Metals are poor conductors of heat, so the handles stay cool","Metals are brittle, so the pans keep their shape when heated","Metals melt at low temperatures, so they spread heat evenly"],
    e: "A saucepan needs to transfer heat to the food and not melt on the cooker." },
  { c: "Hydroxides", q: "Sodium hydroxide has the formula NaOH. Which elements does a hydroxide contain besides the metal?",
    o: ["Oxygen and hydrogen","Oxygen only","Hydrogen only","Hydrogen and sulfur"],
    e: "OH is the hydroxide group. The name ending tells you which elements are present." },
  { c: "Carbonates", q: "Calcium carbonate is found in limestone. Which elements does it contain?",
    o: ["Calcium, carbon and oxygen","Calcium and carbon only","Calcium and oxygen only","Carbon and oxygen only"],
    e: "Carbonate means carbon combined with oxygen, CO₃. With calcium, the formula is CaCO₃." },
  { c: "Breaking down compounds", q: "Electricity passed through water breaks it into hydrogen and oxygen. Why couldn't the same be done to oxygen gas?",
    o: ["Oxygen is an element and cannot be broken down into simpler substances","Oxygen is a gas, and only liquids can be broken down by electricity","Electricity cannot pass through oxygen, so no reaction can start","Oxygen is already a mixture, so it needs a physical method instead"],
    e: "Compounds can be split into their elements by chemical means. Elements are already the simplest substances." }
  ]},
{ n: 8, title: "Mixtures", strand: "Chemistry", topics: "Mixtures vs compounds, solutions and solubility, filtration, evaporation, distillation, chromatography, purity",
  qs: [
  { c: "Conservation of mass in dissolving", q: "10 g of salt is dissolved completely in 100 g of water. What is the mass of the solution?",
    o: ["110 g, because the salt particles are still there, spread among the water particles","100 g, because the salt has disappeared and no longer has any mass","Less than 100 g, because some of the water is used up in dissolving","More than 110 g, because a new substance with extra mass is made"],
    e: "Dissolving is a physical change. No particles are lost, so total mass stays the same even though you cannot see the salt." },
  { c: "Solute and solvent", q: "In a sugar solution, which is the solute and which is the solvent?",
    o: ["Sugar is the solute; water is the solvent","Water is the solute; sugar is the solvent","Both are solutes","The solution is the solvent"],
    e: "The solute is the substance that dissolves. The solvent is the liquid it dissolves in. Together they make a solution." },
  { c: "Saturated solutions", q: "What is a saturated solution?",
    o: ["A solution in which no more solute will dissolve at that temperature","A solution that is very hot, so it is close to boiling","A solution that contains a lot of solvent and only a little solute","Any solution that has a strong colour, such as copper sulfate"],
    e: "When a solution is saturated, extra solute stays undissolved. Changing the temperature can change how much will dissolve." },
  { c: "Solubility and temperature", q: "A hot saturated solution of copper sulfate is left to cool. Crystals appear. Why?",
    o: ["Solubility decreases as the solution cools, so less solid can stay dissolved","Cooling turns some of the water into copper sulfate crystals","The solvent freezes into crystals as the solution gets cold","New copper sulfate is made by a reaction as the solution cools"],
    e: "Most solids are more soluble in hot water. As the solution cools, the extra solute comes out of solution as crystals." },
  { c: "Rate vs amount", q: "Stirring helps sugar dissolve faster in tea. Does stirring increase the total amount of sugar that can dissolve?",
    o: ["No, it only speeds up dissolving; the maximum amount depends on temperature","Yes, stirring always increases solubility","Yes, because stirring adds energy that makes room for more sugar","No, because stirring stops sugar dissolving"],
    e: "Stirring brings fresh solvent to the solid, so it dissolves sooner. Solubility, the maximum that can dissolve, depends on the solvent and the temperature." },
  { c: "Filtration and evaporation", q: "How would you get dry salt from a mixture of sand, salt and water?",
    o: ["Filter to remove the sand, then evaporate the water from the filtrate","Evaporate the water first, then filter the salt away from the sand","Use a magnet to pull out the salt, then pour away the water","Filter the mixture; the salt stays on the paper and the sand passes through"],
    e: "Salt is dissolved, so it passes through the filter paper with the water. Sand is insoluble and stays as the residue. Evaporating the filtrate leaves the salt." },
  { c: "Distillation", q: "Which method gives pure water from sea water?",
    o: ["Distillation: the water evaporates and is then condensed and collected","Filtration, because the filter paper traps the dissolved salt","Chromatography, because the water travels up the paper alone","Evaporation in an open dish, because the water is left behind"],
    e: "Salt is dissolved, so filtering does not remove it. In distillation the water turns to vapour and is cooled back to liquid, leaving the salt behind." },
  { c: "Reading a chromatogram", q: "A spot of black ink separates into three coloured spots on chromatography paper. What does this show?",
    o: ["The ink is a mixture of at least three dyes","The ink is a pure substance","The ink reacted with the solvent to make three new substances","The ink contains three different solvents"],
    e: "Each dye travels a different distance depending on how soluble it is in the solvent and how strongly it sticks to the paper. Three spots means at least three dyes." },
  { c: "Chromatography method", q: "Why is the start line in chromatography drawn in pencil and placed above the level of the solvent?",
    o: ["Pencil does not dissolve in the solvent, and the spots must not dissolve straight into the solvent in the beaker","Pencil lines help the solvent move faster up the paper, and spots above the solvent dry out","Pen ink is too dark, so it hides the spots, and the solvent level does not matter","Pencil shows up better, and the spots need to be below the solvent to dissolve"],
    e: "Ink from a pen would separate too and spoil the result. If the spots are under the solvent, they wash off into the beaker instead of moving up the paper." },
  { c: "Purity and boiling point", q: "Pure water boils at 100 °C. A sample of water boils at 102 °C. What does this suggest?",
    o: ["The water is not pure; it contains dissolved substances","The thermometer must be broken","The water is extra pure","The water is turning into a different element"],
    e: "Pure substances have fixed melting and boiling points. Dissolved impurities change them; salt water, for example, boils above 100 °C." },
  { c: "Air is a mixture", q: "Why is air described as a mixture and not a compound?",
    o: ["Its gases are not chemically joined and their proportions can vary","It contains only one element, which is spread out as a gas","It has a chemical formula that shows a fixed ratio of gases","Its gases are chemically joined, so they cannot be separated"],
    e: "Nitrogen, oxygen and the other gases in air keep their own properties. They can be separated by physical methods, such as fractional distillation of liquid air." },
  { c: "Mixture vs compound", q: "Iron filings and sulfur powder are mixed. Then some of the mixture is heated to make iron sulfide. What happens if a magnet is held near each?",
    o: ["The magnet removes iron from the mixture, but not from iron sulfide","The magnet removes iron from both, because both still contain iron","The magnet removes iron from iron sulfide only, because heating magnetises it","The magnet attracts the sulfur in both, because sulfur is yellow and soft"],
    e: "In the mixture, iron keeps its magnetic property. In the compound, iron atoms are chemically joined to sulfur atoms and the new substance has different properties." },
  { c: "Other solvents", q: "Nail varnish does not dissolve in water but does dissolve in acetone (propanone). What does this show?",
    o: ["Whether something dissolves depends on the solvent as well as the solute","Nail varnish is soluble in all liquids, but dissolves slowly in water","Acetone is a type of water that has been made stronger","Water cannot dissolve anything that is coloured, such as varnish"],
    e: "Insoluble in water does not mean insoluble in everything. Different solvents dissolve different substances." },
  { c: "What a mixture is", q: "Which is the best description of a mixture?",
    o: ["Two or more substances that are together but not chemically joined","Two or more elements chemically joined in a fixed ratio","A substance made of only one type of atom","Any substance that is a liquid"],
    e: "In a mixture each substance keeps its own properties, and the proportions can vary." },
  { c: "Pure in chemistry", q: "A carton says pure orange juice. Is it pure in the chemical sense?",
    o: ["No; it is a mixture of water, sugars, acids and more","Yes; it is pure because it comes only from oranges","Yes; it is pure because nothing has been added to it","No; it is a single substance, but it is not an element"],
    e: "In everyday language pure means nothing added. In chemistry, pure means only one substance." },
  { c: "Dissolving vs melting", q: "Sugar disappears when stirred into water. Has it melted?",
    o: ["No; it has dissolved, spreading out between water particles","Yes; the water was warm enough to melt the sugar crystals","Yes; dissolving and melting are two names for the same change","No; the sugar has reacted and turned into more water particles"],
    e: "Melting needs heat and involves only one substance. Dissolving involves a solute mixing with a solvent." },
  { c: "Insoluble substances", q: "Chalk is stirred into water. The water goes cloudy, and chalk settles at the bottom later. What does this show?",
    o: ["Chalk is insoluble in water","Chalk is soluble in water","Chalk reacts with water","Chalk is a solvent"],
    e: "A solution is transparent, though it may be coloured. A cloudy mixture where solid settles shows the solid has not dissolved." },
  { c: "Concentration", q: "Solution A has 10 g of salt in 100 cm³ of water. Solution B has 20 g of salt in 100 cm³ of water. Which is more concentrated?",
    o: ["B","A","They are equally concentrated","You cannot tell"],
    e: "Concentration is the amount of solute in a given volume. B has twice as much solute in the same volume." },
  { c: "Solubility data", q: "At 20 °C, 36 g of salt dissolves in 100 g of water. If 50 g of salt is added to 100 g of water at 20 °C, what happens?",
    o: ["36 g dissolves and 14 g stays undissolved","All 50 g dissolves if stirred long enough","None of it dissolves until the water is heated","36 g dissolves and the other 14 g reacts with water"],
    e: "Once 36 g has dissolved, the solution is saturated. The extra 14 g cannot dissolve at this temperature." },
  { c: "Solubility curves", q: "Potassium nitrate's solubility is 30 g/100 g water at 20 °C and 110 g/100 g water at 60 °C. A saturated solution in 100 g of water at 60 °C is cooled to 20 °C. How much solid forms?",
    o: ["80 g","30 g","110 g","140 g"],
    e: "At 60 °C it holds 110 g. At 20 °C it can only hold 30 g, so 110 − 30 = 80 g comes out as crystals." },
  { c: "Gas solubility", q: "A fizzy drink goes flat faster when it is warm. What does this show?",
    o: ["Gases are less soluble in water at higher temperatures","Gases are more soluble at higher temperatures","Warm drinks contain more gas","Temperature does not affect gas solubility"],
    e: "Unlike most solids, gases dissolve better in cold water. This is also why warm water holds less oxygen for fish." },
  { c: "Crystal size", q: "How can you grow larger crystals from a solution?",
    o: ["Let the solution cool or evaporate slowly","Boil the solution dry as fast as possible","Add more water","Stir it very quickly"],
    e: "Slow crystallisation gives particles time to arrange into larger, regular crystals." },
  { c: "Residue and filtrate", q: "Muddy water is filtered. What is the liquid that passes through the filter paper called?",
    o: ["The filtrate","The residue","The solute","The solvent"],
    e: "The solid trapped on the paper is the residue. The liquid that passes through is the filtrate." },
  { c: "How filtering works", q: "Why does filtering separate sand from water?",
    o: ["Sand grains are too big to fit through the holes in the paper","The filter paper absorbs the sand into its fibres","The sand dissolves in the paper and stays behind","Water is attracted to the sand and leaves it behind"],
    e: "Filter paper acts like a very fine sieve. Dissolved particles are tiny and pass through it." },
  { c: "Condenser", q: "What is the job of the condenser in distillation?",
    o: ["To cool the vapour so that it turns back into a liquid","To heat the mixture so that the water evaporates faster","To filter out any solid pieces before the vapour is collected","To dissolve the solute so that it does not block the flask"],
    e: "Cold water flows around the inner tube of the condenser, cooling the vapour inside." },
  { c: "Fractional distillation", q: "Ethanol boils at 78 °C and water at 100 °C. How can they be separated?",
    o: ["Fractional distillation, because they have different boiling points","Filtration, because the ethanol particles are smaller than water particles","Using a magnet, because ethanol is attracted and water is not","Chromatography, because ethanol travels further up the paper"],
    e: "When the mixture is heated, ethanol boils off first and is condensed and collected separately." },
  { c: "Separating air", q: "Air is cooled until it becomes liquid, then warmed slowly so the gases boil off one at a time. What property is this separation based on?",
    o: ["Different boiling points","Different colours","Different magnetic properties","Different solubility in water"],
    e: "Nitrogen, argon and oxygen have different boiling points, so they can be collected separately." },
  { c: "Identifying food colourings", q: "A chromatogram has an unknown sweet colouring next to known dyes A, B and C. The unknown's two spots are at the same heights as spots from A and C. What does this show?",
    o: ["The colouring contains dyes A and C","The colouring contains dye B only","The colouring is pure","The colouring contains A, B and C"],
    e: "With the same solvent and paper, the same dye always travels the same distance." },
  { c: "Rf values", q: "A dye travels 3 cm while the solvent travels 6 cm. What is the Rf value?",
    o: ["0.5","2","3","18"],
    e: "Rf = distance moved by dye ÷ distance moved by solvent = 3 ÷ 6 = 0.5. Rf is always less than 1." },
  { c: "Pure substance chromatogram", q: "A substance gives only one spot in chromatography, whatever solvent is used. What does this suggest?",
    o: ["It is probably a pure substance","It is a mixture of many dyes","It is insoluble in all solvents","It is a metal"],
    e: "A mixture would usually separate into more than one spot in at least one solvent." },
  { c: "Magnetic separation", q: "How would you separate iron filings from sand?",
    o: ["Use a magnet","Filter the mixture","Dissolve the iron in water","Distil the mixture"],
    e: "Iron is magnetic and sand is not. Choose a method based on a property that differs between the substances." },
  { c: "Two insoluble solids", q: "How would you separate a mixture of salt and sand?",
    o: ["Dissolve the salt in water, filter out the sand, then evaporate","Use a magnet to pull the sand grains out of the dry mixture","Filter the dry mixture so that the salt falls through the paper","Heat it until the sand melts, then pour the liquid sand away"],
    e: "The useful difference is solubility. Dissolving the salt lets the sand be filtered out." },
  { c: "Immiscible liquids", q: "Oil and water do not mix and form two layers. How can they be separated?",
    o: ["With a separating funnel, by running off the bottom layer","By filtration, because the oil stays on the paper","By chromatography, because oil moves further","By using a magnet, because water is attracted"],
    e: "Liquids that do not mix are immiscible. A separating funnel lets the lower, denser layer drain out first." },
  { c: "Alloys", q: "Steel is iron mixed with a small amount of carbon. Why is steel used for building rather than pure iron?",
    o: ["Steel is stronger and harder than pure iron","Steel is a pure element","Steel cannot rust at all","Steel is a compound with fixed properties"],
    e: "An alloy is a mixture containing a metal. Mixing changes the properties, often making the metal harder." },
  { c: "Sea salt", q: "In hot countries, sea water is let into shallow ponds to get salt. Which separation method is this?",
    o: ["Evaporation","Filtration","Distillation","Chromatography"],
    e: "The Sun evaporates the water, leaving the salt behind." },
  { c: "Melting range", q: "A sample of a solid melts between 115 °C and 121 °C instead of at one temperature. What does this suggest?",
    o: ["It is impure (a mixture)","It is a pure element","The thermometer is fine and the sample is pure","It is a gas"],
    e: "Pure substances melt sharply at one temperature. Impurities lower the melting point and make it melt over a range." },
  { c: "Salt on roads", q: "Salt is spread on icy roads in winter. How does it help?",
    o: ["Salt water freezes below 0 °C","Salt gives out heat as it touches ice","Salt absorbs the ice into its crystals","Salt makes ice harder and less slippery"],
    e: "Dissolved salt is an impurity that lowers the freezing point, so ice melts even below 0 °C." },
  { c: "Surface area and dissolving", q: "Why does granulated sugar dissolve faster than a sugar cube of the same mass?",
    o: ["The small grains have a larger surface area in contact with the water","Granulated sugar is a different, more soluble substance","Sugar cubes are insoluble until they are crushed","Small grains are warmer, so they dissolve sooner"],
    e: "More surface means more sugar particles are exposed to water particles at once." },
  { c: "Purity of water", q: "Why is distilled water used in some experiments rather than tap water?",
    o: ["Tap water contains dissolved substances that might affect the results","Tap water is not made of water molecules","Distilled water is a compound and tap water is an element","Tap water cannot dissolve anything"],
    e: "Tap water is a mixture containing dissolved minerals and gases. Distillation removes them." },
  { c: "Separating a dissolved solid without losing the solvent", q: "You want to collect both the water and the salt from salty water. Which method lets you do this?",
    o: ["Distillation","Evaporation in an open dish","Filtration","Using a magnet"],
    e: "Evaporation in an open dish loses the water to the air. Distillation condenses and collects the water while the salt stays in the flask." }
  ]},
{ n: 9, title: "Material changes", strand: "Chemistry", topics: "Physical and chemical changes, word equations, conservation of mass, burning, rusting, energy changes",
  qs: [
  { c: "Physical vs chemical change", q: "Which of these is a chemical change?",
    o: ["Frying an egg","Melting chocolate","Dissolving sugar in water","Freezing water"],
    e: "In a chemical change, new substances are made and the change is usually hard to reverse. Melting, dissolving and freezing make no new substance." },
  { c: "Candle burning", q: "A candle is lit. Which part involves a chemical change?",
    o: ["The wax vapour burning in the flame","The wax melting near the wick","The liquid wax rising up the wick","The melted wax going solid again"],
    e: "Melting and solidifying are physical changes. Burning makes new substances: carbon dioxide and water vapour." },
  { c: "Mass increases on burning", q: "Magnesium ribbon is heated in a crucible and burns to form a white powder. The powder has a greater mass than the magnesium. Why?",
    o: ["Magnesium has combined with oxygen from the air to form magnesium oxide","Heat has mass, and some of it has been added to the powder","Pieces of the crucible have broken off into the powder","The magnesium atoms have grown bigger as they were heated"],
    e: "magnesium + oxygen → magnesium oxide. The extra mass is the oxygen atoms that have joined on. No mass is created." },
  { c: "Mass seems to decrease", q: "A piece of wood burns and the ash weighs much less than the wood. Has mass been destroyed?",
    o: ["No; gases such as carbon dioxide and water vapour escaped into the air","Yes; burning destroys some of the mass of the wood","Yes; the energy given out took some of the mass with it","No; the ash weighs the same as the wood but feels lighter"],
    e: "If you collected all the products, including the gases, their total mass would equal the mass of the wood plus the oxygen that reacted." },
  { c: "Conservation of mass", q: "Two solutions react in a sealed flask on a balance and a solid forms. What happens to the reading on the balance?",
    o: ["It stays the same, because atoms are rearranged, not created or destroyed","It increases, because a solid is heavier than the liquids that made it","It decreases, because some particles are used up in the reaction","It falls to zero, because the reactants have all been used up"],
    e: "In a closed system nothing can enter or leave. The same atoms are present before and after; they are just joined in new ways." },
  { c: "Conditions for rusting", q: "Three iron nails are set up: A in air and water, B in boiled water with oil on top, C in dry air with a drying agent. Which nail rusts?",
    o: ["Only A","Only B","Only C","A and B"],
    e: "Rusting needs both oxygen and water. Boiling removes dissolved oxygen and the oil stops more getting in (B). The drying agent removes water (C)." },
  { c: "Preventing rust", q: "How does painting a steel gate stop it rusting?",
    o: ["It stops oxygen and water reaching the surface of the iron","It makes the iron into a different element","It adds oxygen to the iron","Paint reacts with rust and turns it back into iron"],
    e: "Rust prevention methods such as paint, oil and plastic coatings work by keeping air and water away from the metal." },
  { c: "Combustion products", q: "Methane (natural gas) burns in plenty of air. What are the products?",
