  {"t":"d3A","c":"Bile","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Bile speeds up the digestion of fats.","R":"Bile breaks fat into small droplets, giving a larger surface area for lipase.","a":0,"e":"Both are true, and the reason explains it. Bile is not an enzyme; it emulsifies fat."},
  {"t":"d2K","c":"What needs digesting","type":"multi","q":"Which must be digested into smaller molecules before they can be absorbed? Select all that apply.","o":["Starch","Protein","Fat","Glucose","Vitamins","Water"],"k":3,"e":"Starch, protein and fat are large molecules. Glucose, vitamins and water are already small enough to be absorbed."},
  {"t":"e2K","c":"Where enzymes come from","type":"multi","q":"Which of these release digestive enzymes? Select all that apply.","o":["Salivary glands","Stomach","Pancreas","Liver","Large intestine"],"k":3,"e":"Saliva contains amylase, the stomach makes protease and the pancreas makes several enzymes. The liver makes bile, which is not an enzyme."},
  {"t":"d1K","c":"Path of food","type":"order","q":"Put these in the order food passes through them.","o":["Mouth","Oesophagus","Stomach","Small intestine","Large intestine","Rectum"],"e":"Food is swallowed down the oesophagus, digested in the stomach and small intestine, has water removed in the large intestine and is stored in the rectum."},
  {"t":"b2A","c":"Odd one out: diseases","q":"Which is the odd one out?","o":["Obesity","Scurvy","Rickets","Anaemia"],"e":"Scurvy, rickets and anaemia are deficiency diseases caused by a lack of a nutrient. Obesity is caused by taking in too much energy."},
  {"t":"a2N","c":"Energy in a portion","q":"Energy per 100 g: butter 3000 kJ, bread 1000 kJ, chicken 700 kJ, apple 200 kJ. How much energy is in a 50 g portion of butter?","o":["1500 kJ","3000 kJ","6000 kJ","150 kJ"],"e":"50 g is half of 100 g, so 3000 ÷ 2 = 1500 kJ."},
  {"t":"e3A","c":"Boiled enzyme","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Boiled amylase cannot digest starch.","R":"High temperatures permanently change the shape of an enzyme.","a":0,"e":"Both are true and the reason explains the assertion: a denatured enzyme no longer fits its substrate."}
  ]},
{ n: 3, title: "The circulatory system", strand: "Biology", topics: "The heart, double circulation, arteries, veins and capillaries, blood",
  qs: [
  {"t":"b2A","c":"Artery structure","q":"Why do arteries have thick walls containing muscle and elastic tissue?","o":["They carry blood at high pressure, pumped directly from the heart","They carry blood at very low pressure back to the heart","They need to let substances diffuse through their walls","They store blood when the body is resting"],"e":"Each heartbeat pushes blood into the arteries at high pressure. Thick, stretchy walls withstand this pressure and help smooth out the flow."},
  {"t":"b2A","c":"Valves in veins","q":"Veins contain valves but arteries (apart from where they leave the heart) do not. Why?","o":["Blood in veins is at low pressure, so valves stop it flowing backwards","Valves make blood in veins move faster than in arteries","Valves let oxygen into the blood in veins","Veins carry blood away from the heart and need valves to push it"],"e":"By the time blood reaches the veins, its pressure is low. Valves make sure it only flows towards the heart, especially in the legs."},
  {"t":"b1A","c":"Capillaries","q":"Capillary walls are only one cell thick. Why is this important?","o":["Substances such as oxygen and glucose can diffuse quickly between blood and cells","Blood can flow through them at very high pressure without bursting","They can contract to help the heart pump blood around the body","Thin walls stop white blood cells from leaving the blood"],"e":"Capillaries are where exchange happens. A very thin wall means only a short distance for diffusion between the blood and the body's cells."},
  {"t":"a2A","c":"Ventricle walls","q":"The wall of the left ventricle is much thicker than the wall of the right ventricle. Why?","o":["The left ventricle pumps blood all around the body, but the right only pumps to the lungs","The left ventricle holds deoxygenated blood, which is heavier to pump","The right ventricle does not need to pump, because blood flows to the lungs by itself","The left ventricle receives blood from the lungs at very high pressure"],"e":"Pushing blood around the whole body needs a much higher pressure than pushing it to the nearby lungs, so the left ventricle has more muscle."},
  {"t":"b3A","c":"Arteries defined by direction","q":"The pulmonary artery carries deoxygenated blood. Why is it still called an artery?","o":["Arteries are vessels that carry blood away from the heart","Arteries are vessels that carry deoxygenated blood","All vessels connected to the lungs are arteries","It has valves along its length"],"e":"Arteries carry blood away from the heart and veins carry it back. The pulmonary artery takes deoxygenated blood from the heart to the lungs. The pulmonary vein brings oxygenated blood back."},
  {"t":"a2K","c":"Double circulation","q":"Which route does blood take in the human double circulation, starting from the body?","o":["Body → right side of heart → lungs → left side of heart → body","Body → left side of heart → lungs → right side of heart → body","Body → lungs → right side of heart → left side of heart → body","Body → right side of heart → left side of heart → lungs → body"],"e":"Blood passes through the heart twice in one full circuit. The right side sends it to the lungs to collect oxygen. It returns to the left side, which pumps it around the body."},
  {"t":"c2A","c":"Red blood cells","q":"Red blood cells have no nucleus. How does this help them do their job?","o":["There is more space for haemoglobin, so each cell can carry more oxygen","It lets them squeeze through capillaries and destroy bacteria more easily","It allows them to divide quickly to make new red blood cells","It helps them stick together and form blood clots at a cut"],"e":"Red blood cells are packed with haemoglobin, which carries oxygen. Their biconcave disc shape also gives a large surface area for oxygen to diffuse in and out."},
  {"t":"c1K","c":"Plasma","q":"Which list shows substances carried dissolved in the plasma?","o":["Glucose, carbon dioxide, urea and hormones","Oxygen, haemoglobin and platelets","Red blood cells and white blood cells","Starch, protein and fat molecules"],"e":"Plasma is the liquid part of blood. It carries digested food such as glucose, waste such as carbon dioxide and urea, and hormones. Most oxygen is carried by haemoglobin in red cells."},
  {"t":"c1K","c":"Platelets","q":"You cut your finger. Which part of the blood helps stop the bleeding?","o":["Platelets, which help form a clot","Red blood cells, which carry oxygen to the cut","Plasma, which washes the cut clean","White blood cells, which seal the skin"],"e":"Platelets are cell fragments that help blood clot. The clot seals the wound and stops blood loss and microorganisms entering."},
  {"t":"c1K","c":"White blood cells","q":"What is the main job of white blood cells?","o":["Defending the body against bacteria and viruses","Carrying oxygen from the lungs to every body cell","Carrying digested food from the gut to the cells","Helping the blood to clot when the skin is cut"],"e":"Some white blood cells engulf pathogens. Others make antibodies that help destroy them."},
  {"t":"d2A","c":"Heart rate and exercise","q":"Why does your heart rate increase when you exercise?","o":["Muscles need oxygen and glucose faster, and carbon dioxide removed","The heart needs to pump faster to cool the body down","Blood becomes thicker during exercise, so it needs more pushing","The lungs stop working during exercise, so the heart takes over"],"e":"Working muscles respire faster. A faster heartbeat delivers more oxygen and glucose to them and removes carbon dioxide more quickly."},
  {"t":"d2A","c":"Coronary arteries","q":"A fatty blockage forms in a coronary artery. Why can this cause a heart attack?","o":["Part of the heart muscle does not get enough oxygen and glucose, so it stops working","Blood can no longer reach the lungs, so no oxygen gets into the body","The heart chambers fill with fat, so they can no longer hold blood","The valves in the heart can no longer close, so blood flows backwards"],"e":"Heart muscle has its own blood supply through the coronary arteries. If this is blocked, the muscle cannot respire and that part of the heart can die."},
  {"t":"b2K","c":"Pulmonary vein","q":"Where does the pulmonary vein carry blood, and what kind of blood is it?","o":["From the lungs to the heart; oxygenated blood","From the heart to the lungs; deoxygenated blood","From the body to the heart; deoxygenated blood","From the heart to the body; oxygenated blood"],"e":"Veins carry blood towards the heart. The pulmonary vein brings blood that has just collected oxygen in the lungs back to the left atrium."},
  {"t":"c1K","c":"Job of the circulatory system","q":"What is the main job of the circulatory system?","o":["To carry oxygen, food and waste around the body","To digest food and absorb the nutrients from it","To take air into the lungs and push it out again","To make new cells and repair damaged tissues"],"e":"Blood is pumped through vessels to reach every cell, bringing what cells need and taking away what they produce."},
  {"t":"a1K","c":"Heart chambers","q":"What is the role of the atria in the heart?","o":["They receive blood coming into the heart","They pump blood all around the body","They stop the heart from beating too fast","They carry blood to the lungs"],"e":"The two atria at the top receive blood from veins and pass it to the ventricles. The muscular ventricles pump blood out."},
  {"t":"a1K","c":"Heart valves","q":"What do the valves inside the heart do?","o":["They stop blood flowing backwards","They pump blood into the arteries","They add oxygen to the blood","They make the blood clot"],"e":"Valves open to let blood through, then close so it cannot flow back the wrong way. The sound of them closing is the heartbeat you hear."},
  {"t":"a2A","c":"Septum","q":"What is the importance of the septum, the wall dividing the left and right sides of the heart?","o":["It keeps the two types of blood apart","It pumps blood into the lungs","It produces new red blood cells","It controls how fast the heart beats"],"e":"If the two types of blood mixed, the blood going to the body would carry less oxygen."},
  {"t":"a3A","c":"Hole in the heart","q":"A baby is born with a hole in the septum. Why might the baby get tired easily?","o":["Some deoxygenated blood mixes with oxygenated blood, so less oxygen reaches the body","The heart cannot beat at all, so blood only moves when the baby moves","Blood stops going to the lungs, so it never collects any oxygen","The blood leaks out of the heart and cannot carry glucose to cells"],"e":"Mixing lowers the amount of oxygen in blood pumped to the body, so cells cannot respire as well."},
  {"t":"a2K","c":"Vena cava","q":"Blood returning from the body enters the heart through the vena cava. Which chamber does it enter?","o":["The right atrium","The left atrium","The left ventricle","The right ventricle"],"e":"Deoxygenated blood from the body enters the right side of the heart, ready to be pumped to the lungs."},
  {"t":"a1K","c":"Aorta","q":"Which blood vessel carries blood from the left ventricle to the body?","o":["The aorta","The vena cava","The pulmonary artery","The pulmonary vein"],"e":"The aorta is the largest artery. It carries oxygenated blood at high pressure from the left ventricle."},
  {"t":"c2K","c":"Blood colour","q":"Drawings often show deoxygenated blood in blue. What colour is it really?","o":["Dark red","Blue","Green","Colourless"],"e":"Oxygenated blood is bright red and deoxygenated blood is dark red. Blue is only used in diagrams, and veins look blue through skin."},
  {"t":"d2A","c":"Pulse","q":"When you feel a pulse in your wrist, what are you detecting?","o":["A surge of blood stretching an artery each time the heart beats","Blood flowing slowly through a vein just under the skin","The heart itself moving down the arm to the wrist","Air bubbles moving through the blood with each breath"],"e":"Each heartbeat pushes blood into the arteries. The stretch travels along the artery and can be felt where it is near the skin."},
  {"t":"d1N","c":"Measuring pulse rate","q":"You count 18 pulse beats in 15 seconds. What is the pulse rate in beats per minute?","o":["72","18","33","270"],"e":"There are four lots of 15 seconds in a minute: 18 × 4 = 72 beats per minute."},
  {"t":"d2E","c":"Recovery time","q":"Two students run the same distance. Student A's pulse returns to normal in 2 minutes; student B's takes 6 minutes. What does this suggest?","o":["Student A is probably fitter","Student B is probably fitter","Student A's heart is weaker","Both are equally fit"],"e":"A fitter person's heart and lungs supply oxygen more efficiently, so they recover more quickly."},
  {"t":"d3A","c":"Athletes' resting heart rate","q":"Trained athletes often have a lower resting heart rate than other people. Why?","o":["Their stronger heart pumps more blood with each beat","Their muscles need no oxygen at all when they are resting","Their blood carries no carbon dioxide, so less needs removing","Their heart has fewer chambers, so each beat takes longer"],"e":"If each beat pumps more blood, fewer beats per minute are needed to supply the same amount."},
  {"t":"b2A","c":"Capillary networks","q":"Why is there a capillary close to almost every cell in the body?","o":["So that substances only diffuse a short distance","To hold each cell firmly in place in the tissue","To keep every cell warm at body temperature","To produce new blood cells wherever needed"],"e":"Diffusion is only fast over short distances. A dense network of capillaries makes sure every cell is supplied."},
  {"t":"b2A","c":"Lumen of veins","q":"Veins have a wider lumen (space inside) than arteries. How does this help?","o":["It lets low-pressure blood flow back to the heart easily","It lets veins hold blood at very high pressure","It lets substances diffuse out through the wall","It lets the vein contract and pump blood itself"],"e":"Blood pressure in veins is low, so a wide passage reduces resistance to flow."},
  {"t":"b3A","c":"Muscles help veins","q":"Why can standing still for a very long time make your feet swell or make you feel faint?","o":["Leg muscles are not squeezing the veins, so blood returns slowly","The heart stops pumping when you stand still for a long time","Arteries close up when you stand, so blood cannot reach the feet","Blood starts to turn solid in the legs after a few minutes"],"e":"When you move, muscles squeeze the veins and, with the valves, push blood upwards. Without this, blood collects in the legs."},
  {"t":"c2A","c":"Hormones in blood","q":"When you are frightened, adrenaline from a gland near the kidneys makes your heart beat faster. How does adrenaline reach the heart?","o":["It is carried dissolved in the blood plasma","It travels along nerves","It is carried by red blood cells","It diffuses through the body tissues"],"e":"Hormones are chemical messengers carried in the plasma."},
  {"t":"c2A","c":"Heat transport","q":"Blood also transports heat. Why is this useful?","o":["Heat from busy organs is spread out, keeping the body at an even temperature","It lets blood warm up food in the stomach so that it digests faster","Heat makes blood flow faster, so it reaches the cells sooner","Warm blood cannot clot, so it never blocks the blood vessels"],"e":"Muscles and the liver produce a lot of heat. Blood carries it to other parts and to the skin, where it can be lost."},
  {"t":"c2A","c":"Haemoglobin","q":"Haemoglobin picks up oxygen in the lungs. Where does it release it?","o":["In body tissues where the oxygen concentration is low","In the heart, which needs the most oxygen","In the lungs, straight after picking it up","In the small intestine, to help digest food"],"e":"Haemoglobin combines with oxygen where oxygen is plentiful and releases it where oxygen is scarce, such as in respiring muscles."},
  {"t":"a3A","c":"Advantage of double circulation","q":"Why is it useful that blood returns to the heart after going through the lungs?","o":["The heart can pump it again at high pressure to reach the whole body","It needs to collect more carbon dioxide from the heart before going to the body","The lungs have no other blood vessels that blood could leave through","The heart cools the blood down after it has been warmed in the lungs"],"e":"Blood loses pressure going through the lung capillaries. Pumping it again means it reaches the body quickly."},
  {"t":"d1A","c":"Heart disease risks","q":"Which lifestyle is most likely to increase the risk of heart disease?","o":["Smoking, eating lots of saturated fat and taking little exercise","Eating plenty of vegetables and exercising regularly","Drinking plenty of water","Getting enough sleep"],"e":"Smoking and a high-fat diet help fatty deposits build up in arteries. Exercise strengthens the heart."},
  {"t":"a2K","c":"First vessel from the left ventricle","q":"Trace the blood: it leaves the left ventricle. Where does it go next?","o":["Into the aorta, to the body","Into the pulmonary artery, to the lungs","Into the right ventricle","Into the vena cava"],"e":"The left side of the heart sends oxygenated blood to the body through the aorta."},
  {"t":"c2K","c":"Collecting digested food","q":"Where does blood pick up most of the digested food such as glucose and amino acids?","o":["The small intestine","The lungs","The kidneys","The large intestine"],"e":"The villi of the small intestine are full of capillaries that absorb digested food."},
  {"t":"c2K","c":"Removing urea","q":"Urea is a waste product carried by the blood. Which organ removes it?","o":["The kidneys","The lungs","The heart","The stomach"],"e":"The kidneys filter urea out of the blood, and it leaves the body in urine. The lungs remove carbon dioxide."},
  {"t":"b2A","c":"Flow in arteries vs veins","q":"If an artery is cut, blood spurts out. If a vein is cut, blood flows out steadily. Why?","o":["Blood in arteries is under high pressure that rises with each heartbeat","Arteries contain more blood than veins, so more comes out at once","Veins hold only a little blood, so it trickles out slowly","Blood in arteries is thinner, so it squirts out more easily"],"e":"Arteries carry blood straight from the heart, so it surges with each beat. Pressure in veins is low and steady."},
  {"t":"d1A","c":"Exercise effect","q":"Why does regular exercise help keep the heart healthy?","o":["The heart muscle becomes stronger and arteries stay healthier","Exercise stops the heart needing oxygen","Exercise removes all fat from the blood permanently","It makes the heart grow extra chambers"],"e":"Like other muscles, the heart gets stronger with use. Exercise also helps control body mass and blood pressure."},
  {"t":"c2K","c":"Blood components","q":"Which part of the blood makes up more than half its volume?","o":["Plasma","Red blood cells","White blood cells","Platelets"],"e":"Blood is about 55% plasma. Red cells make up most of the rest; white cells and platelets are a tiny fraction."},
  {"t":"c3A","c":"Oxygen and red cells","q":"People who live high up in mountains often have more red blood cells than people at sea level. Why is this useful?","o":["Air there has less oxygen, so more red cells help carry enough oxygen","Mountain air contains more carbon dioxide, which red cells remove","They need extra red cells because their blood clots more often","Cold air destroys red cells, so the body makes extra to replace them"],"e":"More red cells mean more haemoglobin, which helps collect enough oxygen from thinner air."},
  {"t":"a3K","c":"Full route of blood","q":"Which sequence follows blood from the lungs and back to the lungs?","o":["Pulmonary vein → left side → aorta → body → vena cava → right side → pulmonary artery","Pulmonary artery → left side → vena cava → body → aorta → right side → pulmonary vein","Pulmonary vein → right side → aorta → body → vena cava → left side → pulmonary artery","Aorta → left side → pulmonary vein → body → vena cava → right side → pulmonary artery"],"e":"Oxygenated blood returns from the lungs to the left side and is pumped round the body. It returns to the right side and is pumped to the lungs."},
  {"t":"a2K","c":"Pumping to the lungs","q":"Which chamber pumps blood to the lungs?","o":["Right ventricle","Left ventricle","Right atrium","Left atrium"],"e":"The right ventricle sends deoxygenated blood along the pulmonary artery to the lungs."},
  {"t":"a2A","c":"Thin atrium walls","q":"Why do the atria have thinner walls than the ventricles?","o":["They only pump blood a short distance, into the ventricles","They carry blood at high pressure to the body","They pump blood directly to the lungs and body","They need to let oxygen diffuse through their walls"],"e":"The ventricles do the hard work of pushing blood out of the heart, so they need more muscle."},
  {"t":"b3A","c":"Slow flow in capillaries","q":"Blood flows very slowly through capillaries, with red cells passing in single file. Why is this useful?","o":["It gives time for substances to diffuse in and out","It lets cells collect food faster than anywhere else","It squeezes red cells until they release haemoglobin","It stops white cells from reaching the tissues"],"e":"Exchange by diffusion takes time. Slow flow and a short distance make exchange efficient."},
  {"t":"b2A","c":"Faulty vein valves","q":"If the valves in leg veins stop working properly, what happens?","o":["Blood flows backwards and collects, so the veins swell","Blood flows faster than usual back to the heart","Arteries start carrying the blood back instead","Blood pressure in the arteries falls to zero"],"e":"Without working valves, gravity pulls blood back down the leg. Swollen veins like this are called varicose veins."},
  {"t":"c2A","c":"Low platelets","q":"Why do people with very few platelets bruise and bleed easily?","o":["Their blood cannot clot properly","Their blood carries too much oxygen","Their white cells attack their own skin","Their plasma contains too much glucose"],"e":"Platelets start the clotting process that seals damaged blood vessels."},
  {"t":"c2K","c":"Bone marrow","q":"Where are new red blood cells made?","o":["Bone marrow","The heart","The lungs","The liver"],"e":"Red blood cells only live for about four months, so bone marrow makes millions of new ones every second."},
  {"t":"c2K","c":"Antibodies","q":"Some white blood cells make antibodies. What do antibodies do?","o":["They stick to particular pathogens and help destroy them","They carry oxygen to cells that are fighting infection","They form a clot to seal a wound in the skin","They digest food that is dissolved in the plasma"],"e":"Each type of antibody matches one type of pathogen. Vaccines train white cells to make the right antibodies quickly."},
  {"t":"d2N","c":"Reading recovery data","q":"Pulse rate (beats per minute): resting 70; straight after exercise 130; after 1 min 110; after 2 min 90; after 3 min 72. Roughly how long did it take to recover?","o":["About 3 minutes","About 1 minute","No time at all","It never returned to normal"],"e":"Recovery time is how long the pulse takes to return to its resting rate. 72 is close to the resting 70 after 3 minutes."},
  {"t":"d3E","c":"Fair fitness test","q":"To compare students' fitness using recovery time, what must be kept the same?","o":["The type and length of exercise for everyone","Each student's resting pulse rate","The recovery time of each student","Nothing; each student can exercise differently"],"e":"Recovery time is the dependent variable. The exercise must be identical so only fitness affects the result."},
  {"t":"d2A","c":"High blood pressure","q":"Why is high blood pressure harmful?","o":["It strains the heart and can damage artery walls","It stops red blood cells carrying oxygen","It makes the blood clot far too slowly","It turns the arteries into veins over time"],"e":"The heart has to work harder against high pressure, and damaged arteries are more likely to become blocked or burst."},
  {"t":"d3A","c":"Chest pain on exertion","q":"Fatty deposits narrow a coronary artery. Why does the person get chest pain climbing stairs, but not at rest?","o":["The working heart needs more oxygen than the artery can supply","Climbing stairs squeezes the coronary arteries shut","At rest, heart muscle does not need any oxygen at all","Exercise melts the fat, which then blocks a vein instead"],"e":"At rest, enough blood gets through. During exercise the heart beats harder and needs more oxygen, which the narrowed artery cannot deliver."},
  {"t":"b1K","c":"Vessels to the heart","q":"Which blood vessels carry blood towards the heart?","o":["Veins","Arteries","Capillaries","All three equally"],"e":"Arteries carry blood away from the heart, capillaries link them, and veins return blood to the heart."},
  {"t":"a3A","c":"Leaking heart valve","q":"The valve between the left atrium and left ventricle leaks. What happens?","o":["Some blood flows back, so less is pumped to the body","Blood flows straight across into the right ventricle","The heart pumps more blood to the body than usual","Deoxygenated blood flows straight into the aorta"],"e":"When the ventricle contracts, some blood is pushed backwards instead of into the aorta, so the heart pumps less efficiently."},
  {"t":"b2A","c":"Where you feel a pulse","q":"Why can you feel a pulse in an artery near the skin, but not in a vein?","o":["Blood in arteries surges with each beat; flow in veins is steady","Veins are too deep in the body for blood to move in them","Veins have no blood in them while you are resting","The wrist artery has a small extra heart of its own"],"e":"By the time blood reaches the veins it has passed through capillaries, which smooth out the surges."},
  {"t":"d2A","c":"Stopping smoking","q":"Why does stopping smoking reduce the risk of heart disease?","o":["Smoke damages arteries and makes blood clot more easily","Smoke cools the heart down and makes it beat slower","Nicotine makes the heart muscle stronger over time","Smoke removes the fatty deposits from the arteries"],"e":"Smoking damages artery linings, raises blood pressure and increases the chance of clots that block arteries."},
  {"t":"c1K","c":"Plasma colour","q":"What colour is blood plasma?","o":["Pale yellow","Bright red","Dark blue","Milky white"],"e":"Plasma is a pale yellow liquid. Blood looks red because of the haemoglobin in red blood cells."},
  {"t":"b2K","c":"Arteries to organs","q":"Which vessels carry blood with the highest pressure?","o":["Arteries","Veins","Capillaries","All vessels have the same pressure"],"e":"Pressure is highest in arteries because they receive blood straight from the ventricles. It falls through capillaries and is lowest in veins."},
  {"t":"a2A","c":"Ventricle walls","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"The wall of the left ventricle is thicker than that of the right ventricle.","R":"The left ventricle pumps blood to the lungs.","a":2,"e":"The assertion is true, but the left ventricle pumps blood to the whole body. The right ventricle pumps to the lungs."},
  {"t":"b2A","c":"Valves in veins","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Veins contain valves.","R":"Blood in veins is at low pressure and could flow backwards.","a":0,"e":"Both are true, and the low pressure is the reason valves are needed."},
  {"t":"b2K","c":"Oxygenated blood","type":"multi","q":"Which blood vessels carry oxygenated blood? Select all that apply.","o":["Aorta","Pulmonary vein","Coronary artery","Pulmonary artery","Vena cava"],"k":3,"e":"The aorta, pulmonary vein and coronary arteries carry oxygenated blood. The pulmonary artery and vena cava carry deoxygenated blood."},
  {"t":"c2K","c":"Dissolved in plasma","type":"multi","q":"Which substances are carried dissolved in the plasma? Select all that apply.","o":["Glucose","Carbon dioxide","Urea","Hormones","Haemoglobin"],"k":4,"e":"Haemoglobin is inside red blood cells, not dissolved in plasma."},
  {"t":"a3K","c":"Through the heart","type":"order","q":"Put these in the order blood passes through them, starting from the right atrium.","o":["Right atrium","Right ventricle","Pulmonary artery","Lungs","Pulmonary vein","Left atrium"],"e":"The right side pumps blood to the lungs, and it returns to the left side of the heart."},
  {"t":"b1K","c":"Odd one out: vessels","q":"Which is the odd one out?","o":["Vena cava","Aorta","Pulmonary artery","Coronary artery"],"e":"The aorta, pulmonary artery and coronary arteries are arteries, carrying blood away from the heart. The vena cava is a vein."},
  {"t":"d2A","c":"Pulse after exercise","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Heart rate rises during exercise.","R":"Muscles need more oxygen and glucose when they work harder.","a":0,"e":"Both true; the faster heart rate delivers oxygen and glucose faster to working muscles."}
  ]},
{ n: 4, title: "Respiration", strand: "Biology", topics: "Aerobic respiration, gas exchange, breathing, smoking and health",
  qs: [
  {"t":"a1K","c":"Respiration vs breathing","q":"Which statement correctly describes the difference between respiration and breathing?","o":["Respiration releases energy in cells; breathing moves air in and out","They are two words for the same process of getting oxygen in","Breathing happens in all cells; respiration happens only in the lungs","Respiration is breathing out; breathing is taking in oxygen"],"e":"Respiration happens in every living cell and releases energy from glucose. Breathing is the movement of air that supplies oxygen and removes carbon dioxide."},
  {"t":"a1K","c":"Respiration equation","q":"Which word equation shows aerobic respiration?","o":["glucose + oxygen → carbon dioxide + water","carbon dioxide + water → glucose + oxygen","glucose + carbon dioxide → oxygen + water","oxygen + water → glucose + carbon dioxide"],"e":"Aerobic respiration uses glucose and oxygen and releases energy, with carbon dioxide and water as waste products. Photosynthesis is the reverse reaction."},
  {"t":"a2K","c":"Where respiration happens","q":"Which cells carry out respiration?","o":["All living cells, including plant cells and microorganisms","Only cells in the lungs, where oxygen enters the body","Only animal cells, since plants photosynthesise instead","Only muscle cells, and only during exercise"],"e":"Every living cell needs energy, so every living cell respires, all the time. In plant and animal cells it happens in the mitochondria."},
  {"t":"b2A","c":"Alveoli","q":"Which set of features makes the alveoli good at gas exchange?","o":["Very large total surface area, thin walls and a rich blood supply","Thick walls, few capillaries and a dry surface to stop leaks","Muscular walls that pump air directly into the blood","A small surface area so that gases cannot escape again"],"e":"Millions of alveoli give a huge surface area. Their walls and the capillary walls are one cell thick, and the blood flow keeps the concentration difference high."},
  {"t":"b2K","c":"Composition of breath","q":"Compared with inhaled air, exhaled air contains:","o":["less oxygen and more carbon dioxide, but still quite a lot of oxygen","no oxygen at all, because all of it is absorbed by the blood","more oxygen and less carbon dioxide, because the lungs make oxygen","the same amounts of oxygen and carbon dioxide as inhaled air"],"e":"Inhaled air has about 21% oxygen and exhaled air about 16%. Carbon dioxide rises from about 0.04% to about 4%. This leftover oxygen is why rescue breathing works."},
  {"t":"c2K","c":"Breathing mechanism","q":"What happens when you breathe in?","o":["The diaphragm contracts and flattens, the ribs move up and out, and air flows in","The lungs expand by themselves, sucking air in through the trachea and bronchi","The diaphragm relaxes and moves up, pushing air down into the lungs from above","The ribs move down and in, squeezing air from the trachea down into the lungs"],"e":"Muscles make the chest cavity bigger. This lowers the pressure inside the lungs, so air from outside, at higher pressure, flows in. The lungs have no muscle of their own."},
  {"t":"b2E","c":"Testing breath","q":"Air is breathed out through limewater in one tube and room air is bubbled through limewater in another. The first tube turns milky much faster. What does this show?","o":["Exhaled air contains more carbon dioxide than room air","Exhaled air contains more oxygen than room air","Exhaled air contains no water vapour","Room air contains no carbon dioxide"],"e":"Limewater turns milky with carbon dioxide. Room air has a little carbon dioxide, so it changes slowly. Exhaled air has much more, so it changes quickly."},
  {"t":"d2A","c":"Smoking and cilia","q":"Smokers often have a cough and get chest infections. Which explanation is correct?","o":["Tar damages the cilia, so mucus and trapped bacteria are not swept away from the lungs","Nicotine makes the lungs produce oxygen too quickly, which irritates them","Smoke makes the alveoli bigger, so bacteria have more space to grow","Carbon monoxide kills bacteria in the lungs, and coughing removes them"],"e":"Cilia normally sweep mucus, dust and microorganisms up out of the airways. When they are damaged, mucus builds up, causing coughing and infections."},
  {"t":"d2A","c":"Carbon monoxide","q":"Cigarette smoke contains carbon monoxide. Why does this make it harder to exercise?","o":["It combines with haemoglobin, so red blood cells carry less oxygen","It blocks the stomata in the lungs, so less air can get in","It makes the heart beat more slowly, so blood moves less","It is used up instead of glucose, so muscles get less energy"],"e":"Carbon monoxide binds to haemoglobin more strongly than oxygen does. Less oxygen reaches the muscles, so less energy is released by respiration."},
  {"t":"d3A","c":"Emphysema","q":"In emphysema, the walls of many alveoli break down. Why does the person become breathless?","o":["The surface area for gas exchange is reduced, so less oxygen gets into the blood","The diaphragm stops working, so the lungs cannot fill with air","Their blood stops carrying carbon dioxide, which builds up in the cells","Their airways become too wide, so air rushes out before it is used"],"e":"Fewer, larger air sacs have much less total surface area. Less oxygen can diffuse into the blood, even when the person breathes hard."},
  {"t":"c2A","c":"Exercise and breathing","q":"Why do you breathe faster and more deeply during exercise?","o":["To take in more oxygen for respiration and remove extra carbon dioxide","To cool the lungs down, because they heat up when muscles work hard","Because the working muscles need extra air to be pumped inside them","To get rid of the extra glucose that is made during hard exercise"],"e":"Muscles respire faster during exercise. They need more oxygen and produce more carbon dioxide, so breathing rate and depth increase."},
  {"t":"a3E","c":"Respiration releases heat","q":"Germinating seeds are placed in a sealed vacuum flask with a thermometer. After two days the temperature has risen. Why?","o":["The seeds are respiring, and some of the energy released is lost as heat","The seeds are photosynthesising inside the flask and producing heat","The vacuum flask slowly creates heat when it is kept closed","The seeds are absorbing heat from the thermometer bulb"],"e":"Respiration releases energy from glucose. Some of this energy is transferred to the surroundings as heat. A control flask with boiled (dead) seeds would show no rise."},
  {"t":"b2A","c":"Diffusion in gas exchange","q":"Why does oxygen move from the alveoli into the blood?","o":["Its concentration is higher in the alveoli than in the blood","The heart sucks oxygen out of the alveoli each time it beats","Muscles in the alveoli walls push oxygen into the blood","Blood always contains more oxygen than air, so it attracts more"],"e":"Diffusion is the net movement of particles from a high concentration to a low concentration. Blood arriving at the lungs is low in oxygen, so oxygen diffuses into it."},
  {"t":"a1A","c":"Need for oxygen and glucose","q":"Why do body cells need a constant supply of glucose and oxygen?","o":["They use them in respiration to release energy for life processes","They store them to build bones","They turn them into carbon dioxide for photosynthesis","They need them to make blood"],"e":"Energy released by respiration is used for movement, growth, keeping warm, sending nerve messages and much more."},
  {"t":"a2A","c":"Mitochondria","q":"Muscle cells contain many more mitochondria than most other cells. Why?","o":["Mitochondria carry out respiration, and muscle cells need a lot of energy","Mitochondria make the muscle stronger by contracting themselves","Mitochondria store oxygen for use when the muscle works hard","Mitochondria carry out photosynthesis to make glucose for the muscle"],"e":"Aerobic respiration happens in mitochondria. Cells that use a lot of energy have lots of them."},
  {"t":"b1K","c":"Airway path","q":"Which is the correct path air takes into the lungs?","o":["Trachea → bronchi → bronchioles → alveoli","Bronchi → trachea → alveoli → bronchioles","Alveoli → bronchioles → bronchi → trachea","Trachea → alveoli → bronchi → bronchioles"],"e":"The trachea divides into two bronchi, which branch into many bronchioles ending in tiny air sacs called alveoli."},
  {"t":"b2A","c":"Cartilage rings","q":"The trachea is held open by rings of cartilage. Why is this needed?","o":["To stop it collapsing when air pressure inside falls during breathing in","To make the trachea squeeze air into the lungs by itself","To filter dust and microorganisms out of the incoming air","To let oxygen diffuse through the trachea wall into the blood"],"e":"The trachea must stay open all the time so air can always pass through."},
  {"t":"b1K","c":"Nose and mucus","q":"How do the nose and airways protect the lungs?","o":["Hairs and sticky mucus trap dust and microorganisms","They absorb oxygen before it reaches the lungs","They make the air colder","They remove carbon dioxide from the air"],"e":"Mucus traps particles, and cilia sweep it up and away from the lungs. The nose also warms and moistens the air."},
  {"t":"c2K","c":"Breathing out","q":"What happens when you breathe out normally?","o":["The diaphragm relaxes and domes up, the ribs move down and in, and air is pushed out","The diaphragm contracts and flattens, the ribs move out, and the air is pushed out","The lungs contract like a muscle and squeeze the air out through the trachea","The ribs move up and out, so the chest gets bigger and pushes the air out"],"e":"A smaller chest volume raises the pressure in the lungs above that outside, so air flows out."},
  {"t":"c2E","c":"Bell jar model","q":"In a bell jar model of the chest, pulling down the rubber sheet at the bottom makes the balloons inflate. What does the rubber sheet represent?","o":["The diaphragm","The ribs","The trachea","The alveoli"],"e":"Pulling the sheet down increases the volume inside the jar, just as the diaphragm flattening increases chest volume. One limitation: the jar's walls cannot move like ribs."},
  {"t":"b2E","c":"Water vapour in breath","q":"When you breathe onto a cold mirror, it mists up. What does this show?","o":["Exhaled air contains water vapour, partly produced by respiration","Exhaled air contains carbon dioxide gas that turns liquid","The mirror has absorbed oxygen","Exhaled air contains no water"],"e":"Water is a product of respiration. Water vapour in breath condenses on the cold surface."},
  {"t":"b3A","c":"Nitrogen in breath","q":"About 78% of inhaled air is nitrogen. Roughly how much of exhaled air is nitrogen?","o":["About 78%, because the body does not use nitrogen gas","About 16%, because most nitrogen is absorbed","About 4%, because nitrogen turns into carbon dioxide","Almost none, because nitrogen is used in respiration"],"e":"Nitrogen is breathed in and out unchanged. Only oxygen and carbon dioxide (and water vapour) change significantly."},
  {"t":"b2A","c":"Moist alveoli","q":"Why are the walls of the alveoli moist?","o":["Gases dissolve in the moisture before diffusing across the walls","Moisture stops dust reaching the blood by trapping it on the walls","Moisture adds extra oxygen to the air because water contains oxygen","Water is needed in the alveoli to make glucose for the lung cells"],"e":"Oxygen dissolves in the thin film of water and then diffuses into the blood."},
  {"t":"b3A","c":"Maintaining diffusion","q":"Breathing keeps air in the alveoli fresh, and blood keeps flowing through the capillaries. Why do both matter?","o":["They keep oxygen concentration higher in the alveoli than in the blood","They stop too much oxygen entering the blood, which would harm the cells","They stretch the alveoli so that they grow larger with every breath","They make carbon dioxide move from the outside air into the alveoli"],"e":"If either stopped, the concentrations would even out and diffusion would slow down and stop."},
  {"t":"d1K","c":"Lung cancer","q":"Which substance in cigarette smoke is the main cause of lung cancer?","o":["Tar, which contains cancer-causing chemicals","Nicotine, which makes smoking addictive","Carbon monoxide, which reduces oxygen in blood","Water vapour, which makes the lungs damp"],"e":"Tar coats the airways and contains carcinogens, substances that can cause cells to divide out of control."},
  {"t":"d1K","c":"Nicotine","q":"Why do many smokers find it hard to give up?","o":["Nicotine is addictive","Tar makes the lungs need smoke","Carbon monoxide gives them energy","Smoke contains vitamins the body needs"],"e":"Nicotine is an addictive drug. It also raises heart rate and blood pressure."},
  {"t":"d1A","c":"Passive smoking","q":"Why can smoking harm people who do not smoke themselves?","o":["They breathe in smoke from other people's cigarettes","Smoking uses up the oxygen in a room, so others cannot breathe","Smokers breathe out germs from the tar that infect other people","It cannot harm them, because smoke only affects the smoker's lungs"],"e":"Breathing in second-hand smoke exposes people, including children, to the same harmful substances."},
  {"t":"d2A","c":"Bronchitis","q":"A smoker has bronchitis, with inflamed airways and lots of mucus. Why does the person cough a lot?","o":["To try to clear mucus that the damaged cilia can no longer remove","Because the alveoli have grown larger and need more air to fill them","Because the diaphragm has stopped working and coughing replaces it","To get more nicotine from the smoke deeper into the lungs"],"e":"Damaged cilia cannot sweep mucus away, so coughing is the body's way of trying to remove it."},
  {"t":"a2E","c":"Germinating seeds","q":"Germinating peas are put in a tube with limewater, and boiled (dead) peas in another. Only the first limewater turns milky. What does this show?","o":["Living seeds respire and release carbon dioxide","Seeds photosynthesise in the dark","Boiled peas release more carbon dioxide","Limewater makes seeds respire"],"e":"Only living cells respire. The boiled peas are a control, showing that the change is caused by living seeds."},
  {"t":"a2A","c":"Seeds need oxygen","q":"Seeds will not germinate without oxygen. Why?","o":["They need oxygen for respiration to release energy for growth","Oxygen softens the seed coat","Oxygen is used for photosynthesis inside the seed","They need oxygen to absorb water"],"e":"Growing needs energy, and seeds get this energy from aerobic respiration of their food stores."},
  {"t":"c3A","c":"Altitude","q":"Mountain climbers breathe faster at high altitude even when resting. Why?","o":["There is less oxygen in each breath of air, so they must breathe more to get enough","There is more carbon dioxide high up, which they must breathe out faster","Cold mountain air cannot enter the lungs easily, so they take more breaths","Their muscles respire less at altitude, so less oxygen is needed each breath"],"e":"Air at altitude is thinner, so each breath delivers less oxygen to the alveoli."},
  {"t":"a2A","c":"Comparing equations","q":"How are respiration and photosynthesis related?","o":["The products of one are the reactants of the other","They are the same reaction, happening in different cells","Both use oxygen and both release glucose as a product","Both only happen in plants, and only in the light"],"e":"Photosynthesis: carbon dioxide + water → glucose + oxygen. Respiration: glucose + oxygen → carbon dioxide + water."},
  {"t":"a2K","c":"Energy is released, not made","q":"Which phrase describes what respiration does with energy?","o":["It releases energy stored in glucose","It creates new energy","It makes energy out of oxygen","It destroys energy"],"e":"Energy cannot be created or destroyed. Respiration transfers the chemical energy stored in glucose into a form cells can use."},
  {"t":"c1N","c":"Breathing rate","q":"A student breathes 6 times in 20 seconds. What is their breathing rate?","o":["18 breaths per minute","6 breaths per minute","120 breaths per minute","3 breaths per minute"],"e":"There are three lots of 20 seconds in a minute: 6 × 3 = 18."},
  {"t":"d2A","c":"Smoking and fitness","q":"Why does smoking make it harder to run long distances?","o":["Less oxygen reaches the muscles, because of carbon monoxide and damaged alveoli","Smoking makes the leg muscles grow too large to move quickly","Nicotine stops the heart beating for a few seconds at a time","Tar gives the muscles extra glucose, which makes them tire quickly"],"e":"Carbon monoxide reduces the oxygen blood can carry, and damage to the alveoli reduces gas exchange."},
  {"t":"b3A","c":"Gas exchange surface","q":"Fish have gills instead of lungs. Which feature would you expect gills to share with alveoli?","o":["A large surface area with a good blood supply and thin walls","Thick, dry walls that stop water getting into the blood","Very few blood vessels, so that the gills stay light","Cartilage rings that keep the gills open like a trachea"],"e":"All efficient gas exchange surfaces share these features, because they make diffusion fast."},
  {"t":"d2A","c":"Asthma","q":"During an asthma attack the muscles around the bronchioles tighten. Why does the person struggle to breathe?","o":["The airways become narrower, so less air can flow through","The alveoli fill with blood, so no air can get in","The diaphragm stops working, so the chest cannot expand","The trachea collapses, so air cannot reach the lungs"],"e":"Narrow airways make it hard to move air in and out. Inhalers contain a drug that relaxes these muscles."},
  {"t":"a1K","c":"Respiration never stops","q":"When does respiration happen in your body?","o":["All the time, day and night, even when asleep","Only when you are exercising and need extra energy","Only when you are breathing in and have fresh oxygen","Only during the day, when you are awake and moving"],"e":"Cells always need energy, so respiration never stops while you are alive. The rate changes with activity."},
  {"t":"a1K","c":"Where energy goes","q":"Which is a use of the energy released by respiration in humans?","o":["Contracting muscles, growth and keeping the body warm","Making glucose from carbon dioxide and water in the liver","Absorbing light energy through the skin to make vitamin D","Producing oxygen in the lungs to be used by the blood"],"e":"Respiration provides energy for all life processes. Making glucose from carbon dioxide is what plants do in photosynthesis."},
  {"t":"c2K","c":"Rib muscles","q":"Which muscles move the ribs during breathing?","o":["Intercostal muscles","The diaphragm","Heart muscle","Biceps"],"e":"Intercostal muscles between the ribs pull the ribcage up and out when you breathe in."},
  {"t":"c3E","c":"Chest measurements","q":"A tape measure round a student's chest reads 82 cm after breathing in and 77 cm after breathing out. What does this show?","o":["The ribs move out when breathing in, so chest volume increases","The lungs shrink each time the student breathes in","The diaphragm moves upwards whenever the student breathes in","Chest size does not change at all during breathing"],"e":"A bigger chest circumference after breathing in is evidence that the ribcage moves up and out, making the chest volume larger."},
  {"t":"a2A","c":"Source of glucose","q":"Where does the glucose used in respiration in your muscles come from?","o":["Digested food, carried to the muscles by the blood","Photosynthesis happening inside the muscle cells","Oxygen that is breathed in through the lungs","Carbon dioxide that is made in other body cells"],"e":"Carbohydrates are digested into glucose, absorbed in the small intestine and carried by the blood to every cell."},
  {"t":"a2A","c":"Warm muscles","q":"Why do your muscles get warm when you exercise?","o":["Faster respiration releases more energy, some of it as heat","Friction between muscle fibres produces the heat","Blood brings heat from the Sun to the muscles","Muscles absorb heat from the air you breathe in"],"e":"Working muscles respire faster. Not all the energy released is used for movement; much is lost as heat."},
  {"t":"b2A","c":"Warm breath","q":"Why is exhaled air warmer than inhaled air?","o":["It has been warmed by the body as it passed through","Respiration happens in the lungs and heats the air","Oxygen becomes hotter as it is absorbed","Carbon dioxide is always warmer than oxygen"],"e":"Air is warmed by the airways and lungs, which are at body temperature."},
  {"t":"b3N","c":"Using composition data","q":"Inhaled air: oxygen 21%, carbon dioxide 0.04%. Exhaled air: oxygen 16%, carbon dioxide 4%. By how many percentage points does oxygen fall?","o":["5","16","21","37"],"e":"21 − 16 = 5 percentage points. Carbon dioxide rises by nearly 4 percentage points, about 100 times as much as before."},
  {"t":"b1K","c":"Site of gas exchange","q":"Where in the lungs does gas exchange happen?","o":["Alveoli","Trachea","Bronchi","Diaphragm"],"e":"The alveoli are tiny air sacs surrounded by capillaries. The other airways only carry air."},
  {"t":"d2A","c":"Vaping","q":"Most vapes contain nicotine but no tar. What risk do they still carry?","o":["Addiction, because nicotine is addictive","Lung cancer caused by the tar in them","Scurvy, because they remove vitamins","Emphysema caused by the tar they contain"],"e":"Nicotine is highly addictive whatever way it is taken. Doctors are still studying the other long-term effects of vaping."},
  {"t":"d3N","c":"Correlation","q":"Data show that the more cigarettes people smoke each day, the higher their risk of lung cancer. What kind of relationship is this?","o":["A positive correlation: as one goes up, so does the other","A negative correlation: as one goes up, the other goes down","No relationship between the two variables","Proof that every smoker will get lung cancer"],"e":"A correlation shows a pattern in a group. It does not mean every smoker gets cancer, but the risk clearly rises with more smoking."},
  {"t":"d1K","c":"Tar stains","q":"Why do heavy smokers' fingers and teeth turn yellow-brown?","o":["Tar in the smoke stains them","Nicotine turns skin cells into fat","Carbon monoxide changes skin colour","Smoke removes oxygen from the skin"],"e":"Tar is a sticky brown substance. The same tar coats the airways and lungs."},
  {"t":"a3E","c":"Choosing a control","q":"Maggots are put in a sealed tube with limewater, which turns milky. What would be a good control?","o":["An identical tube with glass beads instead of maggots","An identical tube with twice as many maggots","An identical tube with no limewater in it","The same tube left in a warmer place"],"e":"The control must be the same in every way except for the living organisms. Glass beads take up the same space but do not respire."},
  {"t":"c1N","c":"Breathing rate change","q":"A student breathes 15 times a minute at rest and 35 times a minute after exercise. By how much has the rate increased?","o":["20 breaths per minute","50 breaths per minute","15 breaths per minute","35 breaths per minute"],"e":"35 − 15 = 20 breaths per minute more. Breathing also gets deeper during exercise."},
  {"t":"b3A","c":"Huge lung surface","q":"The total surface area of the alveoli is about the size of a tennis court. Why does it need to be so large?","o":["So enough oxygen can diffuse into the blood quickly","So the lungs can store food for respiration","So the lungs can hold all of the body's blood","So that air moves through the lungs more slowly"],"e":"The rate of diffusion depends on surface area. The body needs a lot of oxygen every second, especially during exercise."},
  {"t":"d2A","c":"Exercise and lungs","q":"How does regular exercise help breathing?","o":["Breathing muscles get stronger, moving more air per breath","The lungs grow a set of extra alveoli every week","The trachea becomes much wider and much shorter","The blood no longer needs as much oxygen as before"],"e":"Stronger intercostal muscles and diaphragm make breathing more efficient."},
  {"t":"a3A","c":"A common mistake","q":"Someone says 'respiration happens in the lungs'. Why is this wrong?","o":["Respiration happens in every cell; the lungs only exchange gases","Respiration happens only in the heart and in the blood","Respiration happens only in the muscles during exercise","Respiration only happens in plants, never in humans"],"e":"This mixes up respiration with breathing. Breathing and gas exchange supply the oxygen; respiration uses it inside cells."},
  {"t":"c2E","c":"Limits of the bell jar model","q":"In the bell jar model of breathing, why is the rigid glass jar a poor model of the chest?","o":["The jar cannot move, but the ribs move up and out","The jar is much too large to represent a chest","The jar lets light in, unlike the chest wall","The jar has no balloons to represent the lungs"],"e":"Models help explain ideas but always have limits. In real breathing, both the ribs and the diaphragm change the chest volume."},
  {"t":"a1K","c":"Breathing vs respiration","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Breathing and respiration are the same process.","R":"Both involve oxygen.","a":3,"e":"They are different: respiration is a reaction in cells; breathing moves air. The reason is true but does not make them the same."},
  {"t":"d2A","c":"Smokers are breathless","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Smokers often get breathless during exercise.","R":"Carbon monoxide reduces the oxygen carried by red blood cells.","a":0,"e":"Both are true, and less oxygen in the blood is one reason smokers get breathless."},
  {"t":"c2K","c":"Breathing in","type":"multi","q":"Which happen when you breathe in? Select all that apply.","o":["The diaphragm contracts and flattens","The ribs move up and out","The chest volume increases","The pressure in the lungs increases","The diaphragm relaxes"],"k":3,"e":"Breathing in makes the chest bigger, so the pressure inside falls (it does not rise) and air flows in."},
  {"t":"a1K","c":"Products of respiration","type":"multi","q":"Which substances are produced by aerobic respiration? Select all that apply.","o":["Carbon dioxide","Water","Oxygen","Glucose","Starch"],"k":2,"e":"glucose + oxygen → carbon dioxide + water. Energy is released, but it is not a substance."},
  {"t":"b1K","c":"Path of air","type":"order","q":"Put these in the order air passes through them on the way to the blood.","o":["Nose","Trachea","Bronchus","Bronchiole","Alveolus","Capillary"],"e":"Air passes down the trachea, into a bronchus, then smaller bronchioles, to the alveoli where oxygen diffuses into capillaries."},
  {"t":"b1K","c":"Odd one out: airways","q":"Which is the odd one out?","o":["Diaphragm","Trachea","Bronchus","Bronchiole"],"e":"The trachea, bronchi and bronchioles are tubes that carry air. The diaphragm is a sheet of muscle."},
  {"t":"b2A","c":"Alveolus walls","type":"ar","q":"Read the assertion and the reason, then choose the correct statement.","A":"Oxygen diffuses quickly into the blood in the lungs.","R":"Alveolus and capillary walls are only one cell thick.","a":0,"e":"Both are true, and the short diffusion distance explains the fast diffusion."}
  ]},
{ n: 5, title: "Reproduction and development", strand: "Biology", topics: "Gametes, fertilisation, the menstrual cycle, pregnancy, growth and adolescence",
  qs: [
  {"t":"a2A","c":"Sperm cell adaptations","q":"Sperm cells have a tail and contain many mitochondria. How do these help?","o":["The tail lets the sperm swim, and the mitochondria release the energy it needs","The tail anchors the sperm to the egg, and mitochondria store food","The mitochondria carry the genetic information","They help the sperm divide into many cells"],"e":"A sperm must swim a long way to reach the egg. Mitochondria are where respiration happens, so many mitochondria provide plenty of energy for swimming."},
  {"t":"a2A","c":"Egg cell adaptations","q":"Why is an egg cell much larger than a sperm cell?","o":["It contains a store of food for the early embryo","It needs to swim further than a sperm","It contains more chromosomes than a sperm","It needs a larger nucleus to fuse with the sperm"],"e":"The egg's large cytoplasm contains nutrients that supply energy until the embryo implants and gets food from the mother."},
  {"t":"b1K","c":"Fertilisation","q":"What exactly happens at fertilisation?","o":["The nucleus of a sperm fuses with the nucleus of an egg","A sperm enters the uterus","An egg is released from the ovary","The embryo attaches to the wall of the uterus"],"e":"Fertilisation is the joining of the two nuclei. It usually happens in the oviduct. Release of the egg is ovulation; attaching to the uterus wall is implantation."},
  {"t":"a3A","c":"Half the chromosomes","q":"Why do gametes contain only half the number of chromosomes of a normal body cell?","o":["So that when two gametes fuse, the zygote has the full number of chromosomes","So that gametes are small and light enough to travel to each other","Because chromosomes are only needed in body cells, not in gametes","So that the baby gets all its features from just one of its parents"],"e":"Each gamete brings half. When egg and sperm nuclei fuse, the zygote has a complete set, half from each parent."},
  {"t":"b2A","c":"Placenta","q":"What does the placenta do?","o":["It lets oxygen and food pass to the fetus and wastes pass back, without the bloods mixing","It pumps the mother's blood directly into the fetus through the umbilical cord","It surrounds the fetus with fluid and protects it from bumps and knocks","It produces new egg cells so that the next pregnancy can begin straight away"],"e":"The mother's blood and the fetus's blood come very close in the placenta, so substances diffuse across. They do not mix, which protects the fetus."},
  {"t":"d2A","c":"Lifestyle in pregnancy","q":"Why are pregnant women advised not to smoke?","o":["Harmful substances cross the placenta and the fetus may get less oxygen, leading to low birth weight","Smoke enters the uterus directly through the mother's lungs and fills the amnion","Smoking makes the amniotic fluid evaporate, so the fetus has no protection","Smoking only harms the mother's lungs; nothing can reach the fetus"],"e":"Carbon monoxide and nicotine can cross the placenta. Carbon monoxide reduces the oxygen carried in the blood, so the baby may grow more slowly."},
  {"t":"b1K","c":"Amniotic fluid","q":"What is the main function of the amniotic fluid?","o":["It cushions and protects the fetus from knocks","It supplies the fetus with food","It carries oxygen to the fetus","It removes carbon dioxide from the fetus"],"e":"The fetus floats in amniotic fluid inside the amnion. The fluid absorbs bumps. Food and oxygen arrive through the placenta and umbilical cord."},
  {"t":"c2A","c":"Menstrual cycle","q":"Why does the lining of the uterus thicken during each menstrual cycle?","o":["To prepare for a fertilised egg to implant","To push the egg out of the ovary","To produce hormones that make sperm","To store food for the mother"],"e":"A thick lining with a good blood supply is ready to receive an embryo. If no egg is fertilised, the lining breaks down and is lost during menstruation."},
  {"t":"c2K","c":"Ovulation timing","q":"In a typical 28-day cycle, starting on the first day of menstruation, roughly when is an egg released?","o":["Around day 14","Around day 1","Around day 5","Around day 28"],"e":"Ovulation usually happens about halfway through the cycle. Days 1 to 5 are menstruation. This is a typical pattern; real cycles vary."},
  {"t":"d1K","c":"Puberty and hormones","q":"What causes the body changes at puberty?","o":["Sex hormones such as testosterone and oestrogen","A sudden increase in the amount of food eaten","Growth of new organs that were not there before","Changes in the number of chromosomes in body cells"],"e":"At puberty the testes start producing testosterone and the ovaries produce oestrogen. These hormones cause secondary sexual characteristics to develop."},
  {"t":"b3A","c":"Twins","q":"How are identical twins formed?","o":["One fertilised egg splits into two embryos","Two eggs are fertilised by two different sperm","One egg is fertilised by two sperm","Two eggs are fertilised by one sperm"],"e":"Identical twins come from one zygote, so they have the same genetic information. Non-identical twins come from two eggs fertilised by two sperm."},
  {"t":"d2K","c":"Growth vs development","q":"Which statement shows the difference between growth and development?","o":["Growth is an increase in size; development is becoming more complex, with new features","Growth only happens before birth; development only happens after birth","Growth means getting older; development means getting taller and heavier","They mean exactly the same thing and can always be swapped"],"e":"A baby grows by getting bigger. It develops when it gains new abilities and features, such as walking, or body changes at puberty."},
  {"t":"a2A","c":"Many sperm","q":"Millions of sperm are released, but only one fertilises an egg. Why are so many produced?","o":["Most sperm die or never reach the egg, so large numbers increase the chance that one will","Each sperm carries only one chromosome, so many are needed to give a full set","Many sperm must join together and combine before they can fertilise an egg","The extra sperm are absorbed and become food for the growing embryo"],"e":"The journey to the oviduct is long and most sperm do not survive it. Producing huge numbers makes fertilisation more likely."},
  {"t":"a1K","c":"Testes","q":"What are the two main jobs of the testes?","o":["Making sperm and testosterone","Storing urine and releasing sperm","Making eggs and the hormone oestrogen","Making the fluid that becomes semen"],"e":"Sperm are produced in the testes all the time from puberty onwards. Testosterone causes male secondary sexual characteristics."},
  {"t":"a2A","c":"Scrotum","q":"Why do the testes hang outside the body in the scrotum?","o":["Sperm develop best at a slightly lower temperature than body temperature","Being outside the body makes it easier for the sperm to swim away","The scrotum protects the testes from bumps better than the body could","There is no room left for them inside the body next to the bladder"],"e":"Keeping the testes a little cooler than the rest of the body helps healthy sperm form."},
  {"t":"a2K","c":"Semen","q":"Glands add fluid to sperm to make semen. Why is this fluid important?","o":["It provides nutrients and a liquid for the sperm to swim in","It contains extra chromosomes that the sperm pass on","It makes the sperm divide into more sperm cells","It kills off the weaker sperm before they leave"],"e":"The fluid gives sperm energy-rich sugar and a liquid to move in."},
  {"t":"a1K","c":"Ovaries","q":"What is released from an ovary about once a month?","o":["An egg cell","A sperm cell","An embryo","A placenta"],"e":"Each ovary contains many immature eggs. Usually one is released at ovulation each cycle."},
  {"t":"a2K","c":"Moving the egg","q":"An egg cell cannot swim. How does it move along the oviduct?","o":["Cilia and gentle muscle contractions move it along","It is pulled along by sperm that attach to it","It rolls down the oviduct because of gravity","Blood flowing past the oviduct carries it along"],"e":"Tiny beating cilia and gentle muscle movement carry the egg towards the uterus."},
  {"t":"a1K","c":"Uterus","q":"What is the function of the uterus?","o":["It is where the fetus develops during pregnancy","It produces eggs","It is where fertilisation usually happens","It produces sperm"],"e":"The uterus has a thick, muscular wall. The embryo implants in its lining and grows there."},
  {"t":"a1K","c":"Cervix","q":"What is the cervix?","o":["A ring of muscle at the entrance to the uterus","The tube that carries eggs from the ovary","The organ that makes eggs","Part of the placenta"],"e":"The cervix keeps the uterus closed during pregnancy and widens during birth to let the baby out."},
  {"t":"c3A","c":"Fertile time","q":"An egg survives about one day after release, but sperm can survive for a few days. What does this mean?","o":["Fertilisation is possible if intercourse happens a few days before ovulation","Fertilisation can happen at any time in the cycle, so timing does not matter","Fertilisation can only happen on day 1 of the cycle, during menstruation","Sperm must be released after the egg has died for fertilisation to happen"],"e":"Sperm that are already waiting in the oviduct can fertilise the egg soon after it is released."},
  {"t":"b2K","c":"After fertilisation","q":"What happens to the zygote after fertilisation?","o":["It divides many times into a ball of cells that implants in the uterus","It immediately becomes a fully formed but very tiny baby","It travels back up to the ovary, where it grows for nine months","It joins with another egg to double its number of chromosomes"],"e":"The zygote divides as it moves down the oviduct. The ball of cells (embryo) sinks into the soft uterus lining."},
  {"t":"b2K","c":"Embryo and fetus","q":"When is a developing baby called a fetus rather than an embryo?","o":["Once its main organs have formed (about 8 weeks)","As soon as the sperm and egg nuclei have fused","Only once it has been born and starts breathing","From the first day, when the heart starts to beat"],"e":"In the early weeks it is an embryo. From about eight weeks, when it has recognisable organs, it is called a fetus."},
  {"t":"b1K","c":"Gestation","q":"How long does a human pregnancy usually last?","o":["About 40 weeks (9 months)","About 4 weeks (1 month)","About 20 weeks (5 months)","About 2 years (24 months)"],"e":"The time from fertilisation to birth is called gestation. In humans it is about nine months."},
  {"t":"b1K","c":"Umbilical cord","q":"What does the umbilical cord do?","o":["It connects the fetus to the placenta, carrying its blood","It connects the mother's heart to the fetus's heart","It carries the mother's blood into the fetus","It holds amniotic fluid"],"e":"Blood vessels in the cord carry the fetus's blood to and from the placenta, where exchange with the mother's blood happens."},
  {"t":"d2A","c":"Alcohol","q":"Why should pregnant women avoid alcohol?","o":["Alcohol crosses the placenta and can damage the developing brain and body of the fetus","Alcohol cannot cross the placenta, but it makes the mother too tired to eat well","Alcohol thickens the amniotic fluid, so the fetus cannot move around","Alcohol stops the placenta forming, so the fetus gets no food at all"],"e":"Many substances in the mother's blood can cross the placenta. The fetus cannot break down alcohol well."},
  {"t":"d3A","c":"Viruses and the placenta","q":"Some viruses, such as rubella, can cross the placenta. Why are girls often vaccinated against rubella?","o":["To protect a future fetus from damage if they catch rubella while pregnant","Because rubella stops the ovaries making any more eggs after infection","Because the vaccine makes the placenta stronger in a future pregnancy","Because rubella only affects adults, so it must be prevented before then"],"e":"Rubella in early pregnancy can harm the fetus. Being immune before pregnancy prevents this."},
  {"t":"b2K","c":"Birth","q":"What causes the baby to be pushed out during birth?","o":["Strong contractions of the muscle in the uterus wall","The baby swimming out using its arms and legs","The placenta pushing the baby out in front of it","The baby's first breath pushing it out of the uterus"],"e":"The muscular uterus contracts. The cervix widens and the baby is pushed out through the vagina."},
  {"t":"d2A","c":"Breast milk","q":"Why is breast milk especially good for a newborn baby?","o":["It contains nutrients and antibodies that help protect the baby from disease","It contains no water, so the baby's kidneys do not need to work","It is the only food that contains glucose, which babies need most","It contains calcium that makes the baby's teeth appear straight away"],"e":"Breast milk has the right balance of nutrients, and antibodies from the mother give the baby some protection against infections."},
  {"t":"c2A","c":"No periods in pregnancy","q":"Why does menstruation stop during pregnancy?","o":["The uterus lining is needed to support the developing fetus, so it is not broken down","No eggs are left in the ovaries, so the cycle can never start again","The menstrual cycle only happens in girls under 18, so it stops naturally","Blood is not needed in the uterus during pregnancy, so the lining disappears"],"e":"Menstruation is the loss of the lining when no embryo implants. In pregnancy the lining stays and supports the placenta."},
  {"t":"c1K","c":"Hormones and the cycle","q":"What controls the menstrual cycle?","o":["Hormones","The amount of food eaten","The phases of the Moon","The number of sperm present"],"e":"Hormones from the brain and ovaries control when eggs mature, when ovulation happens and when the lining thickens."},
  {"t":"d1K","c":"Changes at puberty (boys)","q":"Which change happens at puberty in boys but not in girls?","o":["The voice becomes much deeper","Pubic and underarm hair grows","A rapid growth spurt happens","Sweat glands become more active"],"e":"Pubic hair, growth spurts and body odour happen in both. The larynx grows more in boys, deepening the voice."},
  {"t":"d1K","c":"Changes at puberty (girls)","q":"Which change happens at puberty in girls?","o":["Breasts develop and menstruation begins","Sperm production begins in the ovaries","Thick facial hair starts to grow","The voice breaks and becomes deep"],"e":"Oestrogen causes breasts to develop and hips to widen. Ovulation and menstruation start."},
  {"t":"d2A","c":"Variation in timing","q":"Two friends are both 12. One has started puberty and the other has not. What does this show?","o":["The age when puberty starts varies a lot between people, and both are normal","The one who has not started must be ill and should see a doctor","Puberty always starts on a person's 12th birthday, so one is early","Only girls go through puberty at 12; boys always start at 16"],"e":"Puberty can start at any time from about 8 to 14 years. Differences in timing are normal."},
  {"t":"d2K","c":"Puberty and adolescence","q":"What is the difference between puberty and adolescence?","o":["Puberty is the body's physical change; adolescence also includes emotional change","They mean exactly the same thing: the body changing into an adult's body","Adolescence happens before birth; puberty happens in the teenage years","Puberty is only the emotional change; adolescence is only the physical change"],"e":"Adolescence covers the teenage years, including changes in feelings, independence and relationships as well as the body."},
  {"t":"d2A","c":"Diet in pregnancy","q":"Which is the best dietary advice for a pregnant woman?","o":["Eat a balanced diet with extra iron and calcium, and only a little extra energy","Eat twice as much of everything, because she is eating for two people now","Avoid protein completely, because it makes the baby grow too large","Eat only fruit and vegetables, because they contain all the nutrients needed"],"e":"Iron helps make extra blood, and calcium builds the baby's bones. The energy needed increases only slightly."},
  {"t":"d2A","c":"Teenage diet","q":"Why do teenagers often need more protein and energy than younger children?","o":["They go through a growth spurt and build a lot of new tissue","They respire less than adults, so they store protein instead","They lose all their muscle at puberty and must rebuild it","Their digestive system works less well, so they absorb less"],"e":"Rapid growth needs protein for new cells and energy for building them."},
  {"t":"a2A","c":"Inheritance","q":"Why does a child often look a bit like each parent?","o":["Half of its genetic information came from each parent","The child learns to copy its parents' expressions and behaviour","All of the child's features come from the mother's egg cell","The placenta passes on the father's features during pregnancy"],"e":"The zygote has chromosomes from both parents, so it inherits a mix of features."},
  {"t":"b2A","c":"Placenta surface area","q":"The placenta has many finger-like projections. Why?","o":["To give a large surface area for exchange","To grip the fetus firmly in place","To pump blood to and from the fetus","To store food ready for after the birth"],"e":"A large surface area means oxygen, nutrients and wastes can diffuse across faster, like villi in the intestine."},
  {"t":"b3A","c":"Fetal waste","q":"How does the fetus get rid of carbon dioxide and urea?","o":["They diffuse across the placenta into the mother's blood","The fetus breathes them out into the amniotic fluid","They are stored in the fetus's body until after birth","The umbilical cord changes them into food for the fetus"],"e":"The fetus's lungs and kidneys are not doing this job yet. The mother's lungs and kidneys remove the waste."},
  {"t":"a2K","c":"Sperm duct","q":"Which tube carries sperm away from each testis?","o":["Sperm duct","Oviduct","Ureter","Umbilical cord"],"e":"The sperm ducts carry sperm to the urethra. Glands along the way add fluid to make semen."},
  {"t":"a3A","c":"Comparing gametes","q":"Which comparison of sperm and egg cells is correct?","o":["Sperm are tiny and made in millions; eggs are large and usually released one at a time","Sperm are large with food stores; eggs are tiny and swim using a tail","Both sperm and eggs are released in millions every month","Eggs contain chromosomes, but sperm do not contain any"],"e":"Their structures match their jobs: sperm move to the egg, while the egg provides food for the early embryo."},
  {"t":"b2K","c":"Implantation","q":"Where does an embryo implant?","o":["The lining of the uterus","The wall of the oviduct","Inside the ovary","In the cervix"],"e":"The thick, soft uterus lining has a good blood supply, ready to support the embryo and form the placenta."},
  {"t":"b2A","c":"Premature babies","q":"Babies born at 30 weeks are more likely to survive than babies born at 22 weeks. Why?","o":["Their organs, especially the lungs, are more developed","They have much more amniotic fluid around them","Their umbilical cord is much shorter and stronger","They no longer need any oxygen from anywhere"],"e":"The lungs are among the last organs to be ready. Very premature babies often need help to breathe."},
  {"t":"c3N","c":"Cycle calendar","q":"A woman's period starts on 3 March and her cycle is usually 28 days. Roughly when is she likely to ovulate?","o":["Around 16 March","Around 3 March","Around 31 March","Around 9 March"],"e":"Day 1 is 3 March, so day 14 is 16 March. Real cycles vary, so this is only an estimate."},
  {"t":"c2K","c":"Menstruation","q":"What happens during menstruation?","o":["The uterus lining breaks down and leaves the body","An egg is released from an ovary into the oviduct","The uterus lining thickens, ready for an embryo","Sperm travel up to the oviduct to meet the egg"],"e":"Menstruation is the start of a new cycle. It happens when the egg released in the last cycle was not fertilised."},
  {"t":"d1K","c":"Spots at puberty","q":"Why do many teenagers get spots during puberty?","o":["Hormones make the skin produce more oil","They eat more chocolate than adults do","Their skin stops producing any oil at all","Puberty stops the body fighting bacteria"],"e":"Extra oil can block pores in the skin. Washing regularly helps."},
  {"t":"d3A","c":"Medicines in pregnancy","q":"Why should a pregnant woman check with a doctor before taking any medicine?","o":["Some medicines can cross the placenta and harm the fetus","Medicines stop the placenta from forming","Medicines are digested by the fetus instead","Medicines always make the pregnancy last longer"],"e":"Small molecules in the mother's blood can diffuse across the placenta. Some are safe; others can affect development."},
  {"t":"b2A","c":"Non-identical twins","q":"Non-identical twins can be a boy and a girl. Why?","o":["They came from two different eggs and two sperm","One fertilised egg split unevenly into two","The placenta decided the sex of each twin","The mother's diet decided each twin's sex"],"e":"Non-identical twins are like any brothers or sisters born at the same time. Identical twins come from one zygote and are always the same sex."},
  {"t":"a1K","c":"Names of gametes","q":"What are the male and female gametes called?","o":["Sperm and eggs (ova)","Testes and ovaries","Zygotes and embryos","Semen and placenta"],"e":"Gametes are sex cells. Testes and ovaries are the organs that make them."},
  {"t":"a2A","c":"Eggs before birth","q":"When are a woman's egg cells formed?","o":["Before she is born; they mature from puberty onwards","New eggs are made every month after puberty","Eggs are formed only during a pregnancy","Eggs are made in the uterus every month"],"e":"A baby girl's ovaries already contain all her immature eggs. From puberty, usually one matures and is released each cycle."},
  {"t":"b1K","c":"Amniotic sac","q":"What is the bag of fluid around the fetus called?","o":["The amniotic sac","The placenta","The umbilical cord","The cervix"],"e":"The amniotic sac (amnion) contains amniotic fluid, which cushions the fetus."},
  {"t":"b3A","c":"Not a perfect barrier","q":"Why is the placenta described as a barrier, but not a complete one?","o":["It stops the bloods mixing, but some harmful substances still cross","It lets all substances cross freely, including blood cells","It blocks everything, including oxygen and food","It only lets waste pass from the mother to the fetus"],"e":"The placenta protects the fetus from many things, but nicotine, alcohol, some drugs and some viruses can still get through."},
  {"t":"a1A","c":"Streamlined sperm","q":"Why is a sperm cell streamlined in shape?","o":["So it can swim efficiently towards the egg","So it can store a lot of food","So it can attach to the uterus wall","So it can divide quickly into many cells"],"e":"A narrow head and long tail let the sperm move through fluid with little resistance."},
